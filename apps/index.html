<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アプリ百景 | porkgorilla://</title>
  <meta name="description" content="定番ゲーム・定番ツール・語学アプリに収まらない、porkgorilla のゲーム・アプリ集。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBT4300J0L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MBT4300J0L');
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    .section {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .section h1 {
      margin: 48px 0 12px;
      font-size: 1.6rem;
      border-left: 4px solid var(--cyber-green);
      padding-left: 10px;
      background: linear-gradient(90deg, var(--cyber-green-faint), transparent);
    }
    .lead { margin: 0 0 24px; line-height: 1.8; }
    .back { display: inline-block; margin-top: 8px; font-size: .85rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 22px 18px 16px;
      border-bottom: 1px solid var(--cyber-green-dim);
      color: var(--cyber-text);
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .card:hover {
      color: var(--cyber-text);
      text-shadow: none;
      border-color: var(--cyber-green);
      border-bottom-style: solid;
      box-shadow: 0 0 18px rgba(57, 255, 106, 0.25);
      transform: translateY(-3px);
    }
    .card-head { display: flex; align-items: center; gap: 10px; }
    .card-icon { font-size: 1.8rem; }
    .card h3 { margin: 0; font-size: 1.05rem; }
    .card p { margin: 0; flex: 1; font-size: .88rem; line-height: 1.7; }
    .card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .card .open { color: var(--cyber-green-dim); font-size: .8rem; text-align: right; }
    .card:hover .open { color: var(--cyber-green); }
    .card-og { width: 100%; height: auto; aspect-ratio: 1200 / 630; object-fit: cover; display: block; margin: -6px 0 4px; border: 1px solid var(--cyber-green-dim); }
  </style>
</head>
<body>
  <main>
    <section class="section">
      <h1>アプリ百景</h1>
      <p class="lead">定番ゲーム・定番ツール・語学アプリのどれにも収まらない、ゲームやアプリを集めた場所。ひとつずつ、景色のように増やしていきます。</p>
      <div class="grid" id="grid"></div>
      <a class="back" href="/#works">&lt; 作品一覧へ戻る</a>
    </section>
  </main>

  <script src="/site.js"></script>
  <script>
    window.renderWorkCards(document.getElementById('grid'), window.SITE_WORKS.filter(w => w.tags.includes('APP')));
  </script>
</body>
</html>
