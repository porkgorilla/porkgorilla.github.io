<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字数カウンター</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 1.6rem; }
    textarea {
      width: 100%;
      max-width: 640px;
      height: 220px;
      padding: 12px;
      font-size: 1rem;
      background: var(--cyber-bg-panel);
      border: 1px solid var(--cyber-green-dim);
      color: var(--cyber-text);
      resize: vertical;
      font-family: var(--cyber-font);
    }
    textarea:focus { outline: none; border-color: var(--cyber-green); }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 640px;
    }
    .stat {
      padding: 12px;
      text-align: center;
    }
    .stat b { display: block; font-size: 1.8rem; color: var(--cyber-green); text-shadow: 0 0 6px var(--cyber-green); }
    .stat span { font-size: .85rem; color: var(--cyber-green-dim); }
    .actions { display: flex; gap: 10px; }
    button {
      padding: .6rem 1.4rem;
      border: 1px solid var(--cyber-green-dim);
      background: var(--cyber-green-faint);
      color: var(--cyber-green);
      font-size: 1rem;
      font-family: var(--cyber-font);
      cursor: pointer;
    }
    button:hover { background: var(--cyber-green); color: #000; }
  </style>
</head>
<body>
  <h1>📝 文字数カウンター</h1>
  <textarea id="t" placeholder="ここに文章を入力または貼り付けてください" autofocus></textarea>
  <div class="stats">
    <div class="stat panel"><b id="chars">0</b><span>文字数</span></div>
    <div class="stat panel"><b id="nospace">0</b><span>空白・改行を除く</span></div>
    <div class="stat panel"><b id="lines">0</b><span>行数</span></div>
    <div class="stat panel"><b id="words">0</b><span>英単語数</span></div>
    <div class="stat panel"><b id="bytes">0</b><span>バイト数(UTF-8)</span></div>
  </div>
  <div class="actions">
    <button id="copy">コピー</button>
    <button id="clear">クリア</button>
  </div>
  <a class="back-link" href="./">&lt; トップへ戻る</a>

  <script>
    const t = document.getElementById('t');
    const $ = id => document.getElementById(id);

    function update() {
      const s = t.value;
      $('chars').textContent = [...s].length;
      $('nospace').textContent = [...s.replace(/\s/g, '')].length;
      $('lines').textContent = s === '' ? 0 : s.split(/\r\n|\r|\n/).length;
      $('words').textContent = (s.match(/[A-Za-z0-9'’-]+/g) || []).length;
      $('bytes').textContent = new TextEncoder().encode(s).length;
    }

    t.addEventListener('input', update);
    $('clear').onclick = () => { t.value = ''; update(); t.focus(); };
    $('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(t.value);
        $('copy').textContent = 'コピーしました!';
      } catch (e) {
        t.select();
        document.execCommand('copy');
        $('copy').textContent = 'コピーしました!';
      }
      setTimeout(() => $('copy').textContent = 'コピー', 1500);
    };
    update();
  </script>
</body>
</html>
