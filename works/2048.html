<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 | porkgorilla://</title>
  <meta name="description" content="同じ数字を合体させて2048を目指す定番パズル。矢印キー・スワイプ対応。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBT4300J0L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MBT4300J0L');
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 16px;
      user-select: none;
      text-align: center;
    }
    h1 { margin: 0; font-size: 1.6rem; }
    #info { font-size: 1.1rem; }
    #board {
      --gap: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
      padding: var(--gap);
      width: min(92vw, 400px);
      aspect-ratio: 1;
      background: var(--cyber-bg);
      border: 2px solid var(--cyber-green);
      box-shadow: 0 0 12px rgba(57, 255, 106, 0.25);
      touch-action: none;
    }
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: clamp(1.2rem, 7vw, 2rem);
      border: 1px solid var(--cyber-green-faint);
      color: var(--cyber-text);
    }
    .cell.pop { animation: pop .15s ease-out; }
    @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
    .v2    { background: rgba(57,255,106,.08); }
    .v4    { background: rgba(57,255,106,.16); }
    .v8    { background: rgba(57,255,106,.28); color: #fff; }
    .v16   { background: rgba(57,255,106,.4);  color: #fff; }
    .v32   { background: rgba(57,255,106,.55); color: #000; }
    .v64   { background: rgba(57,255,106,.7);  color: #000; }
    .v128, .v256, .v512 { background: var(--cyber-green); color: #000; font-size: clamp(1.1rem, 6vw, 1.7rem); box-shadow: 0 0 10px var(--cyber-green); }
    .v1024, .v2048, .vbig { background: #fff; color: #000; font-size: clamp(.9rem, 5vw, 1.4rem); box-shadow: 0 0 14px var(--cyber-green); }
    #msg { min-height: 1.5em; color: var(--cyber-green); }
    .credit { font-size: 11px; color: var(--cyber-green-dim); margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>2048</h1>
    <div id="info">スコア: <span id="score">0</span> / ハイスコア: <span id="best">0</span></div>
    <div id="board"></div>
    <div id="msg">矢印キー / WASD / スワイプで動かす</div>
    <button class="btn" id="restart" type="button">NEW GAME</button>
    <div class="credit">porkgorilla — 2026</div>
  </main>

  <script src="/site.js"></script>
  <script>
    const N = 4;
    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const msgEl = document.getElementById('msg');

    let best = 0;
    try { best = Number(localStorage.getItem('best2048')) || 0; } catch (e) {}
    bestEl.textContent = best;

    let grid, score, over, won, newPos;

    function init() {
      grid = Array.from({ length: N }, () => Array(N).fill(0));
      score = 0; over = false; won = false;
      scoreEl.textContent = 0;
      msgEl.textContent = '矢印キー / WASD / スワイプで動かす';
      addTile(); addTile();
      render();
    }

    function addTile() {
      const empty = [];
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
      if (!empty.length) return;
      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
      newPos = r * N + c;
    }

    // 1行を左に詰めて合体させる
    function slideRow(row) {
      const vals = row.filter(v => v);
      const out = [];
      let gained = 0;
      for (let i = 0; i < vals.length; i++) {
        if (vals[i] === vals[i + 1]) {
          out.push(vals[i] * 2);
          gained += vals[i] * 2;
          i++;
        } else out.push(vals[i]);
      }
      while (out.length < N) out.push(0);
      return { out, gained };
    }

    function move(dir) { // 0:left 1:up 2:right 3:down
      if (over) return;
      let moved = false;
      for (let i = 0; i < N; i++) {
        const line = [];
        for (let j = 0; j < N; j++) {
          line.push(dir === 0 ? grid[i][j] : dir === 2 ? grid[i][N - 1 - j] :
                    dir === 1 ? grid[j][i] : grid[N - 1 - j][i]);
        }
        const { out, gained } = slideRow(line);
        score += gained;
        for (let j = 0; j < N; j++) {
          const v = out[j];
          const cur = dir === 0 ? grid[i][j] : dir === 2 ? grid[i][N - 1 - j] :
                      dir === 1 ? grid[j][i] : grid[N - 1 - j][i];
          if (cur !== v) moved = true;
          if (dir === 0) grid[i][j] = v;
          else if (dir === 2) grid[i][N - 1 - j] = v;
          else if (dir === 1) grid[j][i] = v;
          else grid[N - 1 - j][i] = v;
        }
      }
      if (!moved) return;
      newPos = -1;
      addTile();
      if (score > best) {
        best = score;
        try { localStorage.setItem('best2048', best); } catch (e) {}
      }
      if (!won && grid.flat().some(v => v >= 2048)) {
        won = true;
        msgEl.textContent = '🎉 2048達成! そのまま続けられます';
      }
      if (!canMove()) {
        over = true;
        msgEl.textContent = 'ゲームオーバー! NEW GAME でもう一度';
      }
      render();
    }

    function canMove() {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (!grid[r][c]) return true;
        if (c + 1 < N && grid[r][c] === grid[r][c + 1]) return true;
        if (r + 1 < N && grid[r][c] === grid[r + 1][c]) return true;
      }
      return false;
    }

    function render() {
      scoreEl.textContent = score;
      bestEl.textContent = best;
      boardEl.innerHTML = '';
      grid.flat().forEach((v, i) => {
        const d = document.createElement('div');
        d.className = 'cell' + (v ? ' v' + (v > 2048 ? 'big' : v) : '') + (i === newPos ? ' pop' : '');
        d.textContent = v || '';
        boardEl.appendChild(d);
      });
    }

    const keyMap = { ArrowLeft: 0, a: 0, ArrowUp: 1, w: 1, ArrowRight: 2, d: 2, ArrowDown: 3, s: 3 };
    document.addEventListener('keydown', e => {
      if (e.key in keyMap) { e.preventDefault(); move(keyMap[e.key]); }
    });

    // スワイプ
    let sx = 0, sy = 0;
    boardEl.addEventListener('touchstart', e => {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive: true });
    boardEl.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 0 : 2);
      else move(dy < 0 ? 1 : 3);
    }, { passive: true });

    document.getElementById('restart').onclick = init;
    init();
  </script>
</body>
</html>
