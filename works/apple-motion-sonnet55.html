      if (wd === 'apple') {
        const bump = 1 + .1 * p;
        ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = '#0b0b10';
        const bw = w * 1.15 * bump, bh = fs * 1.1 * bump, r = bh * .25;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(px - bw / 2, py - bh / 2, bw, bh, r) : ctx.rect(px - bw / 2, py - bh / 2, bw, bh);
        ctx.fill(); ctx.restore();
        text(wd, px, py, fs, { sx: bump, color: '#7dff5a', glow: '#7dff5a', blur: 16, alpha: al });
      } else {
        text(wd, px, py, fs, { color: '#fff', alpha: al, stroke: 'rgba(0,0,0,.35)', lw: fs * .04 });
      }
    });
  });
  if (t >= 18.75) {
    const jl = (W / H > 1.2) ? J_L : J_P;
    const maxC = Math.max(...jl.map(s => s.length));
    const f2 = Math.min(W * .88 / maxC, m * .1, H * .1), lh2 = f2 * 1.4;
    const jy0 = lerp(H * .52, H * .58, 0) - (jl.length - 1) * lh2 / 2 + H * .1;
    let ci = 0;
    jl.forEach((l, li) => {
      const ri = l.indexOf('りんご'), x0 = W / 2 - l.length * f2 / 2;
      [...l].forEach((c, j) => {
        const tc = 18.75 + ci * .11; ci++;
        const k = (t - tc) / .22; if (k < 0) return;
        const cx = x0 + j * f2 + f2 / 2, cyy = jy0 + li * lh2, hi = ri >= 0 && j >= ri && j < ri + 3, al = clamp(k * 8);
        if (hi) { ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = '#0b0b10'; ctx.fillRect(cx - f2 / 2, cyy - f2 * .56, f2, f2 * 1.12); ctx.restore(); }
        text(c, cx, cyy, f2, { sx: 1 + .8 * (1 - eOutExpo(clamp(k))), color: hi ? '#7dff5a' : '#fff', alpha: al, stroke: hi ? null : 'rgba(0,0,0,.35)', lw: f2 * .04 });
      });
    });
  }
}
function cuts(t) {
  const half = BEAT / 2, k = Math.min(7, Math.floor((t - 20.625) / half)), u = ((t - 20.625) - k * half) / half;
  const en = k % 2 === 0, w = CUTS[k];
  fillBg(en ? '#07070b' : '#e5122d', en ? '#1a0610' : '#7d0517');
  if (en) { grid(t * 2, .6, '#7dff5a'); }
  const pun = 1.35 - .35 * eOutExpo(clamp(u * 2.2));
  const s = fit(w, W * .88, m * (en ? .34 : .4));
  const g = (rnd(k * 7 + Math.floor(t * 30)) - .5) * 16 * (1 - u);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  text(w, W / 2 + g, H * .5, s, { sx: pun, color: '#00e5ff', alpha: .55 });
  text(w, W / 2 - g, H * .5, s, { sx: pun, color: '#ff2d3d', alpha: .55 });
  ctx.restore();
  text(w, W / 2, H * .5, s, { sx: pun, color: '#fff3e0', glow: en ? '#7dff5a' : '#000', blur: 28 });
  apple(W * .86 - (W > H ? 0 : 0), H * .2, m * .09 * (1 + .2 * (1 - u)), t * 3, 1);
  apple(W * .14, H * .8, m * .07, -t * 2, .9);
}

function sceneE(t, b) {
  const p = pul(b);
  if (t < 24.375) {
    fillBg('#0a0612', '#1c0a2a'); grid(t, .4, '#7dff5a'); particles(t, '#b98aff', 40, 30);
    const cx = W / 2, cy = H * .44, R = Math.min(W * .44, H * .3), kk = seg(t, 22.5, 24.375);
    text('RECALL — 思い出せる？', cx, H * .14, fit('RECALL — 思い出せる？', W * .86, m * .055, 800), { color: '#7dff5a', font: MONO, weight: 800 });
    ctx.save(); ctx.strokeStyle = '#7dff5a'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.shadowColor = '#7dff5a'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - kk)); ctx.stroke(); ctx.restore();
    ring(cx, cy, R, .15, '#fff', 2);
    const s = fit('りんご', R * 1.5, m * .3);
    text('りんご', cx, cy, s, { sx: 1 + .03 * p, color: '#fff3e0', glow: '#b98aff', blur: 26, alpha: clamp((t - 22.5) * 4) });
    const blink = (t * 4 | 0) % 2 === 0;
    text('= ' + (blink ? '?' : ' '), cx, H * .7, m * .16, { color: '#ff4d5e', glow: '#ff2d3d', blur: 20 });
    return;
  }
  if (t < 26.25) {
    fillBg('#2a0510', '#120208'); grid(t, .7, '#ff4d5e'); particles(t, '#ffd2d2', 50, 50);
    apple(W / 2, H * .44, m * .38, t * .6, .12);
    text('りんご =', W / 2, H * .17, m * .07, { color: '#fff3e0', weight: 800, alpha: .9 });
    const k = clamp((t - 24.375) / .3), s = fit('APPLE', W * .9, m * .34);
    ring(W / 2, H * .38, m * .6 * eOutExpo(clamp((t - 24.375) / .5)), 1 - (t - 24.375) / .5, '#7dff5a', 6);
    text('APPLE', W / 2, H * .38, s, { sx: 1 + 1.4 * (1 - eOutExpo(k)), color: '#7dff5a', glow: '#7dff5a', blur: 36, stroke: '#fff', lw: s * .02, alpha: clamp(k * 8) });
    const bs = Math.min(W * .15, m * .13), gp = bs * .22, tot = bs * 5 + gp * 4, x0 = W / 2 - tot / 2 + bs / 2;
    [...'APPLE'].forEach((c, i) => {
      const tl = 24.9 + i * .28, kk = clamp((t - tl) / .22), cx = x0 + i * (bs + gp), cy = H * .62;
      const sc = kk > 0 ? 1 + .35 * (1 - eOutExpo(kk)) : 1;
      ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
      ctx.fillStyle = kk > 0 ? '#7dff5a' : 'rgba(255,255,255,.08)'; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-bs / 2, -bs / 2, bs, bs, bs * .18) : ctx.rect(-bs / 2, -bs / 2, bs, bs); ctx.fill(); ctx.stroke(); ctx.restore();
      text(c, cx, cy, bs * .7, { sx: sc, color: kk > 0 ? '#0b0b10' : 'rgba(255,255,255,.25)' });
    });
    text('5文字 ・ PP が2つ', W / 2, H * .74, fit('5文字 ・ PP が2つ', W * .8, m * .05, 800), { color: '#fff3e0', weight: 800, alpha: seg(t, 25.9, 26.1) * .85 });
    return;
  }
  if (t < 28.125) {
    fillBg('#05030a', '#1a0309'); grid(t, .9, '#ff4d5e'); particles(t, '#fff', 40, 60);
    const fs0 = fit('apple', W * .5, m * .3);
    for (let k = 0; k < 7; k++) {
      const ph = ((b + k / 7) % 1), sc = Math.pow(ph, 2.2) * 4.2 + .1;
      text('apple', W / 2, H * .5, fs0 * sc, { fill: false, stroke: k % 2 ? '#7dff5a' : '#ff4d5e', lw: 2, alpha: (1 - ph) * Math.min(1, ph * 8) * .55, rot: (k - 3) * .06 });
    }
    apple(W / 2, H * .5, m * .2 * (1 + .18 * p) * (1 + .5 * eIn(seg(t, 27.4, 28.125))), Math.sin(b * Math.PI) * .12, 1);
    const cnt = t < 27.19 ? '× 1' : '× 2';
    text(cnt, W / 2, H * .18, m * .13, { color: '#7dff5a', font: MONO, glow: '#7dff5a', blur: 20, sx: 1 + .25 * p });
    return;
  }
  // E4 クライマックス
  const k = t - 28.125;
  fillBg('#3a0610', '#07070b');
  ctx.save(); ctx.translate(W / 2, H * .32); ctx.rotate(t * .25);
  for (let i = 0; i < 16; i++) {
    ctx.rotate(Math.PI / 8); ctx.fillStyle = i % 2 ? 'rgba(255,45,61,.12)' : 'rgba(125,255,90,.06)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(m * 1.6, -m * .12); ctx.lineTo(m * 1.6, m * .12); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  particles(t, '#fff3e0', 50, 40);
  const r = m * .2 * eOutBack(clamp(k / .45)), bounce = 1 + .05 * Math.sin(t * 6);
  ring(W / 2, H * .3, m * .5 * eOutExpo(clamp(k / .6)), 1 - k / .6, '#7dff5a', 8);
  ring(W / 2, H * .3, m * .8 * eOutExpo(clamp(k / .9)), .7 - k / .9, '#ff2d3d', 5);
  apple(W / 2, H * .3, r * bounce, Math.sin(t * 2) * .08, 1);
  const s1 = fit('APPLE', W * .8, m * .2), a1 = clamp((k - .15) * 5);
  text('APPLE', W / 2, H * .52, s1, { sx: 1 + .8 * (1 - eOutExpo(clamp((k - .15) / .4))), color: '#7dff5a', glow: '#7dff5a', blur: 30, stroke: '#fff', lw: s1 * .02, alpha: a1 });
  const s2 = fit('= りんご', W * .6, m * .12), a2 = clamp((k - .4) * 5);
  text('= りんご', W / 2 - s2 * .45, H * .64, s2, { color: '#fff3e0', alpha: a2, glow: '#ff2d3d', blur: 20 });
  const cw = measure('= りんご', s2), ck = eOutExpo(seg(k, .8, 1.2));
  if (ck > 0) {
    const cx = W / 2 - s2 * .45 + cw / 2 + s2 * .7, cy = H * .64, rr = s2 * .5;
    ctx.save(); ctx.strokeStyle = '#7dff5a'; ctx.lineWidth = Math.max(4, s2 * .12); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = '#7dff5a'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2 * ck); ctx.stroke();
    const c2 = seg(k, 1.0, 1.35);
    if (c2 > 0) {
      ctx.beginPath(); ctx.moveTo(cx - rr * .45, cy);
      const p1 = { x: cx - rr * .1, y: cy + rr * .35 }, p2 = { x: cx + rr * .5, y: cy - rr * .35 };
      if (c2 < .5) ctx.lineTo(lerp(cx - rr * .45, p1.x, c2 * 2), lerp(cy, p1.y, c2 * 2));
      else { ctx.lineTo(p1.x, p1.y); const q = (c2 - .5) * 2; ctx.lineTo(lerp(p1.x, p2.x, q), lerp(p1.y, p2.y, q)); }
      ctx.stroke();
    }
    ctx.restore();
  }
  confetti(t, 28.125, W / 2, H * .3, 90);
}

/* ================= 全体 ================= */
const SHAKES = [[7.5, 20], [15, 14], [22.5, 10], [24.375, 14], [28.125, 22]];
for (let i = 0; i < 5; i++) SHAKES.push([(8 + i) * BEAT, 5 + i]);
for (let i = 0; i < 8; i++) SHAKES.push([15 + (33 + i - 32) * BEAT, i === 1 ? 10 : 3]);
function shakeOf(t) {
  let ax = 0, ay = 0;
  for (const [ft, amp] of SHAKES) {
    const d = t - ft; if (d < 0 || d > .6) continue;
    const a = amp * Math.exp(-d * 9) * m / 700, fr = Math.floor(t * 60);
    ax += (rnd(fr + ft * 13) - .5) * 2 * a; ay += (rnd(fr + ft * 17 + 5) - .5) * 2 * a;
  }
  return [ax, ay];
}
const FLASHES = [[3.75, .35, 10], [7.5, 1, 5], [15, .9, 6], [22.5, .7, 7], [24.375, .5, 8], [28.125, 1, 4]];
const CHAPTERS = [[0, 'INTRO'], [3.75, '01 SPELLING 綴り'], [7.5, '02 WORD 単語'], [9.375, '03 MEANING 意味'], [11.25, '04 ACCENT アクセント'],
  [13.125, '05 PRONUNCIATION 発音'], [15, '06 EXAMPLE 例文'], [22.5, '07 RECALL 思い出す'], [24.375, '08 ANSWER 答え'], [26.25, '09 REPEAT 反復'], [28.125, '10 LOCK IN']];

function draw(t) {
  const b = t / BEAT;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#07070b'; ctx.fillRect(0, 0, W, H);
  const [sx, sy] = shakeOf(t);
  ctx.save(); ctx.translate(sx, sy);
  if (t < 3.75) sceneA(t, b);
  else if (t < 7.5) sceneB(t, b);
  else if (t < 15) sceneC(t, b);
  else if (t < 22.5) sceneD(t, b);
  else sceneE(t, b);
  ctx.restore();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let fa = 0;
  for (const [ft, a, dk] of FLASHES) { const d = t - ft; if (d >= 0) fa = Math.max(fa, a * Math.exp(-d * dk)); }
  fa = Math.max(fa, .5 * eIn(seg(t, 7.0, 7.5)) * (t < 7.5 ? 1 : 0), .45 * eIn(seg(t, 27.6, 28.125)) * (t < 28.125 ? 1 : 0));
  if (fa > .01) { ctx.fillStyle = `rgba(255,255,255,${clamp(fa)})`; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(W / 2, H / 2, m * .3, W / 2, H / 2, Math.hypot(W, H) * .6);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  hud(t);
}
function hud(t) {
  let ch = CHAPTERS[0][1];
  for (const c of CHAPTERS) if (t >= c[0]) ch = c[1];
  const by = H - 16, mg = 16, bw = W - mg * 2;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(mg, by, bw, 4);
  ctx.fillStyle = '#7dff5a'; ctx.shadowColor = '#7dff5a'; ctx.shadowBlur = 8; ctx.fillRect(mg, by, bw * clamp(t / DUR), 4);
  ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.4)';
  for (const c of CHAPTERS) if (c[0] > 0) ctx.fillRect(mg + bw * c[0] / DUR - 1, by - 3, 2, 10);
  ctx.restore();
  text(ch, mg, by - 16, 12, { align: 'left', font: MONO, weight: 700, color: '#d8d6e0', alpha: .85, spacing: 1 });
  const sec = Math.min(30, Math.max(0, t));
  text('00:' + String(Math.floor(sec)).padStart(2, '0') + ' / 00:30', W - mg, by - 16, 12, { align: 'right', font: MONO, weight: 700, color: '#d8d6e0', alpha: .85 });
}
function drawIdle() {
  const t = performance.now() / 1000, b = t / BEAT * .5;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fillBg('#07070b', '#160610'); grid(t * .6, .3, '#7dff5a'); particles(t, '#ff4d5e', 50, 25);
  for (let i = 0; i < 4; i++) marquee('APPLE APPLE', t * .4 + i, H * (.15 + .23 * i), m * .2, i % 2 ? 1 : -1, .07, '#fff3e0');
  apple(W / 2, H * .5, m * .3 * (1 + .03 * pul(b)), Math.sin(t) * .15, 1);
}

/* ================= 進行 ================= */
const titleOv = $('titleOv'), pauseOv = $('pauseOv'), endOv = $('endOv'), pauseBtn = $('pauseBtn'), soundBtn = $('soundBtn');

function frame() {
  requestAnimationFrame(frame);
  resize();
  if (mode === 'play') {
    const t = now() - startAt;
    schedule();
    while (cueIdx < CUES.length && t >= CUES[cueIdx].t) { if (t - CUES[cueIdx].t < .6) say(CUES[cueIdx].s, CUES[cueIdx].r); cueIdx++; }
    if (t >= DUR) { finish(); draw(DUR - .001); return; }
    draw(Math.max(0, t));
  } else if (mode === 'pause' || mode === 'end') {
    draw(heldT);
  } else {
    drawIdle();
  }
}
function startPlay() {
  initAudio(); unlockSpeech(); cancelSpeech();
  cueIdx = 0; nextStep = 0; startAt = now() + .2;
  mode = 'play';
  titleOv.hidden = true; pauseOv.hidden = true; endOv.hidden = true; pauseBtn.hidden = false;
}
function pause() {
  if (mode !== 'play') return;
  pauseT = now() - startAt; heldT = Math.max(0, pauseT);
  if (AC) { try { AC.suspend().catch(() => {}); } catch (e) {} }
  cancelSpeech(); mode = 'pause';
  pauseOv.hidden = false; pauseBtn.hidden = true;
  restartArm._dis(); pauseTitleArm._dis();
}
function resume() {
  if (mode !== 'pause') return;
  if (AC) { try { AC.resume(); } catch (e) {} }
  startAt = now() - pauseT; mode = 'play';
  pauseOv.hidden = true; pauseBtn.hidden = false;
}
function toTitle() {
  stopAudio(); cancelSpeech(); mode = 'title';
  pauseOv.hidden = true; endOv.hidden = true; pauseBtn.hidden = true; titleOv.hidden = false;
}
function finish() {
  mode = 'end'; heldT = DUR - .001; pauseBtn.hidden = true;
  let n = 1;
  try { n = (parseInt(localStorage.getItem(VIEWS_KEY) || '0', 10) || 0) + 1; localStorage.setItem(VIEWS_KEY, String(n)); } catch (e) {}
  $('viewMsg').innerHTML = '視聴 <b>' + n + '</b> 回目 ／ 3回見ると、かなり残ります。';
  const msg = '30秒で apple を覚えた！ りんご＝apple（' + n + '回目）\n#APPLE30秒モーションSONNET55';
  $('shareBtn').href = 'https://x.com/intent/post?text=' + encodeURIComponent(msg) + '&url=' + encodeURIComponent(SHARE_URL);
  endOv.hidden = false;
}
function armBtn(btn, label, action) {
  let armed = false, timer = null;
  const dis = () => { armed = false; clearTimeout(timer); btn.textContent = label; btn.classList.remove('danger'); };
  btn.addEventListener('click', () => {
    if (!armed) { armed = true; btn.textContent = '本当に？(もう一度タップ)'; btn.classList.add('danger'); clearTimeout(timer); timer = setTimeout(dis, 3000); return; }
    dis(); action();
  });
  return { _dis: dis };
}
const restartArm = armBtn($('restartBtn'), '最初から', startPlay);
const pauseTitleArm = armBtn($('pauseTitleBtn'), 'タイトルへ', toTitle);

const ICON_ON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>';
function paintSound() { soundBtn.innerHTML = soundOn ? ICON_ON : ICON_OFF; soundBtn.setAttribute('aria-label', soundOn ? '音 ON' : '音 OFF'); }
paintSound();
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; paintSound();
  try { localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0'); } catch (e) {}
  if (master && AC) master.gain.setTargetAtTime(soundOn ? .85 : 0, AC.currentTime, .05);
  if (!soundOn) cancelSpeech();
});
$('startBtn').addEventListener('click', startPlay);
$('againBtn').addEventListener('click', startPlay);
$('titleBtn').addEventListener('click', toTitle);
$('resumeBtn').addEventListener('click', resume);
pauseBtn.addEventListener('click', pause);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Escape') {
    if (mode === 'play') { e.preventDefault(); pause(); }
    else if (mode === 'pause') { e.preventDefault(); resume(); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') pause(); });
if (matchMedia('(pointer: coarse)').matches) { const sb = $('shareBtn'); sb.removeAttribute('target'); sb.removeAttribute('rel'); }

resize();
requestAnimationFrame(frame);
})();
</script>
