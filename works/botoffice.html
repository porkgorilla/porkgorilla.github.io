<style>
[hidden]{display:none!important}
/* Layout: chat list on the left (like the bot app itself), live network map + feed on the right. Phone: tabs. */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --ink:#161a20; --sub:#6c7482; --line:#e1e5ea; --soft:#eceff3;
  --boss:#1c1f25; --boss-edge:#1c1f25;
  --k-cmd:#3d5ce0; --k-data:#0e9a88; --k-rep:#e0830a; --k-ask:#d4336c; --k-re:#7a52ef;
  --f-display:"Dela Gothic One","Zen Maru Gothic","Hiragino Sans",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1014; --panel:#16191f; --ink:#e8ecf1; --sub:#8a93a2; --line:#252a32; --soft:#1d2128;
  --boss:#262a33; --boss-edge:#5b6371;
  --k-cmd:#7d93ff; --k-data:#37d0b4; --k-rep:#ffab3d; --k-ask:#ff6b9c; --k-re:#a98bff;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014; --panel:#16191f; --ink:#e8ecf1; --sub:#8a93a2; --line:#252a32; --soft:#1d2128;
  --boss:#262a33; --boss-edge:#5b6371;
  --k-cmd:#7d93ff; --k-data:#37d0b4; --k-rep:#ffab3d; --k-ask:#ff6b9c; --k-re:#a98bff;
  color-scheme:dark}

/* explicit skins (after the theme blocks, same specificity, so they win) */
:root[data-skin="office"]{--bg:#f2f4f7; --panel:#ffffff; --ink:#161a20; --sub:#6c7482; --line:#e1e5ea; --soft:#eceff3; --boss:#1c1f25; --boss-edge:#1c1f25; --k-cmd:#3d5ce0; --k-data:#0e9a88; --k-rep:#e0830a; --k-ask:#d4336c; --k-re:#7a52ef; color-scheme:light}
:root[data-skin="yakin"]{--bg:#0e1014; --panel:#16191f; --ink:#e8ecf1; --sub:#8a93a2; --line:#252a32; --soft:#1d2128; --boss:#262a33; --boss-edge:#5b6371; --k-cmd:#7d93ff; --k-data:#37d0b4; --k-rep:#ffab3d; --k-ask:#ff6b9c; --k-re:#a98bff; color-scheme:dark}
:root[data-skin="kami"]{--bg:#efe8da; --panel:#fbf7ef; --ink:#2a241c; --sub:#7a6f5f; --line:#ddd2bf; --soft:#f2ebdd; --boss:#2a241c; --boss-edge:#2a241c; --k-cmd:#3156b8; --k-data:#1f8a6e; --k-rep:#c26a0a; --k-ask:#c0365e; --k-re:#7246d0; color-scheme:light}
:root[data-skin="mint"]{--bg:#e4f3ed; --panel:#ffffff; --ink:#123029; --sub:#5b7a72; --line:#cde4db; --soft:#ecf7f2; --boss:#123029; --boss-edge:#123029; --k-cmd:#3d5ce0; --k-data:#0e9a88; --k-rep:#e0830a; --k-ask:#d4336c; --k-re:#7a52ef; color-scheme:light}
:root[data-skin="server"]{--bg:#120f2e; --panel:#1b1742; --ink:#efeaff; --sub:#a39cd0; --line:#2e2867; --soft:#241f55; --boss:#0a0820; --boss-edge:#6b62c9; --k-cmd:#6fa8ff; --k-data:#4fe0d0; --k-rep:#ffc857; --k-ask:#ff6fb1; --k-re:#b79bff; color-scheme:dark}
:root[data-skin="terminal"]{--bg:#030803; --panel:#071107; --ink:#c6ffd4; --sub:#5fae74; --line:#143a1c; --soft:#0c1c0c; --boss:#0c1c0c; --boss-edge:#39ff88; --k-cmd:#4fd6ff; --k-data:#39ff88; --k-rep:#e6ff5c; --k-ask:#ff8cf0; --k-re:#b8a1ff; color-scheme:dark;
  --f-body:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Osaka-Mono","MS Gothic",monospace; --f-display:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Osaka-Mono",monospace}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,.row:focus-visible{outline:2px solid var(--k-cmd);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home{color:var(--sub);text-decoration:none;font-size:12px;letter-spacing:.04em;white-space:nowrap;font-family:var(--f-mono)}
.home:hover{color:var(--ink)}
.brand{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;justify-content:center}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.brand .en{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;color:var(--sub);white-space:nowrap}
.iconbtn{min-width:44px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12px;white-space:nowrap}
.xshare{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-weight:700}
.xshare b{font-family:var(--f-mono);font-size:14px}
.iconbtn[aria-pressed="true"]{border-color:var(--k-cmd);color:var(--k-cmd)}

.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}

/* boss card */
.boss{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 18px;cursor:pointer;text-align:left;width:100%}
.boss:hover{border-color:color-mix(in srgb,var(--sub) 40%,var(--line))}
.boss .av{width:64px;height:64px;flex:none}
.boss-body{flex:1;min-width:0}
.boss-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.boss-name{font-weight:700;font-size:16px}
.boss-tag{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.boss-time{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--sub)}
.boss-msg{margin:4px 0 0;font-size:14.5px;line-height:1.55;text-wrap:pretty}
.boss-msg .lab{color:var(--sub);font-size:12px;margin-right:6px}
.boss.pop{animation:pop .5s ease}
@keyframes pop{30%{transform:scale(1.012)}}

/* controls */
.controls{display:flex;flex-direction:column;gap:10px}
.sc-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sc-list::-webkit-scrollbar{display:none}
.sc{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;min-height:44px;padding:7px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left}
.sc b{font-size:13.5px;font-weight:700;white-space:nowrap}
.sc small{font-size:10.5px;color:var(--sub);letter-spacing:.06em}
.sc[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sc[aria-pressed="true"] small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums;flex:1;min-width:0;flex-wrap:wrap}
.clock .hm{font-family:var(--f-mono);font-size:22px;letter-spacing:.02em}
.clock .day{font-size:12px;color:var(--sub)}
.clock .ot{font-size:11px;color:var(--k-ask);border:1px solid currentColor;border-radius:999px;padding:0 8px}
.clock .cnt{font-size:12px;color:var(--sub)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{min-width:48px;min-height:44px;border:0;background:transparent;cursor:pointer;font-family:var(--f-mono);font-size:13px;display:grid;place-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pause-ic{display:block;width:11px;height:13px;border-left:3.5px solid currentColor;border-right:3.5px solid currentColor}

/* tabs (phone) */
.tabs{display:none;gap:6px;background:var(--soft);padding:4px;border-radius:14px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-weight:700;font-size:12.5px;padding:0 4px;white-space:nowrap;color:var(--sub);position:relative}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs .dot{position:absolute;top:10px;margin-left:4px;width:7px;height:7px;border-radius:50%;background:var(--k-ask)}

.stage{display:grid;grid-template-columns:minmax(330px,400px) minmax(0,1fr);gap:16px;align-items:start}
.right{display:flex;flex-direction:column;gap:16px;min-width:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:20px;min-width:0}
.pane h2{margin:0;font-size:12px;letter-spacing:.14em;color:var(--sub);font-weight:700}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 6px}

/* list */
.list{list-style:none;margin:0;padding:6px 6px 8px}
.row{display:flex;gap:14px;align-items:center;padding:11px 12px;border-radius:14px;cursor:pointer;position:relative;will-change:transform}
.row:hover{background:var(--soft)}
.row.flash{animation:flash 1.1s ease}
@keyframes flash{0%{background:color-mix(in srgb,var(--rc) 16%,transparent)}100%{background:transparent}}
.row .av{width:48px;height:48px;flex:none}
.rb{flex:1;min-width:0}
.rl{display:flex;align-items:baseline;gap:8px}
.rn{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{font-family:var(--f-mono);font-size:11.5px;color:var(--sub);flex:none}
.rp{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);min-width:0}
.rp .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp svg{flex:none;width:14px;height:14px}
.rp.typing{color:var(--k-cmd)}
.rp.sending{color:var(--ink)}
.badge{flex:none;min-width:20px;height:20px;border-radius:10px;background:var(--k-cmd);color:var(--panel);font-size:11px;font-family:var(--f-mono);display:grid;place-items:center;padding:0 6px}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}

/* avatar */
.av{position:relative;display:block;background:var(--c);border-radius:var(--r)}
.av.boss-av{background:var(--boss);box-shadow:inset 0 0 0 1.5px var(--boss-edge)}
.av .e{position:absolute;top:33%;width:19%;height:27%;background:#fff;border-radius:50%;animation:blink 5.2s infinite;animation-delay:var(--bd,0s)}
.av .e:nth-child(1){left:27%}.av .e:nth-child(2){left:54%}
.av .e::after{content:"";position:absolute;width:50%;height:44%;left:25%;top:32%;background:#14171c;border-radius:50%;transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .35s ease}
.av.typing{animation:bob .9s ease-in-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-2px) rotate(-2deg)}}

/* graph */
.graph-wrap{position:relative;height:clamp(380px,56vh,620px);margin:0 8px}
.graph-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 18px 14px;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--k)}
.legend i.sq{border-radius:2px}

/* log */
.log{list-style:none;margin:0;padding:4px 10px 12px;max-height:300px;overflow-y:auto}
.log li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:4px 10px;align-items:baseline;padding:8px 8px;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log li.new{animation:slide .4s ease}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
.log time{font-family:var(--f-mono);font-size:11.5px;color:var(--sub)}
.log .who{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.log .who em{font-style:normal;color:var(--sub);font-weight:500;margin:0 4px}
.log p{grid-column:2/-1;margin:0;font-size:13px;color:var(--ink);text-wrap:pretty;display:flex;gap:8px;align-items:baseline}
.log p .x{min-width:0}
.chip{flex:none;display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--k);border:1px solid color-mix(in srgb,var(--k) 45%,transparent);background:color-mix(in srgb,var(--k) 9%,transparent);border-radius:6px;padding:0 6px;line-height:1.6}
.empty{padding:18px;color:var(--sub);font-size:13px}

.note{font-size:12.5px;color:var(--sub);margin:0;text-wrap:pretty}
.credit{font-size:11px;color:var(--sub);letter-spacing:.05em;text-align:center;padding-top:4px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.32)}
.sheet{position:fixed;z-index:25;top:calc(56px + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translateX(30px);opacity:0}}
.sh-head{display:flex;gap:14px;align-items:center;padding:14px 16px 14px 18px;border-bottom:1px solid var(--line)}
.sh-head .av{width:52px;height:52px;flex:none}
.sh-ttl{flex:1;min-width:0}
.sh-ttl b{display:block;font-size:16px}
.sh-ttl span{display:block;font-size:12px;color:var(--sub);line-height:1.5}
.close{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;position:relative;flex:none}
.close::before,.close::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:2px;background:currentColor;border-radius:2px}
.close::before{transform:translate(-50%,-50%) rotate(45deg)}.close::after{transform:translate(-50%,-50%) rotate(-45deg)}
.thread{flex:1;overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg .av{width:28px;height:28px;flex:none}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.mb{min-width:0;display:flex;flex-direction:column;gap:3px}
.msg.me .mb{align-items:flex-end}
.mm{font-size:11px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:13.5px;line-height:1.55;text-wrap:pretty}
.msg.me .bub{background:color-mix(in srgb,var(--c) 14%,var(--panel));border-color:color-mix(in srgb,var(--c) 35%,var(--line));border-radius:16px 16px 4px 16px}
.file{display:flex;gap:8px;align-items:center;margin-top:6px;padding:7px 10px;border-radius:10px;background:var(--soft);font-family:var(--f-mono);font-size:11.5px;word-break:break-all}
.file svg{flex:none;width:14px;height:14px}
.msg.new{animation:slide .35s ease}

/* daily report */
.reports{padding:4px 12px 14px;display:flex;flex-direction:column;gap:10px}
.rep{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
.rep.new{animation:slide .45s ease}
.rep summary{list-style:none;cursor:pointer;display:flex;gap:4px 10px;align-items:baseline;padding:12px 14px;min-height:44px;flex-wrap:wrap}
.rep summary::-webkit-details-marker{display:none}
.rep summary b{font-size:15px}
.rep summary .meta{font-size:12px;color:var(--sub)}
.rep summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);align-self:center}
.rep[open] summary::after{transform:rotate(-135deg)}
.rep-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.rep h3{margin:0 0 4px;font-size:11.5px;letter-spacing:.1em;color:var(--sub);font-weight:700}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.num span{display:block;font-size:11px;color:var(--sub)}
.num b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.kbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);gap:2px}
.kbar i{background:var(--k)}
.top-bot{display:flex;gap:10px;align-items:center;font-size:13.5px}
.top-bot .av{width:30px;height:30px;flex:none}
.done{margin:0;padding-left:1.3em;font-size:13px;display:flex;flex-direction:column;gap:4px;text-wrap:pretty}
.word{margin:0;font-size:13.5px}
.post{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.post-t{margin:0;font-size:13px;line-height:1.7;user-select:text;-webkit-user-select:text;word-break:break-word}
.post-act{display:flex;gap:8px;flex-wrap:wrap}
.xbtn,.copybtn{min-height:44px;padding:0 16px;border-radius:12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
.xbtn{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.copybtn{background:transparent;border:1px solid var(--line)}
.skinpanel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.skinpanel h2{margin:0;font-size:12px;letter-spacing:.14em;color:var(--sub);font-weight:700}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.skin{border:2px solid var(--line);border-radius:12px;padding:7px;text-align:left;background:var(--bg);cursor:pointer;min-height:44px}
.skin[aria-checked="true"]{border-color:var(--k-cmd)}

let S = null;
let speed = 1;
const settings = loadSettings();

function loadSettings(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch(e){ return {}; }
}
function saveSettings(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({sc: S && S.sc.id, speed, skin})); } catch(e){}
}

function blobRadius(){
  const v = () => ri(40, 60);
  return `${v()}% ${v()}% ${v()}% ${v()}% / ${v()}% ${v()}% ${v()}% ${v()}%`;
}

function fill(tpl, ctx, vocab){
  if (Array.isArray(tpl)) tpl = pick(tpl);
  return tpl.replace(/\{(#?)([A-Za-z0-9]+)(?::(\d+)-(\d+))?\}/g, (m, h, k, a, b) => {
    if (ctx[k] !== undefined) return ctx[k];
    let v;
    if (h) v = ri(a ? +a : 2, b ? +b : 60);
    else {
      const arr = vocab[k]; if (!arr) return m;
      const base = k.replace(/2$/, '');
      let opts = arr;
      if (base !== k && ctx[base] !== undefined) opts = arr.filter(x => x !== ctx[base]);
      v = pick(opts.length ? opts : arr);
      v = fill(v, ctx, vocab);
    }
    ctx[k] = v;
    return v;
  });
}

function fmt(min){
  const m = ((Math.floor(min) % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

function makeBot(id, name, role, color, nx, ny){
  return {id, name, role, color, radius: color === 'boss' ? '50%' : blobRadius(), typing:0, sending:null, last:null,
    lastTime:-1, unread:0, thread:[], pulse:0, pulseColor:'#888', nx, ny, px:0, py:0,
    lookAt:null, lookUntil:0, blinkAt: performance.now() + rnd(800, 5000), seed: Math.random()*10, bd: rnd(0, 5).toFixed(2) + 's'};
}

function loadScenario(id){
  const sc = SCENARIOS.find(s => s.id === id) || SCENARIOS[0];
  S = {sc, bots:new Map(), listBots:[], jobs:[], gap:0.4, sim:540, count:0, particles:[], heat:new Map(), youMsg:null, youTime:null,
    day:newDay(1), reports:[], reportedDay:0};
  const you = makeBot('you', 'あなた', '', 'you', 0.5, 0.06);
  const d = makeBot('d', '総合ボット', 'あなたとチームの間に立つBot。仕事を振り分け、結果をあなたに届ける', 'boss', 0.5, 0.21);
  S.bots.set('you', you); S.bots.set('d', d);
  sc.bots.forEach(([bid, name, role], i) => {
    const b = makeBot(bid, name, role, COLORS[i % COLORS.length], 0.5, 0.43);
    S.bots.set(bid, b);
    S.listBots.push(b);
  });
  layout();
  warmUp();
  buildScenarioButtons();
  buildList();
  rebuildLog();
  renderReports(false);
  $('repDot').hidden = true; $('toast').hidden = true;
  S.youMsg = {text: sc.intro};

function layout(){
  const workers = S.listBots.filter(b => b.id !== 'L');
  const n = workers.length;
  const narrow = graphW < 560;
  workers.forEach((b, i) => {
    const t = n === 1 ? 0.5 : i / (n - 1);
    b.nx = 0.09 + 0.82 * t;
    b.ny = 0.72 + 0.15 * Math.sin(Math.PI * t) + (narrow ? (i % 2 ? 0.07 : -0.05) : 0);
  });
}

/* 最初から一覧が埋まって見えるよう、各Botに「前回の発言」を入れておく */
function warmUp(){
  const msgs = [];
  S.listBots.forEach(b => {
    const cands = [];
    S.sc.jobs.forEach(j => j.steps.forEach(st => { if (st[0] === b.id) cands.push(st); }));
    if (!cands.length) return;
    const st = pick(cands), ctx = {};
    const msg = {time: 540 - ri(4, 160), from: b, to: S.bots.get(st[1]), kind: st[2],
      text: fill(st[3], ctx, S.sc.vocab), file: st[4] ? fill(st[4], ctx, S.sc.vocab) : null};
    msgs.push(msg);
  });
  msgs.sort((a, b) => a.time - b.time).forEach(m => {
    m.from.last = m; m.from.lastTime = m.time;
    m.from.thread.push(m); if (m.to !== m.from) m.to.thread.push(m);
  });
  S.warm = msgs;
}

/* ------------------------------ engine ------------------------------ */
function startJob(){
  const running = new Set(S.jobs.map(j => j.def));
  const pool = S.sc.jobs.filter(j => !running.has(j));
  if (!pool.length) return;
  let total = pool.reduce((s, j) => s + (j.w || 1), 0), r = Math.random() * total, def = pool[0];
  for (const j of pool){ r -= (j.w || 1); if (r <= 0){ def = j; break; } }
  S.jobs.push({def, ctx:{}, i:0, ph:'start', t:0});
}

function stepJob(job, dt){
  const st = job.def.steps[job.i];
  const fb = S.bots.get(st[0]), tb = S.bots.get(st[1]);
  switch (job.ph){
    case 'start':
      fb.typing++; touch(fb);
      job.ph = 'typing'; job.t = rnd(0.9, 2.1);
      updateBot(fb);
      break;
    case 'typing':
      job.t -= dt;
      if (job.t <= 0){
        fb.typing = Math.max(0, fb.typing - 1);
        job.text = fill(st[3], job.ctx, S.sc.vocab);
        job.file = st[4] ? fill(st[4], job.ctx, S.sc.vocab) : null;
        fb.sending = tb; fb.lookAt = tb; fb.lookUntil = Infinity;
        touch(fb);
        job.p = {from:fb, to:tb, kind:st[2], p:0, dur:rnd(1.0, 1.5), file:!!job.file, off:(fb.id < tb.id ? 1 : -1)};
        S.particles.push(job.p);
        job.ph = 'travel';
        updateBot(fb);
      }
      break;
    case 'travel':
      if (job.p.p >= 1){
        deliver(fb, tb, st[2], job.text, job.file);
        job.ph = 'wait'; job.t = rnd(0.5, 1.4);
      }
      break;
    case 'wait':
      job.t -= dt;
      if (job.t <= 0){
        job.i++;
        if (job.i >= job.def.steps.length){
          job.ph = 'done';
          if (!job.def.isReport) S.day.jobs.push({text:job.text, toYou: st[1] === 'you'});
        } else job.ph = 'start';
      }
      break;
  }
}

function touch(b){
  b.lastTime = S.sim;
  if (S.listBots.includes(b)) needReorder = true;
}

function deliver(fb, tb, kind, text, file){
  const msg = {time:S.sim, from:fb, to:tb, kind, text, file};
  fb.last = msg; fb.sending = null; fb.lookUntil = performance.now() + 1200;
  fb.thread.push(msg); if (fb.thread.length > 150) fb.thread.shift();
  if (tb !== fb){ tb.thread.push(msg); if (tb.thread.length > 150) tb.thread.shift(); }
  if (S.listBots.includes(tb) && !(sheetBot === tb)) tb.unread++;
  tb.pulse = 1; tb.pulseColor = kindColor(kind);
  tb.lookAt = fb; tb.lookUntil = performance.now() + 2500;
  S.count++;
  const ds = S.day; ds.count++;
  if (fb.id !== 'you') ds.byBot.set(fb, (ds.byBot.get(fb) || 0) + 1);
  ds.byKind[kind] = (ds.byKind[kind] || 0) + 1;
  const key = [fb.id, tb.id].sort().join('|');
  S.heat.set(key, {v:1, kind});
  if (tb.id === 'you'){ S.youMsg = msg; S.youTime = S.sim; renderBoss(true); }
  updateBot(fb); updateBot(tb);
  if (S.listBots.includes(fb)) flashRow(fb);
  addLog(msg, true);
  if (sheetBot && (sheetBot === fb || sheetBot === tb)) appendThread(msg, true);
  renderClock();
  blip(kind);
}

function update(dt){
  if (!S || speed === 0) return;
  const d = dt * speed;
  S.sim += d;
  const dayIdx = Math.floor(S.sim / 1440), mod = S.sim - dayIdx * 1440;
  if (mod >= 1080 && S.reportedDay < dayIdx + 1){ S.reportedDay = dayIdx + 1; makeReport(); }
  if (mod >= 1200){ S.sim = (dayIdx + 1) * 1440 + 540; S.gap = 0.6; renderClock(); }
  S.gap -= d;
  const maxJobs = speed >= 10 ? 3 : 2;
  if (S.gap <= 0 && S.jobs.length < maxJobs){ startJob(); S.gap = rnd(1.6, 4.2); }
  for (const j of S.jobs) stepJob(j, d);
  S.jobs = S.jobs.filter(j => j.ph !== 'done');
  for (const p of S.particles) p.p = Math.min(1, p.p + d / p.dur);
  S.particles = S.particles.filter(p => p.p < 1);
  for (const [k, h] of S.heat){ h.v -= d * 0.18; if (h.v <= 0) S.heat.delete(k); }
  for (const b of S.bots.values()) if (b.pulse > 0) b.pulse = Math.max(0, b.pulse - d * 1.3);
  clockAcc += dt;
  if (clockAcc > 0.25){ clockAcc = 0; renderClock(); }
}
let clockAcc = 0;

function sortedBots(){ return [...S.listBots].sort((a, b) => b.lastTime - a.lastTime); }

function previewHTML(b){

  return {cls:'', html:`<span class="t">${esc(b.last.text)}</span>`};

function flashRow(b){

function reorder(){
  needReorder = false;
  const order = sortedBots();
  const cur = [...listEl.children];
  if (order.every((b, i) => rows.get(b) === cur[i])) return;
  const first = new Map(cur.map(el => [el, el.getBoundingClientRect().top]));
  order.forEach(b => listEl.appendChild(rows.get(b)));
  if (reduceMQ.matches) return;

let AC = null, soundOn = false, lastBlip = 0;
function initAudio(force){
  if (AC && force){ try { AC.close().catch(() => {}); } catch(e){} AC = null; }
  else if (AC){ if (AC.state === 'closed') AC = null; else { if (AC.state === 'suspended') AC.resume(); return; } }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; }
}
const BLIP_F = {cmd:660, data:880, file:880, rep:520, ask:990, re:740};
function blip(kind){
  if (!soundOn || !AC) return;
  const now = performance.now(); if (now - lastBlip < 70) return; lastBlip = now;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(BLIP_F[kind] || 700, t);
    o.frequency.exponentialRampToValueAtTime((BLIP_F[kind] || 700) * 1.25, t + 0.06);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.18);
  } catch(e){}
}
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  if (soundOn) initAudio(true);
  $('soundBtn').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  $('soundBtn').textContent = soundOn ? '音 ON' : '音 OFF';
});

/* ------------------------------ graph ------------------------------ */
const cv = $('cv'), g = cv.getContext('2d');
let graphW = 600, graphH = 400, dpr = 1, T = {};
function readTokens(){
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  T = {ink:v('--ink'), sub:v('--sub'), line:v('--line'), panel:v('--panel'), bg:v('--bg'), boss:v('--boss'), bossEdge:v('--boss-edge'),
    cmd:v('--k-cmd'), data:v('--k-data'), rep:v('--k-rep'), ask:v('--k-ask'), re:v('--k-re'), font:v('--f-body')};
}
function kindColor(k){ return ({cmd:T.cmd, data:T.data, file:T.data, rep:T.rep, ask:T.ask, re:T.re})[k] || T.cmd; }
function resizeCanvas(){
  const r = $('graphWrap').getBoundingClientRect();
  graphW = Math.max(1, r.width || 0); graphH = Math.max(1, r.height || 0);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(graphW * dpr); cv.height = Math.round(graphH * dpr);
  if (S) layout();
}
new ResizeObserver(resizeCanvas).observe($('graphWrap'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
new MutationObserver(readTokens).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme','data-skin']});

function nodeR(b){
  const base = Math.max(14, Math.min(26, Math.min(graphW, graphH) * 0.05));
  if (b.id === 'you') return base * 0.62;
  if (b.id === 'd') return base * 1.15;
  if (b.id === 'L') return base * 1.05;
  return base;
}

function curvePoint(p, t){
  const a = p.from, b = p.to;
  const mx = (a.px + b.px) / 2, my = (a.py + b.py) / 2;
  const dx = b.px - a.px, dy = b.py - a.py, len = Math.hypot(dx, dy) || 1;
  const off = len * 0.16 * p.off;
  const cx = mx - dy / len * off, cy = my + dx / len * off;
  const u = 1 - t;
  return [u*u*a.px + 2*u*t*cx + t*t*b.px, u*u*a.py + 2*u*t*cy + t*t*b.py];
}

function drawGraph(now){
  if (graphW < 2 || graphH < 2 || cv.offsetParent === null) return;
  const W = graphW, H = graphH;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const padX = 24, padTop = 18, padBot = 46;
  for (const b of S.bots.values()){
    b.px = padX + b.nx * (W - padX * 2);
    b.py = padTop + b.ny * (H - padTop - padBot);
  }
  const you = S.bots.get('you'), d = S.bots.get('d'), L = S.bots.get('L');
  // structure lines
  g.lineWidth = 1.2; g.strokeStyle = T.line;
  const line = (a, b, dash) => { g.setLineDash(dash || []); g.beginPath(); g.moveTo(a.px, a.py); g.lineTo(b.px, b.py); g.stroke(); };
  line(you, d, [3, 5]); line(d, L);
  S.listBots.forEach(b => { if (b !== L) line(L, b); });
  g.setLineDash([]);
  // heat lines
  for (const [k, h] of S.heat){
    const [ia, ib] = k.split('|'); const a = S.bots.get(ia), b = S.bots.get(ib);
    g.strokeStyle = kindColor(h.kind); g.globalAlpha = Math.min(1, h.v) * 0.55; g.lineWidth = 1 + 2.5 * h.v;
    g.beginPath(); g.moveTo(a.px, a.py); g.lineTo(b.px, b.py); g.stroke();
  }
  g.globalAlpha = 1;
  // particles
  for (const p of S.particles){
    const col = kindColor(p.kind);
    for (let i = 7; i >= 1; i--){
      const t = Math.max(0, p.p - i * 0.022);
      const [x, y] = curvePoint(p, t);
      g.globalAlpha = (1 - i / 8) * 0.45; g.fillStyle = col;
      g.beginPath(); g.arc(x, y, 3.2 * (1 - i / 10), 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
    const [x, y] = curvePoint(p, p.p);
    g.fillStyle = col;
    if (p.file){
      g.beginPath(); g.roundRect ? g.roundRect(x - 6, y - 7, 12, 14, 2.5) : g.rect(x - 6, y - 7, 12, 14); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 1.3;
      g.beginPath(); g.moveTo(x - 3, y - 2.5); g.lineTo(x + 3, y - 2.5); g.moveTo(x - 3, y + 1); g.lineTo(x + 3, y + 1); g.moveTo(x - 3, y + 4.5); g.lineTo(x + 1, y + 4.5); g.stroke();
    } else {
      g.beginPath(); g.arc(x, y, 5.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; g.globalAlpha = 0.8; g.beginPath(); g.arc(x - 1.6, y - 1.6, 1.8, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
    }
  }
  // nodes
  const spacing = (W - padX * 2) * 0.82 / Math.max(1, S.listBots.length - 2);
  const fs = W < 560 ? 10.5 : 12;
  for (const b of S.bots.values()) drawNode(b, now, fs, W < 560 ? spacing * 1.7 : 150);
}

function drawNode(b, now, fs, maxW){
  const r = nodeR(b), x = b.px, y = b.py;
  // pulse ring
  if (b.pulse > 0){
    g.strokeStyle = b.pulseColor; g.globalAlpha = b.pulse * 0.6; g.lineWidth = 2;
    g.beginPath(); g.arc(x, y, r * (1.1 + (1 - b.pulse) * 0.9), 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1;
  }
  if (b.id === 'you'){
    g.fillStyle = T.panel; g.strokeStyle = T.sub; g.lineWidth = 1.5;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = T.ink; g.font = `700 ${fs}px ${T.font}`; g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText('あなた', x + r + 8, y);
    return;
  }
  // blob body
  const t = now / 1000, bob = b.typing > 0 ? Math.sin(t * 7) * 2 : 0;
  g.save(); g.translate(x, y + bob);
  g.beginPath();
  for (let i = 0; i <= 28; i++){
    const a = i / 28 * Math.PI * 2;
    const rr = r * (1 + 0.05 * Math.sin(a * 3 + t * 1.3 + b.seed) + 0.03 * Math.sin(a * 2 - t * 0.9 + b.seed * 2));
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
  g.fillStyle = b.color === 'boss' ? T.boss : b.color; g.fill();
  if (b.color === 'boss'){ g.strokeStyle = T.bossEdge; g.lineWidth = 1.5; g.stroke(); }
  // eyes
  if (now > b.blinkAt + 150) b.blinkAt = now + rnd(2200, 6000);
  const blink = now > b.blinkAt && now < b.blinkAt + 150 ? 0.12 : 1;
  let lx = Math.sin(t * 0.4 + b.seed) * 0.4, ly = Math.cos(t * 0.3 + b.seed) * 0.3;
  if (b.lookAt && now < b.lookUntil){
    const dx = b.lookAt.px - x, dy = b.lookAt.py - y, l = Math.hypot(dx, dy) || 1;
    lx = dx / l; ly = dy / l;
  } else if (b.typing > 0){ lx = 0; ly = 0.9; }
  [-1, 1].forEach(s => {
    const ex = s * r * 0.27, ey = -r * 0.1;
    g.fillStyle = '#fff';
    g.beginPath(); g.ellipse(ex, ey, r * 0.19, r * 0.26 * blink, 0, 0, Math.PI * 2); g.fill();
    if (blink > 0.5){
      g.fillStyle = '#14171c';
      g.beginPath(); g.ellipse(ex + lx * r * 0.08, ey + ly * r * 0.1, r * 0.095, r * 0.12, 0, 0, Math.PI * 2); g.fill();
    }
  });
  g.restore();
  // typing bubble
  if (b.typing > 0){
    const bx = x + r * 0.7, by = y - r * 1.15;
    g.fillStyle = T.panel; g.strokeStyle = T.line; g.lineWidth = 1;
    g.beginPath(); g.roundRect ? g.roundRect(bx, by - 9, 30, 18, 9) : g.rect(bx, by - 9, 30, 18); g.fill(); g.stroke();
    for (let i = 0; i < 3; i++){
      g.fillStyle = T.cmd;
      g.globalAlpha = 0.35 + 0.65 * Math.max(0, Math.sin(t * 7 - i * 0.8));
      g.beginPath(); g.arc(bx + 8 + i * 7, by, 2.2, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
  }
  // label
  g.fillStyle = T.ink; g.font = `700 ${fs}px ${T.font}`; g.textAlign = 'center'; g.textBaseline = 'top';
  const lines = wrapLabel(b.name, maxW);
  lines.forEach((ln, i) => g.fillText(ln, x, y + r + 6 + i * (fs + 3)));
}

function wrapLabel(s, maxW){
  if (g.measureText(s).width <= maxW) return [s];
  const mid = Math.ceil(s.length / 2);
  return [s.slice(0, mid), s.slice(mid)];
}

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;

});

/* ------------------------------ daily report ------------------------------ */
function newDay(n){ return {n, count:0, byBot:new Map(), byKind:{}, jobs:[]}; }

function wlen(str){ let n = 0; for (const ch of str) n += ch.codePointAt(0) > 0x10ff ? 2 : 1; return n; }
function buildPost(r){
  const head = `【ボットの職場】${r.sc.name} ${r.n}日目の日報\nやりとり${r.count}件・完了した仕事${r.jobCount}件`;
  const top = r.top ? `\nいちばん働いたBot：${r.top.name}（${r.tc}件）` : '';
  const tail = '\n#ボットの職場';
  const label = '\n今日の成果：';
  let hl = r.highlight || '';
  if (hl){
    const budget = 280 - 24 - wlen(head + top + tail + label);
    if (wlen(hl) > budget){ while (wlen(hl) > budget - 2 && hl.length > 1) hl = hl.slice(0, -1); hl += '…'; }
  }
  return head + top + (hl ? label + hl : '') + tail;
}

function makeReport(){
  const ds = S.day, n = ds.n;
  let top = null, tc = 0;
  for (const [b, c] of ds.byBot) if (b.id !== 'd' && c > tc){ top = b; tc = c; }
  const done = ds.jobs;
  const hl = [...done].reverse().find(j => j.toYou) || done[done.length - 1];
  const rep = {n, sc:S.sc, time:S.sim, count:ds.count, byKind:{...ds.byKind}, top, tc,
    jobs:pickHighlights(done), jobCount:done.length, highlight: hl ? hl.text : null,
    word: fill(pick(CLOSING), {bot: top ? top.name : 'みなさん'}, {})};
  rep.post = buildPost(rep);
  S.reports.unshift(rep); if (S.reports.length > 12) S.reports.pop();
  S.day = newDay(n + 1);
  S.jobs.push({def:{isReport:true, steps:[['d', 'you', 'rep', `${n}日目の日報です。やりとり${rep.count}件、完了した仕事${rep.jobCount}件でした。`, `日報_${n}日目.pdf`]]}, ctx:{}, i:0, ph:'start', t:0});
  renderReports(true);
  showToast(rep);
  if (narrowMQ.matches && currentTab !== 'report') $('repDot').hidden = false;
}

function pickHighlights(done){
  const seen = new Set(), out = [];
  const add = list => { for (let k = list.length - 1; k >= 0 && out.length < 5; k--){ const t = list[k].text; if (!seen.has(t)){ seen.add(t); out.push(t); } } };
  add(done.filter(j => j.toYou));
  if (out.length < 3) add(done.filter(j => !j.toYou && j.text.length > 14));
  return out.reverse();
}

      <div class="post">
        <h3>Xに投稿する文面</h3>
        <p class="post-t" id="post-${i}">${esc(r.post).replace(/\n/g, '<br>')}<br>${esc(GAME_URL)}</p>
        <div class="post-act">
          <a class="xbtn" href="${xHref}" target="_blank" rel="noopener">Xで投稿</a>
          <button class="copybtn" type="button" data-i="${i}">文面をコピー</button>
        </div>
      </div>
    </div>
  </details>`;
}
function renderReports(isNew){
  if (!S.reports.length){
    repEl.innerHTML = '<div class="empty">18:00になると、総合ボットから1日のまとめ(日報)が届きます。日報にはXに投稿できる文面もつきます。</div>';
    return;
  }
  repEl.innerHTML = S.reports.map((r, i) => repHTML(r, i, isNew && i === 0)).join('');
}
repEl.addEventListener('click', e => {
  const b = e.target.closest('.copybtn'); if (!b) return;
  const r = S.reports[+b.dataset.i]; if (!r) return;
  const text = r.post + '\n' + GAME_URL;
  const done = () => { b.textContent = 'コピーしました'; setTimeout(() => { b.textContent = '文面をコピー'; }, 1800); };
  const fallback = () => {
    const el = $('post-' + b.dataset.i); if (!el) return;
    const rg = document.createRange(); rg.selectNodeContents(el);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    b.textContent = '選択しました。コピーしてください';
    setTimeout(() => { b.textContent = '文面をコピー'; }, 2600);
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch(err){ fallback(); }
});

let toastTimer = 0;
function showToast(r){
  $('toastT').textContent = `${r.n}日目の日報`;
  const t = $('toast'); t.hidden = true; void t.offsetWidth; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 7000);
}
$('toastBtn').addEventListener('click', () => {
  $('toast').hidden = true;
  if (narrowMQ.matches) setTab('report');
  else $('paneReport').scrollIntoView({behavior: reduceMQ.matches ? 'auto' : 'smooth', block:'start'});
});

let resetTimer = 0;
$('resetBtn').addEventListener('click', () => {
  const b = $('resetBtn');
  if (b.hasAttribute('data-armed')){
    clearTimeout(resetTimer); b.removeAttribute('data-armed'); b.textContent = 'リセット';
    loadScenario(S.sc.id);
  } else {
    b.setAttribute('data-armed', ''); b.textContent = 'もう一度押すとリセット';
    resetTimer = setTimeout(() => { b.removeAttribute('data-armed'); b.textContent = 'リセット'; }, 3000);
  }
});

/* ------------------------------ skins ------------------------------ */
const SKINS = [
  {id:'auto', name:'自動', note:'端末の明暗に合わせる', pv:['#f2f4f7','#0e1014','#3d5ce0','#e0830a']},
  {id:'office', name:'オフィス', note:'明るい職場', pv:['#f2f4f7','#ffffff','#3d5ce0','#e0830a']},
  {id:'yakin', name:'夜勤', note:'暗いフロア', pv:['#0e1014','#16191f','#7d93ff','#ffab3d']},
  {id:'kami', name:'書類', note:'クラフト紙の机', pv:['#efe8da','#fbf7ef','#3156b8','#c26a0a']},
  {id:'mint', name:'ミント', note:'すっきり淡い緑', pv:['#e4f3ed','#ffffff','#3d5ce0','#d4336c']},
  {id:'server', name:'サーバー室', note:'深夜の紫', pv:['#120f2e','#1b1742','#6fa8ff','#ff6fb1']},
  {id:'terminal', name:'ターミナル', note:'黒画面に緑の文字', pv:['#030803','#071107','#39ff88','#4fd6ff']}
];
let skin = SKINS.some(x => x.id === settings.skin) ? settings.skin : 'auto';
function applySkin(){
  const r = document.documentElement;
  if (skin === 'auto') r.removeAttribute('data-skin'); else r.setAttribute('data-skin', skin);
  document.querySelectorAll('.skin').forEach(b => b.setAttribute('aria-checked', String(b.dataset.id === skin)));
  readTokens();
}
$('skinList').innerHTML = SKINS.map(x => `<button class="skin" type="button" role="radio" data-id="${x.id}" aria-checked="false">
  <span class="pv" style="background:${x.id === 'auto' ? `linear-gradient(90deg,${x.pv[0]} 50%,${x.pv[1]} 50%)` : x.pv[0]}"><i class="wide" style="background:${x.id === 'auto' ? '#ffffff' : x.pv[1]}"></i><i style="background:${x.pv[2]}"></i><i style="background:${x.pv[3]}"></i></span>
  <b>${x.name}</b><small>${x.note}</small></button>`).join('');
$('skinList').addEventListener('click', e => {
  const b = e.target.closest('.skin'); if (!b) return;
  skin = b.dataset.id; applySkin(); saveSettings();
});
$('skinBtn').addEventListener('click', () => {
  const p = $('skinPanel'); p.hidden = !p.hidden;
  $('skinBtn').setAttribute('aria-expanded', String(!p.hidden));
});
applySkin();

/* ------------------------------ loop ------------------------------ */
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (innerWidth < 1 || innerHeight < 1 || !S) return;
  try {
    update(dt);
    if (needReorder) reorder();
    drawGraph(now);
  } catch(e){ console.error(e); }
}

readTokens();
resizeCanvas();
loadScenario(settings.sc || 'menu');
setSpeed([0, 1, 3, 10].includes(settings.speed) ? settings.speed : 1);
if (speed === 0) setSpeed(1);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
