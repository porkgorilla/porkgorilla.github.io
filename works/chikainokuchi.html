<script>
'use strict';
const GAME_URL = 'https://porkgorilla.com/works/chikainokuchi.html';
const OG_CACHE_VERSION = 1;
const SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const HASHTAG = '#近いの口';
const KEY = 'chikainokuchi';
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif';

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), gameEl = $('game');
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = n => Math.round(n).toLocaleString('ja-JP');

const store = {
  get(k, d){ try{ const v = localStorage.getItem(KEY + '-' + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(KEY + '-' + k, JSON.stringify(v)); }catch(e){} }
};
let best = store.get('best', {day:0, yen:0});
if (!best || typeof best !== 'object') best = {day:0, yen:0};
let soundOn = store.get('sound', true) !== false;

/* ================= 画面サイズ ================= */
let CW = 0, CH = 0, DPR = 1, SC = 1, W = 380, H = 700, FLOOR = 630;
function resize(){
  const r = gameEl.getBoundingClientRect();
  const w = r.width, h = r.height;
  if (!(w >= 1 && h >= 1)) return;          // 画面サイズ0のときは何もしない
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  CW = w; CH = h;
  cv.width = Math.max(1, Math.round(w * DPR)); cv.height = Math.max(1, Math.round(h * DPR));
  SC = Math.min(h / 600, w / 380);
  if (!(SC > 0) || !isFinite(SC)) SC = 1;
  W = w / SC; H = h / SC;
  FLOOR = H - Math.max(64, H * 0.1);
  layout();
  fitHUD(); fitBtns();
}

/* ================= 状態 ================= */
const S = {
  mode:'title', day:1, t:0, dayLen:40, anim:0, D:null,
  phase:'idle', phT:0, phDur:1, pat:null, lastPat:'',
  smell:0, strain:0, pose:0, hits:0, dodged:0,
  parts:[], fx:[], texts:[],
  bubble:'', bubbleA:0, mouth:0, lean:0, anger:0, cigGlow:0,
  hand:{x:36, y:4}, sylT:0, idleT:0, smokeT:0,
  endKind:'', endT:0, wrap:false, wrapT:0,
  damage:0, dmgList:[], shake:0, hitT:0, boingT:0, paused:false,
  hitSnd:0, bounceCool:0, squeakT:0, muriShown:false, bossHitSaid:false
};

/* ================= 新入社員(ゴムの体) ================= */
const NN = 9, SEG = 26, HR = 27, STEP = 1 / 120;
const L_REST = SEG * (NN - 1) + HR * .85;
const nb = { n:[], arms:[[],[]], baseX:0, baseY:0, grab:-1, tx:0, ty:0, rel:false, sx:0, sy:0, ox:0, oy:0, pid:null, free:false, floorHit:false };

function initNewbie(){
  nb.n = [];
  for (let i = 0; i < NN; i++){ const x = nb.baseX, y = nb.baseY - i * SEG; nb.n.push({x, y, px:x, py:y}); }
  for (let s = 0; s < 2; s++){
    const sx = nb.baseX + (s ? 16 : -16), sy = nb.baseY - 6 * SEG;
    nb.arms[s] = [{x:sx, y:sy, px:sx, py:sy}, {x:sx + (s ? 6 : -6), y:sy + 26, px:sx, py:sy + 26}, {x:sx + (s ? 8 : -8), y:sy + 50, px:sx, py:sy + 50}];
  }
  nb.free = false; nb.grab = -1; nb.pid = null;
}
function headCenter(){
  const n = nb.n, a = n[NN - 1], b = n[NN - 2];
  let tx = a.x - b.x, ty = a.y - b.y; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
  return {x:a.x + tx * HR * .85, y:a.y + ty * HR * .85, tx, ty};
}
function restHeadY(){ return nb.baseY - L_REST; }

function stepNewbie(h){
  const n = nb.n, free = nb.free;
  const limp = S.endKind === 'faint' && (S.mode === 'faint' || S.mode === 'result');
  const g = free ? 1700 : limp ? 1500 : 0;
  const damp = free ? .996 : limp ? .975 : .982;
  for (let i = 0; i < NN; i++){
    const p = n[i];
    if (i === 0 && !free){ p.x = p.px = nb.baseX; p.y = p.py = nb.baseY; continue; }
    const vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
    p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + g * h * h;
  }
  // まっすぐに戻ろうとする力(ゴムの弾力)
  const kb0 = free ? .035 : limp ? .003 : .11;
  if (!free){ const p = n[1]; p.x += (nb.baseX - p.x) * kb0; p.y += ((nb.baseY - SEG) - p.y) * kb0; }
  for (let i = 1; i < NN - 1; i++){
    const a = n[i - 1], b = n[i], c = n[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1;
    const ix = b.x + dx / l * SEG, iy = b.y + dy / l * SEG, k = kb0 * (1 - .45 * i / NN);
    c.x += (ix - c.x) * k; c.y += (iy - c.y) * k;
  }
  // 無理をすると震える
  // (震えは見た目だけ。体の形には加えない → drawNewbie)
  // 長さの拘束(少し伸び縮みするゴム)
  for (let it = 0; it < 5; it++){
    for (let i = 1; i < NN; i++){
      const a = n[i - 1], b = n[i];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-3;
      const corr = (d - SEG) / d * .6;
      if (i === 1 && !free){ b.x -= dx * corr; b.y -= dy * corr; }
      else { a.x += dx * corr * .5; a.y += dy * corr * .5; b.x -= dx * corr * .5; b.y -= dy * corr * .5; }
    }
    for (let i = 1; i < NN - 1; i++){
      const a = n[i - 1], c = n[i + 1];
      const dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy) || 1e-3, mn = SEG * 1.45;
      if (d < mn){
        const corr = (d - mn) / d * .25;
        if (i === 1 && !free){ c.x -= dx * corr; c.y -= dy * corr; }
        else { a.x += dx * corr * .5; a.y += dy * corr * .5; c.x -= dx * corr * .5; c.y -= dy * corr * .5; }
      }
    }
    if (!free){
      for (let i = 1; i < NN; i++){
        const p = n[i], r = i === NN - 1 ? HR * .7 : 12;
        if (p.y > FLOOR - r) p.y = FLOOR - r;
        if (p.x < r) p.x = r; if (p.x > W - r) p.x = W - r;
      }
    }
  }
  // ドラッグ(拘束の後にかけるので、引っぱると伸びる)
  if (nb.grab >= 0 && !free && !limp && (S.mode === 'play' || S.mode === 'wrap')){
    const p = n[nb.grab];
    p.x += (nb.tx - p.x) * .3; p.y += (nb.ty - p.y) * .3;
    const r = nb.grab === NN - 1 ? HR * .7 : 12;
    if (p.y > FLOOR - r) p.y = FLOOR - r;
  }
  if (free) boingCollide(h);
  stepArms(h, free ? 1700 : 900);
}

function stepArms(h, g){
  const n = nb.n, a = n[5], b = n[7], c = n[6];
  let tx = b.x - a.x, ty = b.y - a.y; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
  const px = -ty, py = tx;
  for (let s = 0; s < 2; s++){
    const arm = nb.arms[s], sg = s ? 1 : -1;
    arm[0].x = c.x + px * 17 * sg + tx * 4; arm[0].y = c.y + py * 17 * sg + ty * 4;
    for (let j = 1; j < 3; j++){
      const p = arm[j];
      const vx = (p.x - p.px) * .965, vy = (p.y - p.py) * .965;
      p.px = p.x; p.py = p.y; p.x += vx + px * sg * 40 * h * h; p.y += vy + g * h * h;
    }
    for (let it = 0; it < 3; it++){
      for (let j = 1; j < 3; j++){
        const q = arm[j - 1], p = arm[j], len = j === 1 ? 26 : 24;
        const dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy) || 1e-3, corr = (d - len) / d;
        if (j === 1){ p.x -= dx * corr; p.y -= dy * corr; }
        else { q.x += dx * corr * .5; q.y += dy * corr * .5; p.x -= dx * corr * .5; p.y -= dy * corr * .5; }
      }
      for (let j = 1; j < 3; j++){
        const p = arm[j];
        if (p.y > FLOOR - 7) p.y = FLOOR - 7;
        if (p.x < 7) p.x = 7; if (p.x > W - 7) p.x = W - 7;
        if (p.y < 7) p.y = 7;
      }
    }
  }
}

/* ================= 物(家具・上司) ================= */
const OBJ = [
  {k:'window', ghost:true, w:200, h:150, yen:180000, name:'窓ガラス'},
  {k:'lamp', w:110, h:16, yen:12000, name:'蛍光灯'},
  {k:'clock', w:44, h:44, yen:4980, name:'壁掛け時計'},
  {k:'poster', w:56, h:72, yen:300, name:'「報連相」の貼り紙'},
  {k:'water', w:34, h:120, yen:35000, name:'ウォーターサーバー'},
  {k:'desk', w:124, h:58, yen:48000, name:'上司のデスク'},
  {k:'pc', w:52, h:42, yen:158000, name:'ノートPC'},
  {k:'plant', w:38, h:86, yen:8800, name:'観葉植物'},
  {k:'chair', w:50, h:86, yen:23000, name:'オフィスチェア'},
  {k:'cabinet', w:42, h:150, yen:62000, name:'書類キャビネット'},
  {k:'boss', w:96, h:290, yen:300000, name:'上司への慰謝料'},
];
OBJ.forEach(o => Object.assign(o, {x:0, y:0, a:0, vx:0, vy:0, va:0, dyn:false, hit:false, cool:0, cx:0, cy:0}));
const OB = {}; OBJ.forEach(o => OB[o.k] = o);
const BOSS = OB.boss;

function placeObjs(reset){
  const cx = W / 2;
  for (const o of OBJ){
    if (reset){ o.dyn = false; o.hit = false; o.vx = o.vy = o.va = 0; o.a = 0; o.cool = 0; }
    if (o.dyn) continue;
    switch (o.k){
      case 'boss': o.x = cx - 120; o.y = FLOOR - o.h / 2; break;
      case 'window': o.w = Math.min(300, W * .5); o.x = W * .36; o.y = Math.max(90, FLOOR - 400); break;
      case 'lamp': o.x = W * .44; o.y = Math.max(60, FLOOR - 470); break;
      case 'clock': o.x = W * .84; o.y = FLOOR - 410; break;
      case 'poster': o.x = W * .67; o.y = FLOOR - 335; break;
      case 'water': o.x = Math.max(o.w / 2 + 4, W * .06); o.y = FLOOR - o.h / 2; break;
      case 'desk': o.x = W * .3; o.y = FLOOR - o.h / 2; break;
      case 'pc': o.x = W * .3 + 22; o.y = FLOOR - OB.desk.h - o.h / 2; break;
      case 'plant': o.x = W * .5; o.y = FLOOR - o.h / 2; break;
      case 'chair': o.x = Math.min(W * .87, W - 70); o.y = FLOOR - o.h / 2; break;
      case 'cabinet': o.x = W - o.w / 2 - 4; o.y = FLOOR - o.h / 2; break;
    }
  }
}
function layout(){
  const ox = nb.baseX, oy = nb.baseY;
  nb.baseX = W / 2 + 85; nb.baseY = FLOOR - 8;
  if (!nb.n.length) initNewbie();
  else if (!nb.free){
    const dx = nb.baseX - ox, dy = nb.baseY - oy;
    for (const p of nb.n){ p.x += dx; p.px += dx; p.y += dy; p.py += dy; }
    for (const arm of nb.arms) for (const p of arm){ p.x += dx; p.px += dx; p.y += dy; p.py += dy; }
  }
  placeObjs(false);
}

/* 上司のローカル座標 → 画面の座標(前傾も考える) */
function bossW(lx, ly){
  const o = BOSS; let x = lx, y = ly;
  if (!o.dyn){
    const c = Math.cos(S.lean), s = Math.sin(S.lean), dy = y - 45;
    x = lx * c - dy * s; y = dy * c + lx * s + 45;

/* ================= 気絶・ピョーン ================= */

function updateBoing(dt){

function boingCollide(h){
  const n = nb.n;
  for (let i = 0; i < NN; i++){
    const p = n[i], r = i === NN - 1 ? HR : 14;
    let vx = p.x - p.px, vy = p.y - p.py;
    const sp0 = Math.hypot(vx, vy) / h;
    let bounced = false;
    if (p.x < r){ p.x = r; if (vx < 0){ vx = -vx * .9; bounced = true; } }
    if (p.x > W - r){ p.x = W - r; if (vx > 0){ vx = -vx * .9; bounced = true; } }
    if (p.y < r){ p.y = r; if (vy < 0){ vy = -vy * .9; bounced = true; } }
    if (p.y > FLOOR - r){ p.y = FLOOR - r; if (vy > 0){ vy = -vy * .86; vx *= .97; bounced = true; } nb.floorHit = true; }
    if (bounced && sp0 > 800 && S.bounceCool <= 0){ S.bounceCool = .22; sfx.bounce(); }

      for (const o of OBJ){
        const c = circRect(p.x, p.y, r, o);
        if (!c) continue;
        const sp = Math.hypot(vx, vy) / h;
        if (o.ghost){ if (sp > 350 && !o.hit){ const cl = toLocal(o, p.x, p.y); o.cx = cl.x; o.cy = cl.y; hitObj(o, 0, 0); } continue; }

function toLocal(o, x, y){

function updateObjs(dt){

/* ================= 音 ================= */
let AC = null, MG = null, NOISE = null;

    AC = new C(); MG = AC.createGain(); MG.gain.value = soundOn ? .9 : 0; MG.connect(AC.destination);

}

  // 胴体
  tube([n[3], n[4], n[5], n[6], n[7]], 40, suit, OUT);
  tube([lp(n[5], n[6], .2), n[6], lp(n[6], n[7], .9)], 13, '#f6f6f2');
  tube([lp(n[5], n[6], .4), n[6], lp(n[6], n[7], .75)], 5.5, '#d23b3b');
  { const pts = [off(3, -11), off(4, -12), off(5, -12), off(6, -11)]; tube(pts, 4, 'rgba(255,255,255,.16)'); }
  // 首
  tube([n[7], n[8]], 15, skin, OUT);
  // 前の腕
  armDraw(nb.arms[0], suit);
  // 頭
  const hc = headCenter(), ang = Math.atan2(hc.ty, hc.tx) + Math.PI / 2;
  ctx.save(); ctx.translate(hc.x, hc.y); ctx.rotate(ang);
  ell(HR - 3, 2, 6, 8, mixHex(skin, '#000000', .08), OUT, 2);
  ell(0, 0, HR, HR, skin, OUT, 2.8);
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ell(-10, -12, 7, 4);
  // 髪(七三っぽい)
  ctx.fillStyle = '#1f1c22'; ctx.beginPath(); ctx.arc(0, 0, HR + 1.2, Math.PI * .98, Math.PI * 2.02);
  ctx.quadraticCurveTo(HR * .4, -HR * .25, -HR * .1, -HR * .42); ctx.quadraticCurveTo(-HR * .6, -HR * .5, -HR - 1, -HR * .05); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#4a4550'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(4, -HR + 1); ctx.quadraticCurveTo(0, -HR * .7, -2, -HR * .45); ctx.stroke();
  // 顔
  ctx.strokeStyle = OUT; ctx.fillStyle = OUT; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  const ex1 = -11, ex2 = 4, ey = -1;
  if (free){
    ell(ex1, ey, 6.5, 7.5, '#fff', OUT, 2); ell(ex2, ey, 6.5, 7.5, '#fff', OUT, 2);
    ell(ex1 - 1, ey + Math.sin(S.anim * 30) * 2, 2.4, 2.4, OUT); ell(ex2 - 1, ey + Math.cos(S.anim * 30) * 2, 2.4, 2.4, OUT);
    ell(-4, 13, 6, 7, '#7a2632', OUT, 2);
  } else if (limp){
    for (const ex of [ex1, ex2]){ ctx.beginPath(); ctx.moveTo(ex - 4, ey - 4); ctx.lineTo(ex + 4, ey + 4); ctx.moveTo(ex + 4, ey - 4); ctx.lineTo(ex - 4, ey + 4); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-12, 12); for (let i = 0; i < 4; i++) ctx.lineTo(-12 + (i + 1) * 4, 12 + (i % 2 ? -2.5 : 2.5)); ctx.stroke();
  } else if (S.hitT > 0){
    ctx.beginPath(); ctx.moveTo(ex1 - 5, ey - 4); ctx.lineTo(ex1 + 3, ey); ctx.lineTo(ex1 - 5, ey + 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex2 + 5, ey - 4); ctx.lineTo(ex2 - 3, ey); ctx.lineTo(ex2 + 5, ey + 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-12, 13); for (let i = 0; i < 4; i++) ctx.lineTo(-12 + (i + 1) * 4, 13 + (i % 2 ? -2.5 : 2.5)); ctx.stroke();
    ell(-17, 7, 4.5, 3, 'rgba(160,170,60,.55)'); ell(10, 7, 4.5, 3, 'rgba(160,170,60,.55)');
  } else if (S.strain > 62){
    ctx.beginPath(); ctx.moveTo(ex1 - 4, ey); ctx.lineTo(ex1 + 4, ey); ctx.moveTo(ex2 - 4, ey); ctx.lineTo(ex2 + 4, ey); ctx.stroke();
    const w = Math.sin(S.anim * 40) * 1.5;
    ctx.beginPath(); ctx.moveTo(-11, 12 + w); ctx.quadraticCurveTo(-4, 8 - w, 3, 12 + w); ctx.stroke();
  } else {
    ell(ex1, ey, 2.8, 3.3, OUT); ell(ex2, ey, 2.8, 3.3, OUT);
    ctx.beginPath(); ctx.moveTo(ex1 - 4, ey - 7); ctx.lineTo(ex1 + 3, ey - 9); ctx.moveTo(ex2 - 3, ey - 9); ctx.lineTo(ex2 + 4, ey - 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9, 13); ctx.quadraticCurveTo(-4, 10, 1, 13); ctx.stroke();
    ell(-18, 7, 4, 2.5, 'rgba(240,130,120,.35)'); ell(11, 7, 4, 2.5, 'rgba(240,130,120,.35)');
  }
  // 汗
  if (!free && !limp && S.strain > 40){
    const k = (S.strain - 40) / 60;
    ctx.fillStyle = 'rgba(110,180,240,.9)';
    for (let i = 0; i < 2; i++){
      const yy = -14 + i * 14 + ((S.anim * 30 + i * 9) % 10) * k;
      ctx.beginPath(); ctx.moveTo(HR + 5 + i * 3, yy - 6); ctx.quadraticCurveTo(HR + 10 + i * 3, yy + 2, HR + 5 + i * 3, yy + 4); ctx.quadraticCurveTo(HR + i * 3, yy + 2, HR + 5 + i * 3, yy - 6); ctx.fill();
    }
  }
  ctx.restore();
}
function drawParticles(){
  for (const p of S.parts){
    ctx.globalAlpha = clamp(p.fade, 0, 1) * clamp(1.2 - p.life / 5, 0, 1);
    const s = p.r * 3.2; ctx.drawImage(SPR, p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}
function drawFx(){
  for (const f of S.fx){
    const a = 1 - f.life / f.max;
    if (f.t === 'smoke'){ ctx.fillStyle = `rgba(170,170,165,${a * .35})`; }
    else ctx.fillStyle = `rgba(222,200,80,${a * .55})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of S.texts){
    const a = clamp((t.max - t.life) / .3, 0, 1);
    fitFont(900, t.size, t.txt, W - 16);
    const hw = ctx.measureText(t.txt).width / 2 + 6;
    const x = hw * 2 < W ? clamp(t.x, hw, W - hw) : W / 2, y = clamp(t.y, 50, H - 20);
    ctx.globalAlpha = a; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
    ctx.strokeText(t.txt, x, y); ctx.fillStyle = t.col; ctx.fillText(t.txt, x, y);
  }
  ctx.globalAlpha = 1;
}
function drawBubble(){
  if (!S.bubble || S.bubbleA < .02) return;
  const txt = S.bubble, maxW = Math.min(W - 24, 320);
  const fs = fitFont(900, 21, txt, maxW - 28);
  const tw = ctx.measureText(txt).width, bw = tw + 28, bh = fs + 22;
  const bx = clamp(BOSS.dyn ? W / 2 : BOSS.x + 70, bw / 2 + 8, W - bw / 2 - 8);
  const by = Math.max(56 + bh / 2, FLOOR - 340);
  ctx.globalAlpha = S.bubbleA;
  const tipX = BOSS.dyn ? bx : BOSS.x + 20, tipY = BOSS.dyn ? by + bh / 2 + 10 : FLOOR - 288;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = OUT; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(clamp(tipX + 8, bx - bw / 2 + 14, bx + bw / 2 - 30), by + bh / 2 - 2); ctx.lineTo(tipX, tipY); ctx.lineTo(clamp(tipX + 26, bx - bw / 2 + 30, bx + bw / 2 - 12), by + bh / 2 - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  rrectPath(bx - bw / 2, by - bh / 2, bw, bh, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillRect(clamp(tipX + 9, bx - bw / 2 + 15, bx + bw / 2 - 29), by + bh / 2 - 5, 16, 6);
  ctx.fillStyle = '#c8432c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, bx, by + 1);
  ctx.globalAlpha = 1;
}
function bar(x, y, w, h, v, label, col){
  ctx.fillStyle = 'rgba(40,32,22,.75)'; rrectPath(x, y, w, h, h / 2); ctx.fill();
  ctx.save(); rrectPath(x, y, w, h, h / 2); ctx.clip(); ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(v, 0, 1), h); ctx.restore();
  fitFont(800, 13, label, w - 18);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.strokeText(label, x + 9, y + h / 2 + 1); ctx.fillText(label, x + 9, y + h / 2 + 1);
}
function drawGauges(){
  if (S.mode === 'title') return;
  if (S.endKind === 'boing'){
    const txt = '被害総額 ¥' + fmt(S.damage);
    fitFont(900, 28, txt, W - 30);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.lineJoin = 'round';
    ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.strokeText(txt, W / 2, 12); ctx.fillStyle = '#c8432c'; ctx.fillText(txt, W / 2, 12);
    return;
  }
  const bw = (W - 30) / 2;
  bar(10, 10, bw, 24, S.smell / 100, 'ヤニ臭', '#c4ad27');
  const hot = S.strain > 62 && Math.sin(S.anim * 24) > 0;
  bar(20 + bw, 10, bw, 24, S.strain / 100, 'ゴム限界', hot ? '#ff3d62' : '#ee819b');
  if (S.mode === 'play' && S.day === 1 && S.t < 5){
    const txt = '新入社員をドラッグして、体を曲げてヤニを避けよう';
    fitFont(800, 15, txt, W - 24);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = clamp((5 - S.t) / .6, 0, 1);
    ctx.fillStyle = 'rgba(30,24,18,.75)'; const tw = ctx.measureText(txt).width + 22; rrectPath(W / 2 - tw / 2, FLOOR + 14, tw, 30, 15); ctx.fill();
    ctx.fillStyle = '#ffe27a'; ctx.fillText(txt, W / 2, FLOOR + 30);
    ctx.globalAlpha = 1;
  }
}
function render(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const sh = S.shake * SC * DPR;
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, sh ? rand(-sh, sh) : 0, sh ? rand(-sh, sh) : 0);
  drawBG();
  const lamp = OB.lamp;
  if (!lamp.dyn){ ctx.strokeStyle = '#6d675c'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lamp.x - 30, 0); ctx.lineTo(lamp.x - 30, lamp.y); ctx.moveTo(lamp.x + 30, 0); ctx.lineTo(lamp.x + 30, lamp.y); ctx.stroke(); }
  for (const o of OBJ) if (!o.dyn && o.k !== 'boss') drawObj(o);
  if (!BOSS.dyn){ ell(BOSS.x + 2, FLOOR + 2, 42, 6, 'rgba(0,0,0,.18)'); drawObj(BOSS); }
  drawTelegraph();
  drawNewbie();
  drawParticles();
  for (const o of OBJ) if (o.dyn) drawObj(o);
  drawFx();
  drawBubble();
  drawGauges();
}

/* ================= HUD・ボタン ================= */
const hudEl = $('hud'), hudBox = $('hudBox');
let hudStr = '';
function updateHUD(force){
  let s = '近いの口';
  if (S.mode === 'play' || S.mode === 'wrap') s = S.wrap ? `${S.day}日目 説教おわり` : `${S.day}日目 残り${Math.max(0, Math.ceil(S.dayLen - S.t))}秒`;
  else if (S.mode === 'boing') s = '大暴走中！';
  else if (S.mode === 'faint') s = '気絶…';
  else if (S.mode === 'result') s = `${S.day}日目`;
  if (s !== hudStr || force){ hudStr = s; hudEl.textContent = s; fitHUD(); }
}
function fitHUD(){
  hudEl.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(hudEl).fontSize) || 15, k = 0;
  while (k++ < 12 && fs > 9 && (hudEl.scrollWidth > hudBox.clientWidth || hudEl.scrollWidth > hudEl.clientWidth + 1)){ fs -= 1; hudEl.style.fontSize = fs + 'px'; }
}
function fitBtns(){
  document.querySelectorAll('.rgrid>*').forEach(b => {
    if (!b.offsetParent) return;
    b.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(b).fontSize) || 16, k = 0;
    while (k++ < 8 && fs > 10 && b.scrollWidth > b.clientWidth + 1){ fs -= 1; b.style.fontSize = fs + 'px'; }
  });
}
const SND_ON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const SND_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function applySound(){
  $('sndBtn').innerHTML = soundOn ? SND_ON : SND_OFF;
  $('pSound').textContent = soundOn ? '音：ON' : '音：OFF';
  if (MG) try{ MG.gain.value = soundOn ? .9 : 0; }catch(e){}
}
function toggleSound(){ soundOn = !soundOn; store.set('sound', soundOn); initAudio(); applySound(); fitBtns(); }
$('sndBtn').addEventListener('click', toggleSound);
$('pSound').addEventListener('click', toggleSound);

function shareHref(text){ return 'https://x.com/intent/post?text=' + encodeURIComponent(text + ' ' + HASHTAG) + '&url=' + encodeURIComponent(SHARE_URL); }
function setShare(el, text){
  el.href = shareHref(text);
  if (matchMedia('(pointer: coarse)').matches){ el.removeAttribute('target'); el.removeAttribute('rel'); }
}

/* ================= 画面遷移 ================= */
function showBest(){
  const t = [];
  if (best.day > 0) t.push(`最高記録：${best.day}日目まで耐えた`);
  if (best.yen > 0) t.push(`最大被害総額：¥${fmt(best.yen)}`);
  $('bestTxt').textContent = t.join(' / ');
  setShare($('shareTitle'), '近いの口：ヘビースモーカー上司の説教で飛んでくるヤニを、ゴムの新入社員をぐにゃっと曲げて避けるゲーム');
}
function beginDay(){
  S.mode = 'play'; S.t = 0; S.dayLen = Math.min(55, 30 + 5 * (S.day - 1)); S.D = diff();
  S.phase = 'inhale'; S.phT = 0; S.phDur = 1.1; S.pat = null; S.lastPat = '';
  S.smell = 0; S.strain = 0; S.hits = 0; S.dodged = 0; S.parts = []; S.texts = []; S.fx = [];
  S.bubble = ''; S.endKind = ''; S.wrap = false; S.wrapT = 0; S.clearAt = 0; S.hitT = 0; S.muriShown = false;
  S.damage = 0; S.dmgList = []; S.paused = false;
  placeObjs(true); initNewbie();
  $('titleOv').hidden = true; $('resOv').hidden = true; $('pauseOv').hidden = true;
  $('pauseBtn').classList.remove('off');
  sfx.inhale(); updateHUD(true);
}
function startGame(){ initAudio(true); S.day = 1; beginDay(); }
function showClear(){
  S.mode = 'result'; S.endKind = 'clear';
  if (S.day > best.day){ best.day = S.day; store.set('best', best); }
  sfx.clear();
  $('resHead').textContent = '説教終了！';
  $('resSub').textContent = `${S.day}日目の説教を耐え抜いた`;
  $('resStats').innerHTML = `避けたヤニ：${fmt(S.dodged)}粒<br>浴びたヤニ：${fmt(S.hits)}粒`;
  $('againBtn').textContent = '翌日の説教へ';
  openResult(`近いの口で${S.day}日目の説教を耐え抜いた！避けたヤニ${fmt(S.dodged)}粒`);
}
function showResult(kind){
  S.mode = 'result'; S.endKind = kind;
  const rem = Math.max(0, Math.ceil(S.dayLen - S.t));
  let share = '';
  if (kind === 'faint'){
    $('resHead').textContent = 'ヤニで気絶…';
    $('resSub').textContent = `${S.day}日目、説教のこり${rem}秒で力尽きた`;
    $('resStats').innerHTML = `避けたヤニ：${fmt(S.dodged)}粒<br>浴びたヤニ：${fmt(S.hits)}粒` + (S.day > 1 ? `<br>${S.day - 1}日分の説教は耐えた` : '');
    share = `近いの口、${S.day}日目でヤニ臭に気絶…`;
  } else {
    if (S.damage > best.yen){ best.yen = S.damage; store.set('best', best); }
    $('resHead').textContent = '大暴走！';
    $('resSub').textContent = `被害総額 ¥${fmt(S.damage)}`;
    const list = S.dmgList.slice().sort((a, b) => b.yen - a.yen).slice(0, 5);
    $('resStats').innerHTML = `${S.day}日目、新入社員がピョーンした` + (list.length ? '<table>' + list.map(d => `<tr><td>${d.name}</td><td class="y">¥${fmt(d.yen)}</td></tr>`).join('') + '</table>' : '<br>…でも何も壊さなかった');
    share = `近いの口で新入社員がピョーンして、被害総額¥${fmt(S.damage)}！(${S.day}日目)`;
  }
  $('againBtn').textContent = 'もう一度';
  openResult(share);
}
function openResult(shareText){
  $('pauseBtn').classList.add('off');
  $('resOv').hidden = false;
  setShare($('resShare'), shareText);
  updateHUD(true); fitBtns();
}
function backToTitle(){
  S.mode = 'title'; S.paused = false; S.endKind = ''; S.bubble = ''; S.parts = []; S.texts = [];
  placeObjs(true); initNewbie(); S.smell = 0; S.strain = 0;
  $('resOv').hidden = true; $('pauseOv').hidden = true; $('titleOv').hidden = false;
  $('pauseBtn').classList.add('off'); disarm();
  showBest(); updateHUD(true);
}
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', () => {
  initAudio(true);
  if (S.endKind === 'clear') S.day++; else S.day = 1;
  beginDay();
});
$('titleBtn').addEventListener('click', backToTitle);

function pauseGame(){
  if (!(S.mode === 'play' || S.mode === 'wrap') || S.paused) return;
  S.paused = true; release();
  $('pauseInfo').textContent = `${S.day}日目・説教のこり${Math.max(0, Math.ceil(S.dayLen - S.t))}秒`;
  setShare($('pShare'), `近いの口で${S.day}日目の説教を受けてる(のこり${Math.max(0, Math.ceil(S.dayLen - S.t))}秒・ヤニ臭${Math.round(S.smell)}%)`);
  $('pauseOv').hidden = false; fitBtns();
}
function resumeGame(){ S.paused = false; $('pauseOv').hidden = true; disarm(); last = performance.now(); initAudio(true); }
$('pauseBtn').addEventListener('click', pauseGame);
$('resumeBtn').addEventListener('click', resumeGame);
let armed = false, armTimer = null;
const pTitle = $('pTitle');
pTitle.addEventListener('click', () => {
  if (!armed){ armed = true; pTitle.textContent = '本当に？(もう一度タップ)'; pTitle.classList.add('danger'); clearTimeout(armTimer); armTimer = setTimeout(disarm, 3000); fitBtns(); return; }
  disarm(); backToTitle();
});
function disarm(){ armed = false; clearTimeout(armTimer); pTitle.textContent = 'タイトルへ'; pTitle.classList.remove('danger'); fitBtns(); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pauseGame();
  else initAudio();
});

/* ================= 入力 ================= */
function toWorld(e){ const r = cv.getBoundingClientRect(); return {x:(e.clientX - r.left) / SC, y:(e.clientY - r.top) / SC}; }
function setTarget(p){
  let tx, ty;
  if (nb.rel){ tx = nb.ox + (p.x - nb.sx) * 1.15; ty = nb.oy + (p.y - nb.sy) * 1.15; }
  else { tx = p.x - nb.ox; ty = p.y - nb.oy; }
  const dx = tx - nb.baseX, dy = ty - nb.baseY, d = Math.hypot(dx, dy), mx = L_REST * 1.45;
  if (d > mx){ tx = nb.baseX + dx / d * mx; ty = nb.baseY + dy / d * mx; }
  nb.tx = clamp(tx, 14, W - 14); nb.ty = Math.min(ty, FLOOR - 14);
}
cv.addEventListener('pointerdown', e => {
  if (!(S.mode === 'play' || S.mode === 'wrap') || S.paused || nb.free) return;
  initAudio();
  e.preventDefault();
  const p = toWorld(e), hc = headCenter();
  let gi = -1, gd = 34;
  for (let i = 3; i < NN - 1; i++){ const d = Math.hypot(p.x - nb.n[i].x, p.y - nb.n[i].y); if (d < gd){ gd = d; gi = i; } }
  const dh = Math.hypot(p.x - hc.x, p.y - hc.y);
  if (dh < HR + 30 && (gi < 0 || dh < gd + 10)){ nb.grab = NN - 1; nb.rel = false; nb.ox = hc.x - nb.n[NN - 1].x; nb.oy = hc.y - nb.n[NN - 1].y; }
  else if (gi >= 0){ nb.grab = gi; nb.rel = false; nb.ox = p.x - nb.n[gi].x; nb.oy = p.y - nb.n[gi].y; nb.ox = 0; nb.oy = 0; }
  else { nb.grab = NN - 1; nb.rel = true; nb.sx = p.x; nb.sy = p.y; nb.ox = nb.n[NN - 1].x; nb.oy = nb.n[NN - 1].y; }
  nb.pid = e.pointerId;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  setTarget(p);
});
cv.addEventListener('pointermove', e => { if (nb.pid !== e.pointerId || nb.grab < 0) return; setTarget(toWorld(e)); });
const up = e => { if (nb.pid === e.pointerId) release(); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);

/* ================= ループ ================= */
let last = performance.now(), acc = 0;
function update(dt){
  S.anim += dt;
  if (S.mode === 'play' || S.mode === 'wrap') updatePlay(dt);
  else if (S.mode === 'faint'){ S.endT += dt; bossPose(dt); if (S.endT > 2.4) showResult('faint'); }
  else if (S.mode === 'boing'){ updateBoing(dt); }
  else bossPose(dt);
  acc += dt; let k = 0;
  while (acc >= STEP && k < 8){ stepNewbie(STEP); acc -= STEP; k++; }
  if (k >= 8) acc = 0;
  updateParticles(dt); updateObjs(dt); updateFx(dt);
  updateHUD();
}
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;
  if (CW < 1 || CH < 1 || innerWidth < 1 || innerHeight < 1 || !nb.n.length){ resize(); return; }
  try{ if (!S.paused) update(dt); render(); }catch(e){ console.error(e); }
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(gameEl);
applySound(); resize(); showBest(); updateHUD(true);
requestAnimationFrame(loop);
</script>
