<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLOR_CONVERTER | porkgorilla://</title>
  <meta name="description" content="カラーピッカーと HEX / RGB / HSL の相互変換ツール。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBT4300J0L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MBT4300J0L');
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    main { padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    h1 { margin: 0; font-size: 1.6rem; }
    .box { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }
    .box > * + * { margin-top: 10px; }
    #sw { height: 110px; border: 1px solid var(--cyber-green-dim); background: #39ff6a; }
    input[type=text] { font-family: var(--cyber-font); font-size: 1rem; padding: 8px 10px; width: 100%; box-sizing: border-box;
      background: var(--cyber-bg-panel); color: var(--cyber-text); border: 1px solid var(--cyber-green-dim); }
    input[type=text]:focus { outline: none; border-color: var(--cyber-green); }
    input.bad { border-color: var(--cyber-red) !important; }
    input[type=color] { width: 100%; height: 44px; padding: 2px; box-sizing: border-box; cursor: pointer;
      background: var(--cyber-bg-panel); border: 1px solid var(--cyber-green-dim); }
    label { color: var(--cyber-green-dim); font-size: .85rem; }
    .field { display: flex; gap: 8px; align-items: flex-end; }
    .field > div { flex: 1; min-width: 0; }
    .field .btn { flex: 0 0 auto; padding: 8px 12px; }
    .credit { font-size: 11px; color: var(--cyber-green-dim); margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>🎨 COLOR_CONVERTER</h1>
    <div class="box panel">
      <div id="sw"></div>
      <div><label>ピッカー</label><input type="color" id="pick" value="#39ff6a"></div>
      <div class="field"><div><label>HEX</label><input type="text" id="hex" spellcheck="false"></div><button class="btn" data-c="hex" type="button">COPY</button></div>
      <div class="field"><div><label>RGB</label><input type="text" id="rgb" spellcheck="false"></div><button class="btn" data-c="rgb" type="button">COPY</button></div>
      <div class="field"><div><label>HSL</label><input type="text" id="hsl" spellcheck="false"></div><button class="btn" data-c="hsl" type="button">COPY</button></div>
    </div>
    <div class="credit">porkgorilla — 2026</div>
  </main>

  <script src="/site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let cur = [57, 255, 106];
    const hex = c => '#' + c.map(x => x.toString(16).padStart(2, '0')).join('');
    function toHsl([r, g, b]) {
      r /= 255; g /= 255; b /= 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
      let h = 0, s = 0;
      if (d) {
        s = d / (1 - Math.abs(2 * l - 1));
        h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
        h *= 60;
      }
      return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
    }
    function fromHsl(h, s, l) {
      s /= 100; l /= 100;
      const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      return [f(0), f(8), f(4)].map(x => Math.round(x * 255));
    }
    function render(except) {
      $('sw').style.background = hex(cur);
      if (except !== 'pick') $('pick').value = hex(cur);
      if (except !== 'hex') $('hex').value = hex(cur).toUpperCase();
      if (except !== 'rgb') $('rgb').value = 'rgb(' + cur.join(', ') + ')';
      if (except !== 'hsl') { const h = toHsl(cur); $('hsl').value = 'hsl(' + h[0] + ', ' + h[1] + '%, ' + h[2] + '%)'; }
      ['hex', 'rgb', 'hsl'].forEach(k => $(k).classList.remove('bad'));
    }
    function parse(kind, s) {
      s = s.trim();
      if (kind === 'hex') {
        const m = s.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
        if (!m) return null;
        let h = m[1]; if (h.length === 3) h = h.replace(/./g, '$&$&');
        return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16));
      }
      const nums = (s.match(/-?\d+(\.\d+)?/g) || []).map(Number);
      if (nums.length !== 3) return null;
      if (kind === 'rgb') return nums.every(n => n >= 0 && n <= 255) ? nums.map(Math.round) : null;
      if (nums[1] < 0 || nums[1] > 100 || nums[2] < 0 || nums[2] > 100) return null;
      return fromHsl(((nums[0] % 360) + 360) % 360, nums[1], nums[2]);
    }
    ['hex', 'rgb', 'hsl'].forEach(k => $(k).addEventListener('input', () => {
      const c = parse(k, $(k).value);
      if (c) { cur = c; render(k); } else $(k).classList.add('bad');
    }));
    $('pick').addEventListener('input', () => { cur = parse('hex', $('pick').value); render('pick'); });
    document.querySelectorAll('[data-c]').forEach(b => b.onclick = async () => {
      const el = $(b.dataset.c);
      try { await navigator.clipboard.writeText(el.value); } catch (e) { el.select(); document.execCommand('copy'); }
      b.textContent = 'OK!'; setTimeout(() => b.textContent = 'COPY', 1200);
    });
    render();
  </script>
</body>
</html>
