<style>
[hidden]{display:none!important}
:root{
  --bg:#14121c; --panel:#211e2e; --ink:#f4f1ea; --dim:#9a95ab; --sub:#7d7891; --gold:#f5c542;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;box-sizing:border-box}
body{min-height:100%;position:relative;background:radial-gradient(ellipse at top,#2a2440 0%,var(--bg) 60%) fixed;background-color:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c",sans-serif;overflow-x:hidden;-webkit-user-select:none;user-select:none;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,a{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent}

/* 上部バー */
#top{display:flex;align-items:center;gap:6px;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 0}
.home{color:var(--sub);text-decoration:none;font-size:12px;letter-spacing:.04em;white-space:nowrap;padding:12px 4px}
.home:hover{color:var(--ink)}
#top .sp{flex:1}
.ibtn{min-width:44px;min-height:44px;border-radius:12px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ibtn svg{width:22px;height:22px}

#app{width:100%;max-width:560px;margin:0 auto;padding:6px 14px 28px;display:flex;flex-direction:column;gap:12px}
h1{font-family:"Dela Gothic One",sans-serif;font-weight:400}
.screen{display:none;flex-direction:column;gap:14px;animation:fade .35s}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* タイトル */
.logo{text-align:center;padding-top:4px}
.logo h1{font-size:44px;line-height:1.05;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 0%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #6b3d10)}
.logo p{color:var(--dim);font-size:13px;margin-top:8px}
.lineup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lineup .mini{background:var(--panel);border-radius:12px;padding:6px 4px 8px;text-align:center;font-size:10.5px;line-height:1.3;min-width:0}
.lineup .mini svg{width:100%;height:auto;display:block}
.lineup .mini b{display:block;color:var(--ink);font-size:11px}
.rules{background:var(--panel);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;color:#d6d1e2}
.rules b{color:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2>*{width:100%;min-width:0}
.grid2>.wide{grid-column:1 / -1}
.btn{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:14px 10px;font-weight:800;font-size:16px;color:#1a1500;background:var(--gold);
  box-shadow:0 5px 0 #a87a10;transition:transform .08s;white-space:nowrap;overflow:hidden}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a87a10}
.btn.alt{background:#e9e4f5;box-shadow:0 5px 0 #8c86a0}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:none;border:2px solid rgba(245,197,66,.55)}
.btn.ghost:active{transform:translateY(2px)}
.btn.ghost.danger{color:#ff7a6a;border-color:rgba(255,122,106,.7)}
.btn.x{background:#000;color:#fff;box-shadow:0 5px 0 #444;border:1px solid #333;font-size:15px}
.btn small{display:block;font-size:11px;font-weight:500;opacity:.75;margin-top:2px}
.best{text-align:center;font-size:12px;color:var(--dim)}
.credit{text-align:center;font-size:11px;color:#6f6a80;letter-spacing:.05em}

/* ゲーム */
.hud{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;font-weight:800;gap:8px;padding:0 6px}
.hud .q{font-size:14px;color:var(--dim);white-space:nowrap}
.hud .score{font-family:"Dela Gothic One";font-size:22px;color:var(--gold)}
.hud .combo{font-size:12px;color:#ff8a5c;min-width:0;text-align:right;white-space:nowrap}
.timer{height:8px;background:#2f2a42;border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5f5f,var(--gold),#6be09a);transform-origin:left}
.hint{background:#fbf7ec;color:#1d1a26;border-radius:18px;padding:16px 16px 18px;position:relative;min-height:112px;box-shadow:0 6px 0 #c9bfa5}
.hint .tag{display:inline-block;font-size:11px;font-weight:800;background:#1d1a26;color:#fbf7ec;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.hint .txt{font-size:19px;font-weight:800;line-height:1.5}
.hint:after{content:"";position:absolute;bottom:-14px;left:50%;margin-left:-12px;border:12px solid transparent;border-top-color:#fbf7ec;border-bottom:0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.card{background:var(--panel);border-radius:18px;padding:8px 8px 10px;position:relative;border:3px solid transparent;color:var(--ink);
  transition:transform .15s,border-color .15s,opacity .2s;min-width:0}
.card:active{transform:scale(.97)}
.card svg{width:auto;max-width:100%;height:auto;max-height:26vh;display:block;margin:0 auto}
.card .lbl{text-align:center;font-size:12px;font-weight:800;margin-top:2px;color:var(--dim);min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.right{border-color:#6be09a;transform:scale(1.03)}
.card.wrong{border-color:#ff5f5f;animation:shake .35s}
.card.dim{opacity:.35}
.card.shuffle{animation:shuf .4s backwards}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes shuf{0%{transform:scale(.6) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.paused .card,.paused .shuffle{animation-play-state:paused}
.stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Dela Gothic One";
  font-size:56px;pointer-events:none;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.toast{text-align:center;font-weight:800;min-height:44px;font-size:14px;line-height:1.5}
.toast .big{font-family:"Dela Gothic One";font-size:22px}
@media (max-height:600px) and (orientation:portrait){
  .card svg{max-height:12vh}
  .cards{gap:8px}
  .card{padding:6px 6px 6px}
  .hint{min-height:0;padding:12px 14px 14px}
  .hint .txt{font-size:16px}
}
/* 低い横長の画面ではカードを横一列に */
@media (max-height:560px) and (orientation:landscape){
  #app{max-width:760px}
  .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hint{min-height:0;padding:10px 14px 12px}
  .hint .txt{font-size:16px}
  .hint .tag{display:none}
  .hint:after{display:none}
  .card svg{max-height:21vh}
  .hint{padding:8px 12px}
  .hud .score{font-size:18px}
  .card .lbl{font-size:11px;min-height:15px}
  .cards{gap:8px;margin-top:0}
  #app{gap:8px}
  #top{padding-top:calc(env(safe-area-inset-top,0px) + 2px)}
  .toast{min-height:0}
  .logo h1{font-size:32px}
  .result .sc{font-size:44px}
  .log{max-height:none}
}

/* リザルト */
.result{text-align:center;padding-top:4px}
.result .sc{font-family:"Dela Gothic One";font-size:64px;color:var(--gold);line-height:1.2}
.result .rank{font-size:22px;font-weight:800;margin-top:4px}
.result .cm{color:#d6d1e2;font-size:14px;margin-top:8px;line-height:1.6}
.log{background:var(--panel);border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.6;max-height:240px;overflow:auto}
.log div{display:flex;gap:8px;border-bottom:1px solid #2f2a42;padding:4px 0}
.log div:last-child{border:0}
.log .ok{color:#6be09a}.log .ng{color:#ff5f5f}
.note{font-size:10.5px;color:#6f6a80;text-align:center;line-height:1.5}

@media (max-height:560px) and (orientation:landscape){
  .result .sc{font-size:40px}
  .result .rank{font-size:18px}
  .result .cm{margin-top:2px}
}
/* 一時停止 */
#pauseOv{position:absolute;inset:0;z-index:9;background:rgba(10,8,16,.86);display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 64px) 16px 24px;overflow-y:auto}
#pauseOv .pcard{width:100%;max-width:420px;background:var(--panel);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 10px 40px rgba(0,0,0,.5)}
#pauseOv h2{font-family:"Dela Gothic One";font-weight:400;font-size:28px;text-align:center}
#pauseOv .st{text-align:center;color:var(--dim);font-size:13px}
</style>
</head>

<div id="pauseOv" hidden>

    `<path d="M40 200 Q44 150 90 146 Q136 150 140 200Z" fill="#1d1d24"/><path d="M80 146 Q90 156 100 146Z" fill="#111"/>`,   // 黒ずくめ

    `<path d="M40 200 Q44 150 90 146 Q136 150 140 200Z" fill="#26324a"/><path d="M80 146 L90 166 L100 146Z" fill="#fff"/><path d="M87 150 L93 150 L95 186 L90 192 L85 186Z" fill="${c}"/>`, // スーツ＋ネクタイ
  ][p.id];
  const glasses = [
    `<g fill="none" stroke="#222" stroke-width="3"><rect x="62" y="80" width="22" height="15" rx="4"/><rect x="96" y="80" width="22" height="15" rx="4"/><line x1="84" y1="86" x2="96" y2="86"/></g>`,
    `<g fill="none" stroke="#222" stroke-width="3.2"><rect x="61" y="79" width="24" height="16" rx="2"/><rect x="95" y="79" width="24" height="16" rx="2"/><line x1="85" y1="85" x2="95" y2="85"/></g>`,
    `<g fill="none" stroke="#5a3d7a" stroke-width="2.6"><ellipse cx="73" cy="88" rx="12" ry="9"/><ellipse cx="107" cy="88" rx="12" ry="9"/><path d="M85 86 q5-3 10 0"/></g>`,
    `<g fill="none" stroke="#777" stroke-width="2.4"><circle cx="73" cy="87" r="10"/><circle cx="107" cy="87" r="10"/><line x1="83" y1="86" x2="97" y2="86"/></g>`,
  ][p.id];
  const eyes = p.id===2
    ? `<path d="M64 88 q9-6 18 0" stroke="#222" stroke-width="3" fill="none"/><path d="M98 88 q9-6 18 0" stroke="#222" stroke-width="3" fill="none"/>`
    : `<circle cx="73" cy="88" r="3" fill="#222"/><circle cx="107" cy="88" r="3" fill="#222"/>`;
  const mouth = ["M80 118 q10 6 20 0","M80 118 h20","M78 116 q12 10 24 0","M78 116 q12 8 24 0"][p.id];
  const extra = p.id===0 ? `<path d="M72 124 q18 14 36 0 q-4 10-18 12 q-14-2-18-12Z" fill="#7a6a6a" opacity=".55"/>` : "";
  return `<svg viewBox="0 0 180 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs><radialGradient id="bg${uid}" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="${c}" stop-opacity=".55"/><stop offset="1" stop-color="${c}" stop-opacity=".08"/></radialGradient></defs>
    <rect width="180" height="200" rx="14" fill="url(#bg${uid})"/>
    ${outfit}
    <rect x="80" y="126" width="20" height="24" fill="${skin}"/>
    <ellipse cx="90" cy="92" rx="38" ry="42" fill="${skin}"/>
    <ellipse cx="52" cy="94" rx="6" ry="9" fill="${skin}"/><ellipse cx="128" cy="94" rx="6" ry="9" fill="${skin}"/>
    <path d="${hairPath}" fill="${hair}"/>
    ${eyes}
    <path d="M66 76 h14 M100 76 h14" stroke="${hair}" stroke-width="3.5" stroke-linecap="round"/>
    ${glasses}
    <path d="M90 92 v12 h-4" stroke="#c99a74" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    ${extra}
    <path d="${mouth}" stroke="#8a4a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    ${props}
  </svg>`;
}

/* ===== 基本設定 ===== */
const GAME_NAME = 'ダレダレ四天王';
const GAME_URL = 'https://porkgorilla.com/works/daredare.html';
const OG_CACHE_VERSION = 1;
const SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const HASHTAG = '#ダレダレ四天王';
const KEY = 'daredare-';
const $ = id => document.getElementById(id);
function lsGet(k, d){ try{ const v = localStorage.getItem(KEY + k); return v === null ? d : v; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(KEY + k, v); }catch(e){} }

/* ===== サウンド ===== */
let AC = null, soundOn = lsGet('sound', '1') === '1';
function initAudio(force){
  if (AC && force){ try{ AC.close().catch(() => {}); }catch(e){} AC = null; }
  else if (AC){
    if (AC.state === 'closed') AC = null;
    else { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  }
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
}
function beep(freqs, dur = .12, type = 'square', vol = .08){
  if (!AC || !soundOn) return;
  try{
    let t = AC.currentTime;
    freqs.forEach(f => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur); t += dur * .8;
    });
  }catch(e){}
}
const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function refreshSound(){
  $('soundBtn').innerHTML = soundOn ? ICON_ON : ICON_OFF;
  $('soundBtn').setAttribute('aria-label', soundOn ? '音をオフにする' : '音をオンにする');
  $('pSound').textContent = soundOn ? '音：ON' : '音：OFF';
}
function toggleSound(){
  soundOn = !soundOn; lsSet('sound', soundOn ? '1' : '0');
  if (soundOn){ initAudio(); beep([660], .08); }
  refreshSound();
}
$('soundBtn').addEventListener('click', toggleSound);
$('pSound').addEventListener('click', toggleSound);

/* ===== X共有 ===== */
function setShare(el, text){
  el.href = 'https://x.com/intent/post?text=' + encodeURIComponent(text + ' ' + HASHTAG) + '&url=' + encodeURIComponent(SHARE_URL);
  if (matchMedia('(pointer: coarse)').matches){ el.removeAttribute('target'); el.removeAttribute('rel'); }
}
setShare($('shareTitle'), `ヒントを読んで、4人のうち誰の話かを当てる肩書きクイズ『${GAME_NAME}』`);

/* ===== 2回押しの確認 ===== */
function twoPress(btn, label, action){
  let armed = false, timer = null;
  const disarm = () => { armed = false; clearTimeout(timer); btn.textContent = label; btn.classList.remove('danger'); };
  btn.addEventListener('click', () => {
    if (!armed){
      armed = true; btn.textContent = '本当に？(もう一度)'; btn.classList.add('danger');
      clearTimeout(timer); timer = setTimeout(disarm, 3000); return;
    }
    disarm(); action();
  });
  return disarm;
}

/* ===== 状態 ===== */
const QN = 10;
let mode = 'title', level = 'easy', paused = false;
let qs = [], qi = 0, score = 0, combo = 0, maxCombo = 0, log = [];
let phase = 'ask', elapsed = 0, limit = 8000, revealLeft = 0;
const levelName = () => level === 'hard' ? 'ガチ' : 'ふつう';

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function refreshHome(){
  const on = (mode === 'title' || mode === 'result') && !paused;
  const a = $('homeLink');
  a.style.visibility = on ? '' : 'hidden';
  a.style.display = (mode === 'play') ? 'none' : '';
  a.tabIndex = on ? 0 : -1;
  if (on) a.removeAttribute('aria-hidden'); else a.setAttribute('aria-hidden', 'true');
}
function show(m){
  mode = m;
  const id = { title:'sTitle', play:'sGame', result:'sResult' }[m];
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  $('pauseBtn').hidden = m !== 'play';
  $('hud').style.visibility = m === 'play' ? '' : 'hidden';
  refreshHome();
  window.scrollTo(0, 0);
}

function buildQuestions(){
  const byP = P.map(p => shuffle(p.hints));
  const order = shuffle([0,1,2,3,0,1,2,3,...shuffle([0,1,2,3]).slice(0,2)]);
  return order.map(pid => ({ pid, h: byP[pid].shift() }));
}

function start(lv){
  level = lv; limit = lv === 'hard' ? 6000 : 8000;
  initAudio(true);
  qs = buildQuestions(); qi = 0; score = 0; combo = 0; maxCombo = 0; log = [];
  $('score').textContent = 0; $('combo').textContent = '';
  paused = false; $('pauseOv').hidden = true;
  show('play'); beep([523,659,784], .09);
  next();
}

function next(){
  phase = 'ask'; elapsed = 0;
  const q = qs[qi];
  $('qNo').textContent = `Q${qi+1}/${QN}`;
  $('htag').textContent = ['ヒント','この人は…','うわさ','プロフィール'][Math.random() * 4 | 0];
  $('htxt').textContent = q.h;
  $('toast').innerHTML = '';
  $('bar').style.transform = 'scaleX(1)';
  const box = $('cards'); box.innerHTML = '';
  shuffle(P).forEach((p, i) => {
    const d = document.createElement('button');
    d.className = 'card shuffle'; d.style.animationDelay = (i * .05) + 's';
    d.innerHTML = avatar(p, qi + '_' + i) + `<div class="lbl">${level === 'easy' ? p.title : '？？？'}</div>`;
    d.dataset.pid = p.id;
    d.addEventListener('click', () => answer(p.id, d));
    box.appendChild(d);
  });
}

function answer(pid, el){
  if (mode !== 'play' || paused || phase !== 'ask') return;
  phase = 'reveal';
  const q = qs[qi], ok = pid === q.pid;
  const cards = [...document.querySelectorAll('.card')];
  const rightEl = cards.find(c => +c.dataset.pid === q.pid);
  cards.forEach(c => { if (c !== rightEl && c !== el) c.classList.add('dim'); });
  cards.forEach(c => c.querySelector('.lbl').textContent = P[+c.dataset.pid].title);
  rightEl.classList.add('right');
  if (ok){
    combo++; maxCombo = Math.max(maxCombo, combo);
    const speed = Math.max(0, 1 - elapsed / limit);
    const gain = Math.round((100 + speed * 200) * (1 + (combo - 1) * .25));
    score += gain;
    rightEl.insertAdjacentHTML('beforeend', '<div class="stamp" style="color:#6be09a">◯</div>');
    $('toast').innerHTML = `<span class="big" style="color:#6be09a">正解！ +${gain}</span>`;
    beep(combo >= 3 ? [784,988,1175,1568] : [784,1047], .09);
  } else {
    combo = 0;
    if (el){ el.classList.remove('dim'); el.classList.add('wrong'); el.insertAdjacentHTML('beforeend', '<div class="stamp" style="color:#ff5f5f">✕</div>'); }
    $('toast').innerHTML = `<span class="big" style="color:#ff5f5f">${el ? 'ハズレ…' : '時間切れ！'}</span><br>正解は「${P[q.pid].title}」`;
    beep([220,165], .18, 'sawtooth', .06);
  }
  $('score').textContent = score;
  $('combo').textContent = combo >= 2 ? `${combo} COMBO!` : '';
  log.push({ h:q.h, ok, ans:P[q.pid].title });
  revealLeft = ok ? 1100 : 1900;
}

const RANKS = [
  [0,'顔と肩書きが全員一致しない人','まずは4人の肩書きを覚えるところから。'],
  [4,'会議でなんとなく頷く人','半分くらいは見分けられた。惜しい！'],
  [7,'業界ウォッチャー','かなり見分けられている。あとはスピード！'],
  [9,'肩書きソムリエ','ほぼ完璧。この4人を混同することはもうない。'],
  [10,'ダレダレ四天王・五人目','全問正解！あなたが五人目の四天王です。'],
];
function finish(){
  const correct = log.filter(l => l.ok).length;
  const r = RANKS.filter(x => correct >= x[0]).pop();
  let isBest = false;
  const k = 'best-' + level, b = +lsGet(k, 0);
  if (score > b){ lsSet(k, score); isBest = true; }
  $('rScore').textContent = score;
  $('rRank').textContent = r[1] + (isBest ? ' ／ 自己ベスト更新！' : '');
  $('rCm').innerHTML = `${correct}/${QN}問正解・最大${maxCombo}コンボ(${levelName()})<br>${r[2]}`;
  $('rLog').innerHTML = log.map(l => `<div><span class="${l.ok ? 'ok' : 'ng'}">${l.ok ? '◯' : '✕'}</span><span>${l.h}<br><small style="color:var(--dim)">→ ${l.ans}</small></span></div>`).join('');
  // 共有文は結果を確定させたあと、変数から作る
  setShare($('shareResult'), `『${GAME_NAME}』(${levelName()})で${correct}/${QN}問正解・${score}点！称号「${r[1]}」`);
  show('result');
  beep([523,659,784,1047], .12, 'triangle', .1);
  renderBest();
}
function renderBest(){
  const e = lsGet('best-easy', null), h = lsGet('best-hard', null);
  $('best').textContent = (e || h) ? `自己ベスト　ふつう ${e || 0}／ガチ ${h || 0}` : '';
}

/* ===== 一時停止 ===== */
let disarmTitle, disarmHome;
function setPaused(on){
  if (mode !== 'play' && on) return;
  paused = on;
  $('pauseOv').hidden = !on;
  $('sGame').classList.toggle('paused', on);
  if (on){
    $('pStat').textContent = `${levelName()}　Q${qi+1}/${QN}　${score}点`;
    setShare($('sharePause'), `『${GAME_NAME}』(${levelName()})をプレイ中：Q${qi+1}/${QN}・${score}点`);
  } else { disarmTitle && disarmTitle(); disarmHome && disarmHome(); }
  refreshHome();
}
$('pauseBtn').addEventListener('click', () => setPaused(true));
$('resumeBtn').addEventListener('click', () => { initAudio(); setPaused(false); });
disarmTitle = twoPress($('pTitle'), 'タイトルへ', () => { setPaused(false); backToTitle(); });
disarmHome = twoPress($('pHome'), 'サイトのトップへ', () => { location.href = '/'; });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && !paused) setPaused(true); else if (!document.hidden) initAudio(); });

function backToTitle(){ paused = false; $('pauseOv').hidden = true; show('title'); renderBest(); }

/* ===== ループ(タイマーと次の問題への間) ===== */
let last = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(100, Math.max(0, now - (last || now))); last = now;
  if (mode !== 'play' || paused) return;
  try{
    if (phase === 'ask'){
      elapsed += dt;
      $('bar').style.transform = `scaleX(${Math.max(0, 1 - elapsed / limit)})`;
      if (elapsed >= limit) answer(-1, null);
    } else {
      revealLeft -= dt;
      if (revealLeft <= 0){ qi++; qi < QN ? next() : finish(); }
    }
  }catch(e){ console.error(e); }
}
requestAnimationFrame(loop);

/* ===== 初期化 ===== */
$('lineup').innerHTML = P.map(p => `<div class="mini">${avatar(p, 't' + p.id)}<b>${p.title}</b></div>`).join('');
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => start(b.dataset.mode)));
$('again').addEventListener('click', () => start(level));
$('toTitle').addEventListener('click', backToTitle);
refreshSound();
refreshHome();
renderBest();
</script>
