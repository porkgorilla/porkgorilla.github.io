<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DICE | porkgorilla://</title>
  <meta name="description" content="サイコロツール。6面のほか4・8・10・12・20・100面に対応、最大10個を同時に振って合計を表示。履歴つき。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBT4300J0L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MBT4300J0L');
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    main { padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; user-select: none; -webkit-user-select: none; }
    h1 { margin: 0; font-size: 1.6rem; }
    .opts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
    select { font-family: var(--cyber-font); font-size: 1rem; padding: .55rem .5rem; background: var(--cyber-bg-panel);
      color: var(--cyber-green); border: 1px solid var(--cyber-green-dim); }
    #tray { width: 100%; max-width: 520px; min-height: 160px; padding: 22px 14px; display: flex; flex-wrap: wrap; gap: 14px;
      justify-content: center; align-content: center; cursor: pointer; }
    .die { width: 72px; height: 72px; border-radius: 12px; background: #e9fff0; box-shadow: 0 3px 0 #1e8f3e, 0 0 12px rgba(57, 255, 106, .3);
      display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 10px; }
    .die.num { display: flex; align-items: center; justify-content: center; font-size: 1.9rem; font-weight: bold; color: #053010; padding: 0;
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); border-radius: 0; box-shadow: none; }
    .die.num.d4 { clip-path: polygon(50% 0, 100% 100%, 0 100%); align-items: flex-end; padding-bottom: 10px; }
    .die.num.d100 { font-size: 1.5rem; }
    .die.rolling { animation: shake .12s linear infinite; }
    @keyframes shake { 0% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) translateY(-3px); } 100% { transform: rotate(-8deg); } }
    .pip { width: 12px; height: 12px; border-radius: 50%; background: #0a3a16; align-self: center; justify-self: center; }
    .pip.red { background: #e0204a; width: 15px; height: 15px; }
    #total { font-size: 2.4rem; color: var(--cyber-green); text-shadow: 0 0 10px var(--cyber-green); min-height: 1.3em; }
    #total small { font-size: .9rem; color: var(--cyber-text); text-shadow: none; display: block; text-align: center; }
    #roll { padding: .8rem 3rem; font-size: 1.1rem; }
    .box { width: 100%; max-width: 520px; padding: 16px 14px 12px; }
    #history { margin: 0; padding: 0; list-style: none; font-size: .9rem; line-height: 1.9; max-height: 220px; overflow-y: auto; }
    #history li { border-bottom: 1px dashed #1a4a26; display: flex; justify-content: space-between; gap: 10px; }
    #history li b { color: var(--cyber-green); }
    #history:empty::before { content: 'まだ振っていません'; color: var(--cyber-green-dim); font-size: .85rem; }
    .head { display: flex; justify-content: space-between; align-items: center; color: var(--cyber-green-dim); font-size: .85rem; margin-bottom: 6px; }
    .small { padding: .35rem .8rem; font-size: .8rem; }
    .credit { font-size: 11px; color: var(--cyber-green-dim); margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>🎲 DICE</h1>
    <div class="opts">
      <select id="count" aria-label="個数"></select>
      <select id="faces" aria-label="面の数">
        <option value="4">4面</option><option value="6" selected>6面</option><option value="8">8面</option><option value="10">10面</option>
        <option value="12">12面</option><option value="20">20面</option><option value="100">100面</option>
      </select>
    </div>
    <div id="tray" class="panel" role="button" aria-label="サイコロを振る"></div>
    <div id="total" aria-live="polite"></div>
    <button class="btn" id="roll" type="button">振る</button>
    <div class="box panel">
      <div class="head"><span>履歴</span><button class="btn small" id="clear" type="button">クリア</button></div>
      <ul id="history"></ul>
    </div>
    <div class="credit">porkgorilla — 2026</div>
  </main>

  <script src="/site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    // 6面の目の位置(3×3のマス番号)
    const PIPS = { 1: [4], 2: [2, 6], 3: [2, 4, 6], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
    const STORE = 'dice_opts';
    let rolling = false, values = [];

    for (let i = 1; i <= 10; i++) $('count').insertAdjacentHTML('beforeend', `<option value="${i}">${i}個</option>`);
    try {
      const o = JSON.parse(localStorage.getItem(STORE) || '{}');
      if (o.count) $('count').value = o.count;
      if (o.faces) $('faces').value = o.faces;
    } catch (e) {}

    function randInt(n) {
      const buf = new Uint32Array(1);
      const lim = Math.floor(0x100000000 / n) * n;
      do crypto.getRandomValues(buf); while (buf[0] >= lim);
      return buf[0] % n;
    }

    function dieEl(v, faces, spinning) {
      const d = document.createElement('div');
      if (faces === 6) {
        d.className = 'die';
        for (let k = 0; k < 9; k++) {
          const cell = document.createElement('span');
          if (PIPS[v].includes(k)) cell.className = 'pip' + (v === 1 ? ' red' : '');
          d.appendChild(cell);
        }
      } else {
        d.className = `die num d${faces}`;
        d.textContent = v;
      }
      if (spinning) d.classList.add('rolling');
      d.setAttribute('aria-label', String(v));
      return d;
    }

    function show(spinning) {
      const faces = +$('faces').value;
      $('tray').innerHTML = '';
      values.forEach(v => $('tray').appendChild(dieEl(v, faces, spinning)));
    }

    function saveOpts() {
      try { localStorage.setItem(STORE, JSON.stringify({ count: $('count').value, faces: $('faces').value })); } catch (e) {}
    }

    function roll() {
      if (rolling) return;
      rolling = true;
      $('roll').disabled = true;
      const n = +$('count').value, faces = +$('faces').value;
      let ticks = 0;
      const timer = setInterval(() => {
        values = Array.from({ length: n }, () => 1 + randInt(faces));
        show(true);
        if (++ticks < 9) return;
        clearInterval(timer);
        values = Array.from({ length: n }, () => 1 + randInt(faces));
        show(false);
        const sum = values.reduce((a, b) => a + b, 0);
        $('total').innerHTML = n > 1 ? `${sum}<small>合計 (${n}d${faces})</small>` : `${sum}<small>(d${faces})</small>`;
        const li = document.createElement('li');
        li.innerHTML = `<span>${n}d${faces}: ${values.join(', ')}</span><b>${sum}</b>`;
        $('history').prepend(li);
        rolling = false;
        $('roll').disabled = false;
      }, 60);
    }

    function preview() {
      const n = +$('count').value, faces = +$('faces').value;
      values = Array.from({ length: n }, (_, i) => Math.min(faces, i % faces + 1));
      show(false);
      $('total').innerHTML = '';
      saveOpts();
    }

    $('roll').onclick = roll;
    $('tray').onclick = roll;
    $('count').onchange = preview;
    $('faces').onchange = preview;
    $('clear').onclick = () => { $('history').innerHTML = ''; };
    document.addEventListener('keydown', e => {
      if ((e.key === ' ' || e.key === 'Enter') && e.target.tagName !== 'SELECT' && e.target.tagName !== 'BUTTON') { e.preventDefault(); roll(); }
    });
    preview();
  </script>
</body>
</html>
