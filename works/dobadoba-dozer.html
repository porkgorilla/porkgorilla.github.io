<script>
'use strict';
const GAME_URL = 'https://porkgorilla.com/works/dobadoba-dozer.html';
const OG_CACHE_VERSION = 1;
const SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const LS_BEST = 'dobadoba-dozer-best';
const LS_SOUND = 'dobadoba-dozer-sound';

// ==PHYS_START==
// 簡易物理:コインは平たい円柱。水平方向は位置ベースで押し合い、垂直方向は「下にあるもの」に乗る。
const PHYS = (function(){
  const C = {
    HALF_W: 3.6, CURTAIN_Z: -5.4, FRONT_Z: 2.6, SIDE_GAP_Z: 0.0, H: 0.8,
    PZ_MID: -3.2, PZ_AMP: 1.0, PZ_PERIOD: 3.6, G: 24, DT: 1/180, DROP_Z: -4.95, CAP: 360,
  };
  const TYPES = {
    coin: { r: 0.42, t: 0.13, m: 1, fr: 11, val: 1 },
    big:  { r: 0.72, t: 0.19, m: 3, fr: 11, val: 10 },
    ball: { r: 0.40, t: 0.80, m: 2, fr: 1.4, val: 0 },
  };
  const CELL = 1.5, GX0 = -6, GZ0 = -9, GW = 9, GH = 10;

  function World(){
    this.coins = []; this.order = []; this.time = 0; this.pz = C.PZ_MID; this.pvz = 0;
    this.events = []; this.nid = 1; this.grid = []; this.dirty = false;
    for (let i = 0; i < GW * GH; i++) this.grid.push([]);
  }
  function add(w, type, x, y, z, vx, vy, vz){
    const T = TYPES[type];
    const c = {
      id: w.nid++, type, r: T.r, t: T.t, im: 1 / T.m, fk: Math.exp(-T.fr * C.DT), val: T.val,
      x, y, z, vx: vx || 0, vy: vy || 0, vz: vz || 0, ox: x, oz: z, py: y,
      onGround: false, sk: 0, sref: null, dead: false, gx: 0, gz: 0,
      rx: (Math.random() - .5) * 1.2, rz: (Math.random() - .5) * 1.2, ry: Math.random() * 6.283,
      wx: (Math.random() - .5) * 14, wz: (Math.random() - .5) * 14, q: null, user: null,
    };
    w.coins.push(c); w.order.push(c);
    return c;
  }
  function buildGrid(w){
    const g = w.grid;
    for (let i = 0; i < g.length; i++) g[i].length = 0;
    for (const c of w.coins){
      let ix = Math.floor((c.x - GX0) / CELL), iz = Math.floor((c.z - GZ0) / CELL);
      if (ix < 0) ix = 0; else if (ix >= GW) ix = GW - 1;
      if (iz < 0) iz = 0; else if (iz >= GH) iz = GH - 1;
      c.gx = ix; c.gz = iz; g[iz * GW + ix].push(c);
    }
  }
  function solvePairs(w){
    const g = w.grid;
    for (const a of w.coins){
      for (let dz = -1; dz <= 1; dz++){
        const iz = a.gz + dz; if (iz < 0 || iz >= GH) continue;
        for (let dx = -1; dx <= 1; dx++){
          const ix = a.gx + dx; if (ix < 0 || ix >= GW) continue;
          const cell = g[iz * GW + ix];
          for (let k = 0; k < cell.length; k++){
            const b = cell[k]; if (b.id <= a.id) continue;
            let ddx = b.x - a.x, ddz = b.z - a.z;
            const rs = a.r + b.r, d2 = ddx * ddx + ddz * ddz;
            if (d2 >= rs * rs) continue;
            const vo = Math.min(a.y + a.t, b.y + b.t) - Math.max(a.y, b.y);
            if (vo <= Math.min(a.t, b.t) * 0.3) continue;
            let d = Math.sqrt(d2);

function placeCam(d, elev){
  camera.position.set(camTarget.x, camTarget.y + Math.sin(elev) * d, camTarget.z + Math.cos(elev) * d);
  camera.lookAt(camTarget);

function layout(){
  VW = window.innerWidth; VH = window.innerHeight;
  renderer.setSize(VW, VH, false);

  const r = slotEl.getBoundingClientRect();
  topPad = Math.round(r.bottom + 6);

  camera.aspect = VW / fullH;
  camera.setViewOffset(VW, fullH, 0, -topPad, VW, VH);
  const aspect = VW / fullH;
  const t = clamp((aspect - 0.55) / (1.6 - 0.55), 0, 1);
  const elev = (66 - t * 26) * Math.PI / 180;
  // 視錐台に全ポイントが入る距離を二分探索(ビューオフセット無しで判定)
  camera.clearViewOffset(); camera.aspect = aspect;
  let lo = 4, hi = 60;

    const mid = (lo + hi) / 2; placeCam(mid, elev);

    for (const p of fitPts){ tmpV.copy(p).project(camera); if (Math.abs(tmpV.x) > 0.97 || Math.abs(tmpV.y) > 0.97 || tmpV.z > 1){ ok = false; break; } }
    if (ok) hi = mid; else lo = mid;

}

const SYMS = ['7', '💎', '⭐', '🔔', '🍒', '🍋'];

let SYM_H = 46, REEL_H = 70;
reelEls.forEach(el => {

function measureReels(){
  const s = reelEls[0].querySelector('.sym');
  SYM_H = s.getBoundingClientRect().height || 46;
  REEL_H = reelEls[0].parentElement.getBoundingClientRect().height || 70;
}
function drawReel(r){
  const span = 6 * SYM_H;
  const o = ((r.off % span) + span) % span;
  r.el.style.transform = `translateY(${o - 12 * SYM_H + (REEL_H - SYM_H) / 2}px)`;
}
const PAYS = [ // [記号, 確率]
  [0, 0.01], [1, 0.016], [2, 0.04], [3, 0.07], [4, 0.10], [5, 0.12],
];
let spin = null;
function pickOutcome(){
  let x = Math.random();
  for (const [s, p] of PAYS){ if (x < p) return { win: true, s, t: [s, s, s] }; x -= p; }
  const a = (Math.random() * 6) | 0;
  if (Math.random() < 0.38){
    let c; do { c = (Math.random() * 6) | 0; } while (c === a);
    return { win: false, t: [a, a, c] };
  }
  let b, c;
  do { b = (Math.random() * 6) | 0; c = (Math.random() * 6) | 0; } while ((a === b) || (a === b && b === c));
  return { win: false, t: [a, b, c] };
}
function startSpin(){
  S.stock--; updateStock();
  const out = pickOutcome();
  const reach = out.t[0] === out.t[1];
  spin = { out, reach, t: 0, stops: [0.55, 0.85, reach ? 2.6 : 1.15], reachShown: false, tickT: 0 };
  reels.forEach(r => { r.state = 'spin'; r.speed = 1150; r.a = null; });
}
function easeOutBack(p){ const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
function updateSlot(dt){
  if (!spin){ if (S.stock > 0 && S.mode === 'play') startSpin(); return; }
  spin.t += dt;
  spin.tickT += dt;
  if (spin.tickT > 0.075 && reels.some(r => r.state === 'spin')){ spin.tickT = 0; SND.tick(); }
  reels.forEach((r, i) => {
    if (r.state === 'spin'){
      r.off += r.speed * dt;
      if (spin.t >= spin.stops[i]){
        const want = (6 - spin.out.t[i]) % 6;
        let m = Math.ceil(r.off / SYM_H + 2);
        while (((m % 6) + 6) % 6 !== want) m++;
        r.state = 'stopping'; r.a = { from: r.off, to: m * SYM_H, t: 0, dur: i === 2 && spin.reach ? 0.6 : 0.4 };
      }
    } else if (r.state === 'stopping'){
      r.a.t += dt;
      const p = Math.min(1, r.a.t / r.a.dur);
      r.off = r.a.from + (r.a.to - r.a.from) * easeOutBack(p);
      if (p >= 1){ r.off = r.a.to; r.state = 'idle'; SND.stop(); }
    }
    drawReel(r);
  });
  if (spin.reach && !spin.reachShown && reels[1].state === 'idle'){
    spin.reachShown = true; $('reach').classList.add('on'); SND.reach(); reels[2].speed = 560;
  }
  if (reels.every(r => r.state === 'idle')){
    $('reach').classList.remove('on');
    const o = spin.out; spin = null;
    resolveSpin(o);
  }
}
function resolveSpin(o){
  if (!o.win){ SND.miss(); return; }
  S.slotWins++;
  const s = o.s;

    banner('FEVER!!', '777 そろった！'); SND.win(3);

  } else if (s === 3){

  } else if (s === 4){

}

function rain(n, bigs, balls, fast){
  const room = C.CAP - countType('coin') - S.rainQ.filter(q => q.type === 'coin').length;
  const onField = Math.max(0, Math.min(n, room));
  const over = n - onField;
  if (over > 0){ addCredits(over); floatAt(VW / 2, topPad + 40, `+${over}`, 'big'); }
  const gap = fast ? 0.025 : 0.06;
  let t = 0;
  const items = [];
  for (let i = 0; i < onField; i++) items.push('coin');
  for (let i = 0; i < bigs; i++) items.splice((Math.random() * items.length) | 0, 0, 'big');
  for (let i = 0; i < balls; i++) items.push('ball');
  for (const type of items){ S.rainQ.push({ at: S.t + t, type }); t += gap; }
}

  const fever = isFever();
  const period = fever ? 4.2 : 3.0;
  return { x: 2.55 * Math.sin(world.time * 2 * Math.PI / period), r: fever ? 1.05 : 0.7 };
}
function checkRing(){
  const R = ringState();
  for (const c of world.coins){
    if (!c.user || !c.user.ring) continue;
    if (c.py >= RING_Y && c.y < RING_Y){
      c.user.ring = false;
      if (Math.abs(c.x - R.x) < R.r - 0.1){
        if (S.stock < 4){ S.stock++; updateStock(); }
        else { addCredits(1); }
        SND.ring();
        floatWorld(R.x, RING_Y + 0.6, C.DROP_Z, 'IN！', 'in');
        ring.userData.pulse = 1;
      }
    } else if (c.y < RING_Y - 1) c.user.ring = false;
  }
}

// ---------- 入力 ----------
const raycaster = new THREE.Raycaster();
const aimPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -C.H);
const ndc = new THREE.Vector2(), hitP = new THREE.Vector3();
function aimFromEvent(e){
  ndc.set(e.clientX / VW * 2 - 1, -(e.clientY / VH) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(aimPlane, hitP)) S.aimX = clamp(hitP.x, -HW + 0.5, HW - 0.5);
}
canvas.addEventListener('pointerdown', e => {
  if (S.mode !== 'play') return;
  e.preventDefault();
  aimFromEvent(e);
  try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
  S.firing = true; S.fireT = 0;
  dropCoin(S.aimX);
});
canvas.addEventListener('pointermove', e => { if (S.mode === 'play' && (S.firing || e.pointerType === 'mouse')) aimFromEvent(e); });
const stopFire = () => { S.firing = false; };
canvas.addEventListener('pointerup', stopFire);
canvas.addEventListener('pointercancel', stopFire);
canvas.addEventListener('lostpointercapture', stopFire);
window.addEventListener('keydown', e => {
  if (S.mode === 'play' && (e.code === 'Space' || e.code === 'Enter')){ e.preventDefault(); if (!e.repeat) dropCoin(S.aimX); }
  else if (S.mode === 'play' && (e.code === 'Escape' || e.code === 'KeyP')) pauseGame();
  else if (S.mode === 'play' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) S.aimX = clamp(S.aimX + (e.code === 'ArrowLeft' ? -0.35 : 0.35), -HW + 0.5, HW - 0.5);
});

// ---------- 画面遷移 ----------
const titleOv = $('titleOv'), pauseOv = $('pauseOv'), overOv = $('overOv');
function showBest(){
  const b = +lsGet(LS_BEST, '0');
  $('bestTitle').textContent = b > 0 ? `これまでの最高所持枚数 ${b}枚` : '';
}
function setPlayHud(on){
  document.body.classList.toggle('playing', on || S.mode === 'pause');
  $('slot').classList.toggle('hide', !on);
  $('hint').classList.toggle('hide', !on);
  if (!on){ $('roul').classList.remove('on'); $('combo').classList.remove('on'); }
}
function startGame(){
  initAudio(true);
  newField();
  Object.assign(S, { mode: 'play', t: 0, credits: 50, shown: 50, maxCredits: 50, totalIn: 0, totalWon: 0, slotWins: 0, jpCount: 0,
    jpPool: 100, stock: 0, jpQueue: 0, feverUntil: 0, rainQ: [], combo: 0, comboT: 0, idle: 0, aimX: 0, firing: false });
  spin = null; roul = null;
  reels.forEach(r => { r.state = 'idle'; r.a = null; drawReel(r); });
  $('reach').classList.remove('on');
  updateStock(); updateJP();
  titleOv.hidden = true; overOv.hidden = true; pauseOv.hidden = true;
  setPlayHud(true);
  setBgm(true);
  $('creditNum').textContent = S.credits;
}
function pauseGame(){
  if (S.mode !== 'play') return;
  S.mode = 'pause'; S.firing = false;
  setBgm(false);
  disarm();
  pauseOv.hidden = false;
}
function resumeGame(){
  initAudio(false);
  S.mode = 'play'; pauseOv.hidden = true; setBgm(true);
}
function endGame(reason){
  S.mode = 'result'; S.firing = false; S.endReason = reason;
  setBgm(false);
  pauseOv.hidden = true;
  setPlayHud(false);
  const prev = +lsGet(LS_BEST, '0');
  const isNew = S.maxCredits > prev;
  if (isNew) lsSet(LS_BEST, String(S.maxCredits));
  $('overTitle').textContent = reason === 'out' ? 'コインが尽きた！' : 'おつかれさま！';
  $('overNote').textContent = reason === 'out' ? '最後の1枚まで押し出しきりました' : `手元に ${S.credits}枚 残して終了`;
  $('stMax').textContent = S.maxCredits;
  $('stNew').innerHTML = isNew ? '<span class="newrec">自己ベスト</span>' : '';
  $('stWon').textContent = S.totalWon;
  $('stIn').textContent = S.totalIn;
  $('stSlot').textContent = S.slotWins;
  $('stJp').textContent = S.jpCount;
  const text = `ドバドバドーザーで最高${S.maxCredits}枚まで増やした！` + (S.jpCount ? `ジャックポット${S.jpCount}回！` : '') + ' #ドバドバドーザー';
  $('shareBtn').href = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SHARE_URL);
  overOv.hidden = false;
}
function backToTitle(){
  S.mode = 'title';
  setBgm(false);
  overOv.hidden = true; pauseOv.hidden = true;
  setPlayHud(false);
  showBest();
  titleOv.hidden = false;
}
// 一時停止から終える(2回押し)
let armed = false, armTimer = null;
const endBtn = $('endBtn');
endBtn.addEventListener('click', () => {
  if (!armed){
    armed = true; endBtn.textContent = '本当に？(もう一度タップ)'; endBtn.classList.add('danger');
    clearTimeout(armTimer); armTimer = setTimeout(disarm, 3000);
    return;
  }
  disarm(); endGame('quit');
});
function disarm(){ armed = false; clearTimeout(armTimer); endBtn.textContent = 'ここで終える'; endBtn.classList.remove('danger'); }

$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('titleBtn').addEventListener('click', backToTitle);
$('resumeBtn').addEventListener('click', resumeGame);
$('pauseBtn').addEventListener('click', () => { if (S.mode === 'play') pauseGame(); else if (S.mode === 'pause') resumeGame(); });
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn; lsSet(LS_SOUND, soundOn ? '1' : '0'); applySoundBtn();
  initAudio(false);
  if (master) master.gain.value = soundOn ? 1 : 0;
  if (soundOn){ SND.blip(); if (bgmOn && AC) bgmT = AC.currentTime + 0.05; }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ if (S.mode === 'play') pauseGame(); }
  else initAudio(false);
});
if (matchMedia('(pointer: coarse)').matches){ const sb = $('shareBtn'); sb.removeAttribute('target'); sb.removeAttribute('rel'); }
applySoundBtn(); showBest();

// ---------- 描画更新 ----------
const dummy = new THREE.Object3D();
const qTmp = new THREE.Quaternion(), axisTmp = new THREE.Vector3();
function renderWorld(dt){
  let nc = 0, nb = 0, nball = 0;
  for (const c of world.coins){
    if (c.type === 'ball'){
      const m = ballPool[nball++]; if (!m) continue;
      if (!c.q) c.q = new THREE.Quaternion();
      const sp = Math.hypot(c.vx, c.vz);
      if (sp > 0.01){ axisTmp.set(c.vz / sp, 0, -c.vx / sp); qTmp.setFromAxisAngle(axisTmp, sp * dt / c.r); c.q.premultiply(qTmp); }
      m.visible = true; m.position.set(c.x, c.y + c.r, c.z); m.quaternion.copy(c.q);
      continue;
    }
    if (c.onGround){
      const k = Math.min(1, dt * 12);
      c.rx -= Math.round(c.rx / Math.PI) * Math.PI; c.rz -= Math.round(c.rz / Math.PI) * Math.PI;
      c.rx *= 1 - k; c.rz *= 1 - k;
    } else { c.rx += c.wx * dt; c.rz += c.wz * dt; }
    dummy.position.set(c.x, c.y + c.t / 2, c.z);
    dummy.rotation.set(c.rx, c.ry, c.rz);
    dummy.updateMatrix();
    if (c.type === 'big'){ if (nb < 60) bigMesh.setMatrixAt(nb++, dummy.matrix); }
    else if (nc < C.CAP) coinMesh.setMatrixAt(nc++, dummy.matrix);
  }
  for (let i = nball; i < ballPool.length; i++) ballPool[i].visible = false;
  coinMesh.count = nc; bigMesh.count = nb;
  coinMesh.instanceMatrix.needsUpdate = true; bigMesh.instanceMatrix.needsUpdate = true;
  pusher.position.set(0, C.H / 2, world.pz - pusherDepth / 2);

  // リング
  const R = ringState();
  ring.position.set(R.x, RING_Y, C.DROP_Z);
  const pulse = ring.userData.pulse || 0;
  const sc = (R.r / 0.7) * (1 + pulse * 0.25);
  ring.scale.set(sc, 1, sc); arm.scale.set(1, 1 / sc, 1);
  ringMat.emissiveIntensity = 0.25 + pulse * 0.5;
  ring.userData.pulse = Math.max(0, pulse - dt * 3);

  // 投入口
  launcher.position.x += (S.aimX - launcher.position.x) * Math.min(1, dt * 14);
  const topY = world.pz > C.DROP_Z ? C.H : 0;
  guide.position.set(launcher.position.x, (4.1 + topY) / 2, C.DROP_Z);
  guide.scale.set(1, 4.1 - topY, 1);
  guide.visible = launcher.visible = S.mode !== 'title';

  // 電飾(ゆっくり流れる。点滅はさせない)
  const sp = isFever() ? 2.2 : 0.9;
  for (const b of bulbs){
    const v = 0.5 + 0.5 * Math.sin(S.t * sp * 2 - b.i * 0.7);
    b.m.emissiveIntensity = 0.25 + v * 0.55;
  }

  // 紙吹雪
  const cnt = [0, 0, 0, 0, 0, 0];
  for (let i = confs.length - 1; i >= 0; i--){
    const p = confs[i];
    p.life -= dt;
    if (p.life <= 0 || p.y < -2.5){ confs.splice(i, 1); continue; }
  }
  for (const p of confs){
    p.vy -= p.g * dt; p.vx *= 1 - dt * 0.8; p.vz *= 1 - dt * 0.8; if (p.g < 2 && p.vy < -1.2) p.vy = -1.2;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.rx += p.wx * dt; p.ry += p.wy * dt;
    dummy.position.set(p.x, p.y, p.z); dummy.rotation.set(p.rx, p.ry, 0);
    const s = Math.min(1, p.life * 3); dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    confMeshes[p.col].setMatrixAt(cnt[p.col]++, dummy.matrix);
  }
  dummy.scale.set(1, 1, 1);
  confMeshes.forEach((m, i) => { m.count = cnt[i]; m.instanceMatrix.needsUpdate = true; });
}
function updateHud(dt){
  if (S.shown !== S.credits){
    const diff = S.credits - S.shown;
    const stepN = Math.sign(diff) * Math.max(1, Math.ceil(Math.abs(diff) * Math.min(1, dt * 10)));
    S.shown = Math.abs(stepN) > Math.abs(diff) ? S.credits : S.shown + stepN;
    $('creditNum').textContent = S.shown;
    if (diff > 0 && S.bumpT <= 0){ $('credits').classList.add('bump'); S.bumpT = 0.12; }
  }
  if (S.bumpT > 0){ S.bumpT -= dt; if (S.bumpT <= 0) $('credits').classList.remove('bump'); }
  const fv = isFever();
  $('feverTag').classList.toggle('on', fv);
  if (fv) $('feverSec').textContent = Math.ceil(S.feverUntil - S.t);
}

// ---------- メインループ ----------
let last = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  const running = S.mode === 'play' || S.mode === 'title';
  if (running){
    S.t += dt;
    if (S.mode === 'title'){
      S.demoT -= dt;
      if (S.demoT <= 0){ S.demoT = rand(0.35, 0.8); dropCoin(rand(-HW + 0.6, HW - 0.6), true); }
    } else {
      if (S.firing){ S.fireT += dt; if (S.fireT >= 0.17){ S.fireT = 0; dropCoin(S.aimX); } }
      processRain();
    }
    acc += dt;
    let steps = 0;
    while (acc >= C.DT && steps < 8){ PHYS.step(world); checkRing(); acc -= C.DT; steps++; }
    if (steps >= 8) acc = 0;
    handleEvents();
    if (S.mode === 'play'){
      updateSlot(dt); updateRoulette(dt);
      if (S.comboT > 0){ S.comboT -= dt; if (S.comboT <= 0){ S.combo = 0; $('combo').classList.remove('on'); } }
      // コイン切れ判定:手持ち0で、何も起きない時間が続いたら終了
      const busy = S.stock > 0 || spin || roul || S.jpQueue > 0 || S.rainQ.length > 0 || world.coins.some(c => !c.onGround);
      if (S.credits <= 0 && !busy){ S.idle += dt; if (S.idle > 6) endGame('out'); }
      else S.idle = 0;
    }
  }
  renderWorld(running ? dt : 0);
  updateHud(dt);
  bgmTick();
  renderer.render(scene, camera);
}

// 起動
measureReels();
reels.forEach(drawReel);
newField();
layout();
window.addEventListener('resize', () => { measureReels(); reels.forEach(drawReel); layout(); });
requestAnimationFrame(frame);
</script>
