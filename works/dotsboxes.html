<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOTS_AND_BOXES | porkgorilla://</title>
  <meta name="description" content="定番のドット&ボックス。点と点を線で結び、4辺を閉じた箱が自分のもの。閉じたらもう1手。CPU対戦、盤の広さを選べる。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBT4300J0L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MBT4300J0L');
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    main { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 16px;
      user-select: none; -webkit-user-select: none; text-align: center; }
    h1 { margin: 0; font-size: 1.6rem; }
    #score { display: flex; gap: 22px; font-size: 1.15rem; }
    #score .you { color: var(--cyber-green); }
    #score .cpu { color: #ff9de0; }
    #score .turn { text-decoration: underline; text-underline-offset: 5px; }
    #board { width: min(100%, 420px); aspect-ratio: 1; touch-action: manipulation; }
    #board svg { width: 100%; height: 100%; display: block; }
    .hit { stroke: transparent; stroke-linecap: round; cursor: pointer; }
    .line { stroke: #17331d; stroke-linecap: round; pointer-events: none; }
    .hit:hover + .line { stroke: var(--cyber-green-dim); }
    .line.you { stroke: var(--cyber-green); }
    .line.cpu { stroke: #ff9de0; }
    .line.last { filter: drop-shadow(0 0 4px #fff); }
    .box.you { fill: rgba(57, 255, 106, .28); }
    .box.cpu { fill: rgba(255, 157, 224, .25); }
    .dot { fill: var(--cyber-text); pointer-events: none; }
    #msg { min-height: 1.5em; color: var(--cyber-green); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .row .btn { padding: .6rem 1rem; font-size: .9rem; }
    select { font-family: var(--cyber-font); font-size: .9rem; padding: .55rem .5rem; background: var(--cyber-bg-panel);
      color: var(--cyber-green); border: 1px solid var(--cyber-green-dim); }
    .rule { font-size: .85rem; color: var(--cyber-green-dim); max-width: 420px; line-height: 1.7; }
    .credit { font-size: 11px; color: var(--cyber-green-dim); margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>⬚ DOTS_AND_BOXES</h1>
    <div id="score"><span class="you" id="sYou">あなた 0</span><span class="cpu" id="sCpu">CPU 0</span></div>
    <div id="board"></div>
    <div id="msg"></div>
    <div class="row">
      <button class="btn" id="new" type="button">新しいゲーム</button>
      <select id="size" aria-label="盤の広さ"><option value="3">3×3</option><option value="4" selected>4×4</option><option value="5">5×5</option><option value="6">6×6</option></select>
      <select id="level" aria-label="CPUの強さ"><option value="0">やさしい</option><option value="1" selected>ふつう</option><option value="2">つよい</option></select>
      <select id="first" aria-label="先手"><option value="you">あなたが先手</option><option value="cpu">CPUが先手</option></select>
    </div>
    <p class="rule">点と点の間をタップして線を引きます。箱の4辺目を引いた人がその箱をもらい、続けてもう1本引けます。箱を多く取った方の勝ち。3辺目を引くと相手に取られるので要注意。</p>
    <div class="credit">porkgorilla — 2026</div>
  </main>

  <script src="/site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const NS = 'http://www.w3.org/2000/svg';
    // 線は "h,r,c"(横線: r=0..N, c=0..N-1)と "v,r,c"(縦線: r=0..N-1, c=0..N)で表す
    let N, lines, boxes, turn, score, over, last, cpuTimer, els;

    const allLines = () => {
      const out = [];
      for (let r = 0; r <= N; r++) for (let c = 0; c < N; c++) out.push(`h,${r},${c}`);
      for (let r = 0; r < N; r++) for (let c = 0; c <= N; c++) out.push(`v,${r},${c}`);
      return out;
    };
    const sidesOf = (r, c) => [`h,${r},${c}`, `h,${r + 1},${c}`, `v,${r},${c}`, `v,${r},${c + 1}`];
    function boxesOf(id) {
      const [t, r, c] = id.split(',');
      const R = +r, C = +c, out = [];
      if (t === 'h') { if (R > 0) out.push([R - 1, C]); if (R < N) out.push([R, C]); }
      else { if (C > 0) out.push([R, C - 1]); if (C < N) out.push([R, C]); }
      return out;
    }
    const count = (set, r, c) => sidesOf(r, c).filter(s => set.has(s)).length;

    function newGame() {
      clearTimeout(cpuTimer);
      N = +$('size').value;
      lines = new Map();
      boxes = {};
      score = { you: 0, cpu: 0 };
      over = false; last = null;
      turn = $('first').value;
      $('msg').textContent = '';
      build();
      render();
      if (turn === 'cpu') cpuTimer = setTimeout(cpuMove, 500);
    }

    function build() {
      const g = 100, pad = 30, size = pad * 2 + g * N;
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
      const add = (tag, attrs) => {
        const el = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        svg.appendChild(el);
        return el;
      };
      els = { lines: {}, boxes: {} };
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        els.boxes[`${r},${c}`] = add('rect', { x: pad + c * g + 4, y: pad + r * g + 4, width: g - 8, height: g - 8, class: 'box', fill: 'transparent' });
      }
      allLines().forEach(id => {
        const [t, r, c] = id.split(',').map((v, i) => i ? +v : v);
        const x1 = pad + c * g, y1 = pad + r * g;
        const x2 = t === 'h' ? x1 + g : x1, y2 = t === 'h' ? y1 : y1 + g;
        const hit = add('line', { x1, y1, x2, y2, class: 'hit', 'stroke-width': 34 });
        hit.addEventListener('click', () => { if (turn === 'you' && !over) play(id, 'you'); });
        els.lines[id] = add('line', { x1: x1 + (t === 'h' ? 8 : 0), y1: y1 + (t === 'v' ? 8 : 0), x2: x2 - (t === 'h' ? 8 : 0), y2: y2 - (t === 'v' ? 8 : 0), class: 'line', 'stroke-width': 9 });
      });
      for (let r = 0; r <= N; r++) for (let c = 0; c <= N; c++) add('circle', { cx: pad + c * g, cy: pad + r * g, r: 7, class: 'dot' });
      $('board').innerHTML = '';
      $('board').appendChild(svg);
    }

    function render() {
      Object.entries(els.lines).forEach(([id, el]) => {
        el.setAttribute('class', 'line' + (lines.has(id) ? ' ' + lines.get(id) : '') + (id === last ? ' last' : ''));
      });
      Object.entries(els.boxes).forEach(([k, el]) => el.setAttribute('class', 'box' + (boxes[k] ? ' ' + boxes[k] : '')));
      $('sYou').textContent = `あなた ${score.you}`;
      $('sCpu').textContent = `CPU ${score.cpu}`;
      $('sYou').classList.toggle('turn', !over && turn === 'you');
      $('sCpu').classList.toggle('turn', !over && turn === 'cpu');
    }

    function play(id, who) {
      if (lines.has(id)) return;
      lines.set(id, who);
      last = id;
      let got = 0;
      boxesOf(id).forEach(([r, c]) => {
        if (count(lines, r, c) === 4) { boxes[`${r},${c}`] = who; got++; }
      });
      score[who] += got;
      if (lines.size === allLines().length) {
        over = true;
        $('msg').textContent = score.you > score.cpu ? `🎉 あなたの勝ち! ${score.you} - ${score.cpu}` :
          score.you < score.cpu ? `CPUの勝ち… ${score.you} - ${score.cpu}` : `引き分け ${score.you} - ${score.cpu}`;
      } else if (!got) {
        turn = who === 'you' ? 'cpu' : 'you';
      }
      render();
      if (!over && turn === 'cpu') cpuTimer = setTimeout(cpuMove, got && who === 'cpu' ? 280 : 450);
    }

    // その線を引いたあと、相手が連続して取れる箱の数(取れる箱を順に取っていくだけの単純な読み)
    function giveaway(id) {
      const set = new Set(lines.keys());
      set.add(id);
      let total = 0, progress = true;
      while (progress) {
        progress = false;
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
          if (count(set, r, c) === 3) {
            sidesOf(r, c).forEach(s => set.add(s));
            total++;
            progress = true;
          }
        }
      }
      return total;
    }

    function cpuMove() {
      if (over || turn !== 'cpu') return;
      const level = +$('level').value;
      const free = allLines().filter(id => !lines.has(id));
      const pick = arr => arr[Math.floor(Math.random() * arr.length)];
      // 1. 取れる箱があれば取る(やさしいは3回に1回、ふつうは10回に1回見逃す)
      const taking = free.filter(id => boxesOf(id).some(([r, c]) => count(lines, r, c) === 3));
      const miss = [.35, .1, 0][level];
      if (taking.length && Math.random() >= miss) { play(pick(taking), 'cpu'); return; }
      // 2. 3辺目を作らない安全な線
      const safe = free.filter(id => boxesOf(id).every(([r, c]) => count(lines, r, c) < 2));
      if (safe.length && level > 0) { play(pick(safe), 'cpu'); return; }
      if (level === 0) { play(pick(safe.length && Math.random() < .6 ? safe : free), 'cpu'); return; }
      // 3. 安全な線がなければ、相手に渡す箱が一番少ない線を選ぶ(ふつうは時々読み違える)
      if (level === 1 && Math.random() < .3) { play(pick(free), 'cpu'); return; }
      let best = Infinity, cands = [];
      free.forEach(id => {
        const g = giveaway(id);
        if (g < best) { best = g; cands = [id]; } else if (g === best) cands.push(id);
      });
      play(pick(cands), 'cpu');
    }

    $('new').onclick = newGame;
    ['size', 'first'].forEach(id => $(id).addEventListener('change', newGame));
    newGame();
  </script>
</body>
</html>
