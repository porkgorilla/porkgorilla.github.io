<script>
'use strict';
const GAME_NAME = '駅弁';
const GAME_URL = 'https://porkgorilla.com/works/ekiben.html';
const OG_CACHE_VERSION = 1;
const SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const HASHTAG = '#駅弁ゲーム';
const KEY_BEST = 'ekiben-best', KEY_SND = 'ekiben-sound';
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

/* ---------------- 弁当の定義 ---------------- */
const BENTOS = [
  { id:'makunouchi', name:'幕内弁当', short:'幕内', price:'¥1,100', paper:'#b8322a', paper2:'#f1e3c4', ink:'#fff7e8', tray:0xd8b884, fly:'幕の内が四方八方へ' },
  { id:'gyutan', name:'牛たん弁当', short:'牛たん', price:'¥1,650', paper:'#1f1d1b', paper2:'#c9a24a', ink:'#f3d27a', tray:0x1d1b1a, fly:'牛たんが回転しながら' },
  { id:'shumai', name:'シウマイ弁当', short:'シウマイ', price:'¥1,050', paper:'#efe2c2', paper2:'#c7362b', ink:'#b02a20', tray:0xdcc293, fly:'シウマイがコロコロと' },
  { id:'kuri', name:'栗ごはん弁当', short:'栗ごはん', price:'¥1,300', paper:'#6a3a1c', paper2:'#e8b54a', ink:'#ffe9b0', tray:0xc9a46d, fly:'栗が弾丸のように' },
  { id:'onigiri', name:'おにぎり弁当', short:'おにぎり', price:'¥780', paper:'#2e5b3b', paper2:'#f2ead2', ink:'#ffffff', tray:0xd4b27e, fly:'海苔がひらひらと' },
];

/* ---------------- 状態 ---------------- */
const S = {
  mode: 'title',      // title | enter | choose | pull | heat | open | eat | leave | boom | over
  paused: false,
  stage: 0, cleared: 0,
  answer: 0, picked: -1,
  t: 0, power: 1,
  best: parseInt(store.get(KEY_BEST) || '0', 10) || 0,
  sound: store.get(KEY_SND) !== 'off',
  shake: 0, zoom: 0, zoomTo: 0,
  grab: null, auto: null,
  time: 0, trainT: 0,
};

/* ---------------- 音 ---------------- */
let AC = null, master = null, noiseBuf = null;
function initAudio(force){
  if (AC && force){
    try { AC.close().catch(() => {}); } catch(e){}
    AC = null;
  } else if (AC){
    if (AC.state === 'closed'){ AC = null; }
    else { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  try {
    AC = new C();
    master = AC.createGain(); master.gain.value = S.sound ? .8 : 0; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch(e){ AC = null; }
}
function setSound(on){
  S.sound = on; store.set(KEY_SND, on ? 'on' : 'off');
  if (master && AC) master.gain.setTargetAtTime(on ? .8 : 0, AC.currentTime, .02);
  $('sndBtn').innerHTML = on
    ? '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'
    : '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  $('sndBtn').setAttribute('aria-label', on ? '音:ON' : '音:OFF');
}
function noise(dur, type, freq, q, vol, attack, when){
  if (!AC || !S.sound) return null;
  const t0 = AC.currentTime + (when || 0);
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + (attack || .01));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0, Math.random()); src.stop(t0 + dur + .05);
  return f;
}
function tone(freq, dur, type, vol, when, slideTo){
  if (!AC || !S.sound) return;
  const t0 = AC.currentTime + (when || 0);
  const o = AC.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + .01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .05);
}
const SFX = {
  creak(){ noise(.07, 'bandpass', rand(700, 1100), 6, .18, .005); },
  snap(){ noise(.06, 'highpass', 2500, 1, .35, .002); tone(900, .05, 'square', .05); },
  hiss(d){ const f = noise(d, 'highpass', 2600, .7, .22, .4); if (f){ f.frequency.linearRampToValueAtTime(4200, AC.currentTime + d); } },
  boom(p){
    noise(1.4, 'lowpass', 900, .8, .9, .005);
    noise(.35, 'highpass', 1500, .5, .5, .002);
    tone(110, .9, 'sine', .9, 0, 32);
    tone(60 * p, .6, 'triangle', .4, 0, 25);
  },
  chime(){ tone(659, .45, 'sine', .25); tone(523, .7, 'sine', .25, .28); },
  tink(){ tone(2100, .18, 'triangle', .3); tone(3200, .1, 'sine', .12); },
  thud(){ noise(.12, 'lowpass', 500, 1, .35, .003); },
  whoosh(){ noise(.5, 'bandpass', 600, 1.2, .2, .15); },
  gatan(){ tone(70, .12, 'sine', .35); noise(.08, 'lowpass', 300, 1, .25, .004); tone(64, .12, 'sine', .3, .22); noise(.08, 'lowpass', 280, 1, .22, .004, .22); },
  eat(){ for (let i = 0; i < 4; i++) noise(.06, 'bandpass', 1400, 3, .15, .005, i * .14); },
  pon(){ tone(500, .15, 'sine', .4, 0, 900); },
};

/* ---------------- Three.js ---------------- */
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x17120d);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x17120d, 30, 60);
const camera = new THREE.PerspectiveCamera(50, 1, .1, 100);
const CAM_DIR = new THREE.Vector3(0, 5.6, 6.9).normalize();
const CAM_TGT = new THREE.Vector3(0, .5, .4);
const ZOOM_DIR = new THREE.Vector3(0, 7, 4.2).normalize();
let camDist = 9, camBasePos = new THREE.Vector3();

scene.add(new THREE.HemisphereLight(0xfff3dc, 0x5c4a38, .75));
const sun = new THREE.DirectionalLight(0xfff0d4, .85);
sun.position.set(3.5, 9, 4.5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left:-7, right:7, top:7, bottom:-7, near:1, far:30 });
scene.add(sun);

const matCache = {};
function M(color, opt){
  const k = color + JSON.stringify(opt || {});
  if (!matCache[k]) matCache[k] = new THREE.MeshLambertMaterial(Object.assign({ color }, opt || {}));
  return matCache[k];

function canvasTex(w, h, draw){

// 湯気のテクスチャは canvas を使わず、色を真っ白に固定して透明度だけを計算で作る。
// canvas のグラデーションは、ほぼ透明な画素の色が端末によって狂い(iOS など)、

const STEAM_TEX = (() => {
  const N = 64, d = new Uint8Array(N * N * 4);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const r = Math.hypot(x + .5 - N / 2, y + .5 - N / 2) / (N / 2);
    const a = r >= 1 ? 0 : r < .5 ? .95 - (.95 - .4) * (r / .5) : .4 * (1 - (r - .5) / .5);
    const i = (y * N + x) * 4;
    d[i] = d[i + 1] = d[i + 2] = 255; d[i + 3] = Math.round(a * 255);
  }
  const t = new THREE.DataTexture(d, N, N, THREE.RGBAFormat);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
  t.needsUpdate = true;
  return t;
})();

const PULL_DIR = [new THREE.Vector3(-.25, .65, 1).normalize(), new THREE.Vector3(.25, .65, 1).normalize()];
function layoutTabs(B){
  for (const tb of B.tabs){
    if (tb.gone && tb.tag.visible === false) continue;
    const p = tb.rest.clone().addScaledVector(PULL_DIR[tb.i], tb.pull * 1.6);
    if (!tb.gone) p.y += Math.sin(S.time * 3 + tb.wob) * .015 * (S.mode === 'choose' ? 1 : 0);
    tb.tag.position.copy(p);
    tb.tag.rotation.x = -tb.pull * .9;
    // 紐は札の上端から箱まで
    const end = p.clone().add(new THREE.Vector3(0, .01, -.24));
    const a = tb.anchor, mid = a.clone().add(end).multiplyScalar(.5), dir = end.clone().sub(a);
    const len = dir.length();
    tb.str.position.copy(mid);
    tb.str.scale.set(1, Math.max(.01, len), 1);
    tb.str.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  }
}

function disposeObj(o){

}

/* --- 吹っ飛ぶ物 --- */
let pieces = [];
const GRAV = 13;
function surfaceY(p){
  const onTable = p.x > TABLE.x0 && p.x < TABLE.x1 && p.z > TABLE.z0 && p.z < TABLE.z1;
  return onTable ? TABLE.y : FLOOR_Y;
}
function viewHX(){   // 縦長の画面では横に飛ぶ量を抑えて、散らかりが画面に収まるようにする
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return clamp(tv * camera.aspect * camDist / 5.5, .4, 1);
}
function launch(P){
  const B = bento; if (!B) return;
  const center = new THREE.Vector3(); B.root.getWorldPosition(center);
  const all = B.food.slice(); if (B.lid.parent) all.push(B.lid);
  for (const m of all){
    if (!m.parent) continue;
    scene.attach(m);
    const k = m.userData.fly;
    const out = new THREE.Vector3(m.position.x - center.x, 0, m.position.z - center.z);
    if (out.lengthSq() < .01) out.set(rand(-1, 1), 0, rand(-1, 1));
    out.normalize();
    const sp = Math.sqrt(P);
    const pc = { m, v: new THREE.Vector3(), w: new THREE.Vector3(), g: 1, r: m.userData.r || .15, delay: 0, kind: k, rest: false, ph: rand(0, 6), hitDone: false };
    if (k === 'lid'){ pc.v.set(rand(-1.5, 1.5), 12 * sp, rand(-1.5, 0)); pc.w.set(rand(-7, 7), rand(-3, 3), rand(-7, 7)); }
    else if (k === 'spin'){ pc.v.copy(out).multiplyScalar(rand(1.2, 2.6) * sp); pc.v.y = rand(9, 12) * sp; pc.w.set(rand(-8, 8), rand(18, 28) * (Math.random() < .5 ? 1 : -1), rand(-8, 8)); }
    else if (k === 'roll'){ out.x += rand(-.4, .4); out.normalize(); pc.v.copy(out).multiplyScalar(rand(2.6, 4.2) * sp); pc.v.y = rand(3, 4.5); pc.roll = true; }
    else if (k === 'soy'){ pc.delay = .9; pc.v.set(rand(-1, 1), 13 * P, rand(.5, 1.5)); pc.w.set(rand(10, 16), rand(-4, 4), rand(8, 14)); }
    else if (k === 'bullet'){
      const tgt = camera.position.clone().add(new THREE.Vector3(rand(-1.4, 1.4), rand(-1.0, .6), 0));
      pc.v.copy(tgt.sub(m.position).normalize().multiplyScalar(rand(13, 16) * Math.sqrt(P)));
      pc.g = .15; pc.bullet = true; pc.delay = rand(0, .35); pc.w.set(rand(-12, 12), rand(-12, 12), 0);
    }
    else if (k === 'nori'){ pc.v.copy(out).multiplyScalar(rand(.6, 1.4)); pc.v.y = rand(5, 7) * sp; pc.g = .16; pc.flutter = true; pc.w.set(rand(-2, 2), rand(-2, 2), rand(-2, 2)); }
    else if (k === 'shower'){ m.visible = false; spawnGrains(m.position, 320, P, 1.25); continue; }
    else if (k === 'divider'){ pc.v.copy(out).multiplyScalar(rand(1.5, 3) * sp); pc.v.y = rand(8, 11) * sp; pc.w.set(rand(-10, 10), rand(-10, 10), rand(-10, 10)); }
    else { pc.v.copy(out).multiplyScalar(rand(1.2, 2.8) * sp); pc.v.y = rand(7, 11) * sp; pc.w.set(rand(-9, 9), rand(-9, 9), rand(-9, 9)); }
    if (!pc.bullet) pc.v.x *= viewHX();
    pieces.push(pc);
  }
  for (const r of B.rice) if (r.userData.fly !== 'shower') spawnGrains(r.position, 90, P, .8);
}
function updatePieces(dt){
  for (const p of pieces){
    if (p.delay > 0){ p.delay -= dt; if (p.delay <= 0 && p.kind === 'soy') SFX.pon(); continue; }
    if (p.rest) continue;
    p.v.y -= GRAV * p.g * dt;
    if (p.flutter){
      p.v.x += Math.sin(S.time * 3.2 + p.ph) * 6 * dt; p.v.z += Math.cos(S.time * 2.4 + p.ph) * 3 * dt;
      p.v.multiplyScalar(1 - 1.6 * dt);
      p.m.rotation.x = Math.sin(S.time * 3 + p.ph) * .9; p.m.rotation.z = Math.cos(S.time * 2.5 + p.ph) * .7;
    } else {
      p.m.rotation.x += p.w.x * dt; p.m.rotation.y += p.w.y * dt; p.m.rotation.z += p.w.z * dt;
    }
    p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.z < TABLE.z0 + .15 && p.v.z < 0 && p.m.position.y < 4.6){ p.m.position.z = TABLE.z0 + .15; p.v.z *= -.35; }
    if (p.bullet && !p.hitDone && p.m.position.distanceTo(camera.position) < 1.3){
      p.hitDone = true; p.bullet = false; p.g = 1;
      screenHit(p.m.position);
      p.v.multiplyScalar(-.12); p.v.y = -1;
    }
    const fy = surfaceY(p.m.position);
    if (p.m.position.y - p.r < fy && p.v.y < 0 && p.m.position.y - p.r > fy - 1.2){
      p.m.position.y = fy + p.r;
      if (p.roll){
        p.v.y *= -.25; p.v.x *= .985; p.v.z *= .985;
        const sp = Math.hypot(p.v.x, p.v.z);
        p.m.rotation.x += p.v.z / Math.max(.15, p.r) * dt; p.m.rotation.z -= p.v.x / Math.max(.15, p.r) * dt;
        p.w.set(0, 0, 0);
        if (sp < .2 && Math.abs(p.v.y) < .5) p.rest = true;
      } else {
        if (Math.abs(p.v.y) > 2.5 && p.kind !== 'nori') SFX.thud();
        p.v.y *= -.32; p.v.x *= .6; p.v.z *= .6; p.w.multiplyScalar(.55);
        if (p.flutter){ p.flutter = false; p.rest = true; p.m.rotation.set(0, p.m.rotation.y, 0); }
        if (Math.abs(p.v.y) < .6 && Math.hypot(p.v.x, p.v.z) < .3) p.rest = true;
      }
    }
    if (p.m.position.y < FLOOR_Y - 2) p.rest = true;
  }
}
function clearPieces(){ for (const p of pieces){ scene.remove(p.m); disposeObj(p.m); } pieces = []; grainN = 0; grains.count = 0; }

// ごはん粒(InstancedMesh)
const GRAIN_MAX = 700;
const grains = new THREE.InstancedMesh(new THREE.SphereGeometry(.045, 6, 4), M(0xfbf8ee), GRAIN_MAX);
grains.count = 0; grains.castShadow = false; grains.frustumCulled = false; scene.add(grains);
const gp = new Float32Array(GRAIN_MAX * 3), gv = new Float32Array(GRAIN_MAX * 3), gs = new Uint8Array(GRAIN_MAX);
let grainN = 0;
const dummy = new THREE.Object3D();
function spawnGrains(pos, n, P, up){
  for (let i = 0; i < n && grainN < GRAIN_MAX; i++, grainN++){
    const j = grainN;
    gp[j*3] = pos.x + rand(-1, 1); gp[j*3+1] = pos.y + rand(0, .2); gp[j*3+2] = pos.z + rand(-.7, .7);
    const a = rand(0, Math.PI * 2), s = rand(.4, 2.6) * Math.sqrt(P);
    gv[j*3] = Math.cos(a) * s * viewHX(); gv[j*3+1] = rand(6, 13) * Math.sqrt(P) * up; gv[j*3+2] = Math.sin(a) * s;
    gs[j] = 0;
  }
  grains.count = grainN;
}
function updateGrains(dt){
  for (let j = 0; j < grainN; j++){
    if (!gs[j]){
      gv[j*3+1] -= GRAV * dt;
      gv[j*3] *= 1 - .4 * dt; gv[j*3+2] *= 1 - .4 * dt;
      gp[j*3] += gv[j*3] * dt; gp[j*3+1] += gv[j*3+1] * dt; gp[j*3+2] += gv[j*3+2] * dt;
      const fy = surfaceY({ x: gp[j*3], z: gp[j*3+2] });
      if (gp[j*3+1] < fy + .03 && gp[j*3+1] > fy - .8){ gp[j*3+1] = fy + .03; gs[j] = 1; }
      if (gp[j*3+1] < FLOOR_Y - 1) gs[j] = 1;
    }
    dummy.position.set(gp[j*3], gp[j*3+1], gp[j*3+2]);
    dummy.rotation.set(j, j * 1.7, 0); dummy.scale.set(1, .6, .6); dummy.updateMatrix();
    grains.setMatrixAt(j, dummy.matrix);
  }
  grains.instanceMatrix.needsUpdate = true;
}

// 湯気
const steam = [];
for (let i = 0; i < 90; i++){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: STEAM_TEX, transparent: true, depthWrite: false, opacity: 0 }));
  sp.visible = false; scene.add(sp); steam.push({ sp, life: 0, max: 1, v: new THREE.Vector3(), s0: .5, s1: 1.5, a: .5 });
}
let steamIdx = 0;
function puff(pos, v, life, s0, s1, a){
  const s = steam[steamIdx++ % steam.length];
  s.sp.position.copy(pos); s.v.copy(v); s.life = 0; s.max = life; s.s0 = s0; s.s1 = s1; s.a = a; s.sp.visible = true;
}
function updateSteam(dt){
  for (const s of steam){
    if (!s.sp.visible) continue;
    s.life += dt;
    const k = s.life / s.max;
    if (k >= 1){ s.sp.visible = false; continue; }
    s.sp.position.addScaledVector(s.v, dt);
    s.v.x += Math.sin(S.time * 2 + s.max * 9) * .3 * dt;
    const sc = s.s0 + (s.s1 - s.s0) * k; s.sp.scale.set(sc, sc, 1);
    s.sp.material.opacity = s.a * Math.sin(Math.PI * Math.min(1, k * 1.2));
  }
}
function emitSteamFromBox(rate, fromFood){
  if (!bento || Math.random() > rate) return;
  const c = new THREE.Vector3(); bento.root.getWorldPosition(c);
  let p;
  if (fromFood) p = c.clone().add(new THREE.Vector3(rand(-1.2, 1.2), BOX.baseH + .55, rand(-.7, .7)));
  else { const side = Math.random() < .5 ? -1 : 1; p = c.clone().add(Math.random() < .5 ? new THREE.Vector3(side * (BOX.w / 2 + .05), BOX.baseH + .75, rand(-.8, .8)) : new THREE.Vector3(rand(-1.3, 1.3), BOX.baseH + .75, side * (BOX.d / 2 + .05))); }
  puff(p, new THREE.Vector3(rand(-.2, .2), rand(.9, 1.6), rand(-.2, .2)), rand(1.4, 2.2), rand(.35, .6), rand(1.4, 2.2), fromFood ? .38 : .5);
}

const fx = $('fx');
function pop(text, cls, xPct, yPct){
  const d = document.createElement('div'); d.className = 'pop ' + cls; d.textContent = text;
  d.style.left = (xPct == null ? 50 : xPct) + '%'; d.style.top = (yPct == null ? 42 : yPct) + '%';
  fx.appendChild(d);
  // 画面の外にはみ出さないよう、幅の半分だけ内側に寄せる
  requestAnimationFrame(() => {
    const W = fx.clientWidth, w = d.offsetWidth, x = (xPct == null ? 50 : xPct) / 100 * W;
    if (w + 16 < W){ const hw = w / 2 + 8; d.style.left = clamp(x, hw, W - hw) + 'px'; }
    else { d.style.left = '50%'; d.style.fontSize = Math.max(14, parseFloat(getComputedStyle(d).fontSize) * (W - 16) / w) + 'px'; }
  });
  setTimeout(() => d.remove(), 2000);
}
function screenHit(pos){
  SFX.tink();
  const v = pos.clone().project(camera);
  const W = fx.clientWidth, H = fx.clientHeight;
  const x = clamp((v.x * .5 + .5) * W, 60, W - 60), y = clamp((-v.y * .5 + .5) * H, 70, H - 60);

/* ---------------- HUD・画面 ---------------- */
const pill = $('pill'), pillBox = $('pillBox');
let pillFull = '', pillShort = '';
function setPill(html, short){ pillFull = html; pillShort = short || html; pill.innerHTML = html; fitHUD(); }
function fitHUD(){
  pill.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(pill).fontSize) || 15, n = 0;
  while (n++ < 12 && fs > 9 && (pill.scrollWidth > pillBox.clientWidth || pill.scrollWidth > pill.clientWidth + 1)){
    fs -= 1; pill.style.fontSize = fs + 'px';
  }
  // それでも収まらないときは短い表記に切り替える
  const over = pill.scrollWidth > pillBox.clientWidth || pill.scrollWidth > pill.clientWidth + 1;
  if (over && pill.innerHTML !== pillShort && pillShort){ pill.innerHTML = pillShort; fitHUD2(); }
  else if (!over && pill.innerHTML !== pillFull && pillFull && pill.innerHTML === pillShort){
    pill.innerHTML = pillFull; pill.style.fontSize = '';
    if (pill.scrollWidth > pillBox.clientWidth || pill.scrollWidth > pill.clientWidth + 1){ pill.innerHTML = pillShort; fitHUD2(); }
  }
}
function fitHUD2(){
  pill.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(pill).fontSize) || 15, n = 0;
  while (n++ < 12 && fs > 9 && (pill.scrollWidth > pillBox.clientWidth || pill.scrollWidth > pill.clientWidth + 1)){ fs -= 1; pill.style.fontSize = fs + 'px'; }
}

function gameOver(complete){

  $('overN').textContent = S.cleared; $('overB').textContent = S.best;
  $('overOv').hidden = false;
  setPill(complete ? '終点・完食' : `終点　<b>${S.cleared}</b>駅クリア`, complete ? '完食' : `終点 <b>${S.cleared}</b>駅`);
}
function backToTitle(){
  S.mode = 'title'; S.paused = false;
  $('overOv').hidden = true; $('pauseOv').hidden = true; $('clearCard').hidden = true; $('pauseBtn').hidden = true;
  showAsk(false);
  clearPieces();
  S.zoomTo = 0;
  placeBento(0, 0); S.answer = -1;
  $('titleOv').hidden = false;
  refreshTitle();
}

/* ---------------- 毎フレーム ---------------- */
function update(dt){
  S.time += dt; S.t += dt;
  // 窓の景色
  farTex.offset.x += dt * .025; nearTex.offset.x += dt * .32;
  // ガタンゴトン
  S.trainT += dt;
  if (S.trainT > 2.2){ S.trainT = 0; if (S.mode !== 'title' && S.mode !== 'over') SFX.gatan(); }
  const B = bento;
  if (B){
    if (S.mode === 'enter'){
      const k = clamp(S.t / .8, 0, 1);
      B.root.position.x = 9 * (1 - ease(k));
      if (k >= 1){ S.mode = 'choose'; S.t = 0; SFX.thud(); showAsk(true); }
    } else if (S.mode === 'heat'){
      const shk = S.t < 2.2 ? .012 : 0;
      B.root.position.set(rand(-shk, shk), TABLE.y + rand(0, shk), rand(-shk, shk));
      emitSteamFromBox(S.t < 2.2 ? .35 + S.t * .3 : .5, false);
      if (S.t > 2.2 && !B.opened){
        B.opened = true; SFX.chime();
        S.zoomTo = 1;
      }
      if (B.opened){
        const k = clamp((S.t - 2.2) / .9, 0, 1), e = ease(k);
        const lid = B.lid;
        lid.position.set(e * 2.9, BOX.baseH + BOX.trayH + .04 + Math.sin(Math.PI * k) * 1.4 - e * (BOX.baseH + BOX.trayH - .02), -e * .5);
        lid.rotation.set(0, -e * .3, -e * .08);
        if (k >= 1){ S.mode = 'open'; S.t = 0; finishClear(); }
      }
    } else if (S.mode === 'open'){
      emitSteamFromBox(.45, true);
    } else if (S.mode === 'eat'){
      const k = clamp(S.t / .9, 0, 1);
      B.food.forEach((m, i) => { const kk = clamp(k * 1.6 - i / B.food.length * .6, 0, 1); const s = 1 - ease(kk); m.scale.copy(m.userData.baseScale || new THREE.Vector3(1, 1, 1)).multiplyScalar(Math.max(.001, s)); });
      if (k >= 1){ S.mode = 'leave'; S.t = 0; S.zoomTo = 0; SFX.whoosh(); }
    } else if (S.mode === 'leave'){
      const k = clamp(S.t / .7, 0, 1);
      B.root.position.x = -10 * ease(k);
      if (k >= 1){
        if (S.stage >= 4) { gameOver(true); }
        else enterStage(S.stage + 1);
      }
    } else if (S.mode === 'boom'){
      if (!B.exploded){
        const shk = .05;
        B.root.position.set(rand(-shk, shk), TABLE.y + rand(0, shk), rand(-shk, shk));
        emitSteamFromBox(.6, false);
        if (S.t > .4){
          B.exploded = true; B.root.position.set(0, TABLE.y, 0);
          SFX.boom(S.power);
          launch(S.power);
          S.shake = .55 * S.power;
          pop(S.power > 1.6 ? 'ドッカーン！！' : 'パーン！', 'big', 50, 36);
          const c = new THREE.Vector3(0, BOX.baseH + .6, 0);
          for (let i = 0; i < 26; i++) puff(c.clone().add(new THREE.Vector3(rand(-1, 1), rand(0, .4), rand(-.7, .7))), new THREE.Vector3(rand(-4, 4), rand(1, 5), rand(-3, 3)), rand(.8, 1.4), rand(.6, 1), rand(2, 3.4), .65);
        }
      } else if (S.t > 3.4 && S.mode === 'boom'){ gameOver(false); }
    }
    // 札と紐
    for (const tb of B.tabs){
      if (tb.gone){
        tb.pull += dt * 4;
        if (tb.pull > 1.7){ tb.tag.visible = false; tb.str.visible = false; }
      } else if (S.grab && S.grab.i === tb.i){
        // ドラッグ中は pointermove で更新
      } else if (S.auto && S.auto.i === tb.i){
        S.auto.t += dt; tb.pull = clamp(S.auto.t / .35, 0, 1);
        if (tb.pull >= 1){ S.auto = null; pick(tb.i, 1); }
      } else if (tb.pull > 0){
        tb.pull = Math.max(0, tb.pull - dt * 5);
      }
    }
    // 引いている間は箱が震える
    if (S.mode === 'choose' || S.mode === 'pull'){
      const p = S.grab ? B.tabs[S.grab.i].pull : 0;
      const shk = p * .02;
      B.root.position.set(shk ? rand(-shk, shk) : 0, TABLE.y, 0);
    }
    layoutTabs(B);
  }
  updatePieces(dt); updateGrains(dt); updateSteam(dt);
  // カメラ
  S.zoom += (S.zoomTo - S.zoom) * Math.min(1, dt * 2.5);
  S.shake = Math.max(0, S.shake - dt * 1.2);
  const bob = (S.mode !== 'title' && S.trainT < .35) ? Math.sin(S.trainT / .35 * Math.PI) * .03 : 0;
  const zp = CAM_TGT.clone().addScaledVector(ZOOM_DIR, camDist * .62);
  camera.position.copy(camBasePos).lerp(zp, S.zoom);
  camera.position.y += bob;
  if (S.shake > 0){ const a = S.shake * S.shake * .8; camera.position.x += rand(-a, a); camera.position.y += rand(-a, a); }
  camera.lookAt(CAM_TGT.x, CAM_TGT.y - S.zoom * .15, CAM_TGT.z);
}
// 左上のサイトトップへのリンクは、タイトル画面とリザルト画面だけで押せる(一時停止中は消す)
let homeOn = null;
function refreshHome(){
  const on = (S.mode === 'title' || S.mode === 'over') && !S.paused;
  if (on === homeOn) return;
  homeOn = on;
  const a = $('homeLink');
  a.style.visibility = on ? '' : 'hidden';
  a.tabIndex = on ? 0 : -1;
  if (on) a.removeAttribute('aria-hidden'); else a.setAttribute('aria-hidden', 'true');
}
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  refreshHome();
  const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;
  if (cv.clientWidth < 1 || cv.clientHeight < 1) return;
  try {
    if (!S.paused) update(dt);
    renderer.render(scene, camera);
  } catch(e){ console.error(e); }
}

/* ---------------- サイズ ---------------- */
function resize(){
  const w = Math.max(1, cv.clientWidth || 0), h = Math.max(1, cv.clientHeight || 0);
  renderer.setSize(w, h, false);
  const aspect = w / h;
  camera.aspect = aspect;
  camera.fov = aspect < 1 ? 56 : 48;
  camera.updateProjectionMatrix();
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const needW = 2.45 / (tv * aspect);      // 横に弁当と札が収まる距離
  const needH = 3.1 / tv;                  // 縦に収まる距離
  camDist = Math.max(aspect > 1.6 ? 6.8 : 8.2, needW, needH * (aspect > 1.6 ? .7 : .85));
  camBasePos.copy(CAM_TGT).addScaledVector(CAM_DIR, camDist);
  fitHUD();
}
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);

/* ---------------- 入力 ---------------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitTab(e){
  if (!bento) return null;
  const r = cv.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(bento.tabs.filter(t => !t.gone).map(t => t.hit));
  if (hits.length) return hits[0].object.userData.tab;
  // 画面上の距離でも拾う(小さい画面で押しやすく)
  let best = null, bd = 1e9;
  for (const t of bento.tabs){
    if (t.gone) continue;
    const p = new THREE.Vector3(); t.tag.getWorldPosition(p); p.project(camera);
    const sx = (p.x * .5 + .5) * r.width, sy = (-p.y * .5 + .5) * r.height;
    const d = Math.hypot(sx - (e.clientX - r.left), sy - (e.clientY - r.top));
    if (d < bd){ bd = d; best = t.i; }
  }
  return bd < 48 ? best : null;
}
cv.addEventListener('pointerdown', e => {
  if (S.paused || S.mode !== 'choose' || S.auto) return;
  const i = hitTab(e);
  if (i == null) return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  S.grab = { i, id: e.pointerId, x: e.clientX, y: e.clientY, t0: performance.now(), lastTick: 0, moved: 0 };
  initAudio();
});
cv.addEventListener('pointermove', e => {
  if (!S.grab || e.pointerId !== S.grab.id){
    if (S.mode === 'choose' && !S.grab) cv.style.cursor = hitTab(e) != null ? 'grab' : '';
    return;
  }
  const g = S.grab, tb = bento.tabs[g.i];
  const dist = Math.hypot(e.clientX - g.x, Math.max(0, e.clientY - g.y) * 1 + Math.min(0, e.clientY - g.y) * .5);
  g.moved = Math.max(g.moved, dist);
  const unit = Math.max(110, Math.min(cv.clientWidth, cv.clientHeight) * .26);
  tb.pull = clamp(dist / unit, 0, 1);
  if (tb.pull - g.lastTick > .12){ g.lastTick = tb.pull; SFX.creak(); }
  if (tb.pull >= 1){
    const held = (performance.now() - g.t0) / 1000;
    S.grab = null; cv.style.cursor = '';
    pick(g.i, 1 + Math.min(1.1, Math.max(0, held - .25) * .9));
  }
});
function endGrab(e){
  if (!S.grab || e.pointerId !== S.grab.id) return;
  const g = S.grab; S.grab = null; cv.style.cursor = '';
  const quick = performance.now() - g.t0 < 350;
  if (g.moved < 12 && quick && e.type === 'pointerup'){ S.auto = { i: g.i, t: bento.tabs[g.i].pull * .35 }; }
}
cv.addEventListener('pointerup', endGrab);
cv.addEventListener('pointercancel', endGrab);

/* ---------------- ボタン ---------------- */
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('titleBtn').addEventListener('click', () => { initAudio(true); backToTitle(); });
$('eatBtn').addEventListener('click', () => { initAudio(); eat(); });
$('sndBtn').addEventListener('click', () => { initAudio(); setSound(!S.sound); });
$('pauseBtn').addEventListener('click', () => {
  if (S.mode === 'title' || S.mode === 'over') return;
  S.paused = true; S.grab = null;
  const b = BENTOS[S.stage];
  $('pauseInfo').textContent = `${S.stage + 1}駅目・${b.name}(${S.cleared}駅クリア)`;
  setShare($('sharePause'), `「駅弁」で${S.stage + 1}駅目の${b.name}に挑戦中。紐はどっちだ…(${S.cleared}駅クリア)`);
  $('pauseOv').hidden = false;
  disarm();
});
$('resumeBtn').addEventListener('click', () => { $('pauseOv').hidden = true; S.paused = false; disarm(); initAudio(); last = performance.now(); });
// 押すと文字が変わるボタンは、枠に収まるよう文字を縮める
function fitBtns(){
  document.querySelectorAll('.pgrid>*').forEach(b => {
    b.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(b).fontSize) || 16, k = 0;
    while (k++ < 8 && fs > 10 && b.scrollWidth > b.clientWidth + 1){ fs -= 1; b.style.fontSize = fs + 'px'; }
  });
}
// 2回押しで確認するボタン(3秒で元に戻る)
function twoPress(btn, label, action){
  let armed = false, timer = null;
  const dis = () => { armed = false; clearTimeout(timer); btn.textContent = label; btn.classList.remove('danger'); fitBtns(); };
  btn.addEventListener('click', () => {
    if (!armed){
      armed = true; btn.textContent = '本当に？(もう一度)'; btn.classList.add('danger'); fitBtns();
      clearTimeout(timer); timer = setTimeout(dis, 3000); return;
    }
    dis(); action();
  });
  return dis;
}
const disarmQuit = twoPress($('quitBtn'), 'タイトルへ', () => backToTitle());
const disarmSite = twoPress($('siteBtn'), 'サイトのトップへ', () => { location.href = '/'; });
function disarm(){ disarmQuit(); disarmSite(); }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){ initAudio(); last = performance.now(); }
});

/* ---------------- 開始 ---------------- */
setSound(S.sound);
resize();
placeBento(0, 0); S.answer = -1;
refreshTitle();
requestAnimationFrame(loop);
function refit(){ fitHUD(); if (typeof fitAsk === 'function') fitAsk(); fitBtns(); }
window.addEventListener('load', () => requestAnimationFrame(refit));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(refit));
</script>
