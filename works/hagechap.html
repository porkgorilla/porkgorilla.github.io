<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

const GAME_URL = 'https://porkgorilla.com/works/hagechap.html';
const OG_CACHE_VERSION = 1;
const SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const HASHTAG = '#ハゲチャップ';
const KEY_BEST = 'hagechap-bestcm', KEY_SND = 'hagechap-sound';
const FONT = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
const CM_PER_UNIT = 9;            // 頭の横幅(約1.6)をおよそ15cmとする
const coarse = matchMedia('(pointer: coarse)').matches;
const TOUCH_OFF = 52;             // 指で隠れないよう、描く点を指の少し上にする

function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
let toastTimer = null;
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms || 1800); }

if (!window.THREE) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadMsg').hidden = false; $('loadMsg').textContent = '通信状況を確かめて、ページを再読み込みしてください。';
  return;
}

/* ================= 3D基盤 ================= */
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
let W = 1, H = 1, baseDist = 5;
const CAM_PLAY = { elev: 0.3, zoom: 1, ty: -0.02 };
const CAM_TOP = { elev: 1.25, zoom: 1.32, ty: -0.62 };   // 完成後: 上から見下ろし、頭を画面の上寄りに
const CAMS = { elev: 0.3, zoom: 1, ty: -0.02 };
const OUTRO = { t: 0, dur: 3.0, from: null, rotFrom: 0, tiltFrom: 0 };

function lin(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
function smooth(a, b, v) { let t = (v - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* 映り込み用の環境マップ(窓の明かりがある部屋っぽく) */
(function makeEnv() {
  const c = mkCanvas(512, 256), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#fff6ea'); gr.addColorStop(0.45, '#c9a888'); gr.addColorStop(0.55, '#7a5a42'); gr.addColorStop(1, '#2a1a10');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 256);
  const win = (x, y, w, h, a) => { const rg = g.createRadialGradient(x, y, 2, x, y, Math.max(w, h)); rg.addColorStop(0, `rgba(255,255,255,${a})`); rg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = rg; g.fillRect(x - w * 2, y - h * 2, w * 4, h * 4); };
  win(150, 60, 50, 34, 1); win(400, 70, 40, 30, 0.6); win(280, 40, 70, 20, 0.5);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping; tex.encoding = THREE.sRGBEncoding;
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromEquirectangular(tex).texture;
  tex.dispose(); pm.dispose();
})();

/* ライト */
scene.add(new THREE.HemisphereLight(0xfff1e2, 0x3a2418, 0.28));
const key = new THREE.DirectionalLight(0xfff0dc, 1.25);
key.position.set(-1.7, 2.8, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1.4, right: 1.4, top: 1.6, bottom: -1.6, near: 0.5, far: 9 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.015; key.shadow.radius = 3;
scene.add(key);
const rim = new THREE.DirectionalLight(0xdbe6ff, 0.75); rim.position.set(1.6, 1.4, -2.6); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffd8bc, 0.28); fill.position.set(2.2, -0.4, 2.0); scene.add(fill);

const headGroup = new THREE.Group(); scene.add(headGroup);
const kGroup = new THREE.Group(); headGroup.add(kGroup);   // ケチャップは頭と一緒に回る

/* ================= 頭の形 ================= */
// 単位球の方向(x,y,z)を、後頭部・首つきの頭の形に変形する。顔は -z 側、カメラは +z 側(後ろ)から見る
function shape(x, y, z, out) {
  let X = x * 0.80, Y = y, Z = z * 0.93;
  Z += Math.max(0, z) * Math.exp(-(((y - 0.02) / 0.42) ** 2)) * 0.075;     // 後頭部のふくらみ
  X *= 1 + 0.03 * Math.exp(-(((y - 0.25) / 0.35) ** 2));                     // 頭頂の横幅
  if (Y > 0.55) Y -= (Y - 0.55) * 0.07;                                        // 頭頂を少し平らに
  const t = smooth(-0.32, -0.9, y);                                            // 首へ(下はすぼまらず円柱になる)
  if (t > 0) {
    const rxz = Math.hypot(x, z) || 1e-6, dx = x / rxz, dz = z / rxz;
    const nx = dx * 0.52, nz = dz * (dz > 0 ? 0.50 : 0.44) - 0.10;              // 首の太さ
    X += (nx - X) * t; Z += (nz - Z) * t;
    Y = y + t * (y + 0.32) * 1.05;
    if (z > 0) {
      const k = t * smooth(-0.45, -0.75, y);
      Z += 0.035 * k * (Math.exp(-(((X - 0.15) / 0.085) ** 2)) + Math.exp(-(((X + 0.15) / 0.085) ** 2)));  // 首の筋
      Z -= 0.02 * k * Math.exp(-((X / 0.05) ** 2));
    }
  }
  out.set(X, Y, Z);
  return out;
}
function dirOf(theta, phi, out) { const s = Math.sin(theta); return out.set(-Math.cos(phi) * s, Math.cos(theta), Math.sin(phi) * s); }

const HSEG_W = 128, HSEG_H = 100;
const headGeo = new THREE.SphereGeometry(1, HSEG_W, HSEG_H);
(function deform() {
  const pos = headGeo.attributes.position, uv = headGeo.attributes.uv, nor = headGeo.attributes.normal;
  const d = new THREE.Vector3(), p = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3(), n = new THREE.Vector3();
  const e = 0.002;
  for (let i = 0; i < pos.count; i++) {
    const phi = uv.getX(i) * Math.PI * 2, theta = (1 - uv.getY(i)) * Math.PI;
    shape(...dirOf(theta, phi, d).toArray(), p);
    pos.setXYZ(i, p.x, p.y, p.z);
    if (theta < 0.004) n.set(0, 1, 0);
    else if (theta > Math.PI - 0.004) n.set(0, -1, 0);
    else {
      const p1 = shape(...dirOf(theta, phi + e, d).toArray(), new THREE.Vector3());
      const p2 = shape(...dirOf(theta, phi - e, d).toArray(), new THREE.Vector3());
      const p3 = shape(...dirOf(theta + e, phi, d).toArray(), new THREE.Vector3());
      const p4 = shape(...dirOf(theta - e, phi, d).toArray(), new THREE.Vector3());
      a.subVectors(p1, p2); b.subVectors(p3, p4);
      n.crossVectors(a, b).normalize();
      dirOf(theta, phi, d);
      if (n.dot(d) < 0) n.negate();
    }
    nor.setXYZ(i, n.x, n.y, n.z);
  }
  pos.needsUpdate = true; nor.needsUpdate = true;
  headGeo.computeBoundingSphere(); headGeo.computeBoundingBox();
})();

/* ================= 肌と髪のテクスチャ ================= */
function hash(i, j) { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967295; }
function vnoise(x, y, per) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const w = k => ((k % per) + per) % per;
  const A = hash(w(xi), yi), B = hash(w(xi + 1), yi), C = hash(w(xi), yi + 1), D = hash(w(xi + 1), yi + 1);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return A + (B - A) * u + (C - A) * v + (A - B - C + D) * u * v;
}
function fbm(x, y, per) { let s = 0, a = 0.5, f = 1; for (let o = 0; o < 4; o++) { s += a * vnoise(x * f, y * f, per * f); a *= 0.5; f *= 2; } return s; }

const TW = 2048, TH = 1024;
const colorC = mkCanvas(TW, TH), bumpC = mkCanvas(1024, 512), roughC = mkCanvas(256, 128);
(function makeTextures() {
  // ---- 肌の色(低解像度で計算して拡大) ----
  const lw = 512, lh = 256, low = mkCanvas(lw, lh), lg = low.getContext('2d');
  const img = lg.createImageData(lw, lh), D = img.data;
  for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
    const u = (x + 0.5) / lw, v = 1 - (y + 0.5) / lh;
    const n = fbm(u * 10, v * 5, 10), n2 = vnoise(u * 40, v * 20, 40);
    let r = 218, g = 148, b = 112;
    r += (n - 0.5) * 30; g += (n - 0.5) * 20; b += (n - 0.5) * 16;
    r += (n2 - 0.5) * 8 * (1 - smooth(0.9, 0.98, v)); g += (n2 - 0.5) * 6 * (1 - smooth(0.9, 0.98, v));
    const cr = smooth(0.6, 0.95, v); r += 12 * cr; g -= 10 * cr; b -= 6 * cr;   // 頭頂は赤み
    const nk = smooth(0.32, 0.16, v); r -= 10 * nk; g -= 12 * nk; b -= 10 * nk; // 首は日焼け
    const i = (y * lw + x) * 4; D[i] = r; D[i + 1] = g; D[i + 2] = b; D[i + 3] = 255;
  }
  lg.putImageData(img, 0, 0);
  const g = colorC.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';

  }
  placeCamera();
  headGroup.rotation.set(ROT.x, ROT.y, 0);
  headGroup.position.y = Math.sin(T * 1.3) * 0.004;            // 呼吸
  blinkT -= dt; let bl = 0;
  if (blinkT < 0) { bl = Math.max(0, 1 - Math.abs(blinkT + 0.09) / 0.09); if (blinkT < -0.18) blinkT = 2 + Math.random() * 4; }
  for (const l of lids) l.rotation.x = -(0.08 + bl * 1.1);   // 前へ倒すと目が閉じる
  if (cur && cur.dirty) buildChunk(cur);

  // ボトル
  if (G.mode === 'play') {
    let bx, by;
    if (P.drawing || (P.hover && !P.rotating)) { bx = P.x; by = P.y - (P.type === 'touch' ? TOUCH_OFF : 0); }
    else { bx = W - Math.min(80, W * 0.16); by = H * 0.62; }
    bottleEl.hidden = false;
    bottleEl.style.transform = `translate(${bx - 29}px, ${by - 150}px) rotate(26deg)`;
  } else bottleEl.hidden = true;

  updateAudio();
}

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  if (window.innerWidth < 1 || window.innerHeight < 1) return;
  try { update(dt); renderer.render(scene, camera); } catch (e) { console.error(e); }
}
requestAnimationFrame(loop);

/* ================= 画面遷移 ================= */
function bestVal() { const v = parseFloat(load(KEY_BEST)); return isFinite(v) ? v : 0; }
function refreshBest() { const b = bestVal(); $('bestT').textContent = b > 0 ? 'これまでの最長：ケチャップ ' + b + 'cm' : ''; }

function startGame() {
  initAudio(true);
  clearAll();
  G.mode = 'play'; G.blob = null; G.strokesStarted = 0;
  ROT.ty = 0; ROT.tx = 0;
  Object.assign(CAMS, CAM_PLAY);
  $('ctrl').hidden = false;
  $('titleOv').hidden = true; $('resOv').hidden = true; $('viewBack').hidden = true;
  toast('頭の外をドラッグすると、頭が回ります', 2600);
}

function commentFor(cm, n) {
  if (n === 0) return '…何もせんのかい。';
  if (cm < 40) return 'ちょっと冷たいのう。';
  if (cm < 120) return 'なんか甘酸っぱい匂いがするんじゃが。';
  if (cm < 260) return '母さん、ワシの頭どうなっとる？';
  if (cm < 450) return 'さっきから、ずっと冷たいんじゃが。';
  return 'ワシはオムライスじゃないぞ！';
}

function finish() {
  if (G.mode !== 'play') return;
  if (cur) endStroke();
  P.down = false; P.drawing = false;
  G.mode = 'outro';
  OUTRO.t = 0; OUTRO.from = { ...CAMS }; OUTRO.rotFrom = ROT.y; OUTRO.tiltFrom = ROT.x;
  $('ctrl').hidden = true; $('bubble').hidden = true; $('toast').hidden = true;
  sfxWhoosh();
}

function showResult() {
  G.mode = 'result';
  ROT.ty = 0; ROT.tx = 0;
  const cm = Math.round(totalLen() * CM_PER_UNIT);
  $('resLen').textContent = cm;
  $('resCmt').textContent = '「' + commentFor(cm, strokes.length) + '」';
  const best = bestVal();
  if (cm > best) { save(KEY_BEST, String(cm)); $('resBest').textContent = cm > 0 ? '最長記録！' : ''; }
  else $('resBest').textContent = best > 0 ? 'これまでの最長：' + best + 'cm' : '';
  G.shareText = 'おじさんの頭に、ケチャップで絵を描いた（ケチャップ' + cm + 'cm） ' + HASHTAG;
  $('xBtn').href = 'https://x.com/intent/post?text=' + encodeURIComponent(G.shareText) + '&url=' + encodeURIComponent(SHARE_URL);
  $('resOv').hidden = false;
  sfxDone();
  makeShareImage(cm);
}

function backToTitle() {
  clearAll();
  Object.assign(CAMS, CAM_PLAY);
  G.mode = 'title';
  $('resOv').hidden = true; $('viewBack').hidden = true; $('ctrl').hidden = true;
  $('titleOv').hidden = false;
  refreshBest();
}

/* ================= 画像 ================= */
let canShareFiles = false;
try { canShareFiles = coarse && !!navigator.canShare && navigator.canShare({ files: [new File([new Blob(['x'])], 't.jpg', { type: 'image/jpeg' })] }); } catch (e) {}
$('imgBtn').textContent = canShareFiles ? '画像を共有' : '画像を保存';

function makeShareImage(cm) {
  G.blob = null;
  try {
    const W2 = 1080, H2 = 1350, c = mkCanvas(W2, H2), g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, H2);
    bg.addColorStop(0, '#6e4a30'); bg.addColorStop(0.6, '#4a2f1e'); bg.addColorStop(1, '#2e1d12');
    g.fillStyle = bg; g.fillRect(0, 0, W2, H2);
    renderer.render(scene, camera);                       // 描いた直後に同じ処理の中で読む
    const src = renderer.domElement, sa = src.width / src.height, da = W2 / H2;
    let sx, sy, sw, sh;
    if (sa > da) { sh = src.height; sw = sh * da; sx = (src.width - sw) / 2; sy = 0; }
    else { sw = src.width; sh = sw / da; sx = 0; sy = (src.height - sh) * 0.15; }
    g.drawImage(src, sx, sy, sw, sh, 0, 0, W2, H2);
    const gr = g.createLinearGradient(0, H2 * 0.66, 0, H2);
    gr.addColorStop(0, 'rgba(20,12,8,0)'); gr.addColorStop(0.45, 'rgba(20,12,8,.72)'); gr.addColorStop(1, 'rgba(20,12,8,.92)');
    g.fillStyle = gr; g.fillRect(0, H2 * 0.66, W2, H2 * 0.34);
    g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
    g.font = '800 96px ' + FONT; g.lineWidth = 10; g.strokeStyle = '#1f1a24';
    g.strokeText('ハゲチャップ', 56, H2 - 190); g.fillStyle = '#e8402f'; g.fillText('ハゲチャップ', 56, H2 - 190);
    g.font = '800 40px ' + FONT; g.fillStyle = '#fff';
    g.fillText('おじさんの頭に、ケチャップ ' + cm + 'cm', 60, H2 - 116);
    g.font = '500 28px ' + FONT; g.fillStyle = '#bfb3a3';
    g.fillText('porkgorilla.com/works/hagechap.html', 60, H2 - 60);
    c.toBlob(b => { G.blob = b; }, 'image/jpeg', 0.9);
  } catch (e) { console.error(e); }
}
function downloadImg() {
  const url = URL.createObjectURL(G.blob);
  const a = document.createElement('a'); a.href = url; a.download = 'hagechap.jpg';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
$('imgBtn').addEventListener('click', async () => {
  if (!G.blob) { toast('画像を準備中…もう一度タップ'); return; }
  if (canShareFiles) {
    const file = new File([G.blob], 'hagechap.jpg', { type: 'image/jpeg' });
    try { await navigator.share({ files: [file], text: G.shareText }); }
    catch (e) { if (e && e.name !== 'AbortError') { try { downloadImg(); } catch (_) {} } }
    return;
  }
  try { downloadImg(); } catch (e) {}
});
if (coarse) { ['xBtn', 'xTitle'].forEach(id => { $(id).removeAttribute('target'); $(id).removeAttribute('rel'); }); }
$('xTitle').href = 'https://x.com/intent/post?text=' + encodeURIComponent('オムライスじゃなくて、おじさんの頭にケチャップで絵を描くゲーム ' + HASHTAG) + '&url=' + encodeURIComponent(SHARE_URL);

/* ================= ボタン ================= */
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('titleBtn').addEventListener('click', backToTitle);
$('doneBtn').addEventListener('click', finish);
$('viewBtn').addEventListener('click', () => { $('resOv').hidden = true; $('viewBack').hidden = false; toast('ドラッグで頭を回せます'); });
$('viewBack').addEventListener('click', () => { $('resOv').hidden = false; $('viewBack').hidden = true; });

/* ================= 音 ================= */
let AC = null, master = null, sqG = null, sqF = null, noiseBuf = null;
let soundOn = load(KEY_SND) !== '0';
function initAudio(force) {
  if (AC && force) { try { AC.close().catch(() => {}); } catch (e) {} AC = null; }
  else if (AC) {
    if (AC.state === 'closed') AC = null;
    else { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  try {
    AC = new C();
    master = AC.createGain(); master.gain.value = soundOn ? 0.9 : 0; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); let b = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; b = (b + 0.02 * w) / 1.02; d[i] = w * 0.45 + b * 3; }
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    sqF = AC.createBiquadFilter(); sqF.type = 'bandpass'; sqF.frequency.value = 900; sqF.Q.value = 0.9;
    sqG = AC.createGain(); sqG.gain.value = 0;
    src.connect(sqF); sqF.connect(sqG); sqG.connect(master); src.start();
    if (AC.state === 'suspended') AC.resume().catch(() => {});
  } catch (e) { AC = null; }
}
function updateAudio() {   // ゲームロジックの外側。描いていなければ必ず0へ
  if (!AC || !sqG) return;
  const drawing = G.mode === 'play' && P.drawing && cur;
  const tgt = drawing ? Math.min(0.45, 0.05 + P.speed * 0.25) : 0;
  try {
    sqG.gain.setTargetAtTime(tgt, AC.currentTime, 0.04);
    sqF.frequency.setTargetAtTime(700 + Math.min(1400, P.speed * 500), AC.currentTime, 0.05);
  } catch (e) {}
}
function noiseHit(dur, freq, vol, type) {
  if (!AC || !noiseBuf) return;
  const t = AC.currentTime, s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
  const gg = AC.createGain(); gg.gain.setValueAtTime(vol, t); gg.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(gg); gg.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
function tone(f0, f1, dur, vol, type, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), gg = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  gg.gain.setValueAtTime(0.0001, t); gg.gain.linearRampToValueAtTime(vol, t + 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gg); gg.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function sfxPlop() { noiseHit(0.12, 500, 0.35); tone(170, 60, 0.12, 0.22); }
function sfxWhoosh() { noiseHit(1.2, 600, 0.16, 'bandpass'); }
function sfxDone() { [660, 880, 1320].forEach((f, i) => tone(f, f, 0.28, 0.12, 'triangle', i * 0.09)); }

const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function refreshSnd() { $('sndBtn').innerHTML = soundOn ? ICON_ON : ICON_OFF; $('sndBtn').setAttribute('aria-pressed', soundOn ? 'true' : 'false'); }
$('sndBtn').addEventListener('click', () => {
  soundOn = !soundOn; save(KEY_SND, soundOn ? '1' : '0'); refreshSnd();
  if (soundOn) initAudio();
  if (master && AC) { try { master.gain.setTargetAtTime(soundOn ? 0.9 : 0, AC.currentTime, 0.02); } catch (e) {} }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && G.mode === 'play') initAudio();
  if (document.visibilityState === 'hidden' && P.down) { if (cur) endStroke(); P.down = false; P.drawing = false; P.rotating = false; }
});

refreshSnd(); refreshBest();
G.mode = 'title';
$('startBtn').disabled = false; $('startBtn').textContent = 'はじめる';
})();
</script>
