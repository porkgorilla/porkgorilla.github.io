<script>
'use strict';
const $ = id => document.getElementById(id);
const GAME_NAME = 'インフィニットゲーム';
const GAME_URL = 'https://porkgorilla.com/works/infinitegame.html';
const OG_CACHE_VERSION = 1;
const SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const HASHTAG = '#インフィニットゲーム';
const KEY_BEST = 'infinitegame-best', KEY_SND = 'infinitegame-sound';

// ---- 世界の定数(1階層ぶんの画面は 400×300 の論理座標) ----
const SW = 400, SH = 300, GROUND = 238, RX = 84;
const G = 1750, V0 = 440, HOLD_MAX = 0.28, HOLD_G = 0.3;
const NEED = 5, DIVE_T = 1.35, STEP = 1 / 120;
const HANDS_WAIT = .6, HANDS_T = 1.2, HANDS_BUBBLE = .2, HANDS_HOLD = 1.5;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---- 色 ----
function hexToHsl(hex){
  const n = parseInt(hex.slice(1), 16); let r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn){ const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
  return [h, s, l];
}
function hslToHex(h, s, l){
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
function hueShift(hex, deg){ if (typeof hex !== 'string' || hex[0] !== '#') return hex; const [h, s, l] = hexToHsl(hex); return hslToHex((h + deg / 360 + 1) % 1, s, l); }

const BASE_THEMES = [
  { key:'b16', name:'16ビット', res:[320,240], pixel:true, style:'b16', wave:'triangle',
    sky1:'#4aa8ff', sky2:'#c4ebff', far:'#7fcd6c', far2:'#5aa94e', ground:'#5bb84b', soil:'#9a6635', soil2:'#7d4f28', ink:'#1f2140',
    skin:'#ffd0a6', hair:'#3b2a20', shirt:'#e9483f', pants:'#2f4f9c', obs:'#b07a42', obs2:'#6d4523', con:'#e6e6ee', con2:'#7d8296', btn:'#d33a5b', glow:'#cfe8ff', text:'#ffffff' },
  { key:'gb', name:'携帯ゲーム機', res:[160,120], pixel:true, style:'gb', wave:'square',
    sky1:'#d8ecb4', sky2:'#d8ecb4', far:'#a3c46e', far2:'#a3c46e', ground:'#5a8a4a', soil:'#2f5a35', soil2:'#2f5a35', ink:'#0f230f',
    skin:'#a3c46e', hair:'#0f230f', shirt:'#2f5a35', pants:'#0f230f', obs:'#2f5a35', obs2:'#0f230f', con:'#c9c9c0', con2:'#6c6c7a', btn:'#9a2752', glow:'#d8ecb4', text:'#0f230f' },
  { key:'fc', name:'8ビット', res:[256,192], pixel:true, style:'fc', wave:'square',
    sky1:'#6b8cff', sky2:'#6b8cff', far:'#3fbf3f', far2:'#1f8f1f', ground:'#c84c0c', soil:'#c84c0c', soil2:'#7c2800', ink:'#000000',
    skin:'#fcb8a0', hair:'#7c2800', shirt:'#2038ec', pants:'#7c2800', obs:'#a8a8a8', obs2:'#545454', con:'#bc3030', con2:'#2a2a2a', btn:'#fcfcfc', glow:'#fcfcfc', text:'#fcfcfc' },
  { key:'arc', name:'アーケード', res:[400,300], pixel:false, style:'neon', wave:'sawtooth',
    sky1:'#05010f', sky2:'#33093f', far:'#ff3fb0', far2:'#7a1aff', ground:'#12002a', soil:'#ff3fb0', soil2:'#00e5ff', ink:'#00e5ff',
    skin:'#ffe08a', hair:'#ff3fb0', shirt:'#00e5ff', pants:'#7a1aff', obs:'#ff3fb0', obs2:'#ffe08a', con:'#1d1240', con2:'#00e5ff', btn:'#ffe08a', glow:'#ff9de0', text:'#ffe08a' },
  { key:'vec', name:'ベクター', res:[400,300], pixel:false, style:'vec', stroke:true, wave:'sine',
    sky1:'#000000', sky2:'#000000', far:'#7dff8a', far2:'#7dff8a', ground:'#000000', soil:'#7dff8a', soil2:'#7dff8a', ink:'#7dff8a',
    skin:'#7dff8a', hair:'#7dff8a', shirt:'#7dff8a', pants:'#7dff8a', obs:'#7dff8a', obs2:'#7dff8a', con:'#0a1a0c', con2:'#7dff8a', btn:'#7dff8a', glow:'#7dff8a', text:'#7dff8a' },
  { key:'txt', name:'テキスト', res:[400,300], pixel:false, style:'txt', wave:'square',
    sky1:'#03122a', sky2:'#03122a', far:'#1d4e80', far2:'#1d4e80', ground:'#03122a', soil:'#3d82b8', soil2:'#3d82b8', ink:'#a8ecff',
    skin:'#a8ecff', hair:'#a8ecff', shirt:'#5fc4ff', pants:'#3d82b8', obs:'#a8ecff', obs2:'#a8ecff', con:'#0c2c52', con2:'#a8ecff', btn:'#a8ecff', glow:'#a8ecff', text:'#a8ecff' },
  { key:'lcd', name:'電卓', res:[200,150], pixel:true, style:'lcd', wave:'square',
    sky1:'#b8c2a2', sky2:'#b8c2a2', far:'#a9b394', far2:'#a9b394', ground:'#b8c2a2', soil:'#1e2617', soil2:'#1e2617', ink:'#1e2617',
    skin:'#1e2617', hair:'#1e2617', shirt:'#1e2617', pants:'#1e2617', obs:'#1e2617', obs2:'#1e2617', con:'#3a3f48', con2:'#9aa0aa', btn:'#e0a030', glow:'#b8c2a2', text:'#1e2617' },
  { key:'bit', name:'1ビット', res:[128,96], pixel:true, style:'bit', wave:'square',
    sky1:'#ffffff', sky2:'#ffffff', far:'#000000', far2:'#000000', ground:'#ffffff', soil:'#000000', soil2:'#000000', ink:'#000000',
    skin:'#ffffff', hair:'#000000', shirt:'#000000', pants:'#000000', obs:'#000000', obs2:'#000000', con:'#f0f0f0', con2:'#222222', btn:'#222222', glow:'#ffffff', text:'#000000' },
];
const COLOR_KEYS = ['sky1','sky2','far','far2','ground','soil','soil2','ink','skin','hair','shirt','pants','obs','obs2','con','con2','btn','glow','text'];
function themeFor(depth){
  const i = (depth - 1) % BASE_THEMES.length, cyc = Math.floor((depth - 1) / BASE_THEMES.length);
  const b = BASE_THEMES[i]; const t = Object.assign({}, b);
  if (cyc > 0){ for (const k of COLOR_KEYS) t[k] = hueShift(b[k], cyc * 67); t.name = b.name + '(' + (cyc + 1) + '周目)'; }
  return t;
}
const ROOM_THEME = { name:'現実', res:[400,300], pixel:false, style:'room', ink:'#000', con:'#18181d', con2:'#55556a', btn:'#c0304a', glow:'#bcd6ff' };

const speedFor = d => Math.min(390, 175 + 11 * (d - 1));

// ---- 階層(レイヤー) ----
function makeLayer(depth, opts = {}){
  const th = depth === 0 ? ROOM_THEME : themeFor(depth);
  const cv = document.createElement('canvas'); cv.width = th.res[0]; cv.height = th.res[1];
  const L = { depth, kind: depth === 0 ? 'room' : 'run', th, cv, ctx: cv.getContext('2d'),
    obs: [], dist: rand(0, 2000), spawnIn: rand(60, 200), spawned: 0, cleared: 0,
    y: GROUND, vy: 0, onGround: true, holding: false, holdT: 0, buffer: 0,
    auto: true, apHold: 0, apJit: 0, testDrive: false, phase: rand(0, 6),
    v: depth === 0 ? 0 : speedFor(depth), child: null, bubble: null, standing: false,
    dead: false, rot: 0, con: null };
  Object.assign(L, opts);
  return L;
}
function ensureChain(L){ let l = L; for (let n = 0; n < 2; n++){ if (!l.child) l.child = makeLayer(l.depth + 1); l = l.child; } }

function screenRect(L){
  if (L.kind === 'room') return { x: 236, y: 92, w: 128, h: 96 };
  return { x: RX + 7, y: L.y - 63, w: 40, h: 30 };
}

// 障害物
function spawn(L){
  const d = L.depth, r = Math.random();
  const pTall = Math.min(.32, .14 + d * .025), pWide = Math.min(.26, .1 + d * .02), pDbl = d >= 3 ? Math.min(.2, (d - 2) * .04) : 0;
  let o;
  if (r < pTall) o = { type:'tall', w: 18, h: 44 };
  else if (r < pTall + pWide) o = { type:'wide', w: 44, h: 20 };
  else if (r < pTall + pWide + pDbl) o = { type:'dbl', w: 66, h: 22, parts: [[0, 18], [48, 66]] };
  else o = { type:'small', w: 18, h: rand(18, 24) };
  if (!o.parts) o.parts = [[0, o.w]];
  o.x = SW + 12; o.passed = false; o.seed = Math.random();
  L.obs.push(o); L.spawned++;
  const k = Math.max(.72, 1 - d * .02);
  L.spawnIn = o.w + L.v * rand(1.05, 1.75) * k + 30;
}

function doJump(L){
  L.vy = -V0; L.onGround = false; L.holdT = 0; L.buffer = 0;
  L.holding = (L === S.cur && !L.auto && !L.testDrive) ? S.btnDown : true;
  if (L === S.cur && !L.auto) sfx('jump');
}
function autoPilot(L, dt){
  if (L.holding){ L.apHold -= dt; if (L.apHold <= 0) L.holding = false; }
  if (!L.onGround) return;
  const ahead = L.obs.filter(o => o.x + o.w > RX - 10).sort((a, b) => a.x - b.x);
  if (!ahead.length) return;
  const o = ahead[0]; let span = o.w, h = o.h;
  for (let i = 1; i < ahead.length; i++){ if (ahead[i].x - (o.x + span) < 50){ span = ahead[i].x + ahead[i].w - o.x; h = Math.max(h, ahead[i].h); } else break; }
  const need = h > 30 || span > 30;
  const base = h > 30 ? 46 : 12, k = h > 30 ? .18 : need ? .17 : .1;
  const d = o.x - RX;
  if (d < base + L.v * (k + L.apJit) && d > -10){
    doJump(L); L.apHold = need ? HOLD_MAX : .02;
    L.apJit = L.jit ? rand(-L.jit, L.jit) : 0;
  }
}
function hit(L){
  const y = L.y;
  const B = [[RX - 10, y - 53, RX + 5, y - 1], [RX + 7, y - 62, RX + 46, y - 34]];
  for (const o of L.obs){
    if (o.x > RX + 50 || o.x + o.w < RX - 12) continue;
    for (const p of o.parts){
      const x1 = o.x + p[0] + 2, x2 = o.x + p[1] - 2, y1 = GROUND - o.h + 3, y2 = GROUND;
      for (const b of B) if (b[0] < x2 && b[2] > x1 && b[1] < y2 && b[3] > y1) return true;
    }
  }
  return false;
}

function updateLayer(L, dt){
  if (L.kind === 'room'){ L.phase += dt; return; }
  if (L.dead){
    L.vy += G * dt; L.y += L.vy * dt;
    if (L.y > GROUND){ L.y = GROUND; L.vy = Math.abs(L.vy) > 120 ? -L.vy * .3 : 0; }
    L.rot = Math.max(-Math.PI / 2, L.rot - dt * 7);
    const c = L.con; c.vy += G * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
    if (c.y + 34 > GROUND){ c.y = GROUND - 34; c.vy = Math.abs(c.vy) > 140 ? -c.vy * .35 : 0; c.vx *= .6; c.vr *= .5; }
    return;
  }
  if (L.standing){ L.phase += dt * .5; return; }
  L.phase += dt * L.v / 14;
  const dx = L.v * dt; L.dist += dx;
  for (const o of L.obs){

let AC = null, master = null, soundOn = lsGet(KEY_SND, true), bgmNext = 0, bgmStep = 0;

// ---- 描画: 画面全体 ----
let CW = 0, CH = 0, DPR = 1, LY = null;
function resize(){
  const r = $('game').getBoundingClientRect();
  const w = Math.floor(r.width), h = Math.floor(r.height);
  if (w < 1 || h < 1) return;
  DPR = Math.min(3, window.devicePixelRatio || 1);
  CW = w; CH = h; cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  LY = layout(w, h);
}
function layout(W, H){
  const pad = 10, land = W > H * 1.15;
  const b = Math.round(clamp(Math.min(W, H) * .035, 9, 18));
  if (!land){
    const ctrlH = clamp(H * .22, 92, 180);
    let vw = W - 2 * pad - 2 * b, vh = vw * .75;
    const maxVh = H - 2 * pad - 2 * b - ctrlH; if (vh > maxVh){ vh = Math.max(60, maxVh); vw = vh / .75; }
    const extra = Math.max(0, H - 2 * pad - 2 * b - ctrlH - vh);
    const vx = (W - vw) / 2, vy = pad + b + extra * .3;
    const cy = vy + vh + b + (H - pad - (vy + vh + b)) / 2;
    const u = clamp(Math.min(W, (H - pad - (vy + vh + b))) * .16, 16, 34);
    return { land, b, view: { x: vx, y: vy, w: vw, h: vh }, body: { x: pad, y: pad, w: W - 2 * pad, h: H - 2 * pad }, dpad: { x: W * .26, y: cy, u }, abtn: { x: W * .74, y: cy, r: u * 1.15 } };
  }
  let vh = H - 2 * pad - 2 * b, vw = vh / .75;
  if (W - vw - 2 * b - 2 * pad < 150){ vw = W - 2 * pad - 2 * b - 150; vh = vw * .75; }
  const vx = (W - vw) / 2, vy = (H - vh) / 2, side = (W - vw) / 2 - b;
  const u = clamp(side * .17, 12, 30);
  return { land, b, view: { x: vx, y: vy, w: vw, h: vh }, body: { x: pad, y: pad, w: W - 2 * pad, h: H - 2 * pad }, dpad: { x: side / 2 + pad / 2, y: H / 2, u }, abtn: { x: W - side / 2 - pad / 2, y: H / 2, r: u * 1.2 } };
}
function rr(c, x, y, w, h, r){ c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }

function drawDevice(A){
  const c = ctx, { view: v, b, body } = LY;
  c.fillStyle = '#0b0c14'; c.fillRect(0, 0, CW, CH);
  if (A.depth === 0){
    // 現実: スマホの縁だけ
    c.fillStyle = '#05060a'; rr(c, v.x - b, v.y - b, v.w + 2 * b, v.h + 2 * b, b); c.fill();

  c.fillStyle = bodyCol; rr(c, body.x, body.y, body.w, body.h, 22); c.fill();
  if (P.stroke){ c.strokeStyle = P.ink; c.lineWidth = 2; c.stroke(); }
  else { c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 3; c.stroke(); }
  c.fillStyle = isTV ? '#0a0a0d' : (P.stroke ? '#000' : P.con2); rr(c, v.x - b * .7, v.y - b * .7, v.w + 1.4 * b, v.h + 1.4 * b, b * .6); c.fill();

  c.fillStyle = isTV ? '#6c6c7c' : (P.stroke ? P.ink : P.con2);

function drawPad(c, dcol, edge, acol, stroke){
  const { dpad: d, abtn: a } = LY, u = d.u, pr = S.btnDown && inPlay();
  c.save();

  c.fillStyle = stroke ? acol : 'rgba(255,255,255,.85)'; c.font = `900 ${Math.round(a.r * .8)}px system-ui,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('A', a.x, a.y + (pr ? 2 : 0) + 1);

function camFor(sr, e){   // e=0: 全体、e=1: sr ぴったり
  const cw = SW * Math.exp(e * Math.log(sr.w / SW)), k = (SW - cw) / (SW - sr.w);
  return { x: sr.x * k, y: sr.y * k, w: cw, h: cw * .75 };
}
function viewLayer(){
  if (S.mode === 'outro' && S.outro) return S.outro.list[S.outro.k];
  if (S.mode === 'result' && S.outro) return S.outro.list[0];
  return S.cur;
}
function fitFont(c, weight, size, txt, maxW){
  c.font = `${weight} ${size}px system-ui,sans-serif`;
  const w = c.measureText(txt).width;
  if (w > maxW && w > 0){ size = Math.max(7, size * maxW / w); c.font = `${weight} ${size}px system-ui,sans-serif`; }
  return size;
}
function render(dt){
  if (!LY || !S.cur) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const A = viewLayer();
  drawDevice(A);
  const v = LY.view;
  let cam = { x: 0, y: 0, w: SW, h: SH };
  if (S.mode === 'dive' && S.dive) cam = camFor(screenRect(A), ease(clamp(S.dive.t / DIVE_T, 0, 1)));
  else if (S.mode === 'outro' && S.outro) cam = camFor(screenRect(A), 1 - ease(clamp(S.outro.t / S.outro.stepT, 0, 1)));
  renderLayer(A, 0);
  ctx.save(); ctx.beginPath(); ctx.rect(v.x, v.y, v.w, v.h); ctx.clip();
  const [rw, rh] = A.th.res, sx = rw / SW, sy = rh / SH;

  ctx.drawImage(A.cv, cam.x * sx, cam.y * sy, cam.w * sx, cam.h * sy, v.x, v.y, v.w, v.h);
  // 中のゲーム画面を、くっきり描き直す
  if (A.child && !A.dead){
    const sr = screenRect(A), s = v.w / cam.w;
    const X = v.x + (sr.x - cam.x) * s, Y = v.y + (sr.y - cam.y) * s, Wd = sr.w * s, Hd = sr.h * s;
    if (X < v.x + v.w && Y < v.y + v.h && X + Wd > v.x && Y + Hd > v.y){
      ctx.imageSmoothingEnabled = !A.child.th.pixel;
      ctx.drawImage(A.child.cv, X, Y, Wd, Hd);
    }
  }
  // 階層の札
  drawViewText(dt);
  ctx.restore();
  const o = S.outro;
  if (o && o.done && (S.mode === 'outro' || S.mode === 'result') && o.handsT > 0) drawHands(o);
}

// ---- いちばん外側: 遊んでいる「私たち」の手 ----
let snapCv = null;
function drawHands(o){
  if (!snapCv) snapCv = document.createElement('canvas');
  if (snapCv.width !== cv.width || snapCv.height !== cv.height){ snapCv.width = cv.width; snapCv.height = cv.height; }
  const sc = snapCv.getContext('2d');
  sc.setTransform(1, 0, 0, 1, 0, 0); sc.clearRect(0, 0, snapCv.width, snapCv.height); sc.drawImage(cv, 0, 0);
  const e = ease(clamp(o.handsT / HANDS_T, 0, 1)), c = ctx;

  const k = lerp(1, target, e);
  const sw = CW * k, sh = CH * k;
  const sx = (CW - sw) / 2, sy = lerp(0, land ? CH * .2 : CH * .17, e);
  const bz = lerp(0, Math.max(8, Math.min(CW, CH) * .035), e);   // スマホの縁

  const bg = c.createLinearGradient(0, 0, 0, CH); bg.addColorStop(0, '#16151d'); bg.addColorStop(1, '#0a0a0f');
  c.fillStyle = bg; c.fillRect(0, 0, CW, CH);
  const gl = c.createRadialGradient(CW / 2, sy + sh / 2, 10, CW / 2, sy + sh / 2, Math.max(CW, CH) * .7);
  gl.addColorStop(0, `rgba(150,170,230,${.22 * e})`); gl.addColorStop(1, 'rgba(150,170,230,0)');
  c.fillStyle = gl; c.fillRect(0, 0, CW, CH);
  const px = sx - bz, py = sy - bz * 1.6, pw = sw + bz * 2, ph = sh + bz * 3.2, pr = bz * 2.2;
  // 手(スマホの後ろ側)。暗い部屋なので、画面の光で縁だけ照らされたシルエットにする
  const HC = '#2e2a3a', HE = 'rgba(170,180,230,.45)', handW = Math.max(54, pw * .3);
  const handBack = side => {
    const ex = side < 0 ? px : px + pw, top = py + ph * .58;
    c.beginPath();
    c.moveTo(ex - side * handW * .55, CH + 20);
    c.bezierCurveTo(ex - side * handW * .5, top + ph * .25, ex - side * handW * .3, top, ex + side * handW * .02, top);
    c.bezierCurveTo(ex + side * handW * .3, top, ex + side * handW * .42, top + ph * .12, ex + side * handW * .4, top + ph * .3);
    c.lineTo(ex + side * handW * .62, CH + 20); c.closePath();
  };
  if (e > 0){
    c.save(); c.globalAlpha = Math.min(1, e * 1.6);
    for (const side of [-1, 1]){ handBack(side); c.fillStyle = HC; c.fill(); c.strokeStyle = HE; c.lineWidth = 1.5; c.stroke(); }
    c.restore();
  }
  // スマホ本体
  c.fillStyle = '#1b1b22'; rr(c, px, py, pw, ph, pr); c.fill();
  c.strokeStyle = '#3a3a46'; c.lineWidth = 1.5; c.stroke();
  c.drawImage(snapCv, 0, 0, snapCv.width, snapCv.height, sx, sy, sw, sh);
  if (bz > 4){ c.fillStyle = '#0c0c10'; rr(c, CW / 2 - bz * 1.6, py + bz * .45, bz * 3.2, bz * .7, bz * .35); c.fill(); }
  // 親指(スマホの手前、画面の下の角にそっと乗せる)

    const tw = Math.max(16, Math.min(28, pw * .075)), tl = Math.max(36, pw * .16);
    for (const side of [-1, 1]){
      const bx0 = side < 0 ? px - tw * .2 : px + pw + tw * .2, by0 = py + ph * .86;
      c.save(); c.translate(bx0, by0); c.rotate(side * -.95);
      c.beginPath(); if (c.roundRect) c.roundRect(-tw / 2, -tl, tw, tl + tw, tw / 2); else c.rect(-tw / 2, -tl, tw, tl + tw);
      c.fillStyle = HC; c.fill(); c.strokeStyle = HE; c.lineWidth = 1.5; c.stroke();
      c.restore();
    }
    c.restore();
  }
  // 上から「…もう1回だけ」
  if (o.ours){
    const txt = '…もう1回だけ';
    const a = clamp((o.hold - (HANDS_WAIT + HANDS_T + HANDS_BUBBLE)) / .25, 0, 1);
    c.save(); c.globalAlpha = S.mode === 'result' ? 1 : a;
    const fs = fitFont(c, 900, Math.round(clamp(CW * .06, 16, 26)), txt, CW * .7);
    const tw = c.measureText(txt).width, bw = tw + fs * 1.6, bh = fs * 2.1;

    // しっぽは画面の外(上)へ
    c.beginPath(); c.moveTo(CW / 2 - fs * .5, by + 2); c.lineTo(CW / 2 + fs * .9, -10); c.lineTo(CW / 2 + fs * .55, by + 2); c.closePath(); c.fill(); c.stroke();

}
function drawViewText(dt){

      c.fillStyle = '#ffd23f'; c.fillText(`第${B.d}階層`, v.x + v.w / 2, v.y + v.h * .18);

    const x0 = v.x + v.w - (n * sz + (n - 1) * gap) - 8, y0 = v.y + 8;
    c.save();
    for (let i = 0; i < n; i++){ c.fillStyle = i < L.cleared ? '#ffd23f' : 'rgba(0,0,0,.4)'; c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1; c.fillRect(x0 + i * (sz + gap), y0, sz, sz); c.strokeRect(x0 + i * (sz + gap) + .5, y0 + .5, sz - 1, sz - 1); }
    c.restore();
  }
  if (S.mode === 'dive' && S.cur && S.cur.depth > 0 && S.dive.t < .8){
    c.save(); c.textAlign = 'center'; c.textBaseline = 'middle';
    fitFont(c, 900, Math.round(v.w * .1), 'ダイブ！', v.w * .8);
    c.lineWidth = 5; c.strokeStyle = '#000'; c.globalAlpha = 1 - S.dive.t / .8;
    c.strokeText('ダイブ！', v.x + v.w / 2, v.y + v.h * .82); c.fillStyle = '#ffd23f'; c.fillText('ダイブ！', v.x + v.w / 2, v.y + v.h * .82);
    c.restore();
  }
  if (S.mode === 'outro' && S.outro && !S.outro.done){
    c.save(); c.textAlign = 'center'; c.textBaseline = 'bottom'; fitFont(c, 700, 12, 'タップでとばす', v.w * .6);
    c.fillStyle = 'rgba(255,255,255,.75)'; c.fillText('タップでとばす', v.x + v.w / 2, v.y + v.h - 6); c.restore();
  }
}

// ---- ループ ----
let last = performance.now(), acc = 0;
function update(dt){
  S.time += dt;
  if (S.mode === 'title' || S.mode === 'result'){
    const root = S.mode === 'result' && S.outro ? S.outro.list[0] : S.cur;
    updateChain(root, dt); return;
  }
  if (S.mode === 'play'){ updateChain(S.cur, dt); if (S.mode === 'play') checkDive(); }
  else if (S.mode === 'dive'){ S.dive.t += dt; updateChain(S.cur.child, dt); if (S.dive.t >= DIVE_T) finishDive(); }
  else if (S.mode === 'crash'){ S.crashT += dt; updateChain(S.cur, dt); if (S.crashT > 1.0) startOutro(); }
  else if (S.mode === 'outro'){ updateOutro(dt); const o = S.outro; if (o) for (let i = Math.max(0, o.k); i < Math.min(o.list.length, o.k + 3); i++) updateLayer(o.list[i], dt); }
}
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  if (innerWidth < 1 || innerHeight < 1) return;
  try {
    if (!CW || !CH){ resize(); if (!CW) return; }
    if (!paused){ acc = Math.min(acc + dt, .1); while (acc >= STEP){ update(STEP); acc -= STEP; } }
    render(paused ? 0 : dt);
    bgmTick();
  } catch (e) { console.error(e); }
}

// ---- UI ----
const RANKS = [[1, '入口でつまずいた人'], [2, 'ちょっと休憩の人'], [3, 'ゲームの中のゲーマー'], [4, '画面の中の画面の人'], [6, 'マトリョーシカ'], [8, '電卓の中の住人'], [9, '1ビットの向こう側'], [12, '階層の旅人'], [16, '無限の入口'], [22, 'もう戻れない人'], [30, 'インフィニット']];
const rankFor = d => { let r = RANKS[0][1]; for (const [k, n] of RANKS) if (d >= k) r = n; return r; };
function shareHref(text){ return 'https://x.com/intent/post?text=' + encodeURIComponent(text + ' ' + HASHTAG) + '&url=' + encodeURIComponent(SHARE_URL); }
function setShare(el, text){ el.href = shareHref(text); if (matchMedia('(pointer: coarse)').matches){ el.removeAttribute('target'); el.removeAttribute('rel'); } }
function setOverlay(which){
  $('titleOv').hidden = which !== 'title'; $('resultOv').hidden = which !== 'result';
}
function refreshHome(){
  const on = (S.mode === 'title' || S.mode === 'result') && !paused, a = $('homeLink');
  a.style.visibility = on ? '' : 'hidden'; a.tabIndex = on ? 0 : -1;
  if (on) a.removeAttribute('aria-hidden'); else a.setAttribute('aria-hidden', 'true');
}
function refreshHud(){
  const L = S.cur, d = (S.mode === 'title' || !L) ? 0 : S.mode === 'result' ? S.maxDepth : L.depth;
  $('hDepth').textContent = d;
  $('hNeed').textContent = d === 0 ? '現実' : S.mode === 'result' ? '帰還' : (S.mode === 'crash' || S.mode === 'outro') ? 'やられた' : (S.mode === 'play' ? (L.cleared >= NEED ? 'ダイブ！' : 'あと' + (NEED - L.cleared)) : (S.mode === 'dive' ? 'ダイブ中' : (L.th.name)));
  $('hScore').textContent = S.score;
  fitHUD();
}
function fitHUD(){
  const pill = $('pill'), box = $('hud'); pill.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(pill).fontSize) || 14, n = 0;
  while (n++ < 10 && fs > 9 && (pill.scrollWidth > box.clientWidth || pill.scrollWidth > pill.clientWidth + 1)){ fs -= 1; pill.style.fontSize = fs + 'px'; }
}
function fitBtns(){
  document.querySelectorAll('.rgrid>*').forEach(b => {
    b.style.fontSize = ''; if (!b.clientWidth) return;
    let fs = parseFloat(getComputedStyle(b).fontSize) || 14, k = 0;
    while (k++ < 8 && fs > 10 && b.scrollWidth > b.clientWidth + 1){ fs -= 1; b.style.fontSize = fs + 'px'; }
  });
}
function showTitle(){
  S.mode = 'title'; S.cur = freshChain(); S.outro = null; S.banner = null; S.score = 0;
  setOverlay('title'); $('pauseOv').hidden = true; paused = false;
  const best = lsGet(KEY_BEST, null);
  $('bestT').textContent = best ? `自己ベスト：第${best.depth}階層(${best.score}跳)` : 'まだ一度も潜っていない。';
  setShare($('shareT'), `ゲームの中の人もゲームをしている。そのゲームの中の人も…。どこまでも潜っていく「${GAME_NAME}」`);
  refreshHud(); refreshHome(); requestAnimationFrame(fitBtns);
}
function showResult(){
  const D = S.maxDepth || (S.cur ? S.cur.depth : 1), sc = S.score;
  if (S.outro){ const o = S.outro; o.k = 0; o.done = true; o.t = o.stepT; o.list[0].bubble = 'あーあ'; o.hold = Math.max(o.hold || 0, HANDS_WAIT + HANDS_T); o.handsT = HANDS_T; o.ours = true; }
  S.mode = 'result';
  const best = lsGet(KEY_BEST, null); let isNew = false;
  if (!best || D > best.depth || (D === best.depth && sc > best.score)){ lsSet(KEY_BEST, { depth: D, score: sc }); isNew = true; }
  const b2 = lsGet(KEY_BEST, { depth: D, score: sc });
  const rank = rankFor(D);
  $('rDepth').textContent = D; $('rScore').textContent = sc;
  $('rRank').textContent = `称号：${rank}`;
  $('rNote').textContent = D <= 1 ? 'まだ1つ目のゲームの中。外ではソファの人が見ている。' : `第${D}階層の人がやられて、${D}人がそろって「あっ」と言った。`;
  $('rBest').textContent = isNew ? '自己ベスト更新！' : `自己ベスト：第${b2.depth}階層(${b2.score}跳)`;
  setShare($('shareR'), `${GAME_NAME}で、ゲームの中のゲームの中の…第${D}階層までダイブした(${sc}跳・称号「${rank}」)`);
  setOverlay('result'); refreshHud(); refreshHome(); requestAnimationFrame(fitBtns);
}
function pauseGame(){
  if (!inPlay() || paused) return;
  paused = true; S.btnDown = false; if (S.cur) S.cur.holding = S.cur.holding && false;
  const d = S.cur ? S.cur.depth : 0;
  $('pNote').textContent = `いま第${d}階層(${S.cur ? S.cur.th.name : ''}の中)。${S.score}跳。`;
  setShare($('shareP'), `${GAME_NAME}で、いま第${d}階層まで潜ってる(${S.score}跳)`);
  syncSndBtns(); $('pauseOv').hidden = false; refreshHome(); requestAnimationFrame(fitBtns);
}
function resume(){ paused = false; $('pauseOv').hidden = true; disarmAll(); initAudio(false); last = performance.now(); refreshHome(); }
function twoStep(btn, label, fn){
  btn.dataset.label = label;
  btn.addEventListener('click', () => {
    if (btn.dataset.armed !== '1'){
      disarmAll(); btn.dataset.armed = '1'; btn.textContent = '本当に？(もう一度)'; btn.classList.add('danger'); fitBtns();
      btn._t = setTimeout(() => disarm(btn), 3000); return;
    }
    disarm(btn); fn();
  });
}
function disarm(btn){ clearTimeout(btn._t); btn.dataset.armed = ''; btn.textContent = btn.dataset.label; btn.classList.remove('danger'); fitBtns(); }
function disarmAll(){ document.querySelectorAll('[data-label]').forEach(disarm); }

const ICON_ON = '<svg viewBox="0 0 20 20"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path d="M13 6.5a5 5 0 0 1 0 7M15.5 4a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 20 20"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path d="M13 7l5 6M18 7l-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
function syncSndBtns(){ $('sndBtn').innerHTML = soundOn ? ICON_ON : ICON_OFF; $('pSnd').textContent = soundOn ? '音：ON' : '音：OFF'; }
function toggleSound(){ soundOn = !soundOn; lsSet(KEY_SND, soundOn); if (soundOn) initAudio(false); syncSndBtns(); }

$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('titleBtn').addEventListener('click', showTitle);
$('resumeBtn').addEventListener('click', resume);
$('pauseBtn').addEventListener('click', () => { if (paused) resume(); else pauseGame(); });
$('sndBtn').addEventListener('click', toggleSound);
$('pSnd').addEventListener('click', toggleSound);
twoStep($('pTitle'), 'タイトルへ', () => { paused = false; showTitle(); });
twoStep($('pHome'), 'サイトのトップへ', () => { location.href = '/'; });

window.addEventListener('resize', () => { resize(); fitHUD(); fitBtns(); });
if (window.ResizeObserver) new ResizeObserver(() => { resize(); fitHUD(); }).observe($('game'));
window.addEventListener('load', () => requestAnimationFrame(() => { fitBtns(); fitHUD(); }));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(() => { fitBtns(); fitHUD(); }));

syncSndBtns();
showTitle();
resize();
requestAnimationFrame(loop);
</script>
