<style>
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#fff6ea;--sub:#d9c3c9;--acc:#ff5d8f;--gold:#ffd166;--panel:rgba(38,22,44,.9);--line:rgba(255,255,255,.18);
  --f:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;--fm:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;position:relative;overflow:hidden;background:#2a1830;color:var(--ink);font-family:var(--f);font-weight:500;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#stage{position:absolute;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#flash{position:absolute;inset:0;background:#ff5d8f;opacity:0;pointer-events:none;transition:opacity .25s}

#top{position:absolute;left:0;right:0;top:0;z-index:7;display:flex;align-items:center;gap:6px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 8px) 6px calc(env(safe-area-inset-left,0px) + 10px)}
.home{color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.04em;white-space:nowrap;pointer-events:auto;
  background:rgba(30,16,36,.6);padding:14px 10px;border-radius:999px;opacity:.9}
#pillBox{flex:1;min-width:0;display:flex;justify-content:center;overflow:hidden}
#pill{background:rgba(30,16,36,.72);border-radius:999px;padding:7px 14px;font-weight:900;font-size:15px;white-space:nowrap;letter-spacing:.03em}
#pill b{color:var(--gold);font-weight:900;margin-left:.6em}
.ic{pointer-events:auto;min-width:44px;min-height:44px;border-radius:50%;border:0;background:rgba(30,16,36,.72);color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ic svg{width:22px;height:22px;display:block}
#sndBtn.off .wave{display:none}
#sndBtn:not(.off) .mute{display:none}

#radio{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4;width:min(92%,520px);
  background:rgba(20,34,28,.78);border:1px solid rgba(160,255,200,.35);color:#d6ffe6;border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.45;
  pointer-events:none;opacity:0;transition:opacity .3s}
#radio.show{opacity:1}
#radio::before{content:"≪ 無線 ≫ ";color:#7dffb5;font-weight:900;font-size:11px}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;width:min(80%,420px);height:6px;
  background:rgba(0,0,0,.45);border-radius:9px;overflow:hidden;pointer-events:none}
#bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5d8f,#ffd166);transform-origin:left}
#shout{position:absolute;left:0;right:0;top:34%;z-index:4;text-align:center;font-family:var(--fm);font-weight:800;font-size:min(11vw,64px);
  color:#fff;text-shadow:0 0 18px #ff5d8f,0 3px 0 #b3245a;pointer-events:none;opacity:0;transform:scale(.6)}
#shout.show{animation:shout 1.3s ease-out both}
@keyframes shout{0%{opacity:0;transform:scale(.5) rotate(-4deg)}15%{opacity:1;transform:scale(1.08) rotate(-4deg)}75%{opacity:1;transform:scale(1) rotate(-4deg)}100%{opacity:0;transform:scale(1.25) rotate(-4deg)}}

#hud{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none;
  padding:0 calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 12px)}
#stat{background:rgba(30,16,36,.6);border-radius:14px;padding:8px 12px;font-size:12px;font-weight:900}
#lives{display:flex;gap:6px;margin-bottom:6px}
#lives i{width:22px;height:12px;border-radius:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)}
#lives i.on{background:var(--acc);border-color:#ffc2d4}
#pow{color:#b7f08c}
#bombBtn{pointer-events:auto;width:84px;height:84px;border-radius:50%;border:3px solid rgba(255,255,255,.35);color:#fff;font-family:var(--f);font-weight:900;font-size:15px;line-height:1.15;
  background:linear-gradient(0deg,rgba(255,93,143,.95) var(--g,0%),rgba(30,16,36,.75) var(--g,0%));cursor:pointer;padding:0}
#bombBtn small{display:block;font-size:10px;font-weight:500;opacity:.85}
#bombBtn:disabled{opacity:.75;cursor:default}
#bombBtn.ready{border-color:var(--gold);box-shadow:0 0 18px rgba(255,209,102,.8);animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}

.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 62px) 16px 16px}
#pauseOv{z-index:9;background:rgba(20,10,26,.72)}
#resultOv{background:rgba(20,10,26,.55)}
.card{margin-top:auto;flex-shrink:0;width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;
  box-shadow:0 12px 40px rgba(0,0,0,.45)}
#pauseOv .card,#resultOv .card{margin-block:auto}
h1{font-family:var(--fm);font-weight:800;font-size:54px;letter-spacing:.1em;margin:0;line-height:1.1;color:#fff;text-shadow:0 2px 0 #b3245a,0 0 22px rgba(255,93,143,.6)}
.sub{font-size:12px;letter-spacing:.2em;color:var(--gold);margin:2px 0 10px;font-weight:900}
.how{font-size:13.5px;line-height:1.7;color:var(--ink);margin:0 0 12px;padding:0;list-style:none}
.how li{padding-left:1.1em;text-indent:-1.1em}
.how li::before{content:"・";color:var(--acc)}
.best{font-size:12px;color:var(--sub);margin-bottom:10px}
h2{font-family:var(--fm);font-weight:800;font-size:28px;margin:0 0 6px;letter-spacing:.08em}
.big{font-size:46px;font-weight:900;color:var(--gold);line-height:1.1}
.rows{font-size:13.5px;line-height:1.8;color:var(--ink);margin:6px 0 14px}
.rows b{color:var(--acc)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acts>*{width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-align:center}
.acts>.wide{grid-column:1 / -1}
.btn{font-family:var(--f);font-weight:900;font-size:16px;min-height:48px;border-radius:12px;border:0;background:var(--acc);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0 10px;box-shadow:0 4px 0 #b3245a}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid rgba(255,255,255,.4)}
.btn.x{background:#111;box-shadow:0 4px 0 #000;font-size:14px}
.btn.danger{background:#c0392b;border-color:#c0392b;color:#fff}
.credit{font-size:11px;color:#a58fa0;margin-top:12px;letter-spacing:.05em;text-align:center}
#err{color:#ffb3b3;font-size:13px;margin-bottom:8px}

@media (max-height:600px){ .card{padding:14px 16px 12px} h1{font-size:38px} .how{font-size:12.5px;line-height:1.5;margin-bottom:8px} .big{font-size:36px} #bombBtn{width:70px;height:70px;font-size:13px} }
@media (max-width:340px){ h1{font-size:42px} }
@media (max-height:560px) and (orientation:landscape){
  .ov{padding-top:calc(env(safe-area-inset-top,0px) + 58px)}
  #titleOv .card{max-width:680px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-flow:dense;column-gap:18px;align-items:center}
  #titleOv .card>h1,#titleOv .card>.sub,#titleOv .card>.how{grid-column:1}
  #titleOv .card>.side{grid-column:2;grid-row:1 / span 3}
  .result{max-width:680px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-flow:dense;column-gap:18px;align-content:center;align-items:center}
  .result>h2,.result>.big,.result>.rows{grid-column:1}
  .result>.acts{grid-column:2;grid-row:1 / span 3}
  .rows{margin-bottom:4px}
  #pauseOv .card{max-width:600px}
  #pauseOv .acts>.wide{grid-column:auto}
}
</style>

<div id="stage">

<div id="top">
  <a class="home" id="homeLink" href="/">&lt; porkgorilla</a>
  <div id="pillBox"><div id="pill" style="visibility:hidden"><span id="dayTx">第1日</span><b id="scoreTx">0</b></div></div>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const GAME_NAME = '熟女戦記', HASHTAG = '#熟女戦記';
const GAME_URL = 'https://porkgorilla.com/works/jukujosenki.html';
const OG_CACHE_VERSION = 1, SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const K_BEST = 'jukujosenki-best', K_SND = 'jukujosenki-sound';
const stageEl = $('stage'), cv = $('cv');
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }

/* ---------- 状態 ---------- */
let mode = 'title', paused = false, T = 0;
let W = 0, H = 0, XR = 4, YR = 3.5;
let best = parseInt(lsGet(K_BEST, '0'), 10) || 0;
let soundOn = lsGet(K_SND, '1') !== '0';
const P = { x:0, y:0, tx:0, ty:0, vx:0, vy:0, inv:0, pow:1, lives:3, fireT:0, g:null };
const S = { score:0, day:1, st:0, q:[], gauge:0, kills:0, boss:null, clearT:-1, dieT:0, shots:0, shake:0, ready:false };
let enemies = [], shots = [], ebul = [], items = [], fx = [];
const inp = { keys:{}, drag:null };

/* ---------- three.js ---------- */
let renderer = null, scene = null, camera = null, ok3d = false;
const GEO = {}, MATS = {};
let ground = null, houses = [], clouds = [], ret1 = null, ret2 = null, bombRing = null;
const camP = { x:2.4, y:.6, z:-7 }, camL = { x:0, y:-1.6, z:0 };
const pools = { shot:[], ebul:[], ring:[], fx:[], item:[] };

function C(h){ return new THREE.Color(h).convertSRGBToLinear(); }
function mat(h, o){
  const k = h + (o ? JSON.stringify(o) : '');
  if (!MATS[k]) MATS[k] = new THREE.MeshPhongMaterial(Object.assign({ color:C(h), flatShading:true, shininess:6 }, o || {}));
  return MATS[k];
}
function mk(geo, m, sx, sy, sz, x, y, z, parent){
  const o = new THREE.Mesh(GEO[geo], m); o.scale.set(sx, sy, sz); o.position.set(x || 0, y || 0, z || 0);
  if (parent) parent.add(o); return o;
}
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}

function init3d(){
  renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true });
  renderer.outputEncoding = THREE.sRGBEncoding;
  scene = new THREE.Scene();
  scene.background = canvasTex(8, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#3b4f9a'); gr.addColorStop(.38, '#8f7fc0'); gr.addColorStop(.62, '#f29a7a'); gr.addColorStop(.8, '#ffd08a'); gr.addColorStop(1, '#ffe2b0');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  scene.fog = new THREE.Fog(C('#f6b98c'), 110, 300);
  camera = new THREE.PerspectiveCamera(60, 1, .1, 500);
  scene.add(new THREE.HemisphereLight(0xfff0e0, 0x8a6a8a, .95));
  const sun = new THREE.DirectionalLight(0xffd9a8, .95); sun.position.set(-6, 9, 8); scene.add(sun);

  GEO.sph = new THREE.SphereGeometry(1, 12, 9);
  GEO.box = new THREE.BoxGeometry(1, 1, 1);
  GEO.cone = new THREE.ConeGeometry(1, 1, 8);
  GEO.cyl = new THREE.CylinderGeometry(1, 1, 1, 10);
  GEO.ring = new THREE.RingGeometry(.8, 1, 28);
  GEO.tor = new THREE.TorusGeometry(1, .09, 6, 22);
  GEO.apron = new THREE.CylinderGeometry(1.02, 1.3, 1, 12, 1, true, Math.PI / 2 + .25, Math.PI - .5);

  // 地面(夕方の住宅街)
  const gt = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#7d8a6a'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#9a9488'; g.fillRect(0, 118, w, 20); g.fillRect(118, 0, 20, h);
    const cols = ['#b5533c', '#5b6f8e', '#8a7a5a', '#6e4e5e', '#c9b38a', '#4f7a6a'];
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++){
      const bx = (i < 2 ? 10 : 146) + (i % 2) * 54, by = (j < 2 ? 10 : 146) + (j % 2) * 54;
      g.fillStyle = cols[(i * 3 + j * 5) % cols.length]; g.fillRect(bx, by, 44, 44);
      g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(bx, by + 22, 44, 2);
    }
  });
  gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(12, 12);
  ground = new THREE.Mesh(new THREE.PlaneGeometry(720, 720), new THREE.MeshPhongMaterial({ map:gt, shininess:0 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(0, -20, -200); scene.add(ground);
  const hc = ['#e9dcc4', '#d8c8b8', '#c9d3d8', '#e2c9c0'], rc = ['#a8452f', '#4e607e', '#5a4a52', '#3f6a5a'];
  for (let i = 0; i < 44; i++){
    const g = new THREE.Group(), w = rand(4, 8), d = rand(4, 8), hh = rand(3, 7);
    mk('box', mat(hc[i % 4]), w, hh, d, 0, hh / 2, 0, g);
    mk('box', mat(rc[(i * 3) % 4]), w + .8, .8, d + .8, 0, hh + .3, 0, g);
    g.position.set(rand(-90, 90), -20, rand(-300, 20)); scene.add(g); houses.push(g);
  }
  const cm = new THREE.MeshPhongMaterial({ color:C('#fff1e6'), flatShading:true, shininess:0, transparent:true, opacity:.85 });
  for (let i = 0; i < 12; i++){
    const g = new THREE.Group();
    for (let k = 0; k < 4; k++) mk('sph', cm, rand(2.5, 5), rand(1, 1.8), rand(2, 3.5), rand(-4, 4), rand(-.6, .6), rand(-2, 2), g);
    const side = i % 2 ? 1 : -1;
    g.position.set(side * rand(9, 46), i % 3 ? rand(-13, -7) : rand(8, 16), rand(-300, 20)); scene.add(g); clouds.push(g);
  }
  // 照準
  const rm = new THREE.MeshBasicMaterial({ color:0xfff2a8, transparent:true, opacity:.75, side:THREE.DoubleSide, depthTest:false, fog:false });
  ret1 = new THREE.Mesh(GEO.ring, rm); ret1.scale.setScalar(1.1); scene.add(ret1);
  ret2 = new THREE.Mesh(GEO.ring, rm); ret2.scale.setScalar(1.6); scene.add(ret2);
  bombRing = new THREE.Mesh(GEO.tor, new THREE.MeshBasicMaterial({ color:0xff8fb3, transparent:true, opacity:.9, fog:false }));
  bombRing.visible = false; scene.add(bombRing);

  P.g = buildAuntie(); scene.add(P.g);
  ok3d = true;
}

/* ---------- おばちゃん ---------- */
function buildAuntie(){
  const g = new THREE.Group(), b = new THREE.Group(); g.add(b); g.userData.b = b;
  const skin = mat('#f0c7a2'), blouse = mat('#9a5fc0'), skirt = mat('#4b3f63'), white = mat('#fffaf2'), hair = mat('#4a2c44'), pink = mat('#ff7fa6');
  mk('sph', blouse, 1.08, 1.0, .98, 0, .1, 0, b);                 // 胴
  mk('sph', skirt, 1.16, .8, 1.06, 0, -.62, 0, b);                // 腰まわり
  const dots = mat('#ffd6ea');

let AC = null, master = null, bgmNext = 0, bgmStep = 0;
function initAudio(force){

  else if (AC){ if (AC.state === 'closed') AC = null; else { if (AC.state === 'suspended') AC.resume(); return; } }

}
function tone(f, d, type, vol, to, when){

  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02);

  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(master); s.start(t);
}

  else if (k === 'hit'){ if (T - lastHitS < .05) return; lastHitS = T; tone(320, .07, 'triangle', .12, 160); }
  else if (k === 'kill'){ noise(.12, .16); tone(520, .12, 'square', .07, 180); }
  else if (k === 'hurt'){ noise(.3, .3); tone(200, .35, 'sawtooth', .16, 60); }
  else if (k === 'item'){ tone(660, .08, 'square', .1); tone(990, .14, 'square', .1, 0, AC.currentTime + .08); }
  else if (k === 'bomb'){ noise(.7, .35); tone(180, .7, 'sawtooth', .2, 900); }
  else if (k === 'ready'){ tone(784, .09, 'triangle', .14); tone(1047, .16, 'triangle', .14, 0, AC.currentTime + .1); }
  else if (k === 'warn'){ for (let i = 0; i < 3; i++) tone(440, .22, 'square', .1, 330, AC.currentTime + i * .4); }
  else if (k === 'clear'){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .14, 0, AC.currentTime + i * .13)); }
  else if (k === 'boom'){ noise(.9, .4); tone(120, .9, 'sawtooth', .22, 40); }
}
const N = { A2:110, E2:82.4, F2:87.3, G2:98, A4:440, B4:493.9, C5:523.3, D5:587.3, E5:659.3, F5:698.5, G5:784, A5:880 };
const MEL = ['A4',0,'A4','B4','C5',0,'B4','A4', 'E5',0,'E5','D5','C5',0,'B4',0, 'A4',0,'C5','E5','A5',0,'G5','E5', 'F5',0,'E5','D5','E5',0,0,0];
const BAS = ['A2','E2','A2','E2', 'A2','E2','A2','E2', 'F2','F2','G2','G2', 'F2','E2','E2','E2'];
function bgm(){
  if (!AC || !soundOn || paused || mode !== 'play'){ bgmNext = 0; return; }
  const sd = S.boss ? .19 : .22;
  if (!bgmNext || bgmNext < AC.currentTime - .5) bgmNext = AC.currentTime + .06;
  let guard = 0;
  while (bgmNext < AC.currentTime + .18 && guard++ < 8){
    const i = bgmStep % 32, m = MEL[i];

  $('resRows').innerHTML = '到達　<b>第' + S.day + '日</b>　／　撃墜　<b>' + S.kills + '羽</b><br>称号　<b>「' + rank + '」</b>' + (isBest ? '<br>最高戦果を更新！' : '');
  show('result');
  setShare($('shareRes'), GAME_NAME + '：第' + S.day + '日まで戦い、' + S.kills + '羽撃墜・' + S.score.toLocaleString('en-US') + '点。称号「' + rank + '」');
}
function backToTitle(){ paused = false; $('pauseOv').hidden = true; clearWorld(); P.g.visible = true; P.x = P.y = 0; show('title'); }
function setPause(on){
  if (on && mode !== 'play') return;
  paused = on; $('pauseOv').hidden = !on;
  if (on){ $('pauseTx').textContent = '第' + S.day + '日　' + S.score.toLocaleString('en-US') + ' 点　撃墜 ' + S.kills + '羽'; setShare($('sharePause'), GAME_NAME + 'で第' + S.day + '日を交戦中(' + S.score.toLocaleString('en-US') + '点・' + S.kills + '羽撃墜)'); disarmAll(); inp.drag = null; }
  else { if (AC && AC.state === 'suspended') AC.resume(); bgmNext = 0; }
  refreshHome(); requestAnimationFrame(fitBtns);
}
const arms = [];
function twoPress(btn, label, fn){
  const a = { armed:false, timer:null, btn, label }; arms.push(a);
  a.off = () => { a.armed = false; clearTimeout(a.timer); btn.textContent = label; btn.classList.remove('danger'); fitBtns(); };
  btn.addEventListener('click', () => {
    if (!a.armed){ a.armed = true; btn.textContent = '本当に？(もう一度)'; btn.classList.add('danger'); clearTimeout(a.timer); a.timer = setTimeout(a.off, 3000); fitBtns(); return; }
    a.off(); fn();
  });
}
function disarmAll(){ arms.forEach(a => a.off()); }
function setSound(on){ soundOn = on; lsSet(K_SND, on ? '1' : '0'); $('sndBtn').classList.toggle('off', !on); if (master) master.gain.value = on ? .5 : 0; }

/* ---------- ゲーム進行 ---------- */
function hurt(){
  if (P.inv > 0 || mode !== 'play') return;
  P.lives--; P.inv = 2.2; S.shake = .45; if (P.pow > 1) P.pow--;
  const f = $('flash'); f.style.transition = 'none'; f.style.opacity = '.35'; requestAnimationFrame(() => { f.style.transition = 'opacity .5s'; f.style.opacity = '0'; });
  burst(P.x, P.y, 0, '#ffd6ea', 8, 6);
  if (P.lives <= 0){ sfx('boom'); mode = 'dying'; S.dieT = 0; $('pauseBtn').style.visibility = 'hidden'; radio('熟女01、撃墜！……いえ、買い物袋は無事とのこと'); }
  else { sfx('hurt'); radio(['熟女01、被弾！ パーマは無事か', '被弾！ エプロンに着弾を確認', 'フン直撃。洗濯が増えました'][Math.floor(rand(0, 3))]); }
}
function addGauge(v){ const was = S.gauge >= 100; S.gauge = Math.min(100, S.gauge + v); if (!was && S.gauge >= 100){ sfx('ready'); radio('井戸端ゲージ充填完了。いつでもどうぞ'); } }
function kill(e, i, byBomb){
  burst(e.x, e.y, e.z, FXC[e.type], e.type === 'boss' ? 40 : e.type === 'kite' ? 12 : 7, e.type === 'boss' ? 16 : 7);
  S.score += e.d.sc * S.day; S.kills++; if (!byBomb) addGauge(e.type === 'kite' ? 12 : 6);
  if (e.type === 'kite' || (e.type !== 'boss' && Math.random() < .07)) dropItem(e.x, e.y, e.z);
  if (e.ring) e.ring.visible = false;
  scene.remove(e.g); enemies.splice(i, 1);
  if (e.type === 'boss'){ S.boss = null; sfx('boom'); S.shake = .6; S.clearT = 0; for (const b of ebul){ b.m.visible = false; b.ring.visible = false; } ebul = []; }
  else sfx('kill');
}
function bomb(){
  if (mode !== 'play' || paused || S.gauge < 100) return;
  S.gauge = 0; sfx('bomb'); S.shake = .5;
  const sh = $('shout'); sh.classList.remove('show'); void sh.offsetWidth; sh.classList.add('show');
  bombRing.visible = true; bombRing.userData.t = 0; bombRing.position.set(P.x, P.y, -2);
  for (let i = enemies.length - 1; i >= 0; i--){ const e = enemies[i]; if (e.type === 'boss'){ e.hp -= 22; e.hit = .2; if (e.hp <= 0) kill(e, i, true); } else if (e.z > -150) kill(e, i, true); }
  for (const b of ebul){ b.m.visible = false; b.ring.visible = false; } ebul = [];
  P.inv = Math.max(P.inv, 1);
}

function tick(dt){
  T += dt;
  // 背景
  const sp = mode === 'title' ? 22 : 42;
  if (ground) ground.material.map.offset.y += sp * dt / 60;
  for (const h of houses){ h.position.z += sp * dt; if (h.position.z > 30){ h.position.z -= 330; h.position.x = rand(-90, 90); } }
  for (const c of clouds){ c.position.z += (sp + 16) * dt; if (c.position.z > 30) c.position.z -= 330; }
  if (radioT > 0){ radioT -= dt; if (radioT <= 0) $('radio').classList.remove('show'); }
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  const ud = P.g.userData;
  ud.bag.rotation.z = Math.sin(T * 5) * .15; ud.head.rotation.z = Math.sin(T * 2.3) * .05;

  if (mode === 'title' || mode === 'result'){
    if (mode === 'title'){ P.g.position.set(0, Math.sin(T * 1.6) * .25, 0); P.g.rotation.set(-.12, Math.sin(T * .7) * .25, Math.sin(T * 1.1) * .06); ud.arm.rotation.x = Math.sin(T * 6) * .12 + .3; }
    ret1.visible = ret2.visible = false; return;
  }

  if (mode === 'play'){
    // 入力
    const k = inp.keys, ks = 11 * dt;
    if (k.ArrowLeft || k.a) P.tx -= ks; if (k.ArrowRight || k.d) P.tx += ks; if (k.ArrowUp || k.w) P.ty += ks; if (k.ArrowDown || k.s) P.ty -= ks;
    P.tx = clamp(P.tx, -XR, XR); P.ty = clamp(P.ty, -YR, YR);
    const f = Math.min(1, dt * 13), nx = P.x + (P.tx - P.x) * f, ny = P.y + (P.ty - P.y) * f;
    P.vx = (nx - P.x) / Math.max(dt, .001); P.vy = (ny - P.y) / Math.max(dt, .001); P.x = nx; P.y = ny;
    if (P.inv > 0) P.inv -= dt;
    P.fireT -= dt; if (P.fireT <= 0){ P.fireT += .13; if (P.fireT < 0) P.fireT = 0; fire(); }
    // ステージ
    S.st += dt;
    while (S.q.length && S.q[0].t <= S.st) S.q.shift().f();
    if (S.clearT >= 0){
      const was = S.clearT; S.clearT += dt;
      if (was < .6 && S.clearT >= .6){ sfx('clear'); radio('第' + S.day + '日、任務完了。なお夕飯の支度が残っています'); if (P.lives < 3) P.lives++; }
      if (S.clearT >= 4.2){ S.day++; buildStage(); }
    }
    P.g.position.set(P.x, P.y + Math.sin(T * 3) * .08, 0);
    P.g.rotation.set(-.32 + clamp(P.vy * .02, -.25, .25), 0, clamp(-P.vx * .05, -.6, .6));
    ud.arm.rotation.x = Math.sin(T * 46) * .05;
    P.g.visible = P.inv <= 0 || Math.floor(T * 14) % 2 === 0;
    ret1.visible = ret2.visible = true; ret1.position.set(P.x + .33, P.y + .18, -26); ret2.position.set(P.x + .33, P.y + .18, -60);
  } else if (mode === 'dying'){
    S.dieT += dt; P.y -= (2 + S.dieT * 9) * dt; P.g.visible = true;
    P.g.position.set(P.x, P.y, 0); P.g.rotation.z += dt * 9; P.g.rotation.x += dt * 3; ret1.visible = ret2.visible = false;
    if (S.dieT > 1.9){ finish(); return; }
  }

  // 敵
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i]; e.t += dt; e.pz = e.z;
    if (e.type === 'crow'){
      e.z += e.vz * dt;
      if (e.aim && e.z < -18 && e.z > -110){ e.bx += clamp(P.x - e.bx, -3.2 * dt, 3.2 * dt); e.by += clamp(P.y - e.by, -3.2 * dt, 3.2 * dt); }
      e.x = e.bx + Math.sin(e.t * 2 + e.ph) * e.amp; e.y = e.by + Math.cos(e.t * 1.7 + e.ph) * e.amp * .5;
    } else if (e.type === 'pigeon'){
      e.z += e.vz * dt; e.x = e.bx + Math.sin(e.t * 1.5 + e.ph) * .35; e.y = e.by;
      if (!e.s1 && e.z > -88){ e.s1 = 1; if (mode === 'play') eShoot(e, P.x, P.y); }
      if (!e.s2 && e.z > -50){ e.s2 = 1; if (mode === 'play') eShoot(e, P.x, P.y); }
      if (!e.s3 && e.z > -30){ e.s3 = 1; if (mode === 'play' && S.day >= 2) eShoot(e, P.x, P.y); }
    } else if (e.type === 'kite'){
      if (!e.lock){
        e.z += e.vz * dt; const u = clamp((e.z + 125) / 65, 0, 1);
        e.x += (e.bx - e.x) * Math.min(1, dt * 2.2); e.y += (e.by - e.y) * Math.min(1, dt * 2.2);
        if (e.z >= -60){ e.lock = 1; e.tx = P.x; e.ty = P.y; const d = Math.hypot(e.tx - e.x, e.ty - e.y, e.z) || 1, v = 44 + S.day * 2; e.vx = (e.tx - e.x) / d * v; e.vy = (e.ty - e.y) / d * v; e.vzz = -e.z / d * v; e.ring = pget('ring', mkRing); e.ring.position.set(e.tx, e.ty, 0); e.ring.scale.setScalar(2.2); e.ring.material.opacity = .25; }
      } else { e.x += e.vx * dt; e.y += e.vy * dt; e.z += e.vzz * dt; if (e.ring){ const u = clamp(1 + e.z / 60, 0, 1); e.ring.scale.setScalar(2.6 - u * .9); e.ring.material.opacity = .25 + u * .6; if (e.z > 1){ e.ring.visible = false; e.ring = null; } } }
      e.g.rotation.z = e.lock ? clamp(-e.vx * .03, -.6, .6) : 0;
    } else if (e.type === 'boss'){
      if (e.z < -44) e.z += e.vz * dt;
      else {
        e.x = Math.sin(e.t * .7) * XR * .75; e.y = Math.sin(e.t * 1.13) * YR * .5 + .6;
        if (mode === 'play'){
          e.atk -= dt; e.sum -= dt;
          if (e.atk <= 0){ e.atk = Math.max(.8, 1.75 - S.day * .17); e.n++;
            const off = e.n % 3 === 0 ? [[0, 0], [-2.4, 0], [2.4, 0], [0, 2.2], [0, -2.2]] : e.n % 2 ? [[0, 0], [-2.2, .6], [2.2, -.6]] : [[0, 0], [1.6, 1.8], [-1.6, -1.8]];
            for (const [ox, oy] of off) eShoot(e, clamp(P.x + ox, -XR, XR), clamp(P.y + oy, -YR, YR), true); }
          if (e.sum <= 0){ e.sum = 6.5; spawn('crow', clamp(e.x - 2, -XR, XR), ry(), { z:-60, aim:true }); spawn('crow', clamp(e.x + 2, -XR, XR), ry(), { z:-66, aim:true }); }
        }
      }
    }
    const fl = Math.sin(e.t * e.d.flap + e.ph) * .75; e.wl.rotation.z = fl; e.wr.rotation.z = -fl;
    if (e.hit > 0) e.hit -= dt; e.g.scale.setScalar(e.d.s * (e.hit > 0 ? 1.14 : 1));
    e.g.position.set(e.x, e.y, e.z);
    if (mode === 'play' && e.type !== 'boss' && e.pz < 1 && e.z > -1.2 && Math.hypot(e.x - P.x, e.y - P.y) < e.r * .55 + .5){
      if (P.inv <= 0){ hurt(); burst(e.x, e.y, e.z, FXC[e.type], 6, 6); if (e.ring) e.ring.visible = false; scene.remove(e.g); enemies.splice(i, 1); continue; }
    }
    if (e.z > 14){ if (e.ring) e.ring.visible = false; scene.remove(e.g); enemies.splice(i, 1); }
  }
  // 自弾
  for (let i = shots.length - 1; i >= 0; i--){
    const b = shots[i]; b.pz = b.z; b.z -= 115 * dt; b.x += b.vx * dt; let dead = b.z < -150;
    if (!dead) for (let j = enemies.length - 1; j >= 0; j--){
      const e = enemies[j];
      if (Math.min(e.pz, e.z) - e.r <= b.pz && Math.max(e.pz, e.z) + e.r >= b.z && Math.hypot(b.x - e.x, b.y - e.y) < e.r + .25){
        e.hp--; e.hit = .08; dead = true; S.score += 10;
        if (e.type === 'boss') addGauge(.2);
        if (e.hp <= 0) kill(e, j); else sfx('hit');
        break;
      }
    }
    if (dead){ b.m.visible = false; shots.splice(i, 1); } else b.m.position.set(b.x, b.y, b.z);
  }
  // 敵弾
  for (let i = ebul.length - 1; i >= 0; i--){
    const b = ebul[i]; b.pz = b.z; b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    b.m.position.set(b.x, b.y, b.z); b.m.rotation.x += dt * 5;
    const u = clamp(1 - b.z / b.z0, 0, 1);    // 0→1 で着弾
    b.ring.material.opacity = u < .45 ? 0 : .2 + (u - .45) / .55 * .7; b.ring.scale.setScalar((2.4 - u * 1.5) * (b.r > .4 ? 1.25 : 1));
    let dead = b.z > 9;
    if (!dead && mode === 'play' && b.pz < .4 && b.z >= -.4 && Math.hypot(b.x - P.x, b.y - P.y) < b.r + .5){ if (P.inv <= 0){ hurt(); dead = true; } }
    if (b.z > .5) b.ring.visible = false;
    if (dead){ b.m.visible = false; b.ring.visible = false; ebul.splice(i, 1); }
  }
  // ネギ
  for (let i = items.length - 1; i >= 0; i--){
    const b = items[i]; b.pz = b.z; b.z += 20 * dt;
    if (b.z > -30){ b.x += clamp(P.x - b.x, -5 * dt, 5 * dt); b.y += clamp(P.y - b.y, -5 * dt, 5 * dt); }
    b.m.position.set(b.x, b.y, b.z); b.m.rotation.z += dt * 3; b.m.rotation.y += dt * 2;
    let dead = b.z > 10;
    if (!dead && mode === 'play' && b.pz < 1 && b.z > -1 && Math.hypot(b.x - P.x, b.y - P.y) < 1.9){
      dead = true; sfx('item'); if (P.pow < 3){ P.pow++; radio('ネギを確保。火力が上がります'); } else { S.score += 500 * S.day; }
    }
    if (dead){ b.m.visible = false; items.splice(i, 1); }
  }
  // 羽
  for (let i = fx.length - 1; i >= 0; i--){
    const p = fx[i]; p.life -= dt; p.vy -= 9 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.m.position.set(p.x, p.y, p.z); p.m.rotation.x += p.rs * dt; p.m.rotation.z += p.rs * .7 * dt;
    if (p.life <= 0){ p.m.visible = false; fx.splice(i, 1); }
  }
  if (bombRing.visible){ const t = (bombRing.userData.t += dt); bombRing.scale.setScalar(1 + t * 60); bombRing.position.z = -2 - t * 60; bombRing.material.opacity = Math.max(0, .9 - t * 1.1); if (t > .85) bombRing.visible = false; }
  hud();
}

function render(){
  let px, py, pz, lx, ly, lz;
  if (mode === 'title'){
    const port = H > W; px = 2.6 + Math.sin(T * .3) * .8; py = .5; pz = port ? -8.2 : -6.4; lx = port ? 0 : 1.6; ly = port ? -2.6 : -.9; lz = 0;
  } else { px = P.x * .5; py = P.y * .5 + 1.5; pz = 10; lx = P.x * .62; ly = P.y * .62 + .2; lz = -30; }
  const k = mode === 'title' ? .04 : .16;
  camP.x += (px - camP.x) * k; camP.y += (py - camP.y) * k; camP.z += (pz - camP.z) * k;
  camL.x += (lx - camL.x) * k; camL.y += (ly - camL.y) * k; camL.z += (lz - camL.z) * k;
  if (!isFinite(camP.x + camP.y + camP.z + camL.x + camL.y + camL.z)){ camP.x = px; camP.y = py; camP.z = pz; camL.x = lx; camL.y = ly; camL.z = lz; }
  const sh = S.shake > 0 ? S.shake * .5 : 0;
  camera.position.set(camP.x + rand(-sh, sh), camP.y + rand(-sh, sh), camP.z);
  camera.lookAt(camL.x, camL.y, camL.z);
  renderer.render(scene, camera);
}

function resize(){
  const w = stageEl.clientWidth || 0, h = stageEl.clientHeight || 0;
  if (w < 1 || h < 1 || !ok3d) return;
  W = w; H = h;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.fov = H > W ? 72 : 60; camera.updateProjectionMatrix();
  const hh = Math.tan(camera.fov * Math.PI / 360) * 10, hw = hh * camera.aspect;
  XR = clamp(hw * 1.45, 2.6, 6.5); YR = Math.min(4.2, hh * .72);
  fitHUD(); fitBtns();
}

let last = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;
  if (!ok3d) return;
  if (W < 1 || H < 1 || stageEl.clientWidth !== W || stageEl.clientHeight !== H){ resize(); if (W < 1 || H < 1) return; }
  try { if (!paused) tick(dt); bgm(); render(); } catch (e) { console.error(e); }
}

/* ---------- 入力 ---------- */
function mouseTarget(e){
  const r = cv.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
  P.tx = clamp(((e.clientX - r.left) / r.width * 2 - 1) * XR * 1.1, -XR, XR);
  P.ty = clamp(-((e.clientY - r.top) / r.height * 2 - 1) * YR * 1.25, -YR, YR);
}
cv.addEventListener('pointerdown', e => {
  if (mode !== 'play' || paused) return;
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  if (e.pointerType === 'mouse') mouseTarget(e); else inp.drag = { id:e.pointerId, x:e.clientX, y:e.clientY };
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (mode !== 'play' || paused) return;
  if (e.pointerType === 'mouse'){ mouseTarget(e); return; }
  const d = inp.drag; if (!d || d.id !== e.pointerId) return;
  const s = (XR * 2) / Math.max(1, Math.min(W, 520) * .62);
  P.tx = clamp(P.tx + (e.clientX - d.x) * s, -XR, XR); P.ty = clamp(P.ty - (e.clientY - d.y) * s, -YR, YR);
  d.x = e.clientX; d.y = e.clientY;
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => cv.addEventListener(ev, e => { if (inp.drag && inp.drag.id === e.pointerId) inp.drag = null; }));
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.isContentEditable || t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && !['checkbox', 'radio', 'button', 'range'].includes(t.type)))) return;
  inp.keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
  if (e.repeat) return;
  if (e.key === ' '){ if (mode === 'play' && !paused){ bomb(); e.preventDefault(); } }
  else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ if (mode === 'play') setPause(!paused); }
  if (e.key.startsWith('Arrow') && mode === 'play') e.preventDefault();
});
document.addEventListener('keyup', e => { inp.keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
window.addEventListener('blur', () => { inp.keys = {}; });
document.addEventListener('visibilitychange', () => { if (document.hidden){ if (mode === 'play' && !paused) setPause(true); } else initAudio(); });
window.addEventListener('resize', resize);

$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('titleBtn').addEventListener('click', backToTitle);
$('pauseBtn').addEventListener('click', () => setPause(true));
$('resumeBtn').addEventListener('click', () => { initAudio(); setPause(false); });
$('bombBtn').addEventListener('click', bomb);
$('sndBtn').addEventListener('click', () => { setSound(!soundOn); if (soundOn) initAudio(); });
twoPress($('quitBtn'), 'タイトルへ', backToTitle);
twoPress($('siteBtn'), 'サイトのトップへ', () => { location.href = '/'; });

/* ---------- 起動 ---------- */
setSound(soundOn);
try { if (!window.THREE) throw new Error('three'); init3d(); } catch (e) { console.error(e); ok3d = false; $('err').hidden = false; $('startBtn').disabled = true; }
show('title'); resize();
window.addEventListener('load', () => requestAnimationFrame(() => { resize(); fitBtns(); }));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(() => { fitHUD(); fitBtns(); }));
requestAnimationFrame(loop);
</script>
