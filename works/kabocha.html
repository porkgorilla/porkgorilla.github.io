<style>
[hidden]{display:none!important}
/* 全画面の夜の作業台。下に道具の棚、右に手元のスイッチ。単一のダークな世界観で固定 */
:root{
  --night:#0d0b13;
  --panel:rgba(22,18,28,.9);
  --line:rgba(255,214,170,.14);
  --ink:#f4e9d8;
  --sub:#a99c8c;
  --pump:#f08a24;
  --pump-deep:#b85a14;
  --flame:#ffd36a;
  --f-disp:"Potta One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--flame);outline-offset:2px}

/* 上部バー(どの画面でも前面) */
.top{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;pointer-events:none}
.top > *{pointer-events:auto}
.home{color:var(--sub);text-decoration:none;font-size:12px;letter-spacing:.04em;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
.home:hover{color:var(--ink)}
.brand{font-family:var(--f-disp);font-size:15px;color:var(--pump);letter-spacing:.06em;opacity:.9;pointer-events:none}
.snd{min-width:44px;min-height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:rgba(20,16,26,.6);font-size:12px;color:var(--sub)}
.snd[aria-pressed="true"]{color:var(--ink)}

/* 右の手元スイッチ */
.side{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:12;display:flex;flex-direction:column;gap:10px}
.sbtn{width:56px;min-height:56px;border-radius:16px;border:1px solid var(--line);background:rgba(20,16,26,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--sub);padding:6px 2px}
.sbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sbtn[aria-pressed="true"]{color:var(--night);background:var(--flame);border-color:var(--flame)}
.sbtn.danger{color:#fff;background:#b8322a;border-color:#b8322a}

/* ヒント */
.hint{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:11;max-width:min(320px,calc(100% - 100px));
  padding:8px 14px;border-radius:12px;background:rgba(20,16,26,.78);border:1px solid var(--line);font-size:12px;line-height:1.6;color:var(--ink);text-align:center;
  transition:opacity .5s;pointer-events:none}
.hint.fade{opacity:0}

/* 下のパネル共通 */
.panel{position:absolute;left:0;right:0;bottom:0;margin-inline:auto;max-width:640px;z-index:10;background:var(--panel);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:10px}
.toolrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.toolrow::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;min-width:58px;height:58px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--sub)}
.tool svg{width:24px;height:24px}
.tool[aria-pressed="true"]{border-color:var(--pump);color:var(--ink);background:rgba(240,138,36,.16)}
.ctrlrow{display:flex;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-width:44px;min-height:44px;background:transparent;border:none;color:var(--sub);font-weight:700;font-size:14px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--pump);color:var(--night)}
.seglabel{font-size:11px;color:var(--sub);letter-spacing:.06em}
.icon{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon:disabled{opacity:.35;cursor:default}
.spacer{flex:1}
.btn{min-height:46px;padding:0 20px;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:15px;letter-spacing:.04em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--pump);color:var(--night);box-shadow:0 0 0 1px rgba(255,211,106,.25),0 6px 20px rgba(240,138,36,.35)}
.btn.primary:hover{background:#ff9a35}
.btn.ghost{background:transparent;color:var(--pump);border-color:rgba(240,138,36,.55)}
.btn.ghost:hover{background:rgba(240,138,36,.12)}
.btn.soft{background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--line);font-size:13px;padding:0 14px}
.btn.soft[aria-pressed="true"]{background:rgba(255,211,106,.16);border-color:rgba(255,211,106,.6);color:var(--flame)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* 完成パネル */
.donehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}

.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1 1 auto}

/* タイトル */
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top,0px) + 60px) 16px 0;
  background:linear-gradient(to top,rgba(8,6,12,.85),rgba(8,6,12,.1) 55%,rgba(8,6,12,0))}
.card{width:100%;max-width:460px;margin-top:auto;flex-shrink:0;margin-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--panel);border:1px solid var(--line);
  border-radius:22px;padding:22px 20px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h1{margin:0 0 6px;font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:1.15;color:var(--pump);
  text-shadow:0 0 24px rgba(240,138,36,.45);letter-spacing:.04em;text-wrap:balance}
.lead{margin:0 0 14px;font-size:14px;line-height:1.75;color:var(--ink)}
.howto{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:6px;font-size:13px;color:var(--sub);line-height:1.6}
.howto b{color:var(--flame);font-weight:700;margin-right:6px;letter-spacing:.06em}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.actions .btn{flex:1 1 140px}
.credit{font-size:11px;color:#7e7363;margin-top:16px;letter-spacing:.05em}

/* 画像保存 */
.ov.center .card{margin-bottom:auto}
.ov.center{background:rgba(6,5,9,.72);padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
.save h2{margin:0 0 12px;font-family:var(--f-disp);font-weight:400;font-size:22px;color:var(--flame)}
.save img{display:block;width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:#000;margin-bottom:10px;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.note{font-size:12px;color:var(--sub);margin:0 0 12px;line-height:1.6}

@media (min-width:900px){
  .panel{bottom:16px;border-radius:20px;border-bottom:1px solid var(--line);padding-bottom:12px}
}
@media (max-height:600px){
  .card{padding:14px 16px 12px}
  .card h1{font-size:30px;margin-bottom:2px}
  .lead{font-size:13px;margin-bottom:8px;line-height:1.6}
  .howto{gap:2px;margin-bottom:10px;font-size:12px}
  .credit{margin-top:8px}
  .card .btn{min-height:44px}
}
@media (prefers-reduced-motion:reduce){ .hint{transition:none} }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const GAME_URL = 'https://porkgorilla.com/works/kabocha.html';
const OG_CACHE_VERSION = 1;
const SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const HASHTAG = '#かぼちゃ彫刻室';
function shareHref(text){
  return 'https://x.com/intent/post?text=' + encodeURIComponent(text + ' ' + HASHTAG) + '&url=' + encodeURIComponent(SHARE_URL);
}
function setShare(el, text){
  el.href = shareHref(text);
  if (matchMedia('(pointer: coarse)').matches){ el.removeAttribute('target'); el.removeAttribute('rel'); }
}
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
const coarse = matchMedia('(pointer: coarse)').matches;

/* ========== 彫りデータ(R=残っている皮 / G=切り口の縁) ========== */
const W = 2048, H = 1024, RIM = 0.024;
const carveCv = document.createElement('canvas');
carveCv.width = W; carveCv.height = H;
const cx = carveCv.getContext('2d');
cx.lineCap = 'round'; cx.lineJoin = 'round';
let ops = [];

function scaleAt(y){
  const th = clamp(y / H * Math.PI, 0.05, Math.PI - 0.05);
  const s = Math.max(Math.sin(th), 0.12);
  const L = Math.sqrt(Math.cos(th) ** 2 + 0.64 * Math.sin(th) ** 2);
  return [W / (2 * Math.PI * s), H / (Math.PI * L)];
}
function setPass(pass){
  if (pass === 'rim'){ cx.globalCompositeOperation = 'lighter'; cx.strokeStyle = cx.fillStyle = 'rgb(0,255,0)'; }
  else { cx.globalCompositeOperation = 'source-over'; cx.strokeStyle = cx.fillStyle = '#000'; }
}
function resetCarve(){
  cx.setTransform(1,0,0,1,0,0);
  cx.globalCompositeOperation = 'source-over';
  cx.fillStyle = '#f00'; cx.fillRect(0, 0, W, H);
}
function seg(d, a, b, pass){
  const x1 = ((a[0] % W) + W) % W, y1 = a[1];
  let dx = b[0] - a[0]; dx -= W * Math.round(dx / W);
  const dy = b[1] - y1, my = y1 + dy / 2;
  const [sx, sy] = scaleAt(my);
  let lx = dx / 2 / sx, ly = dy / 2 / sy;
  if (Math.abs(lx) + Math.abs(ly) < 1e-5) lx = 1e-4;
  const lw = pass === 'rim' ? d + RIM * 2 : d;
  cx.lineWidth = lw;
  const ext = Math.abs(dx) / 2 + lw * sx;
  for (const off of [-W, 0, W]){
    const mx = x1 + dx / 2 + off;
    if (mx + ext < 0 || mx - ext > W) continue;
    cx.setTransform(sx, 0, 0, sy, mx, my);
    cx.beginPath(); cx.moveTo(-lx, -ly); cx.lineTo(lx, ly); cx.stroke();
  }
}
function shapePath(sh, s){
  cx.beginPath();
  if (sh === 'tri'){
    cx.moveTo(0, -0.42*s); cx.lineTo(0.48*s, 0.38*s); cx.lineTo(-0.48*s, 0.38*s); cx.closePath();
  } else if (sh === 'nose'){
    cx.moveTo(-0.45*s, -0.35*s); cx.lineTo(0.45*s, -0.35*s); cx.lineTo(0, 0.42*s); cx.closePath();
  } else if (sh === 'circle'){
    cx.arc(0, 0, 0.42*s, 0, Math.PI*2);
  } else if (sh === 'star'){
    for (let i = 0; i < 10; i++){
      const r = (i % 2 ? 0.21 : 0.5) * s, a = -Math.PI/2 + i * Math.PI / 5;
      i ? cx.lineTo(Math.cos(a)*r, Math.sin(a)*r) : cx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    cx.closePath();
  } else if (sh === 'moon'){
    const R1 = 0.45*s, R2 = 0.4*s, d = 0.22*s, al = -Math.PI/4;
    const x0 = (d*d + R1*R1 - R2*R2) / (2*d), h = Math.sqrt(Math.max(R1*R1 - x0*x0, 0));
    const a = Math.atan2(h, x0), b = Math.atan2(h, x0 - d);
    const ca = Math.cos(al), sa = Math.sin(al);
    // 回転した座標系で描く
    const save = cx.getTransform();
    cx.transform(ca, sa, -sa, ca, 0, 0);
    cx.arc(0, 0, R1, a, Math.PI*2 - a, false);
    cx.arc(d, 0, R2, -b, b, true);
    cx.closePath();
    cx.setTransform(save);
  } else if (sh === 'mouth'){
    const w = s, n = 8;
    for (let i = 0; i <= n; i++){
      const x = -w/2 + w*i/n, t = 2*x/w;
      let y = -0.13*s + 0.12*s*(1 - t*t);
      if (i % 2) y += 0.1*s*(1 - 0.4*t*t);
      i ? cx.lineTo(x, y) : cx.moveTo(x, y);
    }
    for (let i = n; i >= 0; i--){

  if (AC && force){ try{ AC.close().catch(() => {}); }catch(e){} AC = null; }

  try{

    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    carveBP = AC.createBiquadFilter(); carveBP.type = 'bandpass'; carveBP.frequency.value = 2000; carveBP.Q.value = 1.4;
    carveGain = AC.createGain(); carveGain.gain.value = 0;

const BPM = 118, BPS = BPM / 60, STEP = 60 / BPM / 2;
const mf = m => 440 * Math.pow(2, (m - 69) / 12);

const BASS = [0, 0, 12, 0, 7, 0, 12, 10];
const LEAD = [69, null, 72, null, 76, null, 75, 76,  77, null, 76, null, 72, null, 69, null,

function startMusic(){
  if (!AC) return;

}
function stopMusic(){ musicOn = false; }
function bassNote(t, f){
  const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(220, t + 0.2); lp.Q.value = 6;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
  o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
}
function organ(t, f, dur){
  for (const [mul, v] of [[1, 0.05], [2, 0.025], [3, 0.012]]){
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f * mul;
    const lfo = AC.createOscillator(); lfo.frequency.value = 5.5; const lg = AC.createGain(); lg.gain.value = f * mul * 0.006;
    lfo.connect(lg); lg.connect(o.frequency);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.03); g.gain.setValueAtTime(v, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);

}
function playStep(i, t){
  const inBar = i % 8, bar = Math.floor(i / 8) % 4;
  if (inBar % 2 === 0) tone(t, 140, 0.26, 0.85, 'sine', 42);
  else noiseHit(t, 0.05, 'highpass', 8000, 6500, 0.13, 0.7);
  if (inBar === 2 || inBar === 6){ noiseHit(t, 0.16, 'bandpass', 1900, 1100, 0.42, 0.9); tone(t, 190, 0.1, 0.12, 'triangle', 150); }
  bassNote(t, mf(ROOTS[bar] + BASS[inBar]));

  if (n != null){ let len = 1; while (LEAD[(i + len) % 32] === null && len < 4) len++; organ(t, mf(n), STEP * len * 0.95); }
}

}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(x, y){
  const r = canvas.getBoundingClientRect();
  ndc.set((x - r.left) / r.width * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  group.updateMatrixWorld();

  if (!h || !h.uv) return null;
  const th = (1 - h.uv.y) * Math.PI;
  return { px: h.uv.x * W, py: (1 - h.uv.y) * H, ok: th > 0.42 && th < Math.PI - 0.45 };
}
function texDist(a, b){
  let dx = b[0] - a[0]; dx -= W * Math.round(dx / W);
  const [sx, sy] = scaleAt((a[1] + b[1]) / 2);
  return Math.hypot(dx / sx, (b[1] - a[1]) / sy);

}

  for (let i = 1; i <= n; i++){
    const hit = pick(drag.lx + dx * i / n, drag.ly + dy * i / n);
    const last = op.p[op.p.length - 1];
    if (hit && hit.ok){
      const q = [r1(hit.px), r1(hit.py)];
      if (last){

        if (td < 0.3){ drawSegNow(op.d, last, q); op.p.push(q); continue; }
        op.p.push(null);
      }
      drawSegNow(op.d, q, q); op.p.push(q);
    } else if (last){ op.p.push(null); }
  }

  drag.lx = x; drag.ly = y;
}

}

    }
    const [a, b] = [...pts.values()];
    drag = { kind: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: zoom, mx: (a.x + b.x) / 2 };
    return;
  }
  if (pts.size > 2) return;
  const x = e.clientX, y = e.clientY;
  velY = 0;
  if (state === 'carve' && !rotateLock){
    const hit = pick(x, y);
    if (hit && hit.ok){
      if (tool === 'knife'){ startStroke(hit, x, y); return; }
      drag = { kind: 'stamp', sx: x, sy: y, hit }; return;
    }
  }
  drag = { kind: 'rotate', lx: x, ly: y };
});
canvas.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (!drag) return;
  const x = e.clientX, y = e.clientY;
  if (drag.kind === 'pinch'){
    if (pts.size < 2) return;
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2;
    zoom = clamp(drag.z0 * drag.d0 / d, 0.6, 1.8);
    yaw += (mx - drag.mx) * 0.007; drag.mx = mx;
    return;
  }
  if (drag.kind === 'stamp'){
    if (Math.hypot(x - drag.sx, y - drag.sy) < 10) return;
    drag = { kind: 'rotate', lx: x, ly: y };
  }
  if (drag.kind === 'rotate'){
    const dx = x - drag.lx, dy = y - drag.ly;
    yaw += dx * 0.008; velY = dx * 0.008;
    pitch = clamp(pitch + dy * 0.005, -0.15, 1.0);
    drag.lx = x; drag.ly = y;
  } else if (drag.kind === 'carve'){
    extendStroke(x, y);
  }
});
function endPointer(e, cancel){
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (!drag) return;
  if (drag.kind === 'stamp' && !cancel){
    const h = drag.hit;
    ops.push({ t: 's', sh: tool, x: r1(h.px), y: r1(h.py), s: STAMP_S[size] * (SHAPE_MUL[tool] || 1) });
    drawOp(ops[ops.length - 1]); carveTex.needsUpdate = true;
    saveWork(); refreshUI(); sfx.stamp(); $('hint').classList.add('fade');
    drag = null; return;
  }
  if (drag.kind === 'carve'){ endStroke(); drag = null; return; }
  if (drag.kind === 'pinch'){
    if (pts.size === 1){ const [q] = [...pts.values()]; drag = { kind: 'rotate', lx: q.x, ly: q.y }; }
    else if (!pts.size) drag = null;
    return;
  }
  if (!pts.size) drag = null;
}
canvas.addEventListener('pointerup', e => endPointer(e, false));
canvas.addEventListener('pointercancel', e => endPointer(e, true));
canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = clamp(zoom * (1 + e.deltaY * 0.0012), 0.6, 1.8); }, { passive: false });

/* ========== ループ ========== */
let lit = 1, last = performance.now(), T = 0;
function loop(now){
  requestAnimationFrame(loop);
  if ((innerWidth || 0) < 1 || (innerHeight || 0) < 1){ last = now; return; }
  try { frame(now); } catch (e) { console.error(e); }
}
function frame(now){
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; T += dt;
  if (!drag || drag.kind !== 'rotate'){ yaw += velY; velY *= 0.92; if (Math.abs(velY) < 1e-4) velY = 0; }
  if (state === 'title' || (state === 'done' && autoRot)) yaw += dt * (danceOn ? 0.3 : 0.45);
  if (danceOn){
    if (dropT < 1){
      dropT = Math.min(1, dropT + dt / 0.9);
      group.position.y = 6 * (1 - easeBounce(dropT));
      if (!landed && dropT > 0.36){ landed = true; sfx.plop(); }
      if (dropT >= 1){ beat = -1.5; startMusic(); }
    }
    group.rotation.set(0, faceYaw, 0);
    if (dropT >= 1){
      if (musicOn && AC) beat = (AC.currentTime - musicStart) * BPS - 1.5;
      else beat += dt * BPS;
    }
    const spin = applyPose(danceAt(beat));
    dancer.rotation.y = yaw + spin;
    scheduleMusic();
  } else group.rotation.y = yaw;
  danceBlend += ((danceOn ? 1 : 0) - danceBlend) * Math.min(1, dt * 3.5);
  R_FIT = lerp(1.3, 1.5, danceBlend);
  TARGET.y = lerp(0.02, 0.6, danceBlend);

  const litTarget = state === 'title' ? 1 : state === 'carve' ? (previewLit ? 1 : 0) : (doneLit ? 1 : 0);
  lit += (litTarget - lit) * Math.min(1, dt * 3);
  const fl = 0.9 + 0.06 * Math.sin(T * 13.1) + 0.05 * Math.sin(T * 7.3 + 1.3) + 0.03 * Math.sin(T * 23.7);

  U.glowAmt.value = lit * 2.3 * fl;
  innerMat.color.setScalar(0.3 + lit * 1.3 * fl);
  waxMat.color.copy(waxBase).multiplyScalar(0.25 + lit * 1.1 * fl);
  hemi.intensity = 0.8 - 0.7 * lit;
  key.intensity = 1.5 - 1.44 * lit;
  rimL.intensity = 0.5 - 0.15 * lit;
  flame.material.opacity = lit;
  flame.scale.set(0.15 * fl, 0.26 * (0.85 + (fl - 0.9) * 2), 1);
  glowDecal.material.opacity = lit * 0.75 * fl * (1 - 0.6 * danceBlend);
  headLight.intensity = lit * danceBlend * 1.8 * fl;
  const pulse = danceOn && beat >= 0 ? 0.85 + 0.15 * Math.cos((beat % 1) * Math.PI * 2) : 1;
  stageKey.intensity = danceBlend * (0.75 - 0.3 * lit) * pulse;
  stageRim.intensity = danceBlend * 1.1;
  stageRim2.intensity = danceBlend * 0.7;
  spotDecal.material.opacity = danceBlend * 0.5 * pulse;
  shadow.scale.setScalar(1 - 0.35 * danceBlend);

  // 彫っていないときはループ音を必ずフェードアウト
  if (carveGain && AC){
    const carving = drag && drag.kind === 'carve';
    carveLevel = carving ? carveLevel * 0.9 : 0;
    carveGain.gain.setTargetAtTime(soundOn ? carveLevel * 0.55 : 0, AC.currentTime, 0.04);
    carveBP.frequency.setTargetAtTime(1500 + carveLevel * 2600, AC.currentTime, 0.06);
  }

  baseDist = fitDist(innerWidth, innerHeight, insetTop, insetBottom);
  placeCamera(baseDist * zoom);
  renderer.render(scene, camera);
}

toTitle();
requestAnimationFrame(loop);
})();
</script>
