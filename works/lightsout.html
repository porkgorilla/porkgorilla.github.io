<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIGHTS_OUT | porkgorilla://</title>
  <meta name="description" content="定番のライツアウト。押したマスと上下左右のライトが反転する。全部消せたらクリア。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBT4300J0L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MBT4300J0L');
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    main { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 16px;
      user-select: none; -webkit-user-select: none; text-align: center; }
    h1 { margin: 0; font-size: 1.6rem; }
    #info { display: flex; gap: 18px; font-size: 1.05rem; flex-wrap: wrap; justify-content: center; }
    #board { display: grid; gap: 6px; width: min(90vw, 380px); aspect-ratio: 1; padding: 8px;
      border: 2px solid var(--cyber-green); background: var(--cyber-bg-panel); box-shadow: 0 0 12px rgba(57, 255, 106, .25); }
    .light { border: 1px solid var(--cyber-green-dim); background: var(--cyber-bg); cursor: pointer; padding: 0;
      transition: background .12s, box-shadow .12s; }
    .light.on { background: var(--cyber-green); border-color: var(--cyber-green); box-shadow: 0 0 12px var(--cyber-green); }
    .light.hint { outline: 2px dashed #fff; outline-offset: -6px; }
    #msg { min-height: 1.5em; color: var(--cyber-green); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .row .btn { padding: .6rem 1.1rem; font-size: .9rem; }
    .rule { font-size: .85rem; color: var(--cyber-green-dim); max-width: 380px; line-height: 1.7; }
    .credit { font-size: 11px; color: var(--cyber-green-dim); margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>💡 LIGHTS_OUT</h1>
    <div id="info"><span>LEVEL <b id="lv">1</b></span><span>手数 <b id="moves">0</b></span><span>最少 <b id="par">-</b></span></div>
    <div id="board"></div>
    <div id="msg"></div>
    <div class="row">
      <button class="btn" id="reset" type="button">↺ やり直す</button>
      <button class="btn" id="hint" type="button">ヒント</button>
      <button class="btn" id="next" type="button">次の問題 ▶</button>
    </div>
    <p class="rule">押したマスと、その上下左右のライトが反転します。すべてのライトを消せばクリア。レベルが上がると盤面が広がります。</p>
    <div class="credit">porkgorilla — 2026</div>
  </main>

  <script src="/site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const STORE = 'lightsout_level';
    let level = 1;
    try { level = Math.max(1, parseInt(localStorage.getItem(STORE) || '1', 10) || 1); } catch (e) {}

    let n, lights, initial, moves, cleared, solution;

    // レベル1〜3は4x4、4〜7は5x5、8以降は6x6。押す数がレベルとともに増える
    const sizeFor = lv => lv <= 3 ? 4 : lv <= 7 ? 5 : 6;
    const pressesFor = lv => Math.min(3 + lv, sizeFor(lv) * sizeFor(lv) - 4);

    function toggle(arr, i) {
      const r = Math.floor(i / n), c = i % n;
      [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < n && cc >= 0 && cc < n) arr[rr * n + cc] ^= 1;
      });
    }

    // GF(2) 上で連立方程式を解き、手数が最少の押し方を返す(解なしなら null)
    function solve(state) {
      const N = n * n;
      const rows = [];
      for (let i = 0; i < N; i++) {
        const row = new Array(N + 1).fill(0);
        const t = new Array(N).fill(0);
        toggle(t, i);
        for (let j = 0; j < N; j++) row[j] = t[j];
        rows.push(row);
      }
      // 列 j がマス j を押すこと、行 i がマス i の状態。行列は対称なので転置不要
      rows.forEach((row, i) => { row[N] = state[i]; });
      const pivotCol = [];
      let r = 0;
      for (let c = 0; c < N && r < N; c++) {
        let p = r;
        while (p < N && !rows[p][c]) p++;
        if (p === N) continue;
        [rows[r], rows[p]] = [rows[p], rows[r]];
        for (let k = 0; k < N; k++) if (k !== r && rows[k][c]) for (let j = c; j <= N; j++) rows[k][j] ^= rows[r][j];
        pivotCol.push(c);
        r++;
      }
      for (let k = r; k < N; k++) if (rows[k][N]) return null;
      const free = [...Array(N).keys()].filter(c => !pivotCol.includes(c));
      let best = null;
      // 自由変数(5x5 なら2個)を総当たりして最少手を選ぶ
      for (let mask = 0; mask < (1 << free.length); mask++) {
        const x = new Array(N).fill(0);
        free.forEach((c, b) => { x[c] = (mask >> b) & 1; });
        pivotCol.forEach((c, i) => {
          let v = rows[i][N];
          free.forEach(f => { v ^= rows[i][f] & x[f]; });
          x[c] = v;
        });
        if (!best || x.reduce((a, b) => a + b) < best.reduce((a, b) => a + b)) best = x;
      }
      return best;
    }

    function newPuzzle() {
      n = sizeFor(level);
      lights = new Array(n * n).fill(0);
      // ランダムに押して作るので必ず解ける
      do {
        lights.fill(0);
        const idx = [...Array(n * n).keys()].sort(() => Math.random() - .5).slice(0, pressesFor(level));
        idx.forEach(i => toggle(lights, i));
      } while (lights.every(v => !v));
      initial = lights.slice();
      solution = solve(lights);
      $('par').textContent = solution.reduce((a, b) => a + b);
      $('lv').textContent = level;
      buildBoard();
      restart();
    }

    function restart() {
      lights = initial.slice();
      moves = 0; cleared = false;
      $('moves').textContent = 0;
      $('msg').textContent = '';
      render();
    }

    const board = $('board');
    let cells = [];
    function buildBoard() {
      board.innerHTML = '';
      board.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
      cells = [];
      for (let i = 0; i < n * n; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'light';
        b.setAttribute('aria-label', `${Math.floor(i / n) + 1}行${i % n + 1}列`);
        b.onclick = () => press(i);
        board.appendChild(b);
        cells.push(b);
      }
    }

    function render(hintIdx) {
      cells.forEach((b, i) => {
        b.classList.toggle('on', !!lights[i]);
        b.classList.toggle('hint', i === hintIdx);
        b.setAttribute('aria-pressed', lights[i] ? 'true' : 'false');
      });
    }

    function press(i) {
      if (cleared) return;
      toggle(lights, i);
      moves++;
      $('moves').textContent = moves;
      render();
      if (lights.every(v => !v)) {
        cleared = true;
        const par = +$('par').textContent;
        $('msg').textContent = moves <= par ? `🎉 クリア! 最少手数 ${moves} 手で達成!` : `🎉 クリア! (${moves}手 / 最少 ${par}手)`;
        level++;
        try { localStorage.setItem(STORE, String(level)); } catch (e) {}
      }
    }

    $('reset').onclick = restart;
    $('next').onclick = newPuzzle;
    $('hint').onclick = () => {
      if (cleared) return;
      const s = solve(lights);
      const i = s ? s.indexOf(1) : -1;
      if (i >= 0) { render(i); $('msg').textContent = '点線のマスを押してみよう'; }
    };
    newPuzzle();
  </script>
</body>
</html>
