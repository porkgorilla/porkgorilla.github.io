function sceneFan(P, live) {
  drawStreet();
  const [a, b] = P.zone, v = P.v;

function drawJudge() {

function drawStar(x, y, r, c) {

function drawParts() {
  for (const p of parts) {
    const a = 1 - p.life / p.max;
    ctx.globalAlpha = Math.max(0, a);
    if (p.type === 'drop') { circ(p.x, p.y, p.r); ctx.fillStyle = '#4fa4e0'; ctx.fill(); }
    else if (p.type === 'smoke') { circ(p.x, p.y, p.r); ctx.fillStyle = 'rgba(90,96,110,.55)'; ctx.fill(); }
    else if (p.type === 'steam') { circ(p.x, p.y, p.r); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fill(); }
    else if (p.type === 'spark') { circ(p.x, p.y, p.r); ctx.fillStyle = SUN; ctx.fill(); }
    else if (p.type === 'bit') { ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.r * 2, p.r); }

const SCENES = { water: sceneWater, pump: scenePump, bow: sceneBow, massage: sceneMassage, fan: sceneFan, cat: sceneCat };
function render() {
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (S.mode === 'title' || !S.task) { drawTitleScene(); return; }
  if (S.mode === 'result') { drawTitleScene(); return; }
  const live = S.mode === 'play' || (S.mode === 'pause' && S.prevMode === 'play');
  SCENES[S.task.id](S.P, live);
  drawParts();
  const P = S.P;
  if (S.mode === 'play' || S.mode === 'ready' || S.mode === 'pause') {
    if (P.limit) drawTimer(1 - P.t / P.limit);
    txt(HINT[S.task.kind], W / 2, H - 30, 13, INK);

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  updateLoopSound();
  render();
  requestAnimationFrame(frame);
}
setSound(soundOn);
showBest(); updateHud();
requestAnimationFrame(frame);

})();
