<style>
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:#120d0a}
body{height:100%;margin:0;overflow:hidden;background:#120d0a;color:#f6ede0;

#cupTag{position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 62px);z-index:3;pointer-events:none;
  font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(22,14,9,.6);border:1px solid rgba(255,238,215,.16);white-space:nowrap}

.gauge{position:absolute;top:52%;transform:translateY(-50%);width:30px;height:min(46vh,340px);z-index:3;pointer-events:none}
.gauge.r{right:calc(env(safe-area-inset-right,0px) + 16px)}
.gauge.l{left:calc(env(safe-area-inset-left,0px) + 16px)}
.gTrack{position:absolute;inset:0;border-radius:15px;background:rgba(22,14,9,.62);border:1px solid rgba(255,238,215,.28);overflow:hidden}
.zs{position:absolute;top:0;bottom:0;left:0;right:0}
.zs+.zs{display:none}
.gauge.split .zs{right:50%}
.gauge.split .zs+.zs{display:block;left:50%;right:0}
.gauge.split .gFill{left:12px;width:4px}
.zone{position:absolute;left:0;right:0}
.zGood{background:rgba(130,205,120,.5)}

.gFill{position:absolute;left:11px;width:8px;bottom:0;border-radius:4px;background:linear-gradient(#fffdf6,#efe2c6)}

@keyframes jpop{0%{opacity:0;transform:scale(.4) rotate(-6deg)}14%{opacity:1;transform:scale(1.12) rotate(2deg)}26%{transform:scale(1) rotate(-1deg)}75%{opacity:1}100%{opacity:0;transform:scale(1.04) translateY(-12px)}}

@media (max-height:620px){.card{padding:14px 16px 12px}.how{font-size:12.5px;margin-bottom:8px;line-height:1.5}.sub{margin:4px 0 8px;font-size:13px}.stats{margin-bottom:10px}.go{min-height:44px}}

.go:active{transform:translateY(2px);box-shadow:0 2px 0 #9c6420}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const GAME_NAME = '眠らない眼';
const GAME_URL = 'https://porkgorilla.com/works/nemuranaime.html';
const OG_CACHE_VERSION = 1;
const SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const HASHTAG = '#眠らない眼';
const KEY_STATS = 'nemuranaime-stats', KEY_SND = 'nemuranaime-sound', KEY_MODE = 'nemuranaime-mode', KEY_SET = 'nemuranaime-set';

function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function sstep(a, b, x){ const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function G(x, y, cx, cy, sx, sy){ const a = (x - cx) / sx, b = (y - cy) / sy; return Math.exp(-(a * a + b * b)); }
function smax(a, b, k){ const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.max(a, b) + h * h * k * 0.25; }
const C = hex => new THREE.Color(hex).convertSRGBToLinear();

/* ---------------- stats ---------------- */
const blankStats = () => ({ total:0, perfect:0, burst:0, best:0, double:0 });
let stats = {};
try {
  const s = JSON.parse(lsGet(KEY_STATS, 'null'));
  if (s){
    const OLD = { normal:'one-paka-manual', both:'both-two-paka-manual', hang:'one-hang-manual' };
    if (typeof s.total === 'number') stats['one-paka-manual'] = Object.assign(blankStats(), s);
    else for (const k in s){ if (s[k] && typeof s[k] === 'object') stats[OLD[k] || k] = Object.assign(blankStats(), s[k]); }
  }
} catch(e){}
function saveStats(){ lsSet(KEY_STATS, JSON.stringify(stats)); }

/* ---------------- renderer ---------------- */
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 60);

function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}
// cafe background
scene.background = canvasTex(512, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2c1d14'); gr.addColorStop(.6, '#1c120c'); gr.addColorStop(1, '#0e0906');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++){
    const x = Math.random() * w, y = Math.random() * h * .7, r = rand(14, 46);
    const b = g.createRadialGradient(x, y, 0, x, y, r);
    const col = Math.random() < .7 ? '255,190,120' : '255,235,200';
    b.addColorStop(0, `rgba(${col},.22)`); b.addColorStop(.75, `rgba(${col},.12)`); b.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = b; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
});
// environment
(function(){
  const pm = new THREE.PMREMGenerator(renderer), es = new THREE.Scene();
  const tex = canvasTex(64, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h);
    [[0,'#fff4e4'],[.35,'#e6c9a6'],[.6,'#8a6a50'],[1,'#21160f']].forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  es.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ map:tex, side:THREE.BackSide })));
  scene.environment = pm.fromScene(es, .04).texture; pm.dispose();
})();

scene.add(new THREE.HemisphereLight(0xfff0dd, 0x3a261a, 0.35));
const key = new THREE.DirectionalLight(0xffe6c8, 2.0);
key.position.set(-3.8, 2.7, 2.8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left:-2.2, right:2.2, top:2.2, bottom:-2.6, near:1, far:12 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
key.target.position.set(-0.3, -0.2, 0.4);
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.35); fill.position.set(3.5, 0.2, 3); scene.add(fill);
const under = new THREE.DirectionalLight(0xffc8a0, 0.25); under.position.set(0, -3, 3); scene.add(under);

/* ---------------- face (heightfield) ---------------- */
const FX0 = -1.8, FX1 = 1.8, FY0 = -2.35, FY1 = 1.8, fW = FX1 - FX0, fH = FY1 - FY0;
const NX = 231, NY = 266;
const EXL = -0.6, EXR = 0.6, EY = 0.03, ER = 0.2;

function baseZ(x, y){
  let z = 0.55 - 0.16 * x * x - 0.035 * (y - 0.2) * (y - 0.2);
  const ax = Math.abs(x);
  if (ax > 0.88) z -= 1.7 * (ax - 0.88) * (ax - 0.88);
  if (y > 1.05) z -= 0.9 * (y - 1.05) * (y - 1.05);
  z += 0.05 * G(x, y, 0, 1.0, 1.0, 0.5);
  for (const s of [-1, 1]){
    z += 0.10 * G(x, y, s * 0.6, 0.37, 0.42, 0.13);
    z -= 0.27 * G(x, y, s * 0.6, 0.0, 0.36, 0.27);
    z += 0.12 * G(x, y, s * 0.8, -0.5, 0.38, 0.3);
    z += 0.05 * G(x, y, s * 0.55, -0.8, 0.4, 0.35);
    z += 0.075 * G(x, y, s * 0.2, -0.95, 0.11, 0.09);
    z -= 0.03 * G(x, y, s * 0.42, -1.12, 0.06, 0.25);   // nasolabial
  }
  z += 0.05 * G(x, y, 0, 0.3, 0.18, 0.15);
  const t = sstep(0.3, -0.85, y);
  const w = 0.07 + 0.08 * t, h = (0.09 + 0.31 * t) * sstep(-1.08, -0.9, y) * sstep(0.5, 0.22, y);
  z += h * Math.exp(-(x * x) / (w * w));
  z += 0.10 * G(x, y, 0, -0.86, 0.15, 0.12);
  z -= 0.06 * G(x, y, 0, -1.12, 0.45, 0.12);

let AC = null, master = null, noiseB = null;

function initAudio(force){
  if (AC && force){ try { AC.close().catch(() => {}); } catch(e){} AC = null; }
  else if (AC){ if (AC.state === 'closed') AC = null; else { if (AC.state === 'suspended') AC.resume(); return; } }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
    noiseB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseB.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

}

  f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0, Math.random() * .5); s.stop(t0 + dur + .02);
}

  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

}

      case 'set': tone(t, .05, 'triangle', 900, 600, .08); nz(t, .03, 'highpass', 3000, 3000, 1, .05); break;
      case 'whoosh': nz(t, .28, 'bandpass', 500, 1700, 1.2, .06); break;
      case 'under': tone(t, .14, 'sine', 180, 120, .12); nz(t, .06, 'bandpass', 900, 600, 4, .05); break;
      case 'pop':
        nz(t, .02, 'highpass', 4000, 4000, 1, .3); tone(t, .07, 'triangle', 1300, 320, .28); tone(t + .01, .14, 'sine', 560, 260, .3); break;
      case 'perfect':

        [1047, 1319, 1568, 2093].forEach((f, i) => tone(t + .08 + i * .06, .35, 'sine', f, f, .12)); break;
      case 'squirt': nz(t, .03, 'highpass', 3000, 3000, 1, .2); nz(t, .32, 'bandpass', 1400, 700, 2, .32); break;

    visH = 2.15; visW = visH * a;
    if (visW > 2.9){ visW = 2.9; visH = visW / a; }
    if (visW < 1.4){ visW = 1.4; visH = visW / a; if (visH > 3.1){ visH = 3.1; visW = visH * a; } }
    cx = a < 1 ? lerp(-0.42, -0.2, clamp((a - .45) / .55, 0, 1)) : -0.2;
    cy = a < 1 ? -0.2 : -0.02;
    if (SET.open === 'hang') cy -= a < 1 ? 0.1 : 0.2;
    side = 0.32;
  }
  const d = visH / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camBase.set(cx + d * side, cy - d * 0.06, 0.45 + d * 0.95); camLook.set(cx, cy, 0.45);
  camera.updateProjectionMatrix();
  fitHUD(); fitBtns();
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('app'));

/* ---------------- update ---------------- */
let tAll = 0;
function pickTarget(sl, link){
  let z = curZones(sl);
  if (link && slots[1].cup){
    const z2 = curZones(slots[1]);
    const lo = Math.max(z.pc - z.pw, z2.pc - z2.pw), hi = Math.min(z.pc + z.pw, z2.pc + z2.pw);
    const g0 = Math.max(z.g0, z2.g0), g1 = Math.min(z.g1, z2.g1);
    const pc = lo < hi ? (lo + hi) / 2 : g0 < g1 ? (g0 + g1) / 2 : z.pc;
    z = { g0:Math.min(g0, pc - .01), g1:Math.max(g1, pc + .01), pc, pw:lo < hi ? (hi - lo) / 2 : .02 };
  }
  const skill = autoOn() ? SET.skill : 'normal', r = Math.random();
  if (skill === 'pro') return r < .9 ? z.pc + rand(-z.pw, z.pw) * .5 : rand(z.g0 + .01, z.g1 - .01);
  if (skill === 'bad') return r < .3 ? rand(.08, z.g0 - .03) : r < .55 ? rand(z.g1 + .02, .95) : r < .8 ? 1.2 : rand(z.g0 + .01, z.g1 - .01);
  return r < .6 ? z.pc + rand(-.03, .03) : r < .8 ? rand(z.g0 + .02, z.g1 - .02) : r < .9 ? rand(z.g1 + .02, .95) : 1.2;
}
function demoHold(sl, dt, link){
  const d = sl.demo;
  if (!d.hold){ d.wait -= dt; if (d.wait <= 0){ d.hold = true; d.target = pickTarget(sl, link); } }
  return d.hold;
}
function slotHolding(sl, dt){
  const auto = mode !== 'play' || SET.prog === 'auto';
  if (instantOn()) return sl.held;
  if (linked()){
    const s0 = slots[0];
    if (sl !== s0) return !!s0.holdingNow;
    if (!slots.every(s => s.phase === 'ready')){ s0.demo.hold = false; return false; }
    if (mode === 'play' && slots.some(s => s.held)) return true;
    return auto ? demoHold(s0, dt, true) : false;
  }
  if (mode === 'play' && sl.held) return true;
  if (!auto || sl.phase !== 'ready') return false;
  return demoHold(sl, dt, false);
}
function animCup(cc, sl, dt, phase){
  if (!cc.lidGone && !cc.bodyPivot){
    const acc = (cc.lidAngT - cc.lidAng) * 160 - cc.lidVel * 11;
    cc.lidVel += acc * dt; cc.lidAng += cc.lidVel * dt;
    cc.pivot.quaternion.setFromAxisAngle(cc.axis, Math.max(0, cc.lidAng));
    const bulgeT = phase === 'ready' ? Math.pow(Math.min(1, sl.P), 1.5) * 0.07 : 0;
    setBulge(cc, lerp(Math.max(0, cc.bulgeNow), bulgeT, Math.min(1, dt * 14)));
  }
  if (cc.bodyPivot && cc.hangOn && cc.bodyPivot.parent !== scene){
    const acc = 26 * Math.cos(cc.hAng) - cc.hDamp * cc.hVel;
    cc.hVel += acc * dt; cc.hAng += cc.hVel * dt;
    if (cc.hAng > 2.75){ cc.hAng = 2.75; cc.hVel = -Math.abs(cc.hVel) * .5; } if (cc.hAng < 0.1 && cc.hVel < 0){ cc.hAng = 0.1; cc.hVel = Math.abs(cc.hVel) * .5; }
    cc.bodyPivot.rotation.x = cc.hAng;
    if (cc.spill > 0 && phase === 'after' && Math.abs(cc.hAng - Math.PI / 2) > 0.5){
      cc.spill -= dt * 0.8;
      const m = mouthWorld(cc, tmpV);
      if (Math.random() < .8) emit(m, tmpV2.set(rand(-.2, .2), rand(-.2, .3), rand(0, .6)), rand(.014, .026), cc.T.syrup);
    }
  }
  for (let i = cc.flies.length - 1; i >= 0; i--){
    const f = cc.flies[i]; f.t += dt; f.v.y -= 6 * dt;
    f.obj.position.addScaledVector(f.v, dt);
    f.obj.rotation.x += f.w.x * dt; f.obj.rotation.y += f.w.y * dt; f.obj.rotation.z += f.w.z * dt;
    if (f.t > 2){ if (f.obj.parent) f.obj.parent.remove(f.obj); cc.flies.splice(i, 1); }
  }
  if (cc.pour > 0 && cc.open && !cc.squashT){
    // 口が横を向いているので、フタが開くとミルクが下のふちから流れ出る
    cc.pour = Math.max(0, cc.pour - dt * 0.42);
    cc.liq.scale.y = 0.06 + 0.94 * cc.pour;
    const sc = cc.root.scale.x;
    if (Math.random() < (cc.pour > 0.25 ? 0.95 : 0.45)){
      const p = cc.root.localToWorld(tmpV.set(rand(-.08, .08), -0.25 - rand(0, .03), MOUTH_Y + 0.01));
      const q = emit(p, tmpV2.set(rand(-.06, .06), rand(-.2, 0), -rand(.9, 1.4) * sc), rand(.012, .022) * (0.6 + cc.pour * 0.5), cc.T.syrup);
      if (q){ q.drip = true; q.life = 2.5; q.max = 2.5; }
    }
  }
  cc.squash = lerp(cc.squash, cc.squashT, Math.min(1, dt * 18));
  const qq = phase === 'ready' || phase === 'enter' ? sl.q : sl.q * .5;
  cc.body.scale.set(1 + 0.06 * qq + .3 * cc.squash, 1 - .25 * cc.squash, 1 - 0.15 * qq - .5 * cc.squash);
}
function updateSlot(sl, dt){
  const c = sl.cup;
  const holding = slotHolding(sl, dt);
  sl.holdingNow = holding;
  const link = linked() && !instantOn();
  switch (sl.phase){
    case 'none': if (!c) spawnCup(sl); break;
    case 'enter': {
      c.enterT = Math.min(1, c.enterT + dt / c.enterDur);
      const t = c.enterT, e = 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
      c.root.position.set(lerp(c.from.x, c.seat.x, e), lerp(c.from.y, c.seat.y, e), lerp(c.from.z, c.seat.z, Math.min(1, e)));
      c.root.rotation.set((1 - t) * 1.6, (1 - t) * -1.2 * -sl.side, (1 - t) * 2.5);
      if (t >= 1){ sl.phase = 'ready'; c.root.position.copy(c.seat); c.root.rotation.set(0, 0, 0); sl.q = Math.max(sl.q, .45); if (!instantOn()) sfx('set'); sl.demo.wait = rand(.7, 1.6); }
      break;
    }
    case 'ready': {
      const z = curZones(sl);
      if (link && sl !== slots[0]){ sl.squeezing = slots[0].squeezing; break; }
      if (holding){
        sl.squeezing = true;
        const rate = link && slots[1].cup ? (z.rate + curZones(slots[1]).rate) / 2 : z.rate;
        sl.P += dt * rate * (0.35 + 1.25 * sl.P);
        sl.creakAcc += dt;
        if (sl.creakAcc > 0.15 - Math.min(1, sl.P) * 0.1){ sl.creakAcc = 0; sfx('creak', Math.min(1, sl.P)); }
        if (instantOn()){ if (sl.P >= z.pc) instantPop(sl); break; }
        if (sl.P >= 1){ if (link) jointDo(() => slots.forEach(s => { if (s.phase === 'ready') burst(s); })); else burst(sl); break; }
        const manual = mode === 'play' && (link ? slots.some(s => s.held) : sl.held);
        if (!manual && sl.demo.hold && sl.P >= sl.demo.target){
          sl.demo.hold = false; sl.demo.wait = rand(1, 2);
          if (link) jointDo(() => { slots.forEach(s => { if (s.phase === 'ready') resolve(s); }); slots.forEach(s => { s.P = 0; s.squeezing = false; }); });
          else resolve(sl);
        }
      } else sl.P = Math.max(0, sl.P - dt * 1.6);
      break;
    }
    case 'after':
      sl.timer -= dt; if (sl.timer <= 0) startDrop(sl); break;
    case 'drop': {
      const d = c.drop; d.t += dt;
      d.v.y -= 7 * dt;
      c.root.position.addScaledVector(d.v, dt);
      c.root.rotation.x -= d.w * dt * .6; c.root.rotation.z += d.w * dt * .25 * -sl.side;
      if (c.spill > 0 && d.t > .12 && c.body.parent){
        c.spill -= dt * 1.2;
        const m = mouthWorld(c, tmpV);
        if (Math.random() < .7) emit(m, tmpV2.set(rand(-.2, .2), rand(-.3, .1), rand(-.1, .4)), rand(.014, .028), c.T.syrup);
      }
      if (d.t > 1.0){ disposeCup(c); sl.cup = null; sl.phase = 'none'; spawnCup(sl); }
      break;
    }
  }
  if (sl.cup) animCup(sl.cup, sl, dt, sl.phase);
  for (let i = sl.trash.length - 1; i >= 0; i--){
    const tr = sl.trash[i]; tr.t += dt;
    animCup(tr.c, sl, dt, 'after');
    if (tr.t > tr.delay){
      tr.v.y -= 7 * dt;
      tr.c.root.position.addScaledVector(tr.v, dt);
      tr.c.root.rotation.x -= tr.w * dt * .5; tr.c.root.rotation.z += tr.w * dt * .3 * sl.side;
    }
    if (tr.t > tr.delay + 1.3){ disposeCup(tr.c); sl.trash.splice(i, 1); }
  }
  let qT = 0;
  if (sl.phase === 'ready' || (instantOn() && sl.held)) qT = holding ? 0.18 + 0.82 * Math.min(1, sl.P / 0.92) : 0.14;
  else if (sl.phase === 'after') qT = 0.1;
  sl.q = lerp(sl.q, qT, Math.min(1, dt * (qT > sl.q ? 16 : 6)));
  sl.hasCup = !!(sl.cup && (sl.phase === 'ready' || sl.phase === 'after' || (sl.phase === 'enter' && sl.cup.enterT > .8)));
}

function update(dt){
  tAll += dt;
  for (const sl of slots) updateSlot(sl, dt);
  if (linked() && !instantOn() && slots[1]) slots[1].P = slots[0].P;

  const sL = slots.find(s => s.side < 0), sR = slots.find(s => s.side > 0);
  const qL = sL ? sL.q : 0, qR = sR ? sR.q : 0;
  S.smile = lerp(S.smile, S.smileT, Math.min(1, dt * 7));
  S.smileT = lerp(S.smileT, 0.08, Math.min(1, dt * 0.7));
  S.wince = Math.max(0, S.wince - dt * 1.1);
  S.blinkT -= dt;
  if (S.blinkT <= 0){ S.blink = 1; S.blinkT = rand(2.5, 5.5); }
  S.blink = Math.max(0, S.blink - dt * 7);
  const bl = S.blink > 0 ? Math.sin(S.blink * Math.PI) : 0;
  const lClose = clamp(Math.max(qL * 1.4, sL && sL.hasCup ? 0.25 : bl), 0, 1);
  let rClose, rSq, lSq;
  if (sR){ rClose = clamp(Math.max(qR * 1.4, sR.hasCup ? 0.25 : bl, S.wince), 0, 1); rSq = qR + qL * 0.3 + S.wince * 0.5; lSq = qL + qR * 0.3; }
  else { rClose = clamp(Math.max(bl, qL * 0.78, S.wince), 0, 1); rSq = qL * 0.6 + S.wince * 0.7; lSq = qL; }
  applyFace(lClose, Math.min(1.2, lSq), rClose, Math.min(1.2, rSq), clamp(S.smile + Math.max(qL, qR) * 0.45, -0.8, 1.2));

  // gaze
  const hl = sL && sL.holdingNow && sL.phase === 'ready' && !sR;
  S.lookCup = lerp(S.lookCup, hl ? 1 : 0, Math.min(1, dt * 5));
  eyes[1].lookAt(tmpV.copy(camera.position).lerp(tmpV2.set(EXL, EY - .05, 0.9), S.lookCup * .4));
  eyes[0].lookAt(camera.position);

  // tremble & camera
  let tr = 0;
  for (const sl of slots) if (sl.phase === 'ready' && sl.holdingNow) tr = Math.max(tr, Math.max(0, Math.min(1, sl.P) - 0.45) * 0.008);
  faceRoot.position.set(rand(-tr, tr), rand(-tr, tr), 0);
  for (const sl of slots) if (sl.cup && sl.phase === 'ready') sl.cup.root.position.set(sl.cup.seat.x + faceRoot.position.x, sl.cup.seat.y + faceRoot.position.y - sl.q * 0.01, sl.cup.seat.z);
  S.shake = Math.max(0, S.shake - dt * 1.4);
  const sh = S.shake * S.shake * 0.06;
  camera.position.lerpVectors(camBase, camLook, Math.max(qL, qR) * 0.06);
  camera.position.x += Math.sin(tAll * .5) * .015 + rand(-sh, sh); camera.position.y += Math.sin(tAll * .37) * .01 + rand(-sh, sh);
  camera.lookAt(camLook);

  // particles
  for (let i = 0; i < PMAX; i++){
    const q = parts[i];
    if (q.on){
      q.life -= dt;
      if (!q.sparkle) q.v.y -= 6 * dt; else q.v.multiplyScalar(1 - dt * 2);
      q.p.addScaledVector(q.v, dt);
      if (!q.sparkle && q.v.z < 0.4 && Math.abs(q.p.x) < 1.6 && q.p.y > -2 && q.p.y < 1.4 && q.p.z < zRest(q.p.x, q.p.y) + 0.01){
        if (q.drip || Math.random() < .55) addSplat(q.p.x, q.p.y, q.s * 1.6, q.syrup, q.drip);
        if (Math.random() < .2) sfx('plop'); q.on = false;
      }
      if (q.on && !q.sparkle && q.p.z > camera.position.z - 2.2 && q.v.z > 0){ if (Math.random() < .12) lensSplat(1, q.syrup); q.on = false; }
      if (q.life <= 0) q.on = false;
    }
    if (q.on){
      const s = q.sparkle ? q.s * (q.life / q.max) : q.s;
      dummy.position.copy(q.p); dummy.scale.set(s, s * (1 + Math.min(1.5, q.v.length() * .25)), s);
      dummy.lookAt(tmpV.copy(q.p).add(q.v));
      dummy.updateMatrix(); drops.setMatrixAt(i, dummy.matrix);
      drops.setColorAt(i, q.sparkle ? COL_GOLD : q.syrup ? COL_SYRUP : COL_CREAM);
    } else { dummy.scale.set(0, 0, 0); dummy.updateMatrix(); drops.setMatrixAt(i, dummy.matrix); }
  }
  drops.instanceMatrix.needsUpdate = true; if (drops.instanceColor) drops.instanceColor.needsUpdate = true;

  // splats
  for (let i = splats.length - 1; i >= 0; i--){
    const m = splats[i], u = m.userData;
    u.life -= dt; m.position.y += u.vy * dt; m.scale.y += dt * u.s * 0.02;
    if (u.life < 1.5){ const k = Math.max(0, u.life / 1.5); m.scale.x = u.s * k; m.scale.z = u.s * .36 * k; }
    if (u.life <= 0){ faceRoot.remove(m); splats.splice(i, 1); }
  }

  // gauges
  if (mode === 'play'){
    for (const sl of slots){
      const g = sl.gauge; if (!g || (linked() && sl !== slots[0])) continue;
      const p = clamp(sl.P, 0, 1);
      g.fill.style.height = (p * 100) + '%';
      g.mark.style.top = ((1 - p) * 100) + '%';
    }
  }
}

/* ---------------- loop ---------------- */
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  if (W < 1 || H < 1){ resize(); return; }
  try {
    if (!paused){
      const sc = autoOn() ? SET.spd : 1;
      for (let k = 0; k < sc; k++) update(dt);
    }
    renderer.render(scene, camera);
  } catch(e){ console.error(e); }
}
buildOpts();
setupSlots();
resize();
showTitle();
requestAnimationFrame(loop);
</script>
