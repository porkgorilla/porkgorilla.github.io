<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sakura:#FFE8EE;
  --sakura-deep:#FF7A95;
  --yomogi:#6E9B5C;
  --kinako:#F2C94C;
  --azuki:#3B2A2F;
  --paper:#FFFFFF;
  --muted:#8C6B72;
  --stage-bg:#FFF6F8;
  --dot:#FFD3DD;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sakura:#2A1D22; --sakura-deep:#FF8FA6; --yomogi:#8DBB79; --kinako:#F2C94C;
    --azuki:#FBEFF2; --paper:#3A2A30; --muted:#C9A9B1; --stage-bg:#33242A; --dot:#4A3139;
  }
}
:root[data-theme="dark"]{
  --sakura:#2A1D22; --sakura-deep:#FF8FA6; --yomogi:#8DBB79; --kinako:#F2C94C;
  --azuki:#FBEFF2; --paper:#3A2A30; --muted:#C9A9B1; --stage-bg:#33242A; --dot:#4A3139;
}
*,*::before,*::after{box-sizing:inherit;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{margin:0;height:100%;overflow:hidden;}
body{
  background:var(--sakura);
  color:var(--azuki);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:8px 10px 4px;}
.hud{display:flex;align-items:center;gap:8px;font-weight:800;}
.score{font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-size:1.5rem;line-height:1;min-width:4.5em;}
.score small{font-size:.7rem;color:var(--muted);font-family:"M PLUS Rounded 1c",sans-serif;margin-left:2px;}
.combo{font-size:.85rem;color:var(--muted);flex:1;}
.combo b{color:var(--sakura-deep);font-size:1.05rem;}
.hearts{font-size:1.2rem;letter-spacing:2px;color:var(--sakura-deep);}
.hearts .lost{opacity:.2;}
.iconbtn{border:none;background:var(--paper);color:var(--azuki);width:44px;height:44px;min-width:44px;min-height:44px;border-radius:50%;font-size:1rem;cursor:pointer;}
.iconbtn:focus-visible,.btn:focus-visible{outline:3px solid var(--yomogi);outline-offset:2px;}
.timebar{height:8px;border-radius:4px;background:var(--paper);margin:6px 0 8px;overflow:hidden;}
.timebar i{display:block;height:100%;width:100%;background:var(--yomogi);transform-origin:left;}
.timebar.hurry i{background:var(--sakura-deep);}

/* 吹き出し：おじさんのリクエスト */
.bubble{
  position:relative;background:var(--paper);border-radius:22px;padding:10px 14px 12px;
  min-height:62px;display:flex;flex-direction:column;justify-content:center;
  border:3px solid var(--azuki);
}
.bubble::after{
  content:"";position:absolute;left:50%;bottom:-13px;width:20px;height:20px;background:var(--paper);
  border-right:3px solid var(--azuki);border-bottom:3px solid var(--azuki);transform:translateX(-50%) rotate(45deg);
}
.bubble .req{font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-size:1.1rem;text-align:center;line-height:1.35;}
.bubble .req .arrow{color:var(--sakura-deep);}
.bubble .otimer{height:5px;background:var(--dot);border-radius:3px;margin-top:6px;overflow:hidden;}
.bubble .otimer i{display:block;height:100%;width:100%;background:var(--kinako);transform-origin:left;}
.bubble.fever{background:var(--kinako);color:#3B2A2F;}
.bubble.fever::after{background:var(--kinako);}

#stageWrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;margin-top:10px;}
#stage{position:relative;touch-action:none;border-radius:28px;
  background:radial-gradient(var(--dot) 1.6px, transparent 1.8px) 0 0/22px 22px, var(--stage-bg);}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;}
#ov{cursor:grab;}
.illust{font-size:.62rem;color:var(--muted);text-align:right;padding:2px 4px 0;}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:20px;margin-bottom:2px;position:relative;z-index:6;}
.home{color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.04em;white-space:nowrap;padding:4px 2px;}
.home:hover{color:var(--azuki)}
.credit{font-size:11px;color:var(--muted);margin-top:14px;letter-spacing:.05em}
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin-top:12px;}
.actions .btn{margin-top:0;}
.btn.ghost{background:transparent;color:var(--sakura-deep);box-shadow:none;border:3px solid var(--sakura-deep);}
.btn.ghost:active{transform:translateY(1px);box-shadow:none;}
.share{display:inline-block;margin-top:12px;font-size:.85rem;font-weight:800;color:var(--azuki);text-decoration:none;border-bottom:2px solid var(--dot);padding:4px 2px;}
.share:hover{border-color:var(--sakura-deep);}

.modal{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:5;}
.modal.hidden{display:none;}
.sheet{pointer-events:auto;background:var(--paper);border:3px solid var(--azuki);border-radius:26px;padding:18px 18px 16px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 0 var(--azuki);}
.sheet h1{font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-weight:400;font-size:1.45rem;line-height:1.3;margin:0 0 8px;}
.sheet h1.logo{font-size:2.4rem;line-height:1.05;margin:2px 0 0;letter-spacing:.03em;color:var(--sakura-deep);-webkit-text-stroke:2px var(--azuki);paint-order:stroke fill;text-shadow:0 4px 0 var(--azuki);}
.subtitle{font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-size:.95rem;margin:12px 0 8px;}
.sheet p{margin:4px 0;font-size:.86rem;line-height:1.6;color:var(--muted);}
.sheet p strong{color:var(--azuki);}
.btn{font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-size:1.1rem;border:3px solid var(--azuki);background:var(--sakura-deep);color:#fff;border-radius:999px;padding:10px 28px;margin-top:12px;cursor:pointer;box-shadow:0 4px 0 var(--azuki);}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--azuki);}
.bigscore{font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-size:2.6rem;line-height:1.1;margin:4px 0;}
.rank{font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-size:1.15rem;color:var(--sakura-deep);}
.stats{display:flex;justify-content:center;gap:18px;font-size:.82rem;color:var(--muted);margin-top:6px;}
.stats b{color:var(--azuki);font-size:1rem;}
.newbest{color:var(--yomogi);font-weight:800;font-size:.9rem;}
@media (prefers-reduced-motion: reduce){ .btn:active{transform:none;} }
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><a class="home" href="/">&lt; porkgorilla</a></div>
  <div class="hud">
    <div class="score" id="score">0<small>もち</small></div>
    <div class="combo" id="combo">コンボ <b>0</b></div>
    <div class="hearts" id="hearts">♥♥♥</div>
    <button class="iconbtn" id="muteBtn" aria-label="音のオン・オフ">🔊</button>
  </div>
  <div class="timebar" id="timebar"><i id="timefill"></i></div>
  <div class="bubble" id="bubble">
    <div class="req" id="req">ほっぺとおなか、さわってみる？</div>
    <div class="otimer"><i id="ofill"></i></div>
  </div>
  <div id="stageWrap">
    <div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
  </div>
  <div class="illust">イラスト：いらすとや</div>
</div>

<div class="modal" id="titleModal">
  <div class="sheet">
    <h1 class="logo">オジヒッパル</h1>
    <div class="subtitle">おじさんのもちもちほっぺ大作戦</div>
    <p>おじさんのリクエストどおりに<strong>ほっぺ</strong>や<strong>おなか</strong>をつまんで、光る丸まで引っ張ってキープ。</p>
    <p>引っ張りすぎると<strong>いたたっ</strong>でハート−1。10コンボでフィーバー。</p>
    <button class="btn" id="startBtn">もちもち開始</button>
    <div class="credit">porkgorilla — 2026</div>
  </div>
</div>

<div class="modal hidden" id="resultModal">
  <div class="sheet">
    <p id="endReason">タイムアップ</p>
    <div class="bigscore" id="finalScore">0</div>
    <div class="rank" id="rankText"></div>
    <div class="stats"><span>最大コンボ <b id="maxComboText">0</b></span><span>ベスト <b id="bestText">0</b></span></div>
    <div class="newbest" id="newBest" hidden>ベスト更新！</div>
    <div class="actions">
      <button class="btn" id="retryBtn">もう一回もちもち</button>
      <button class="btn ghost" id="titleBtn">タイトルへ</button>
    </div>
    <a class="share" id="shareBtn" href="#" target="_blank" rel="noopener">Xで結果をポストする</a>
  </div>
</div>

{ let k=0; for (let r=0;r<ny-1;r++) for (let c=0;c<nx-1;c++){

function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER,
 'attribute vec2 aPos;attribute vec2 aUV;uniform vec2 uWorld;varying vec2 vUV;'+
 'void main(){vec2 p=aPos/uWorld*2.0-1.0;gl_Position=vec4(p.x,-p.y,0.0,1.0);vUV=aUV;}'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER,
 'precision mediump float;uniform sampler2D uTex;uniform float uFlash;varying vec2 vUV;'+
 'void main(){vec4 c=texture2D(uTex,vUV);c.rgb=mix(c.rgb,vec3(1.0,0.25,0.3)*c.a,uFlash*0.45);gl_FragColor=c;}'));
gl.linkProgram(prog); gl.useProgram(prog);
const posBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,posBuf); gl.bufferData(gl.ARRAY_BUFFER,rest,gl.DYNAMIC_DRAW);

let actx=null, muted=false, strOsc=null, strGain=null;
function initAudio(force){
  if (actx && force){ try{ actx.close().catch(()=>{}); }catch(e){} actx=null; strOsc=null; strGain=null; }
  else if (actx && actx.state==='closed'){ actx=null; }
  return audio();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && actx && actx.state==='suspended') actx.resume(); });
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume(); return actx; }
function tone(type, f0, f1, dur, vol, delay){
  const a=audio(); if(!a||muted) return;
  const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}

function stretchSound(t){
  const a=actx; if(!a) return;
  if(t<0 || muted){ if(strOsc){ const o=strOsc,g=strGain; g.gain.setTargetAtTime(0.0001,a.currentTime,0.03); o.stop(a.currentTime+0.15); strOsc=null; } return; }
  if(!strOsc){ strOsc=a.createOscillator(); strGain=a.createGain(); strOsc.type='triangle';
    strGain.gain.value=0.0001; strOsc.connect(strGain); strGain.connect(a.destination); strOsc.start();
    strGain.gain.setTargetAtTime(0.045,a.currentTime,0.03); }
  strOsc.frequency.setTargetAtTime(150+t*420 + Math.sin(performance.now()/40)*6*t, a.currentTime, 0.03);
}

  let o;
  if (touchy && combo>=3 && Math.random()<0.15){
    const pair = pick([[180,0],[270,270],[90,90],[225,315]]);
    o={ type:'double', targets:[mkTarget('L',pair[0]), mkTarget('R',pair[1])] };
    o.html='りょうほっぺを<br>同時に <span class="arrow">'+DIRS[pair[0]][0]+DIRS[pair[1]][0]+'</span> のばして！';
    o.limit=orderLimit+1.6;
  } else {
    const k = Math.random()<0.3 ? 'B' : pick(['L','R']);
    const ang = pick(ANG[k]); const t=mkTarget(k,ang);
    o={ type:'single', targets:[t] };
    const tail = k==='B' ? pick(['たぷん！','ぽよん！','むにっ！']) : pick(['むにーっ！','のびーっ！','もちっ！']);
    o.html=ZONES[k].name+'を <span class="arrow">'+DIRS[ang][0]+'</span> '+DIRS[ang][1]+'へ<br>'+tail;
    o.limit=orderLimit;
  }
  o.t=0; o.prog=0; order=o;
  bubble.classList.remove('fever'); reqEl.innerHTML=o.html;
}
function addScore(n, x, y){
  score+=n; floatText('+'+n, x, y-30, 'var', 26);
}
function floatText(text,x,y,color,size){ fx.push({type:'text',text,x,y,vy:-60,t:0,life:0.9,color,size:size||24}); }
function hearts3(x,y,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=80+Math.random()*140;
  fx.push({type:'heart',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,t:0,life:0.8+Math.random()*0.4,size:14+Math.random()*12}); } }

function success(){
  const o=order, n=o.targets.length;
  const base=100+Math.max(0,o.limit-o.t)*40;
  const pts=Math.round(base*(1+combo*0.1)*(n>1?2:1));
  combo++; maxCombo=Math.max(maxCombo,combo);
  for (const t of o.targets){ const z=ZONES[t.zone]; forceRelease(t.zone); hearts3(z.rx+t.tx, z.ry+t.ty, 10); }
  const z0=ZONES[o.targets[0].zone];
  addScore(pts, z0.rx+o.targets[0].tx, z0.ry+o.targets[0].ty);
  floatText(pick(['もっちもち！','いいのびっぷり！','ぷるるん！','極上もち！']), WORLD_W/2, IY+70, '#FF7A95', 30);
  sfx.success();
  orderLimit=Math.max(2.3, orderLimit-0.09);
  order=null;
  if (combo>0 && combo%10===0){ startFever(); } else orderCooldown=0.25;
}
function startFever(){
  fever=6; sfx.fever(); bubble.classList.add('fever');
  reqEl.innerHTML='もちもちフィーバー！<br>どこでも思いっきり引っ張って離して！';
  floatText('フィーバー！', WORLD_W/2, IY+120, '#E0A800', 40);
}
function missOrder(){
  combo=0; order=null; orderCooldown=0.45; sfx.miss();
  floatText(pick(['おそいよ〜','まだかね？','ひまだなあ']), WORLD_W/2, IY+70, '#8C6B72', 24);
  reqEl.textContent='……';
}
function ouch(k){
  const z=ZONES[k];
  forceRelease(k);
  z.vx += z.ox*2; z.vy += z.oy*2;
  flash=1; shake=0.35; angry=1.1; sfx.ouch();
  floatText(pick(['いたたっ！','いててて！','のびすぎ！']), z.rx, z.ry-50, '#E0335A', 32);
  if (state==='play' && invul<=0){
    hearts--; combo=0; invul=0.9; renderHud();
    if (hearts<=0) endGame('ほっぺが限界です');
  }
}
function endGame(reason){
  state='over'; order=null; fever=0; stretchSound(-1); sfx.end();
  for (const k of ZKEYS) forceRelease(k, true);
  let best=loadBest();
  const isNew=score>best; if(isNew){ best=score; try{ localStorage.setItem(BEST_KEY,String(best)); }catch(e){} }
  $('endReason').textContent=reason;
  $('finalScore').textContent=score.toLocaleString()+' もち';
  $('rankText').textContent= score<1500?'かたいおもち級': score<4000?'つきたてのおもち級': score<8000?'もちもち職人': score<13000?'ほっぺマイスター':'伝説のもち神';
  $('maxComboText').textContent=maxCombo; $('bestText').textContent=best.toLocaleString();
  updateShare();   // 称号(rankText)を書き込んだ後に共有文を作る
  $('newBest').hidden=!isNew;
  bubble.classList.remove('fever');
  reqEl.textContent='おつかれさん。ほっぺがあったかいよ';
  ofill.style.transform='scaleX(0)';
  setTimeout(()=>$('resultModal').classList.remove('hidden'), 600);
}
function startGame(){
  initAudio(true);
  state='play'; score=0; combo=0; maxCombo=0; hearts=3; timeLeft=GAME_TIME; orderLimit=4.6;
  fever=0; invul=0; order=null; orderCooldown=0.5;
  $('titleModal').classList.add('hidden'); $('resultModal').classList.add('hidden');
  reqEl.textContent='よろしくたのむよ'; renderHud();
}
$('startBtn').addEventListener('click',startGame);
function backToTitle(){
  state='title'; order=null; fever=0; stretchSound(-1);
  for (const k of ZKEYS) forceRelease(k, true);
  $('resultModal').classList.add('hidden'); $('titleModal').classList.remove('hidden');
  bubble.classList.remove('fever'); reqEl.textContent='ほっぺとおなか、さわってみる？';
  ofill.style.transform='scaleX(0)';
}
$('titleBtn').addEventListener('click',backToTitle);
function updateShare(){
  const text='オジヒッパルで '+score.toLocaleString()+' もち（'+$('rankText').textContent+'・最大'+maxCombo+'コンボ）\n#オジヒッパル';
  $('shareBtn').href='https://x.com/intent/post?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(SHARE_URL);
}
if (window.matchMedia && matchMedia('(pointer: coarse)').matches){ $('shareBtn').removeAttribute('target'); $('shareBtn').removeAttribute('rel'); }
$('retryBtn').addEventListener('click',startGame);

let lastHud='';
function renderHud(){
  const s=score+'|'+combo+'|'+hearts;
  if (s!==lastHud){ lastHud=s;
    scoreEl.innerHTML=score.toLocaleString()+'<small>もち</small>';
    comboEl.innerHTML='コンボ <b>'+combo+'</b>';
    heartsEl.innerHTML=[0,1,2].map(i=>'<span class="'+(i<hearts?'':'lost')+'">♥</span>').join('');
  }
  timefill.style.transform='scaleX('+Math.max(0,timeLeft/GAME_TIME)+')';
  timebar.classList.toggle('hurry', timeLeft<10);
}

// ===== Input =====
function toWorld(e){ const r=ov.getBoundingClientRect(); return { x:(e.clientX-r.left)*WORLD_W/r.width, y:(e.clientY-r.top)*WORLD_H/r.height }; }
function forceRelease(k, silent){
  const z=ZONES[k];
  for (const [pid,kk] of pointers) if (kk===k) pointers.delete(pid);
  if (z.grabbed){ z.grabbed=false; z.vx=0; z.vy=0; if(!silent) sfx.boing(Math.min(1,Math.hypot(z.ox,z.oy)/z.max)); }
}
ov.addEventListener('pointerdown',e=>{
  audio();
  const p=toWorld(e); let best=null, bd=1e9;
  for (const k of ZKEYS){ const z=ZONES[k]; if (z.grabbed) continue;
    const d=Math.hypot(p.x-(z.rx+z.ox), p.y-(z.ry+z.oy));
    if (d<z.hit && d/z.hit<bd){ bd=d/z.hit; best=k; } }
  if (!best) return;
  touchedOnce=true;
  const z=ZONES[best];
  z.grabbed=true; z.sxp=p.x-z.ox; z.syp=p.y-z.oy; z.px=p.x; z.py=p.y; z.vx=0; z.vy=0;
  pointers.set(e.pointerId,best);
  try{ ov.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
});
ov.addEventListener('pointermove',e=>{
  const k=pointers.get(e.pointerId); if(!k) return;
  const p=toWorld(e); ZONES[k].px=p.x; ZONES[k].py=p.y; e.preventDefault();
});
function up(e){
  const k=pointers.get(e.pointerId); if(!k) return;
  pointers.delete(e.pointerId);
  const z=ZONES[k]; z.grabbed=false; z.vx=0; z.vy=0;
  const L=Math.hypot(z.ox,z.oy);
  sfx.boing(Math.min(1,L/z.max));
  if (k==='B'){ ZONES.L.vy += z.oy*1.2; ZONES.R.vy += z.oy*1.2; }
  if (state==='play' && fever>0 && L>z.max*0.55){
    combo++; maxCombo=Math.max(maxCombo,combo);
    addScore(Math.round(80*(1+combo*0.1)), z.rx+z.ox, z.ry+z.oy);
    hearts3(z.rx+z.ox, z.ry+z.oy, 6);
  } else if (L>z.max*0.35){
    floatText(z.cheek?pick(['ぷるん','もちっ','ぽよん']):pick(['たぷん','ぼよよん']), z.rx, z.ry-40, '#FF7A95', 20);
  }
}
ov.addEventListener('pointerup',up); ov.addEventListener('pointercancel',up);

// ===== Update =====
function physics(dt){
  let tension=-1;
  for (const k of ZKEYS){
    const z=ZONES[k];
    if (z.grabbed){
      const dx=z.px-z.sxp, dy=z.py-z.syp, raw=Math.hypot(dx,dy); z.raw=raw;
      let tx=0, ty=0;
      if (raw>0.001){ const d=z.max*Math.tanh(raw/z.max); tx=dx/raw*d; ty=dy/raw*d; }
      const a=Math.min(1,dt*28); z.ox+=(tx-z.ox)*a; z.oy+=(ty-z.oy)*a;
      tension=Math.max(tension, raw/z.ouch);
      if (raw>z.ouch) ouch(k);
    } else {
      z.raw=0;
      const steps=Math.max(1,Math.ceil(dt/0.008)), h=dt/steps;
      for (let s=0;s<steps;s++){
        const ax=-260*z.ox-6.5*z.vx, ay=-260*z.oy-6.5*z.vy;
        z.vx+=ax*h; z.vy+=ay*h; z.ox+=z.vx*h; z.oy+=z.vy*h;
      }
      if (Math.abs(z.ox)<0.05 && Math.abs(z.vx)<0.5){ z.ox=0; z.vx=0; }
      if (Math.abs(z.oy)<0.05 && Math.abs(z.vy)<0.5){ z.oy=0; z.vy=0; }
    }
  }
  stretchSound(tension>=0 ? Math.min(1,tension) : -1);
}
function game(dt){
  timeLeft-=dt; invul=Math.max(0,invul-dt);
  if (timeLeft<=0){ timeLeft=0; renderHud(); endGame('タイムアップ'); return; }
  if (fever>0){
    fever-=dt; ofill.style.transform='scaleX('+Math.max(0,fever/6)+')';
    if (fever<=0){ fever=0; orderCooldown=0.3; bubble.classList.remove('fever'); reqEl.textContent='ふう……'; }
  } else if (!order){
    orderCooldown-=dt; if (orderCooldown<=0) newOrder();
  } else {
    const o=order; o.t+=dt;
    let allIn=true;
    for (const t of o.targets){ const z=ZONES[t.zone];
      if (!z.grabbed || Math.hypot(z.ox-t.tx, z.oy-t.ty)>z.tol) allIn=false; }
    o.prog = allIn ? o.prog+dt/HOLD : Math.max(0,o.prog-dt/HOLD*1.5);
    ofill.style.transform='scaleX('+Math.max(0,1-o.t/o.limit)+')';
    if (o.prog>=1) success();
    else if (o.t>=o.limit) missOrder();
  }
  renderHud();
}
function updateFx(dt){
  for (let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.t+=dt;
    if (f.type==='heart'){ f.vy+=380*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; } else { f.y+=f.vy*dt; f.vy*=0.95; }
    if (f.t>=f.life) fx.splice(i,1); }
  flash=Math.max(0,flash-dt*3); shake=Math.max(0,shake-dt); angry=Math.max(0,angry-dt);
}

// ===== Render =====
function renderGL(){
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  if (!texReady) return;
  const breathe=Math.sin(T*2.2)*2.2;
  const L=ZONES.L, R=ZONES.R, B=ZONES.B;
  const bOy=B.oy+breathe;
  const wl=L.w, wr=R.w, wb=B.w;
  for (let i=0;i<NV;i++){
    const a=wl[i], b=wr[i], c=wb[i];
    pos[i*2]  = rest[i*2]  + a*L.ox + b*R.ox + c*B.ox;
    pos[i*2+1]= rest[i*2+1]+ a*L.oy + b*R.oy + c*bOy;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,posBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,pos);
  gl.uniform1f(uFlash,flash);
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_SHORT,0);
}
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function renderOverlay(){
  const k=dpr*ov.width/(dpr*WORLD_W);
  octx.setTransform(k,0,0,k,0,0);
  octx.clearRect(0,0,WORLD_W,WORLD_H);

  // blush
  for (const key of ['L','R']){ const z=ZONES[key]; const s=Math.min(1,Math.hypot(z.ox,z.oy)/z.max);
    if (s<0.05) continue;
    const x=z.rx+z.ox*0.8, y=z.ry+z.oy*0.8, rad=28+s*18;
    const g=octx.createRadialGradient(x,y,0,x,y,rad);
    g.addColorStop(0,'rgba(255,80,110,'+(0.45*s)+')'); g.addColorStop(1,'rgba(255,80,110,0)');
    octx.fillStyle=g; octx.beginPath(); octx.arc(x,y,rad,0,Math.PI*2); octx.fill(); }

  // idle hints
  if (state==='title' && !touchedOnce){
    const pulse=reduceMotion?0.5:(0.5+0.5*Math.sin(T*4));
    for (const k of ZKEYS){ const z=ZONES[k];
      octx.strokeStyle='rgba(255,122,149,'+(0.25+0.35*pulse)+')'; octx.lineWidth=3; octx.setLineDash([7,7]);
      octx.beginPath(); octx.ellipse(z.rx,z.ry,z.cheek?34:64,z.cheek?34:48,0,0,Math.PI*2); octx.stroke(); }
    octx.setLineDash([]);
  }

  // order targets
  if (state==='play' && order){
    for (const t of order.targets){ const z=ZONES[t.zone];
      const gx=z.rx+t.tx, gy=z.ry+t.ty;
      const inside = z.grabbed && Math.hypot(z.ox-t.tx,z.oy-t.ty)<=z.tol;
      // arrow
      octx.strokeStyle='rgba(255,122,149,0.8)'; octx.lineWidth=5; octx.lineCap='round';
      octx.beginPath(); octx.moveTo(z.rx,z.ry); octx.lineTo(gx,gy); octx.stroke();
      // zone
      octx.fillStyle='rgba(255,255,255,0.55)'; octx.strokeStyle='#FF7A95'; octx.lineWidth=3;
      octx.beginPath(); octx.arc(z.rx+z.ox,z.ry+z.oy,12,0,Math.PI*2); octx.fill(); octx.stroke();
      // goal ring
      octx.setLineDash([6,6]); octx.lineWidth=4;
      octx.strokeStyle=inside?'#6E9B5C':'#FF7A95';
      octx.fillStyle=inside?'rgba(110,155,92,0.25)':'rgba(255,122,149,0.15)';
      octx.beginPath(); octx.arc(gx,gy,z.tol+6,0,Math.PI*2); octx.fill(); octx.stroke(); octx.setLineDash([]);
      if (order.prog>0){ octx.strokeStyle='#6E9B5C'; octx.lineWidth=7;
        octx.beginPath(); octx.arc(gx,gy,z.tol+14,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,order.prog)); octx.stroke(); }
    }
  }

  // tension lines
  let maxT=0;
  for (const k of ZKEYS){ const z=ZONES[k]; if (!z.grabbed) continue;
    const t=Math.min(1,z.raw/z.ouch); maxT=Math.max(maxT,t);
    const r=Math.round(110+145*t), g=Math.round(155-120*t), b=Math.round(92-40*t);
    octx.strokeStyle='rgba('+r+','+g+','+b+',0.75)'; octx.lineWidth=3+6*t; octx.setLineDash([2,8]); octx.lineCap='round';
    octx.beginPath(); octx.moveTo(z.rx+z.ox,z.ry+z.oy); octx.lineTo(z.px,z.py); octx.stroke(); octx.setLineDash([]);
    octx.fillStyle='rgba('+r+','+g+','+b+',0.9)'; octx.beginPath(); octx.arc(z.px,z.py,9+6*t,0,Math.PI*2); octx.fill();
  }
  octx.textAlign='center'; octx.textBaseline='middle';
  if (maxT>0.72){ octx.font='30px sans-serif'; octx.globalAlpha=Math.min(1,(maxT-0.72)*4);
    octx.fillText('💦', IX+300+Math.sin(T*30)*2, IY+120); octx.globalAlpha=1; }
  if (angry>0){ octx.font='44px sans-serif'; octx.globalAlpha=Math.min(1,angry*2);
    octx.fillText('💢', IX+290, IY+70); octx.globalAlpha=1; }

  // fx
  for (const f of fx){
    const a=1-f.t/f.life;
    octx.globalAlpha=Math.max(0,a);
    if (f.type==='heart'){ octx.fillStyle='#FF7A95'; octx.font=f.size+'px sans-serif'; octx.fillText('♥',f.x,f.y); }
    else {
      octx.font=f.size+'px "Mochiy Pop One","M PLUS Rounded 1c",sans-serif';
      octx.lineWidth=6; octx.strokeStyle='#fff'; octx.lineJoin='round';
      octx.strokeText(f.text,f.x,f.y); octx.fillStyle=f.color==='var'?'#3B2A2F':f.color; octx.fillText(f.text,f.x,f.y);
    }
  }
  octx.globalAlpha=1;

  // shake
  if (shake>0 && !reduceMotion){ stage.style.transform='translate('+((Math.random()-0.5)*14*shake)+'px,'+((Math.random()-0.5)*14*shake)+'px)'; }
  else stage.style.transform='';
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now; T+=dt;
  physics(dt);
  if (state==='play') game(dt);
  updateFx(dt);
  renderGL(); renderOverlay();
  requestAnimationFrame(frame);
}
renderHud(); ofill.style.transform='scaleX(0)';
requestAnimationFrame(frame);
})();
</script>
</body>
