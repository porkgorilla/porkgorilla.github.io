/* ---------- 状態 ---------- */
let mode = 'title', paused = false;
let S = newState();
function newState(){
  return { room:'desk', known:{}, roomKnown:{ desk:true }, visited:{ desk:true }, exits:{}, gone:{}, inv:[], f:{},
    turns:0, lookTry:0, outTry:0, fixed:false, seen:{}, coffeeMade:false, pick:null };
}
const has = it => S.inv.includes(it);
function give(it){ if (!has(it)) S.inv.push(it); }
function drop(it){ S.inv = S.inv.filter(x => x !== it); }
function thingsHere(){ return ROOMS[S.room].things.filter(id => !S.gone[id]); }
function tLabel(id){
  if (S.known[id]){ const t = T[id]; return (t.n2 && S.seen[roomOf(id)]) ? t.n2 : t.n; }
  const all = ROOMS[roomOf(id)].things; return 'なにか' + 'ＡＢＣＤ'[all.indexOf(id)];
}
function roomOf(id){ return ROOM_ORDER.find(r => ROOMS[r].things.includes(id)); }
function rLabel(r){ return S.roomKnown[r] ? ROOMS[r].name : ROOMS[r].alias; }
function exitsHere(){
  const r = S.room, out = [];
  if (r === 'desk'){ if (S.exits.corridor) out.push('corridor'); }
  else if (r === 'corridor'){ out.push('desk'); ['kitchen', 'copy', 'meet', 'server'].forEach(x => { if (S.exits[x]) out.push(x); }); }
  else out.push('corridor');
  return out;
}

/* ---------- 表示 ---------- */
const logEl = $('log');
function say(txt, cls){
  const p = document.createElement('p'); if (cls) p.className = cls; p.textContent = txt; logEl.appendChild(p);
  while (logEl.children.length > 90) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
function dimOld(){ logEl.querySelectorAll('p:not(.old)').forEach(p => p.classList.add('old')); }
function refresh(){
  $('here').textContent = 'ここ：' + rLabel(S.room) + (S.roomKnown[S.room] ? '' : '(？)');
  $('inv').innerHTML = 'もちもの：' + (S.inv.length ? '<b>' + S.inv.map(i => ITEMS[i]).join('、') + '</b>' : 'なし');
  $('turns').textContent = '手数 ' + S.turns;
  document.querySelectorAll('.vb').forEach(b => {
    const k = b.dataset.v;
    if (k === 'look' || k === 'out'){
      b.classList.toggle('down', !S.fixed); b.classList.toggle('up', S.fixed);
      b.querySelector('small').textContent = S.fixed ? (k === 'look' ? 'みる' : 'でる') : '障害中';
    }
  });
}
function buildVerbs(){
  const box = $('verbs'); box.innerHTML = '';
  VERBS.forEach(([k, en, ja]) => {
    const b = document.createElement('button'); b.className = 'vb'; b.dataset.v = k;
    b.innerHTML = '<b>' + en + '</b><small>' + ja + '</small>';
    b.addEventListener('click', () => onVerb(k, b));
    box.appendChild(b);
  });
}
function showTargets(q, list){
  $('tgtQ').textContent = q;
  const box = $('tgtList'); box.innerHTML = '';
  list.concat([{ k:'__cancel', label:'× やめる', cls:'cancel' }]).forEach(o => {
    const b = document.createElement('button'); b.className = 'tb' + (o.cls ? ' ' + o.cls : ''); b.dataset.k = o.k; b.textContent = o.label;
    b.addEventListener('click', () => { if (o.k === '__cancel'){ sfx('key'); closeTargets(); } else o.fn(); });
    box.appendChild(b);
  });
  $('verbs').hidden = true; $('tgt').hidden = false; box.scrollTop = 0;
}
function closeTargets(){ $('tgt').hidden = true; $('verbs').hidden = false; S.pick = null; }
function thingOpts(fn, withAround){
  const o = [];
  if (withAround) o.push({ k:'around', label:'まわり', fn: () => fn('around') });
  thingsHere().forEach(id => o.push({ k:id, label:tLabel(id), cls:S.known[id] ? '' : 'unk', fn: () => fn(id) }));
  return o;
}

/* ---------- コマンド ---------- */
const LOOK_NG = ['LOOK は使えません。', 'LOOK は現在、障害中です。', '見ようとしないでください。', '目はあいています。コマンドが落ちているだけです。', 'LOOK は使えません。耳と鼻と手があります。', '何度押しても LOOK は使えません。'];
const OUT_NG = ['OUT は使えません。', 'OUT は現在、障害中です。', '部屋を出るときは GO を使ってください。OUT ではありません。', '退勤もできません。', 'ログアウトもできません。', '何度押しても OUT は使えません。'];
function onVerb(k, btn){
  if (mode !== 'play' || paused) return;
  if ((k === 'look' || k === 'out') && !S.fixed){
    const n = k === 'look' ? S.lookTry++ : S.outTry++, arr = k === 'look' ? LOOK_NG : OUT_NG;
    sfx('ng'); btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    say('> ' + VNAME[k], 'cmd'); say(arr[Math.min(n, arr.length - 1)], 'err'); return;
  }
  sfx('key');
  if (k === 'look'){ doLook(); return; }
  if (k === 'out'){
    showTargets('OUT：退勤しますか？', [{ k:'yes', label:'退勤する', fn: () => { closeTargets(); finish(); } }]); return;
  }
  if (k === 'go'){
    const ex = exitsHere();
    if (!ex.length){ echo('GO'); say('どっちへ行けばいいか、わからない。\nまわりを きく・かぐ・さわる で手がかりをさがそう。'); return; }
    showTargets('GO：どこへ？', ex.map(r => ({ k:r, label:(S.room !== 'corridor' && r === 'corridor' && S.roomKnown.corridor ? '廊下へもどる' : rLabel(r) + 'へ'), cls:S.roomKnown[r] ? '' : 'unk', fn: () => doGo(r) }))); return;
  }
  if (k === 'listen' || k === 'smell' || k === 'touch'){ showTargets(VNAME[k] + '：なにを？', thingOpts(id => doSense(k, id), true)); return; }
  if (k === 'take'){ showTargets('TAKE：なにを？', thingOpts(doTake)); return; }
  if (k === 'talk'){ showTargets('TALK：だれに？', thingOpts(doTalk)); return; }
  if (k === 'use'){
    const o = S.inv.map(it => ({ k:'i:' + it, label:ITEMS[it], fn: () => pickUseTarget(it) })).concat(thingOpts(doUseThing));
    showTargets('USE：なにを？', o); return;
  }
}
function echo(txt){ dimOld(); say('> ' + txt, 'cmd'); }
function turn(){ S.turns++; }
function identify(id){
  if (S.known[id]) return false; S.known[id] = true; sfx('id');
  const r = roomOf(id);
  if (ROOMS[r].key === id && !S.roomKnown[r]){ S.roomKnown[r] = true; say('ここは' + ROOMS[r].name + 'らしい。', 'sys'); }
  return true;
}
function doSense(v, id){
  closeTargets(); turn();
  if (id === 'around'){
    echo(VNAME[v] + ' まわり');
    const a = AROUND[S.room][v]; say(a.t);
    if (a.ex){
      let nu = false; a.ex.forEach(r => { if (!S.exits[r]){ S.exits[r] = true; nu = true; } });
      if (nu){ sfx('id'); say('GO で行ける場所がふえた。', 'sys'); }
      if (S.room === 'corridor' && !S.roomKnown.corridor){ S.roomKnown.corridor = true; say('ここは廊下らしい。', 'sys'); }
    }
  } else {
    echo(VNAME[v] + ' ' + tLabel(id));
    const r = T[id][v]; say(r.t); if (r.id) identify(id);
  }
  refresh();
}
function doTake(id){
  closeTargets(); turn(); echo('TAKE ' + tLabel(id));
  const t = T[id];
  if (!S.known[id]) say('正体のわからないものを持ち歩くのは、こわい。\nまずは きく・かぐ・さわる。');
  else if (t.item){
    if (id === 'cup' && (has('cup') || has('coffee'))) say('紙コップは、もう持っている。');
    else { give(t.item); if (!t.stay) S.gone[id] = true; sfx('get'); say(ITEMS[t.item] + 'を手に入れた。', 'sys'); }
  } else say(typeof t.take === 'function' ? t.take() : t.take);
  refresh();
}
function doTalk(id){
  closeTargets(); turn(); echo('TALK ' + tLabel(id));
  const t = T[id];
  if (t.talk){ if (t.person) identify(id); say(t.talk()); }
  else if (S.known[id]) say(t.n + 'に話しかけた。\n返事はない。');
  else say('話しかけてみた。\n返事がない。人ではないらしい。');
  refresh();
}
function doUseThing(id){
  closeTargets(); turn(); echo('USE ' + tLabel(id));
  if (!S.known[id]) say('なにかわからないものを使うのは、こわい。\nまずは きく・かぐ・さわる。');
  else say(T[id].use());
  refresh();
}
function pickUseTarget(it){
  sfx('key');
  const o = S.inv.filter(x => x !== it).map(x => ({ k:'i:' + x, label:ITEMS[x], fn: () => doUseOn(it, 'i:' + x) }))
    .concat(thingOpts(id => doUseOn(it, id)));
  showTargets('USE ' + ITEMS[it] + '：なにに？', o);
}
function doUseOn(it, tg){
  closeTargets(); turn();
  const isItem = tg.startsWith('i:'), tid = isItem ? tg.slice(2) : tg;
  echo('USE ' + ITEMS[it] + ' → ' + (isItem ? ITEMS[tid] : tLabel(tid)));
  if (!isItem && !S.known[tid]){ say('なにかわからないものに使うのは、こわい。\nまずは きく・かぐ・さわる。'); refresh(); return; }
  const pair = (a, b) => (it === a && tid === b) || (it === b && tid === a && isItem);
  const f = S.f;
  if (isItem && pair('pen', 'fusen')){
    if (!f.need) say('書くことが、まだない。\nメールなら書くことは山ほどあるのに。');
    else { drop('fusen'); give('memo'); sfx('get'); say('付箋に「サーバー再起動の承認をおねがいします」と書いた。\n字がまっすぐ書けたかは、わからない。'); say('承認依頼メモを手に入れた。', 'sys'); }
  }
  else if (it === 'pen' && tid === 'fusen') say('付箋を手に取ってからにしよう。');
  else if (isItem && pair('pen', 'memo')) say('もう書いてある。たぶん。');
  else if (it === 'memo' && tid === 'door'){
    drop('memo'); give('memoOK'); sfx('get');
    say('ドアの下のすきまに、メモをすべりこませた。\n……\n部長「なんだこの字は。……まあいい」\nポン、という音。\nメモがすべり出てきた。朱肉のにおいがする。承認されたらしい。'); say('承認ずみメモを手に入れた。', 'sys');
  }
  else if (it === 'memoOK' && tid === 'door') say('もう承認はもらった。朱肉のにおいがその証拠だ。');
  else if ((it === 'fusen' || it === 'pen') && tid === 'door') say(f.need ? '先に、付箋になにか書いたほうがよさそうだ。' : 'ドアに用事はまだない。');
  else if (it === 'memo' && tid === 'tanaka'){ identify('tanaka'); say('田中「これ、部長のハンコがないと……。朱肉のにおいがしません」'); }
  else if (it === 'memoOK' && tid === 'tanaka'){
    identify('tanaka'); drop('memoOK'); f.approved = true; if (!f.need) f.need = true;
    say('田中「(クンクン)……朱肉のにおい。承認、たしかに」');
    if (f.coffee) recover(); else say('田中「あとはパスワードを打つだけ……なんですが、眠くて思い出せない……。\nコーヒーがあれば……」');
  }
  else if (it === 'cup' && tid === 'maker'){ drop('cup'); give('coffee'); S.coffeeMade = true; sfx('get'); say('紙コップにコーヒーを注いだ。\nあふれたかどうかは、手があつくなったのでわかった。'); say('コーヒーを手に入れた。', 'sys'); }
  else if (it === 'coffee' && tid === 'maker') say('もどすのは、やめておく。');
  else if (it === 'coffee' && tid === 'tanaka'){
    identify('tanaka'); drop('coffee'); f.coffee = true;
    say('田中「あっ、コーヒー……(ズズッ)……目がさめました」');
    if (f.approved) recover(); else say(f.need ? '田中「でも、部長の承認がないと再起動できないんです」' : '田中「ところで、どちらさまですか。見えなくて」');
  }
  else if (it === 'coffee' && tid === 'sato'){ identify('sato'); say('佐藤「あ、もう飲んでるんで」'); }
  else if (it === 'coffee' && tid === 'door') say('すきまから流しこむのは、さすがにまずい。');
  else if (it === 'coffee' && (tid === 'pc' || tid === 'server' || tid === 'copier')) say('それだけは、やめておく。');
  else if (it === 'coffee' && tid === 'plant') say(S.seen.corridor ? '山本さんにかけるのは、やめておく。' : 'コーヒーをやるのは、植物によくない。');
  else if (it === 'cup' && tid === 'tanaka'){ identify('tanaka'); say('田中「……からっぽですね」'); }
  else if (!isItem && T[tid].person){ identify(tid); say(T[tid].n + '「？ ……いえ、けっこうです」'); }
  else say('うまく使えない。');
  refresh();
}
function doGo(r){

}

function doLook(){
  turn(); echo('LOOK');
  const r = S.room; S.seen[r] = true; S.roomKnown[r] = true; ROOMS[r].things.forEach(id => S.known[id] = true);
  sfx('id'); say(LOOK_T[r]());
  if (Object.keys(S.seen).length === 1) say('OUT を押すと、いつでも退勤できる。', 'sys');
  refresh(); picDirty = true;
}
function recover(){
  S.fixed = true; S.known.server = true; S.known.tanaka = true; S.roomKnown.server = true;
  say('田中「思い出した……Enter！」\nサーバーが「ポーン」と鳴った。\n田中「あ。設定の OUT と LOOK のあいだに、空白が入ってました」');
  say('「OUT」と「LOOK」が復旧しました。', 'sys');
  say('LOOK を押してみよう。', 'sys');
  sfx('fix'); picDirty = true; flashT = 0;
  document.querySelectorAll('.vb').forEach(b => { if (b.dataset.v === 'look' || b.dataset.v === 'out'){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); } });
}

/* ---------- 画面の切り替え ---------- */
function refreshHome(){
  const on = (mode === 'title' || mode === 'result') && !paused, a = $('homeLink');
  a.style.visibility = on ? '' : 'hidden'; a.tabIndex = on ? 0 : -1;
  if (on) a.removeAttribute('aria-hidden'); else a.setAttribute('aria-hidden', 'true');
}
function shareHref(text){ return 'https://x.com/intent/post?text=' + encodeURIComponent(text + ' ' + HASHTAG) + '&url=' + encodeURIComponent(SHARE_URL); }
function setShare(el, text){
  el.href = shareHref(text);
  if (matchMedia('(pointer: coarse)').matches){ el.removeAttribute('target'); el.removeAttribute('rel'); }
}
function show(m){
  mode = m;
  $('titleOv').hidden = m !== 'title'; $('resultOv').hidden = m !== 'result';
  $('pauseBtn').hidden = m !== 'play'; $('turns').hidden = m !== 'play';
  if (m === 'title'){
    const b = parseInt(lsGet(K_BEST), 10);
    $('bestLine').textContent = b > 0 ? '最少記録：' + b + ' 手' : '';
    setShare($('shareTitle'), '「' + GAME_NAME + '」メールが落ちた朝、ゲームの LOOK と OUT も落ちた。手さぐりで復旧させるテキストアドベンチャー');
  }
  refreshHome(); fitBtns();
}
function start(){
  initAudio(true);
  S = newState(); logEl.innerHTML = ''; closeTargets();
  document.querySelectorAll('.vb').forEach(b => b.classList.remove('pop', 'shake'));
  show('play'); refresh(); picDirty = true;
  say('午前9時。メールソフトが落ちた。\nついでに、このゲームの「LOOK」と「OUT」も落ちた。', 'sys');
  say('あなたは自分の席にすわっている。それだけは、おしりでわかる。\nまわりに、なにかが 3つ ある気配がする。');
  say('まずは LISTEN・SMELL・TOUCH で、まわりや「なにか」をしらべよう。', 'sys');
  sfx('key');
}
function rankOf(n){ return n <= 34 ? '心眼の社員' : n <= 48 ? '手さぐり上手' : n <= 70 ? 'ふつうの会社員' : '迷える会社員'; }
function finish(){
  turn();
  const n = S.turns, rank = rankOf(n), seen = Object.keys(S.seen).length;
  const b = parseInt(lsGet(K_BEST), 10); if (!(b > 0) || n < b) lsSet(K_BEST, String(n));
  $('rTurns').textContent = n; $('rRank').textContent = '称号：' + rank;
  $('rLook').textContent = S.lookTry + ' 回'; $('rOut').textContent = S.outTry + ' 回'; $('rSeen').textContent = seen + ' / 6';
  setShare($('shareResult'), '「' + GAME_NAME + '」を ' + n + ' 手で復旧して、午前10時に退勤した(称号：' + rank + '、使えないLOOKを押した回数：' + S.lookTry + '回)');
  show('result');
}
function backToTitle(){ paused = false; $('pauseOv').hidden = true; disarmAll(); show('title'); picDirty = true; }
function openPause(){
  if (mode !== 'play') return; paused = true; $('pauseOv').hidden = false; disarmAll();
  setShare($('sharePause'), '「' + GAME_NAME + '」で手さぐり中(' + S.turns + '手目、' + (S.fixed ? '復旧ずみ' : 'LOOK と OUT はまだ使えない') + ')');
  refreshHome(); fitBtns();
}
function closePause(){ paused = false; $('pauseOv').hidden = true; disarmAll(); refreshHome(); if (AC && AC.state === 'suspended') AC.resume(); }
const armed = {};
function twoTap(btn, label, fn){
  btn.addEventListener('click', () => {
    const a = armed[btn.id];
    if (!a || !a.on){
      armed[btn.id] = { on:true, label, btn, timer:setTimeout(() => disarm(btn.id), 3000) };
      btn.textContent = '本当に？(もう一度)'; btn.classList.add('danger'); fitBtns(); return;
    }
    disarm(btn.id); fn();
  });
}
function disarm(id){ const a = armed[id]; if (!a) return; clearTimeout(a.timer); a.on = false; a.btn.textContent = a.label; a.btn.classList.remove('danger'); fitBtns(); }
function disarmAll(){ Object.keys(armed).forEach(disarm); }
function fitBtns(){
  document.querySelectorAll('.go').forEach(b => {
    b.style.fontSize = ''; if (!b.offsetParent) return;
    let fs = parseFloat(getComputedStyle(b).fontSize) || 15, k = 0;
    while (k++ < 8 && fs > 10 && b.scrollWidth > b.clientWidth + 1){ fs -= 1; b.style.fontSize = fs + 'px'; }
  });
}

/* ---------- 絵の窓 ---------- */
const cv = $('pic'), cx = cv.getContext('2d'), PW = 320, PH = 112;
let picDirty = true, noiseAcc = 0, flashT = 9, last = 0;
const R = (x, y, w, h, c) => { cx.fillStyle = c; cx.fillRect(x, y, w, h); };
function fitFont(size, txt, maxW){
  cx.font = size + 'px ' + '"DotGothic16",monospace';
  const w = cx.measureText(txt).width;
  if (w > maxW && w > 0){ size = Math.max(6, size * maxW / w); cx.font = size + 'px "DotGothic16",monospace'; }
  return size;
}
function label(txt, y, c, size){
  cx.textAlign = 'center'; cx.textBaseline = 'middle'; const s = fitFont(size || 16, txt, PW - 24);
  const w = cx.measureText(txt).width; R(PW / 2 - w / 2 - 6, y - s / 2 - 3, w + 12, s + 6, 'rgba(0,0,0,.78)');
  cx.fillStyle = c; cx.fillText(txt, PW / 2, y + 1);
}
function person(x, y, shirt, hair){ R(x, y, 10, 10, '#f0c9a0'); R(x, y, 10, 3, hair || '#222'); R(x - 3, y + 10, 16, 22, shirt); R(x - 1, y + 32, 5, 12, '#223'); R(x + 6, y + 32, 5, 12, '#223'); }
function room(wall, floor){ R(0, 0, PW, 76, wall); R(0, 76, PW, PH - 76, floor); R(0, 74, PW, 2, '#0006'); }
const SCENE = {
  desk(){ room('#1d2a6b', '#3a3550'); R(40, 62, 240, 8, '#a36b3a'); R(50, 70, 6, 30, '#7a4d26'); R(264, 70, 6, 30, '#7a4d26');
    R(120, 22, 80, 40, '#111'); R(124, 26, 72, 32, '#38d6ff'); R(154, 62, 12, 3, '#555');
    for (let i = 0; i < 14; i++) R(118 + (i % 7) * 12, i < 7 ? 16 : 60, 9, 7, i % 2 ? '#ffd23f' : '#ff9fd0');
    R(60, 52, 22, 10, '#ddd'); R(62, 48, 8, 5, '#bbb'); R(226, 56, 16, 6, '#ffd23f'); },
  corridor(){ room('#2a3470', '#4a4a5a'); for (let i = 0; i < 4; i++){ R(20 + i * 80, 20, 34, 56, '#16204f'); R(48 + i * 80, 48, 3, 5, '#ffd23f'); }
    person(262, 34, '#7d8aa8', '#333'); R(259, 30, 6, 4, '#5be37a'); R(266, 27, 5, 5, '#5be37a'); cx.fillStyle = '#fff'; cx.font = '10px monospace'; cx.textAlign = 'left'; cx.fillText('z z', 278, 30); },
  kitchen(){ room('#3a5a4a', '#555a5a'); R(20, 50, 180, 26, '#ddd'); R(20, 50, 180, 4, '#aaa'); R(40, 26, 26, 24, '#222'); R(46, 38, 14, 12, '#6b3a1a'); R(44, 22, 18, 4, '#444');
    R(90, 38, 10, 12, '#fff'); R(104, 38, 10, 12, '#fff'); R(150, 44, 30, 6, '#99a'); person(240, 34, '#e88', '#422'); R(254, 44, 8, 3, '#f0c9a0'); R(260, 38, 6, 8, '#fff');
    if (S.coffeeMade) for (let i = 0; i < 6; i++) R(60 + i * 34, 86 + (i % 2) * 8, 5, 3, '#6b3a1a'); },
  copy(){ room('#4a3a6a', '#55505f'); R(40, 30, 70, 46, '#e0e0e0'); R(40, 30, 70, 8, '#bbb'); R(48, 44, 22, 10, '#38d6ff'); R(44, 66, 62, 4, '#999'); R(110, 52, 18, 3, '#fff');
    R(170, 40, 60, 36, '#a36b3a'); R(174, 34, 52, 6, '#fff'); R(174, 28, 52, 6, '#eee');
    R(256, 54, 34, 24, '#3a2a1a'); R(264, 46, 18, 8, '#3a2a1a'); R(266, 48, 14, 6, '#4a3a6a'); R(262, 52, 8, 4, '#ff9a2a'); R(274, 51, 7, 4, '#ff9a2a'); },
  meet(){ room('#5a4a3a', '#5f5a50'); R(120, 10, 80, 66, '#7a4d26'); R(124, 14, 72, 60, '#8f5d30'); R(186, 44, 5, 8, '#ffd23f'); R(140, 22, 40, 14, '#fff');
    cx.fillStyle = '#c00'; cx.font = '11px "DotGothic16",monospace'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('空室', 160, 30); R(120, 76, 80, 2, '#000'); },
  server(){ room('#10202a', '#2a3a40'); for (let i = 0; i < 3; i++){ R(20 + i * 50, 12, 40, 64, '#111'); for (let j = 0; j < 7; j++){ R(24 + i * 50, 16 + j * 8, 32, 5, '#223'); R(26 + i * 50, 17 + j * 8, 3, 3, (i + j) % 3 ? '#5be37a' : '#ffd23f'); } }
    R(190, 58, 60, 6, '#666'); R(200, 34, 36, 24, '#111'); R(203, 37, 30, 18, '#38d6ff'); person(268, 34, '#4a7', '#111'); R(262, 26, 6, 9, '#fff'); R(264, 35, 3, 10, '#f0c9a0'); }
};
function drawPic(dt){
  if (cv.clientWidth < 1 || cv.clientHeight < 1) return;
  if (!S.fixed || mode !== 'play'){
    noiseAcc += dt; if (noiseAcc < .12 && !picDirty) return; noiseAcc = 0; picDirty = false;
    R(0, 0, PW, PH, '#05060c');
    for (let i = 0; i < 70; i++){ const g = 20 + Math.random() * 50 | 0; R(Math.random() * PW | 0, Math.random() * PH | 0, 2 + Math.random() * 14 | 0, 2, 'rgb(' + g + ',' + g + ',' + (g + 20) + ')'); }
    label('LOOK できません', PH / 2 - 10, '#ff5a6a', 18); label('(画面が見えないのは仕様です)', PH / 2 + 14, '#8b96c9', 11); return;
  }
  if (flashT < 2.2){ flashT += dt; picDirty = true; }
  if (!picDirty) return; picDirty = false;
  if (S.seen[S.room]){ SCENE[S.room](); label(ROOMS[S.room].name, PH - 11, '#ffd23f', 12); }
  else { R(0, 0, PW, PH, '#0b1030'); label('LOOK を押してください', PH / 2, '#5be37a', 16); }
  if (flashT < 2.2 && Math.floor(flashT * 6) % 2 === 0){ R(0, 0, PW, PH, 'rgba(91,227,122,.25)'); label('OUT + LOOK 復旧', 16, '#5be37a', 14); }
}
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  if (paused) return;
  try { drawPic(dt); } catch(e){ console.error(e); }
}

/* ---------- 起動 ---------- */
buildVerbs(); drawSnd(); refresh(); show('title');
$('startBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', start);
$('titleBtn').addEventListener('click', backToTitle);
$('pauseBtn').addEventListener('click', openPause);
$('resumeBtn').addEventListener('click', closePause);
twoTap($('pTitleBtn'), 'タイトルへ', backToTitle);
twoTap($('pSiteBtn'), 'サイトのトップへ', () => { location.href = '/'; });
$('sndBtn').addEventListener('click', () => { soundOn = !soundOn; lsSet(K_SND, soundOn ? '1' : '0'); drawSnd(); if (soundOn){ initAudio(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC) initAudio(); });
window.addEventListener('resize', () => { picDirty = true; fitBtns(); });
window.addEventListener('load', () => requestAnimationFrame(fitBtns));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { picDirty = true; requestAnimationFrame(fitBtns); });
requestAnimationFrame(loop);
</script>
