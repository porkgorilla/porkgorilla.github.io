<script>
(() => {
'use strict';
// ===== 設定 =====
const GAME_NAME = 'パパイヤ頭突き';
const GAME_URL = 'https://porkgorilla.com/works/papaya-zutsuki.html';
const OG_CACHE_VERSION = 1;
const SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const HASHTAG = '#パパイヤ頭突き';
const KEY_BEST = 'papaya-zutsuki-best', KEY_SND = 'papaya-zutsuki-sound';
const FF = '"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';

if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };
}
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), game = $('game');
const W = 420, H = 640, GROUND = 560, G = 900, GP = 420;
const HIP = { x: 112, y: 518 };
const HC = { x: 18, y: -136 };          // 頭の中心(腰からの相対)
const FORE = { x: 50, y: -166 };        // おでこ(腰からの相対)
const LUNGE_IN = .07, LUNGE_HOLD = .05, LUNGE_OUT = .17, LUNGE_A = .5, RETAP = .2, WHIFF_CD = .38;
const rot = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return { x: p.x * c - p.y * s, y: p.x * s + p.y * c }; };
const STRIKE = (() => { const r = rot(FORE, LUNGE_A); return { x: HIP.x + r.x, y: HIP.y + r.y }; })();
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let best = parseInt(lsGet(KEY_BEST) || '0', 10) || 0;
let soundOn = lsGet(KEY_SND) !== '0';

// ===== モジャモジャ髪(固定の乱数で形を決める) =====
const HAIR = (() => {
  let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const out = [];
  for (let i = 0; i < 400 && out.length < 58; i++) {
    const a = r() * Math.PI * 2, d = Math.sqrt(r());
    const x = -16 + Math.cos(a) * 88 * d, y = -194 + Math.sin(a) * 64 * d;
    if (x > 4 && y > -200) continue;          // おでこは広く出す(髪は後ろへ)
    if (x > -10 + (y + 200) * -.15 && y > -200) continue;
    if (y > -116) continue;                     // あごまわりは出す
    if (x > -8 && y > -160) continue;           // 顔は出す
    out.push({ x, y, r: 14 + r() * 9, s: r() * 6.28, w: r() < .5 ? 1 : -1 });
  }
  return out.sort((p, q) => p.y - q.y);
})();

// ===== 状態 =====
function fresh() {
  return {
    mode: 'title', t: 0, gameT: 0, score: 0, lives: 3, combo: 0, maxCombo: 0, splits: 0, perfects: 0, dodges: 0,
    items: [], halves: [], parts: [], splats: [], texts: [], crowd: [], ebb: 0, party: false, band: false,
    lunge: -1, checked: false, hitThis: false, whiffed: false, cd: 0, stun: 0, stunType: '', squint: 0, bruise: 0,
    shake: 0, hitstop: 0, hl: 0, hv: 0, hairS: 1, plan: null, hzRow: 0, dieT: 0, flash: 0, feverT: 0, blink: 3
  };
}
let S = fresh();

// ===== 画面サイズ =====
let cw = 0, ch = 0, dpr = 1, SC = 1, ox = 0, oy = 0, VL = 0, VR = W, VT = 0, VB = H, OXOFF = 0;
// 描画用のカメラ(タイトル画面ではおじさんに寄る)。ゲームの判定は上の SC/ox/oy を使う
const cam = { sc: 1, ox: 0, oy: 0, init: false };
function camTarget() {
  if (S.mode === 'title' && !titleOv.hidden) {
    const card = titleOv.querySelector('.card').getBoundingClientRect(), g = game.getBoundingClientRect();
    const A = card.top - g.top - 6;               // カードより上の空き
    if (A > 150) {
      const t = Math.min(cw / 330, A / 340, SC * 2.2);
      return { sc: t, ox: cw / 2 - 150 * t, oy: A / 2 + 6 - 405 * t };
    }
  }
  return { sc: SC, ox: ox + OXOFF, oy };
}
function resize() {
  const r = game.getBoundingClientRect();
  if (r.width < 1 || r.height < 1) return false;
  cw = r.width; ch = r.height;
  dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(cw * dpr)); cv.height = Math.max(1, Math.round(ch * dpr));
  SC = Math.min(cw / W, ch / H);
  ox = (cw - W * SC) / 2; oy = (ch - H * SC) / 2;
  VL = -ox / SC; VR = (cw - ox) / SC; VT = -oy / SC; VB = (ch - oy) / SC;
  return true;
}
if (window.ResizeObserver) new ResizeObserver(() => { resize(); fitHUD(); fitBtns(); }).observe(game);
window.addEventListener('resize', () => { resize(); fitHUD(); fitBtns(); });

// ===== 音 =====
let AC = null, master = null, NB = null;
function initAudio(force) {
  if (AC && force) { try { AC.close().catch(() => {}); } catch (e) {} AC = null; }
  else if (AC) { if (AC.state === 'closed') AC = null; else { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; } }
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AC = new C(); master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination);
    NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (AC.state === 'suspended') AC.resume().catch(() => {});
  } catch (e) { AC = null; }
}
function envG(g, t, a, peak, d) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
function tone(type, f, t, dur, vol, f2, dest) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  envG(g, t, .004, vol, dur); o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + .05);
}
function noise(t, dur, vol, ft, f, q, f2) {
  const s = AC.createBufferSource(); s.buffer = NB;
  const fl = AC.createBiquadFilter(); fl.type = ft; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur); fl.Q.value = q || 1;
  const g = AC.createGain(); envG(g, t, .004, vol, dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
}
function sfx(type, force) {
  if (!AC || !soundOn) return;
  if (!force && S.mode !== 'play' && S.mode !== 'dying') return;   // タイトル・一時停止中は鳴らさない
  const t = AC.currentTime + .005;
  switch (type) {
    case 'whoosh': noise(t, .1, .25, 'bandpass', 600, 1.2, 2400); break;
    case 'whiff': tone('sine', 380, t, .12, .12, 220); break;
    case 'split':
      noise(t, .16, .7, 'lowpass', 2600, .8, 500); tone('sine', 170, t, .16, .7, 55);
      noise(t + .02, .09, .3, 'bandpass', 1400, 3); break;
    case 'perfect':
      tone('triangle', 1318.5, t + .03, .18, .18); tone('triangle', 1975.5, t + .09, .26, .16); break;
    case 'gold':
      [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone('triangle', f, t + .03 + i * .05, .22, .15)); break;
    case 'clang':
      [1180, 2650, 3920, 5100].forEach((f, i) => tone('sine', f, t, .7 - i * .12, .22 / (i + 1)));
      tone('sine', 220, t, .12, .4, 90); break;
    case 'ouch':
      noise(t, .12, .5, 'lowpass', 900, 1); tone('square', 330, t + .02, .32, .12, 140); break;
    case 'boing': tone('sine', 220, t, .16, .3, 480); tone('sine', 480, t + .1, .12, .14, 260); break;
    case 'drop':
      noise(t, .2, .55, 'lowpass', 1100, .7, 200); tone('sine', 110, t, .2, .6, 45);
      tone('triangle', 392, t + .12, .16, .12); tone('triangle', 311, t + .26, .3, .12); break;
    case 'combo':

// ===== 更新 =====
function update(dt) {

  S.blink -= dt; if (S.blink < -.12) S.blink = rand(2, 4.5);
  if (S.mode === 'title') {   // タイトル画面: ときどき素振りの頭突き(音・記録なし)
    S.demo = (S.demo || 0) + dt;
    if (S.lunge < 0 && S.demo > 2.6) { S.demo = 0; S.lunge = 0; }
    if (S.lunge >= 0) { S.lunge += dt; if (S.lunge > LUNGE_IN + LUNGE_HOLD + LUNGE_OUT) S.lunge = -1; }
  }
  if (S.mode === 'title' || S.mode === 'pause' || S.mode === 'over') { if (S.mode !== 'pause') updFx(dt); return; }
  if (S.hitstop > 0) { S.hitstop -= dt; return; }
  let g = dt;
  if (S.mode === 'dying') { g = dt * .35; S.dieT += dt; if (S.dieT > 1.3) { showResult(); return; } }
  S.gameT += g;
  if (S.cd > 0) S.cd -= g; if (S.stun > 0) S.stun -= g; if (S.squint > 0) S.squint -= g;
  if (S.bruise > 0) S.bruise -= g * .4; if (S.flash > 0) S.flash -= g;
  if (S.combo >= 20) S.feverT += g; else S.feverT = 0;
  if (S.lunge >= 0) {
    S.lunge += g;
    if (!S.checked && S.lunge >= LUNGE_IN) { S.checked = true; S.hitThis = judge(true); }
    else if (S.checked && !S.hitThis && S.lunge < LUNGE_IN + LUNGE_HOLD) S.hitThis = judge(false);
    if (S.checked && !S.hitThis && !S.whiffed && S.lunge >= LUNGE_IN + LUNGE_HOLD) { S.whiffed = true; whiff(); }
    if (S.lunge > LUNGE_IN + LUNGE_HOLD + LUNGE_OUT) S.lunge = -1;

    if (it.state === 'rest') { it.x += it.vx * g; it.vx *= Math.pow(.05, g); it.rot += it.vx / 18 * g; it.life -= g; if (it.life <= 0) it.state = 'gone'; continue; }

}
function updFx(g) {

    h.vy += G * g; h.x += h.vx * g; h.y += h.vy * g; h.rot += h.vr * g;
    if (h.vy > 0 && h.y > GROUND - 8) { h.y = GROUND - 8; h.state = 'rest'; h.rot = h.side < 0 ? 0 : Math.PI; h.vx *= .4; }
  }

const rankOf = sc => { let r = RANKS[0][1]; for (const [b, n] of RANKS) if (sc >= b) r = n; return r; };
function showTitle() {
  S = fresh(); S.mode = 'title'; hudKey = ''; updHUD();
  setBgm(false);
  overOv.hidden = true; pauseOv.hidden = true; titleOv.hidden = false;
  $('pauseBtn').hidden = true; $('sndBtn').hidden = false;
  $('bestT').textContent = best > 0 ? `自己ベスト ${best.toLocaleString('ja-JP')}点（${rankOf(best)}）` : 'おでこを磨いて、いざ南国へ。';
  setShare($('shareT'), `${GAME_NAME}｜モジャモジャ頭のおじさんが、飛んでくるパパイヤをおでこで割りまくるゲーム`);
  refreshHome(); requestAnimationFrame(fitBtns);
}
function startGame() {
  initAudio(true);
  S = fresh(); S.mode = 'play'; hudKey = ''; updHUD();
  titleOv.hidden = true; overOv.hidden = true; pauseOv.hidden = true;
  $('pauseBtn').hidden = false; $('sndBtn').hidden = true;
  setBgm(true); sfx('start');
  refreshHome();
  addText('パパイヤ、来るぞ！', W / 2, 220, { col: '#fff36b', size: 30, life: 1.4, vy: -10 });
}
function pauseGame() {
  if (S.mode !== 'play') return;
  S.mode = 'pause'; setBgm(false); disarm();
  $('pauseInfo').textContent = `いま ${S.score.toLocaleString('ja-JP')}点・${S.splits}個割った・ライフ${S.lives}`;
  setShare($('shareP'), `${GAME_NAME}でパパイヤを${S.splits}個割ってる途中（${S.score.toLocaleString('ja-JP')}点）`);
  pauseOv.hidden = false; refreshHome(); requestAnimationFrame(fitBtns);
}
function resumeGame() {
  if (S.mode !== 'pause') return;
  initAudio(false);
  pauseOv.hidden = true; disarm(); S.mode = 'play'; setBgm(true); last = performance.now(); refreshHome();
}
function showResult() {
  S.mode = 'over'; setBgm(false);
  $('pauseBtn').hidden = true; $('sndBtn').hidden = false; pauseOv.hidden = true;
  const isNew = S.score > best && S.score > 0;
  if (isNew) { best = S.score; lsSet(KEY_BEST, String(best)); }
  const rank = rankOf(S.score);
  $('rHead').textContent = S.lives > 0 ? 'ここで完成！' : '試合終了';
  $('rTitle').textContent = rank;
  $('rScore').textContent = S.score.toLocaleString('ja-JP') + '点';
  $('rBest').innerHTML = isNew ? '自己ベスト更新！<span class="rnew">NEW</span>' : `自己ベスト ${best.toLocaleString('ja-JP')}点`;
  $('rSplit').textContent = S.splits; $('rCombo').textContent = S.maxCombo; $('rPerf').textContent = S.perfects;
  setShare($('shareR'), `${GAME_NAME}でパパイヤを${S.splits}個割って${S.score.toLocaleString('ja-JP')}点！最大${S.maxCombo}コンボ【${rank}】`);
  overOv.hidden = false; refreshHome(); requestAnimationFrame(fitBtns);
  sfx('over', true);
}
// 「ここで終える」は2回押し
// 一時停止画面の「ここで終える」「サイトのトップへ」は2回押しで確認
function twoTap(btn, label, action) {
  let armed = false, tm = null;
  const dis = () => { armed = false; clearTimeout(tm); btn.textContent = label; btn.classList.remove('danger'); btn.classList.add('ghost'); fitBtns(); };
  btn.addEventListener('click', () => {
    if (!armed) { armed = true; btn.textContent = '本当に？もう一度'; btn.classList.add('danger'); btn.classList.remove('ghost'); clearTimeout(tm); tm = setTimeout(dis, 3000); fitBtns(); return; }
    dis(); action();
  });
  return dis;
}
const disEnd = twoTap($('endBtn'), 'ここで終える', () => showResult());
const disSite = twoTap($('siteBtn'), 'サイトのトップへ', () => { location.href = '/'; });
function disarm() { disEnd(); disSite(); }
// 左上のトップへのリンクは、タイトル画面とリザルト画面だけで押せる
function refreshHome() {
  const on = S.mode === 'title' || S.mode === 'over';
  const a = $('homeLink');
  a.style.visibility = on ? '' : 'hidden';
  a.tabIndex = on ? 0 : -1;
  if (on) a.removeAttribute('aria-hidden'); else a.setAttribute('aria-hidden', 'true');
}
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('titleBtn').addEventListener('click', showTitle);
$('pauseBtn').addEventListener('click', pauseGame);
$('resumeBtn').addEventListener('click', resumeGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); else if (AC) initAudio(false); });

// ===== 入力 =====
cv.addEventListener('pointerdown', e => { e.preventDefault(); tryHeadbutt(); });
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.code;
  if (k === 'Space' || k === 'ArrowDown' || k === 'KeyJ' || k === 'Enter') {
    if (S.mode === 'play') { e.preventDefault(); tryHeadbutt(); }
    else if (S.mode === 'title' && k !== 'Enter' && document.activeElement === document.body) { e.preventDefault(); startGame(); }
  } else if (k === 'Escape' || k === 'KeyP') {
    if (S.mode === 'play') pauseGame(); else if (S.mode === 'pause') resumeGame();
  }
});

// ===== ループ =====
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;
  if (cw < 1 || ch < 1) { resize(); return; }
  renderDt = dt;
  try { update(dt); updHUD(); render(); } catch (e) { console.error(e); }
}
updSnd(); resize(); showTitle();
requestAnimationFrame(loop);
})();
</script>
</body>
