<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PASSWORD_GEN | porkgorilla://</title>
  <meta name="description" content="長さと文字種を選べるパスワード生成ツール。ブラウザ内で生成し、送信はしません。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBT4300J0L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MBT4300J0L');
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    main { padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    h1 { margin: 0; font-size: 1.6rem; }
    .box { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }
    input { font-family: var(--cyber-font); font-size: 1rem; background: var(--cyber-bg-panel); color: var(--cyber-text);
      border: 1px solid var(--cyber-green-dim); }
    #out { width: 100%; box-sizing: border-box; text-align: center; font-size: 1.2rem; padding: 14px 8px; color: var(--cyber-green); }
    label { color: var(--cyber-green-dim); font-size: .85rem; }
    .opt { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--cyber-text); font-size: .95rem; }
    .opt input { flex: 0 0 auto; accent-color: var(--cyber-green); }
    input[type=range] { width: 100%; padding: 0; accent-color: var(--cyber-green); }
    #strength { height: 6px; background: var(--cyber-green-faint); margin-top: 6px; }
    #bar { height: 100%; width: 0; background: var(--cyber-green); transition: width .2s, background .2s; }
    .btns { display: flex; gap: 10px; margin-top: 12px; }
    .btns .btn { flex: 1; }
    .credit { font-size: 11px; color: var(--cyber-green-dim); margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>🔑 PASSWORD_GEN</h1>
    <div class="box panel">
      <input id="out" readonly aria-label="生成されたパスワード">
      <div id="strength"><div id="bar"></div></div>
      <div style="margin-top:14px">
        <label>長さ: <b id="lenv">16</b></label>
        <input type="range" id="len" min="4" max="64" value="16">
      </div>
      <label class="opt"><input type="checkbox" id="lo" checked> 小文字 (a-z)</label>
      <label class="opt"><input type="checkbox" id="up" checked> 大文字 (A-Z)</label>
      <label class="opt"><input type="checkbox" id="nu" checked> 数字 (0-9)</label>
      <label class="opt"><input type="checkbox" id="sy"> 記号 (!@#$…)</label>
      <label class="opt"><input type="checkbox" id="am"> 紛らわしい文字を除く (0 O o 1 l I)</label>
      <div class="btns">
        <button class="btn" id="gen" type="button">GENERATE</button>
        <button class="btn" id="copy" type="button">COPY</button>
      </div>
    </div>
    <div class="credit">porkgorilla — 2026 // ブラウザ内で生成。どこにも送信しません</div>
  </main>

  <script src="/site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const SETS = { lo: 'abcdefghijklmnopqrstuvwxyz', up: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', nu: '0123456789', sy: '!@#$%^&*()-_=+[]{};:,.?' };
    function rnd(n) { // 剰余バイアスのない乱数
      const lim = Math.floor(0x100000000 / n) * n, b = new Uint32Array(1);
      do { crypto.getRandomValues(b); } while (b[0] >= lim);
      return b[0] % n;
    }
    function gen() {
      const strip = s => $('am').checked ? s.replace(/[0Oo1lI]/g, '') : s;
      const sets = Object.keys(SETS).filter(k => $(k).checked).map(k => strip(SETS[k]));
      const len = +$('len').value, all = sets.join('');
      const chars = sets.map(s => s[rnd(s.length)]); // 各文字種を最低1文字含める
      while (chars.length < len) chars.push(all[rnd(all.length)]);
      chars.length = len;
      for (let i = chars.length - 1; i > 0; i--) { const j = rnd(i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
      $('out').value = chars.join('');
      const bits = len * Math.log2(all.length);
      $('bar').style.width = Math.min(100, bits / 128 * 100) + '%';
      $('bar').style.background = bits < 50 ? 'var(--cyber-red)' : bits < 80 ? '#ffd24d' : 'var(--cyber-green)';
    }
    $('len').oninput = () => { $('lenv').textContent = $('len').value; gen(); };
    ['lo', 'up', 'nu', 'sy', 'am'].forEach(k => $(k).onchange = () => {
      if (!['lo', 'up', 'nu', 'sy'].some(x => $(x).checked)) $('lo').checked = true;
      gen();
    });
    $('gen').onclick = gen;
    $('copy').onclick = async () => {
      try { await navigator.clipboard.writeText($('out').value); }
      catch (e) { $('out').select(); document.execCommand('copy'); }
      $('copy').textContent = 'COPIED!'; setTimeout(() => $('copy').textContent = 'COPY', 1500);
    };
    gen();
  </script>
</body>
</html>
