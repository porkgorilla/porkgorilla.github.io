<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>15 PUZZLE | porkgorilla://</title>
  <meta name="description" content="定番のスライドパズル。数字を1から15の順に並べよう。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBT4300J0L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MBT4300J0L');
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 16px;
      user-select: none;
      -webkit-user-select: none;
      text-align: center;
    }
    h1 { margin: 0; font-size: 1.6rem; }
    #info { font-size: 1.1rem; }
    #board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 6px;
      padding: 6px;
      width: min(92vw, 380px);
      aspect-ratio: 1;
      background: var(--cyber-bg);
      border: 2px solid var(--cyber-green);
      box-shadow: 0 0 12px rgba(57, 255, 106, 0.25);
    }
    .t {
      padding: 0;
      font-family: var(--cyber-font);
      font-weight: bold;
      font-size: clamp(1.3rem, 8vw, 2rem);
      border: 1px solid var(--cyber-green-dim);
      background: var(--cyber-green-faint);
      color: var(--cyber-green);
      cursor: pointer;
    }
    .t:hover { background: rgba(57,255,106,.3); }
    .t.ok { background: rgba(57,255,106,.35); color: #fff; }
    .t.blank { visibility: hidden; }
    #msg { min-height: 1.5em; color: var(--cyber-green); }
    .credit { font-size: 11px; color: var(--cyber-green-dim); margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>🔲 15 PUZZLE</h1>
    <div id="info">手数: <span id="moves">0</span> / タイム: <span id="time">0</span>s / ベスト手数: <span id="best">-</span></div>
    <div id="board"></div>
    <div id="msg">数字を1から15の順に並べよう。タイルをタップ / 矢印キー</div>
    <button class="btn" id="restart" type="button">SHUFFLE</button>
    <button class="btn" id="mute" type="button"></button>
    <div class="credit">porkgorilla — 2026</div>
  </main>

  <script src="/site.js"></script>
  <script>
    // ---- サウンド (Web Audio で合成) ----
    let audio = null;
    let muted = false;
    try { muted = localStorage.getItem('muted_puzzle15') === '1'; } catch (e) {}
    const muteBtn = document.getElementById('mute');
    function updateMuteBtn() { muteBtn.textContent = muted ? '🔇 SOUND OFF' : '🔊 SOUND ON'; }
    updateMuteBtn();

    // iOSでバックグラウンド後に音が死ぬことがあるため、リスタート等のユーザー操作で作り直す
    function initAudio() {
      if (audio) audio.close().catch(() => {});
      const AC = window.AudioContext || window.webkitAudioContext;
      audio = AC ? new AC() : null;
    }
    function ensureAudio() {
      if (!audio) initAudio();
      else if (audio.state === 'suspended') audio.resume().catch(() => {});
    }

    function tone(freq, start, dur, type, vol, endFreq) {
      if (!audio || muted) return;
      const t = audio.currentTime + start;
      const osc = audio.createOscillator();
      const g = audio.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      g.gain.setValueAtTime(vol || 0.08, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g).connect(audio.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    muteBtn.onclick = () => {
      muted = !muted;
      try { localStorage.setItem('muted_puzzle15', muted ? '1' : '0'); } catch (e) {}
      updateMuteBtn();
      if (!muted) { ensureAudio(); tone(660, 0, 0.08); tone(990, 0.07, 0.1); }
    };

    const sfx = {
      slide() { tone(300, 0, 0.05, 'square', 0.05, 220); },
      win()   { tone(523, 0, 0.12); tone(659, 0.12, 0.12); tone(784, 0.24, 0.12); tone(1047, 0.36, 0.3); }
    };

    const N = 4;
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const timeEl = document.getElementById('time');
    const bestEl = document.getElementById('best');
    const msgEl = document.getElementById('msg');

    let best = 0;
    try { best = Number(localStorage.getItem('puzzle15Best')) || 0; } catch (e) {}
    if (best) bestEl.textContent = best;

    let t, moves, sec, timer, started, solved; // t[i] = 数字 (0 が空き)

    function init() {
      clearInterval(timer);
      t = Array.from({ length: N * N }, (_, i) => (i + 1) % (N * N));
      // 空きを動かして混ぜる (必ず解ける配置になる)
      let blank = t.indexOf(0), prev = -1;
      for (let k = 0; k < 300; k++) {
        const ns = neighbors(blank).filter(n => n !== prev);
        const n = ns[Math.floor(Math.random() * ns.length)];
        [t[blank], t[n]] = [t[n], t[blank]];
        prev = blank; blank = n;
      }
      if (isSolved()) return init();
      moves = 0; sec = 0; started = false; solved = false;
      movesEl.textContent = 0; timeEl.textContent = 0;
      msgEl.textContent = '数字を1から15の順に並べよう。タイルをタップ / 矢印キー';
      render();
    }

    function neighbors(i) {
      const r = Math.floor(i / N), c = i % N, out = [];
      if (r > 0) out.push(i - N);
      if (r < N - 1) out.push(i + N);
      if (c > 0) out.push(i - 1);
      if (c < N - 1) out.push(i + 1);
      return out;
    }
    function isSolved() { return t.every((v, i) => v === (i + 1) % (N * N)); }

    function render() {
      boardEl.innerHTML = '';
      t.forEach((v, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 't' + (v === 0 ? ' blank' : '') + (v && v === i + 1 ? ' ok' : '');
        b.textContent = v || '';
        b.onclick = () => tap(i);
        boardEl.appendChild(b);
      });
    }

    // タップしたタイルと同じ行/列に空きがあれば、まとめてスライド
    function tap(i) {
      if (solved) return;
      const blank = t.indexOf(0);
      const r = Math.floor(i / N), c = i % N, br = Math.floor(blank / N), bc = blank % N;
      if (r !== br && c !== bc) return;
      ensureAudio();
      const step = r === br ? (bc > c ? 1 : -1) : (br > r ? N : -N);
      let pos = blank;
      while (pos !== i) { t[pos] = t[pos - step]; pos -= step; }
      t[i] = 0;
      afterMove();
    }

    function key(dx, dy) { // 空きの隣のタイルを空きへ動かす (矢印の向きにタイルが動く)
      if (solved) return;
      const blank = t.indexOf(0);
      const r = Math.floor(blank / N) - dy, c = (blank % N) - dx;
      if (r < 0 || r >= N || c < 0 || c >= N) return;
      tap(r * N + c);
    }

    function afterMove() {
      if (!started) { started = true; timer = setInterval(() => { sec++; timeEl.textContent = sec; }, 1000); }
      moves++;
      movesEl.textContent = moves;
      sfx.slide();
      render();
      if (isSolved()) {
        solved = true;
        clearInterval(timer);
        let extra = '';
        if (!best || moves < best) {
          best = moves; bestEl.textContent = best; extra = ' (ベスト更新!)';
          try { localStorage.setItem('puzzle15Best', best); } catch (e) {}
        }
        msgEl.textContent = '🎉 クリア! ' + moves + '手 / ' + sec + '秒' + extra;
        setTimeout(sfx.win, 300);
      }
    }

    const keyMap = { ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0], ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1] };
    document.addEventListener('keydown', e => {
      const m = keyMap[e.key];
      if (m) { e.preventDefault(); key(m[0], m[1]); }
    });
    document.getElementById('restart').onclick = () => { initAudio(); init(); };
    init();
  </script>
</body>
</html>
