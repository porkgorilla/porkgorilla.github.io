<script>
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
const titleOv = $('titleOv'), inOv = $('inOv'), pauseOv = $('pauseOv'), resOv = $('resOv');
const H = 640, HZ = 330, G = 900;
const FF = '"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif';
const SKIN = '#f2c79e', RED = '#e0453a', WHITEHAT = '#f6f6f6';
let W = 480, SC = 1, OX = 0, OY = 0, DPR = 1, VX0 = 0, VX1 = 480, T = 0;

const GAME_URL = 'https://porkgorilla.com/works/sportsday.html';
const OG_CACHE_VERSION = 1;
const SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const LS_BEST = 'sportsday-best', LS_SOUND = 'sportsday-sound';
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

/* ---------- 画面サイズ ---------- */
function resize(){
  const r = stage.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width*DPR));
  cv.height = Math.max(1, Math.round(r.height*DPR));
  W = Math.max(360, Math.min(960, r.width / Math.max(1,r.height) * H));
  SC = Math.min(r.width / W, r.height / H);
  OX = (r.width - W*SC)/2; OY = (r.height - H*SC)/2;
  VX0 = -OX/SC; VX1 = W + OX/SC;
}
window.addEventListener('resize', resize);
resize();

/* ---------- 音 ---------- */
let AC = null, MG = null, NB = null;
let soundOn = lsGet(LS_SOUND) !== '0';
function initAudio(force){
  if (AC && force){
    try { AC.close().catch(()=>{}); } catch(e){}
    AC = null;
  } else if (AC){
    if (AC.state === 'closed'){ AC = null; }
    else { if (AC.state === 'suspended') AC.resume(); return; }
  }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MG = AC.createGain(); MG.gain.value = .6; MG.connect(AC.destination);
    NB = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
    const d = NB.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    bgmNext = 0;
  } catch(e){ AC = null; }
}
function tone(f,d,type,v,slide=0,vib=0,delay=0){
  if (!AC || !soundOn) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f,t);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(30,f+slide), t+d);
  if (vib){ const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = vib; lg.gain.value = f*.03; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t+d); }
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(MG); o.start(t); o.stop(t+d+.03);
}
function noiseB(d,v,freq,att=.005,type='bandpass'){
  if (!AC || !soundOn || !NB) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = NB;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = .8;
  const g = AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f).connect(g).connect(MG); s.start(t, Math.random()*.5); s.stop(t+d+.05);
}
function note(m,t,d,type,v){
  if (!AC || !soundOn) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = 440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(MG); o.start(t); o.stop(t+d+.03);
}
const sfx = {
  beep(){ tone(660,.14,'square',.07); },
  pistol(){ noiseB(.35,.6,2200,.002,'lowpass'); tone(150,.14,'sawtooth',.16,-90); },
  whistle(){ tone(2400,.45,'sine',.1,0,28); },
  step(){ tone(240+Math.random()*80,.035,'square',.03); },
  throw(){ tone(240,.12,'triangle',.09,520); },
  pon(){ tone(700,.08,'sine',.2); tone(1050,.14,'sine',.13,0,0,.07); },
  rim(){ tone(420,.05,'square',.05); },
  beat(odd){ tone(odd?523:440,.09,'triangle',.13); noiseB(.09,.3,260,.002,'lowpass'); },
  good(){ tone(130,.15,'square',.15,-50); },
  miss(){ tone(220,.16,'sawtooth',.06,-90); },
  cheer(v=1){ noiseB(1.6,.2*v,1300,.35); }
};
const MEL = [72,72,74,76, 76,74,72,74, 76,79,77,76, 74,0,74,0, 72,72,74,76, 77,76,74,72, 74,76,74,71, 72,0,0,0];
const BASS = [48,55,48,55,53,48,55,43];
let bgmNext = 0, bgmStep = 0;
function bgmTick(){
  const on = AC && soundOn && S.mode === 'play' && !S.paused && ev && ev.key !== 'tsuna';
  if (!on){ bgmNext = 0; return; }
  const spb = ev.key === 'dash' ? .13 : .17;
  if (bgmNext < AC.currentTime) bgmNext = AC.currentTime + .05;
  while (bgmNext < AC.currentTime + .25){
    const n = MEL[bgmStep % 32];
    if (n) note(n, bgmNext, spb*.9, 'square', .03);
    if (bgmStep % 2 === 0) note(BASS[(bgmStep>>2) % 8], bgmNext, spb*1.6, 'triangle', .06);
    bgmNext += spb; bgmStep++;
  }
}
function updSnd(){ $('sndBtn').textContent = soundOn ? '音 ON' : '音 OFF'; }
$('sndBtn').addEventListener('click', () => { soundOn = !soundOn; lsSet(LS_SOUND, soundOn?'1':'0'); updSnd(); if (soundOn) initAudio(); });
updSnd();

/* ---------- 描画ヘルパー ---------- */
function hash(i){ const s = Math.sin(i*12.9898)*43758.5453; return s - Math.floor(s); }
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }
function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function textOut(t,x,y,size,color='#2b2a33',stroke='#fff',align='center'){
  ctx.font = `900 ${size}px ${FF}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(3,size/5); ctx.strokeText(t,x,y);
  ctx.fillStyle = color; ctx.fillText(t,x,y);
}
function ball(x,y,r=6.5,c=RED){ ctx.fillStyle = c; circle(x,y,r); ctx.fillStyle = 'rgba(255,255,255,.55)'; circle(x-r*.35,y-r*.35,r*.35); }

function kid(x,y,s,o={}){
  ctx.save(); ctx.translate(x,y); ctx.scale(s*(o.dir||1), s); ctx.rotate(o.lean||0);
  const ph = o.ph || 0, run = o.run || 0;
  ctx.lineCap = 'round';
  ctx.strokeStyle = SKIN; ctx.lineWidth = 5;
  for (const sg of [1,-1]){
    const a = Math.sin(ph)*.8*run*sg + (o.legA||0)*sg;
    line(0,-20, Math.sin(a)*18, -20+Math.cos(a)*18);
  }
  ctx.fillStyle = o.pants || '#24408e'; rr(-8,-29,16,11,3);
  ctx.fillStyle = o.shirt || '#fff'; rr(-9,-47,18,20,5);
  ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1; ctx.strokeRect(-8.5,-46.5,17,19);
  ctx.strokeStyle = SKIN; ctx.lineWidth = 4.5;
  if (o.arms === 'pull'){ line(0,-41,16,-34); line(0,-38,19,-31); }
  else if (o.arms === 'up'){ line(0,-42,-8,-60); line(0,-42,9,-61); }
  else if (o.arms === 'throw' || o.arms === 'hold'){
    const a = o.arms === 'hold' ? -2.2 : -2.4 + (o.throwK||0)*3.0;
    line(0,-42, Math.sin(a)*15, -42+Math.cos(a)*15);
    line(0,-42, 6, -30);
  } else {
    for (const sg of [1,-1]){ const a = -Math.sin(ph)*.9*run*sg + .15; line(0,-42, Math.sin(a)*15, -42+Math.cos(a)*15); }
  }
  ctx.fillStyle = SKIN; circle(0,-57,10);
  ctx.fillStyle = o.hat || RED; ctx.beginPath(); ctx.arc(0,-59,10.6,Math.PI,0); ctx.fill(); ctx.fillRect(0,-60.5,15,3.6);
  if (o.hat === WHITEHAT){ ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0,-59,10.6,Math.PI,0); ctx.stroke(); }
  ctx.fillStyle = '#2b2a33'; circle(5,-56,1.6);
  ctx.restore();
}
function youMark(x,y){
  ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(x-7,y-10); ctx.lineTo(x+7,y-10); ctx.lineTo(x,y); ctx.fill();
  textOut('あなた', x, y-22, 13, RED);
}

const CLOUDS = [{x:.05,y:40,r:22,s:6},{x:.38,y:150,r:16,s:9},{x:.62,y:60,r:26,s:5},{x:.85,y:190,r:18,s:8}];
const FLAGC = ['#e0453a','#f2b632','#3a8fd9','#4cb06a','#f07ab0','#8a5cd6','#ff8a3a'];
const CROWD = ['#3a6fd9','#e86a5a','#f2c032','#5cb06a','#9a6ad6','#444','#f08a3a','#fff'];
function drawSky(cam){
  const g = ctx.createLinearGradient(0,0,0,HZ); g.addColorStop(0,'#7cc6ee'); g.addColorStop(1,'#d6effa');
  ctx.fillStyle = g; ctx.fillRect(VX0-10,-500,VX1-VX0+20,HZ+500);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  const span = (VX1-VX0)+260;
  for (const c of CLOUDS){
    const x = VX0 + (((c.x*span + T*c.s - cam*.08) % span) + span) % span - 130;
    circle(x,c.y,c.r); circle(x+c.r*.9,c.y+4,c.r*.8); circle(x-c.r*.9,c.y+5,c.r*.7); circle(x+c.r*.2,c.y-c.r*.5,c.r*.75);
  }
  // 木
  const o = cam*.25, i0 = Math.floor((VX0+o)/60)-2, i1 = Math.ceil((VX1+o)/60)+2;
  ctx.fillStyle = '#6fae63';
  for (let i=i0;i<i1;i++){ const x = i*60-o, h = 30+12*Math.sin(i*1.7)+8*Math.sin(i*.6); circle(x, HZ-26, h); }
  ctx.fillStyle = '#5f9d55'; ctx.fillRect(VX0-10,HZ-30,VX1-VX0+20,30);
  drawTents(cam);
  drawFlags(cam);
  // 地面
  ctx.fillStyle = '#d8a46c'; ctx.fillRect(VX0-10,HZ,VX1-VX0+20,H-HZ+500);
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(VX0-10,HZ+50,VX1-VX0+20,10); ctx.fillRect(VX0-10,HZ+190,VX1-VX0+20,14);
  drawCrowd(cam);
}
function drawTents(cam){
  const span = 460, o = cam*.45, i0 = Math.floor((VX0+o)/span)-1, i1 = Math.ceil((VX1+o)/span)+1;
  for (let i=i0;i<i1;i++){
    const x = i*span - o + 150, y = HZ - 6;
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(x-60,y-48,120,48);
    ctx.fillStyle = '#bbb'; ctx.fillRect(x-60,y-50,3,50); ctx.fillRect(x+57,y-50,3,50);
    ctx.fillStyle = '#9a6a3a'; ctx.fillRect(x-36,y-22,72,5);
    for (let k=0;k<6;k++){
      const b0 = x-66+k*22, b1 = b0+22, t0 = x-46+k*92/6, t1 = t0+92/6;
      ctx.fillStyle = k%2 ? '#fff' : RED;
      ctx.beginPath(); ctx.moveTo(t0,y-74); ctx.lineTo(t1,y-74); ctx.lineTo(b1,y-52); ctx.lineTo(b0,y-52); ctx.fill();
    }
    ctx.fillStyle = '#fff'; ctx.fillRect(x-66,y-52,132,10);
    ctx.font = `700 9px ${FF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = RED;
    ctx.fillText(((i%2)+2)%2 ? '救護' : '本部', x, y-47);
  }
}
function drawFlags(cam){

    ctx.fillStyle = 'rgba(255,255,255,.9)'; circle(rx, ry, 26);
    textOut(next ? 'オー' : 'エス', rx, ry, 15, RED, 'rgba(0,0,0,0)');
    if (!this.done && S.mode === 'play'){ ctx.strokeStyle = RED; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(rx, ry, 26 + (1-frac)*46, 0, Math.PI*2); ctx.stroke(); }
    const sinceBeat = this.t - this.beatK*this.B;
    if (S.mode === 'play' && !this.done && this.beatK >= 1 && sinceBeat < .25) textOut(this.beatK % 2 ? 'オー！' : 'エス！', cx - Math.min(150, W*.3), GY - 140, 30, RED);
    if (this.streak >= 2) textOut(`シンクロ ×${this.streak}`, cx + Math.min(150, W*.3), GY - 140, 18, '#2b2a33');
    for (const f of this.fx){ ctx.globalAlpha = 1 - f.t/.7; textOut(f.txt, cx, GY - 170 - f.t*40, 22, f.good ? RED : '#556'); }
    ctx.globalAlpha = 1;
  }
};

const EVENTS = [DASH, TAMA, TSUNA];

/* ---------- 画面遷移 ---------- */
function updHud(){
  const inGame = ev && ['intro','count','play','done'].includes(S.mode);
  $('hudEv').textContent = inGame ? `第${S.ei+1}種目 ${ev.name}` : 'スポーツの日';
  $('hudScore').textContent = `合計 ${S.total}`;
  $('pauseBtn').style.visibility = (S.mode === 'play' || S.mode === 'count') ? 'visible' : 'hidden';
}
function showTitle(){
  S.mode = 'title'; S.paused = false; ev = null;
  inOv.hidden = true; pauseOv.hidden = true; resOv.hidden = true; titleOv.hidden = false;
  const b = +(lsGet(LS_BEST) || 0);
  $('bestT').textContent = b ? `自己ベスト ${b}点` : '';
  updHud();
}
function startGame(){
  initAudio(true);
  S.ei = 0; S.res = []; S.total = 0; S.paused = false;
  showIntro();
}
function showIntro(){
  ev = EVENTS[S.ei]; ev.init(); S.mode = 'intro';
  $('inEy').textContent = `第${S.ei+1}種目 / 全${EVENTS.length}種目`;
  $('inName').textContent = ev.name; $('inSub').textContent = ev.sub;
  $('inDesc').innerHTML = ev.desc; $('inKeys').textContent = ev.keys;
  const p = S.res[S.ei-1];
  $('inPrev').hidden = !p;
  if (p) $('inPrev').innerHTML = `${EVENTS[S.ei-1].name}：${p.line}　<b>+${p.score}点</b>`;
  titleOv.hidden = true; resOv.hidden = true; inOv.hidden = false;
  updHud();
}
function beginCount(){
  initAudio();
  inOv.hidden = true; S.mode = 'count'; S.cd = 0; S.cdStep = -1; S.goT = 0;
  updHud();
}
function nextEvent(){ S.ei++; if (S.ei >= EVENTS.length) showResult(); else showIntro(); }
function rankOf(t){
  if (t >= 2900) return '🥇 スポーツの日の英雄';
  if (t >= 2300) return '🥈 紅組のエース';
  if (t >= 1600) return '🥉 よくがんばりました';
  return '🎽 参加賞';
}
function showResult(){
  S.mode = 'result';
  const best = +(lsGet(LS_BEST) || 0), nb = S.total > best;
  if (nb) lsSet(LS_BEST, S.total);
  const rk = rankOf(S.total);
  $('rankT').textContent = rk;
  $('totalT').innerHTML = `${S.total}<small>点</small>`;
  $('bdT').innerHTML = EVENTS.map((e,i) => `<tr><th>${e.name}</th><td>${S.res[i].line}</td><td class="pt">${S.res[i].score}点</td></tr>`).join('');
  $('bestR').textContent = nb ? '自己ベスト更新！' : `自己ベスト ${best}点`;
  const text = `スポーツの日で ${S.total}点！【${rk}】\n${S.res.map(r => r.share).join(' / ')}\n#スポーツの日`;
  $('shareBtn').href = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SHARE_URL);
  inOv.hidden = true; resOv.hidden = false;
  updHud(); sfx.cheer(1);
}
function pause(){
  if (S.paused || (S.mode !== 'play' && S.mode !== 'count')) return;
  S.paused = true; pauseOv.hidden = false;
}
function resume(){ S.paused = false; pauseOv.hidden = true; disarm(); last = performance.now(); initAudio(); }

$('startBtn').addEventListener('click', startGame);
$('inStart').addEventListener('click', beginCount);
$('againBtn').addEventListener('click', startGame);
$('titleBtn').addEventListener('click', showTitle);
$('pauseBtn').addEventListener('click', pause);
$('resumeBtn').addEventListener('click', resume);
if (matchMedia('(pointer: coarse)').matches){ $('shareBtn').removeAttribute('target'); $('shareBtn').removeAttribute('rel'); }

// 一時停止中の「タイトルへ戻る」は2回押し
const quitBtn = $('quitBtn');
let armed = false, armTimer = null;
quitBtn.addEventListener('click', () => {
  if (!armed){
    armed = true; quitBtn.textContent = '本当に？(もう一度タップ)'; quitBtn.classList.add('danger');
    clearTimeout(armTimer); armTimer = setTimeout(disarm, 3000); return;
  }
  disarm(); showTitle();
});
function disarm(){ armed = false; clearTimeout(armTimer); quitBtn.textContent = 'タイトルへ戻る'; quitBtn.classList.remove('danger'); }

/* ---------- 入力 ---------- */
function tap(){ if (!S.paused && S.mode === 'play' && ev) ev.tap(); }
cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
const TAP_KEYS = ['Space','Enter','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyF','KeyJ','KeyZ','KeyX'];
window.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP'){ if (S.paused) resume(); else pause(); return; }
  if ((S.mode === 'play' || S.mode === 'count') && !S.paused && TAP_KEYS.includes(e.code)){
    e.preventDefault(); if (!e.repeat) tap();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pause(); else initAudio();
});

/* ---------- ループ ---------- */
function drawTitleScene(){
  drawSky(T*30);
  for (let i=0;i<5;i++){
    const span = (VX1-VX0) + 200, x = VX0 + ((T*(80+i*14) + i*170) % span) - 100, y = 450 + (i%3)*48;
    ctx.fillStyle = 'rgba(0,0,0,.13)'; ctx.beginPath(); ctx.ellipse(x,y+1,12,3,0,0,Math.PI*2); ctx.fill();
    kid(x, y, 1.1, { run:1, ph:T*(9+i), hat: i%2 ? WHITEHAT : RED });
  }
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#d8a46c'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  if (!ev || S.mode === 'title' || S.mode === 'result') { drawTitleScene(); return; }
  ev.draw();
  if (S.mode === 'count'){
    const st = Math.min(2, Math.max(0, S.cdStep));
    const w = ev.cd[st], sz = w.length > 2 ? 40 : 80;
    textOut(w, W/2, 250, sz, RED);
  } else if (S.goT > 0){
    ctx.globalAlpha = Math.min(1, S.goT*2); textOut(ev.go, W/2, 250, 64, RED); ctx.globalAlpha = 1;
  }
  if (S.mode === 'done') textOut(S.banner, W/2, 250, S.banner.length > 7 ? 34 : 44, RED);
}
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (!S.paused){
    T += dt;
    if (S.mode === 'count'){
      S.cd += dt;
      const st = Math.floor(S.cd/.8);
      if (st !== S.cdStep && st < 3){ S.cdStep = st; if (!(ev.key === 'dash' && st === 2)) sfx.beep(); }
      if (S.cd >= 2.4){ S.mode = 'play'; S.goT = .8; if (ev.key === 'dash') sfx.pistol(); else sfx.whistle(); updHud(); }
    }
    if (S.goT > 0) S.goT -= dt;
    if (ev && ['count','play','done'].includes(S.mode)) ev.update(dt);
    if (S.mode === 'done'){ S.doneT += dt; if (S.doneT > 1.8){ updHud(); nextEvent(); } }
  }
  bgmTick();
  draw();
  requestAnimationFrame(loop);
}
showTitle();
requestAnimationFrame(loop);
</script>
