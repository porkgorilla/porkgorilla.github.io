<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const GAME_NAME = 'スーパーメトロ井戸', HASHTAG = '#スーパーメトロ井戸';
const GAME_URL = 'https://porkgorilla.com/works/supermetroido.html';
const OG_CACHE_VERSION = 1, SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
/*LOGIC*/
const N = 7, HOUSES = 12, TURNS = 18;
const PT = { house:[0,1,3,6], tunnel:2, direct:3, flood:8, feud:4, combo:12 };
function at(g, x, z){ return (x < 0 || z < 0 || x >= N || z >= N) ? undefined : g[z][x]; }
function evaluate(g){
  const r = { houses:0, tunnel:0, direct:0, flood:0, feud:0, combo:0, total:0, dots:{}, tunnels:[], combos:[], nCombo:0, nTunnel:0, happy:0 };
  for (let z = 0; z < N; z++) for (let x = 0; x < N; x++){
    const c = g[z][x];
    if (c === 'H'){
      let w = 0, s = 0, m = 0;
      for (let dz = -3; dz <= 3; dz++) for (let dx = -3; dx <= 3; dx++){
        const t = at(g, x + dx, z + dz); if (!t || t === 'H') continue;
        const d = Math.max(Math.abs(dx), Math.abs(dz));
        if (t === 'W' && d <= 1) w = 1; else if (t === 'S' && d <= 2) s = 1; else if (t === 'M' && d <= 3) m = 1;
      }
      r.dots[x + ',' + z] = [w, s, m];
      r.houses += PT.house[w + s + m]; if (w + s + m === 3) r.happy++;
    }
    if (c === 'M'){
      for (const [dx, dz] of [[1,0],[0,1]]){
        let k = 1, nW = 0, nS = 0, hit = false;
        for (;; k++){ const t = at(g, x + dx * k, z + dz * k); if (t === undefined) break; if (t === 'M'){ hit = true; break; } if (t === 'W') nW++; if (t === 'S') nS++; }
        if (hit){
          r.tunnels.push({ x1:x, z1:z, x2:x + dx * k, z2:z + dz * k, flooded:nW > 0 });
          if (nW > 0) r.flood -= PT.flood * nW; else { r.tunnel += PT.tunnel; r.direct += PT.direct * nS; r.nTunnel++; }
        }
      }
    }
    if (c === 'W'){ if (at(g, x + 1, z) === 'W') r.feud -= PT.feud; if (at(g, x, z + 1) === 'W') r.feud -= PT.feud; }
    for (const [dx, dz] of [[1,0],[0,1]]){
      const a = c, b = at(g, x + dx, z + dz), d = at(g, x + dx * 2, z + dz * 2);
      if (b === 'M' && ((a === 'S' && d === 'W') || (a === 'W' && d === 'S'))){ r.combo += PT.combo; r.nCombo++; r.combos.push([x, z, dx, dz]); }
    }
  }
  r.total = r.houses + r.tunnel + r.direct + r.flood + r.feud + r.combo;
  return r;
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newGrid(){
  const g = []; for (let z = 0; z < N; z++) g.push(new Array(N).fill(null));
  const cells = []; for (let i = 0; i < N * N; i++) cells.push(i);
  shuffle(cells).slice(0, HOUSES).forEach(i => { g[Math.floor(i / N)][i % N] = 'H'; });
  return g;
}
function newQueue(){ const q = []; for (let i = 0; i < TURNS / 3; i++) q.push(...shuffle(['S','M','W'])); return q; }
function bestMove(g, p){
  let best = null, bs = -1e9;
  for (let z = 0; z < N; z++) for (let x = 0; x < N; x++){
    if (g[z][x]) continue;
    g[z][x] = p; const s = evaluate(g).total + Math.random() * .5; g[z][x] = null;
    if (s > bs){ bs = s; best = { x, z }; }
  }
  return best;
}
function rankOf(s){
  return s < 60 ? '更地に毛が生えた村' : s < 90 ? 'ふつうの町' : s < 120 ? '住みたい街ランキング圏内' : s < 150 ? 'スーパーメトロ井戸シティ' : '伝説の井戸端メトロポリス';
}
/*ENDLOGIC*/
const LH = .82, MAXH = 6, RANGE = { S:2, M:3, W:1 };
const NAME = { S:'スーパー', M:'メトロ', W:'井戸' }, COL = { S:0xe8413a, M:0xf29a1f, W:0x2e8bff };
const ZUKAN = [['well','井戸水、噴出'],['sale','特売品が湧く井戸'],['trainwell','電車が湧く井戸'],['train','イルカ路線'],['tower','積めてしまう'],['towerup','高すぎて発射'],['line','スーパーメトロ井戸'],['disco','街のディスコ化'],['space','宇宙進出']];
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
const rnd = (a, b) => a + Math.random() * (b - a), pickOf = a => a[Math.floor(Math.random() * a.length)];

const S = { mode:'title', game:'toy', cur:'S', count:0, auto:false, autoT:0, queue:[], turn:0, sel:null, score:0, ev:null, endT:0 };
let best = +lsGet('supermetroido-best', '0') || 0, xrayOn = false, xrayPulse = 0, ghost = null;
let paused = false, soundOn = lsGet('supermetroido-sound', '1') === '1';
let found = {}; try { found = JSON.parse(lsGet('supermetroido-found', '{}')) || {}; } catch (e) { found = {}; }
let stacks = [];
const inB = (x, z) => x >= 0 && z >= 0 && x < N && z < N;
const topT = (x, z) => { if (!inB(x, z)) return null; const s = stacks[z][x]; return s.length ? s[s.length - 1].t : null; };

/* ---------- 音 ---------- */
let AC = null, noiseBuf = null, lastSfx = {};
function initAudio(force){
  if (AC && force){ try { AC.close().catch(() => {}); } catch (e) {} AC = null; }
  else if (AC){ if (AC.state === 'closed') AC = null; else { if (AC.state === 'suspended') AC.resume(); return; } }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f, t0, d, type, vol, f2){
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + t0;
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .12, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);

const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3(), inv = new THREE.Matrix4();

const popS = p => p < .6 ? p / .6 * 1.2 : 1.2 - (p - .6) / .4 * .2;

  }
  const dance = S.count >= 1 ? .13 : 0;
  for (let z = 0; z < N; z++) for (let x = 0; x < N; x++){
    const s = stacks[z][x];
    for (let i = 0; i < s.length; i++){
      const o = s[i].o, u = o.userData; if (u.pop < 1) u.pop = Math.min(1, u.pop + dt * 2.8); u.sq = Math.max(0, u.sq - dt * 5);

    const op = (S.game === 'puzzle' && (xrayOn || xrayPulse > 0)) ? .22 : 1; m.opacity += (op - m.opacity) * Math.min(1, dt * 7); m.depthWrite = m.opacity > .9;
