[hidden]{display:none!important}
/* layout: 全面3Dキャンバス。上にHUD、下に操作列、中央にカード型ポップアップ */
:root{
  --panel:rgba(250,246,238,.88); --paper:#fbf7ef; --ink:#2f241c; --sub:#857261;
  --btn:#ffffff; --btn-ink:#2f241c; --on:#2f241c; --on-ink:#ffffff; --muted:#a8977f; --how:#5a4838;

*{box-sizing:border-box}

.hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.home{pointer-events:auto;color:var(--sub);text-decoration:none;font-size:12px;letter-spacing:.04em;white-space:nowrap;

.home:hover{color:var(--ink)}

.ibtn{pointer-events:auto;min-width:44px;min-height:44px;border:0;border-radius:12px;background:var(--panel);color:var(--ink);

.pz{display:flex;gap:5px}.pz i{display:block;width:5px;height:16px;background:var(--ink);border-radius:2px}

.ibtn[aria-expanded="true"]{background:var(--ink);color:#fff}
.share{display:inline-flex;align-items:center;margin-top:10px;color:var(--ink);font-weight:700;font-size:13px;text-decoration:none;border-bottom:1px solid currentColor;min-height:44px;padding:0 2px}
@media (max-width:440px){.card{padding:20px 14px 16px}.opt{grid-template-columns:4.4em 1fr}.seg button{min-width:44px;padding:0 6px;font-size:12px}}
@media (max-width:360px){.opt{grid-template-columns:4em 1fr}.seg{gap:3px}.seg button{padding:0 3px}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const GAME_URL = 'https://porkgorilla.com/works/surilingo.html';
const OG_CACHE_VERSION = 1;
const SHARE_URL = GAME_URL + '?ogv=' + OG_CACHE_VERSION;
const K_TOTAL = 'surilingo-total', K_SET = 'surilingo-settings', K_SND = 'surilingo-sound';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
const C = h => new THREE.Color(h).convertSRGBToLinear();

/* ---------- 設定 ---------- */
const SET = Object.assign({ theme:'kitchen', time:'auto', mode:'auto', grater:'copper', peel:'on', bpm:120 },
  (() => { try { return JSON.parse(lsGet(K_SET) || '{}'); } catch(e){ return {}; } })());
const saveSet = () => lsSet(K_SET, JSON.stringify(SET));
const GR = {
  copper:  { name:'銅', mult:1.0, part:.13 },
  ceramic: { name:'陶器', mult:.8, part:.1 },
  oni:     { name:'鬼おろし', mult:1.6, part:.42 }
};
const VARIETIES = [
  { name:'ふじ',  base:'#c3272d', dark:'#7a1218', streak:'#f0c058', dot:'#f5dc9a', top:'#d9b45a', flesh:'#f6ecc4', R:4.3, sy:.92 },
  { name:'紅玉', base:'#a3111d', dark:'#55060d', streak:'#c22a2a', dot:'#e8a98a', top:'#8a1a1a', flesh:'#f8efd0', R:3.7, sy:.9 },
  { name:'王林', base:'#c6cc5c', dark:'#8c9530', streak:'#e4e09a', dot:'#8b7a3a', top:'#9aa040', flesh:'#f1efc2', R:4.1, sy:.95 }
];

/* ---------- 昼と夜 ---------- */
// 「自動」は端末(またはclaude.aiの表示設定)のライト/ダークに合わせる
const darkMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function deviceDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true; if (t === 'light') return false;
  return !!(darkMQ && darkMQ.matches);
}
const isNight = () => SET.time === 'night' || (SET.time === 'auto' && deviceDark());
let nightNow = null;
function applySkin(){
  const n = isNight();
  if (n) document.documentElement.setAttribute('data-skin', 'night'); else document.documentElement.removeAttribute('data-skin');
  return n;
}

/* ---------- three ---------- */
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, .5, 400);

function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
// 簡易環境マップ(金属の映り込み用)。夜は暗いものに差し替える(明るいままだと部屋全体が照らされる)
const ENV = {};
function makeEnv(stops, panel){
  const pm = new THREE.PMREMGenerator(renderer);
  const es = new THREE.Scene();
  const tex = canvasTex(64, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    stops.forEach(([o, c]) => gr.addColorStop(o, c));
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  const sp = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ map:tex, side:THREE.BackSide }));
  es.add(sp);
  const lp = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), new THREE.MeshBasicMaterial({ color:panel }));
  lp.position.set(-20, 30, 20); lp.lookAt(0, 0, 0); es.add(lp);
  const t = pm.fromScene(es, .04).texture; pm.dispose(); return t;
}
ENV.day = makeEnv([[0, '#ffffff'], [.45, '#c8c2b8'], [.55, '#6e665e'], [1, '#2a2622']], 0xffffff);
ENV.night = makeEnv([[0, '#2a3248'], [.45, '#151a26'], [.55, '#0b0d12'], [1, '#050608']], 0x6a7290);
scene.environment = ENV.day;


/* ---------- 寸法 ---------- */
const COARSE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const PY = 8;            // おろし金の上面
const ZA = -6.2;         // アームが動く面
const BX = 0, BY = 3;    // メトロノームの支点
const L1 = 30, L2 = 13, L3 = 11, ROD = 6;
const PICK_X = 27, BIN_X = -26, AMP = 10;
const TRAY = { x:16, z:4.1, h:7.4 };
const PULP_AREA = (TRAY.x * 2 - .4) * (TRAY.z * 2 - .3);
const CAP_H = 6;

/* ---------- 世界(雰囲気ごと) ---------- */
let world = null, grGroup = null, hemi, key, fill;
const M = {};   // テーマのマテリアル
function std(c, o){ return new THREE.MeshStandardMaterial(Object.assign({ color:C(c) }, o || {})); }
function box(w, h, d, mat){ const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = m.receiveShadow = true; return m; }
function cyl(rt, rb, h, seg, mat){ const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.castShadow = m.receiveShadow = true; return m; }
function disposeGroup(g){ g.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material){ [].concat(o.material).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); } }); }

const tileTex = () => canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#e8e0d0'; g.fillRect(0, 0, w, h);
  const tw = 128, th = 64;
  for (let r = 0; r < h / th; r++) for (let c = -1; c < w / tw + 1; c++){
    const x = c * tw + (r % 2) * tw / 2, y = r * th;
    const v = 228 + Math.random() * 14 | 0;
    g.fillStyle = 'rgb(' + v + ',' + (v - 8) + ',' + (v - 22) + ')'; g.fillRect(x + 3, y + 3, tw - 6, th - 6);
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(x + 6, y + 6, tw - 30, 6);
  }
}, [6, 3]);

function updClock(){

}

let particleMesh = null;
function buildGrater(){
  if (grGroup){ world.remove(grGroup); disposeGroup(grGroup); }
  grGroup = new THREE.Group(); world.add(grGroup);
  const t = SET.grater;
  let plateM, toothGeo, toothM, place;
  if (t === 'copper'){
    plateM = std('#c27248', { metalness:.85, roughness:.33 });
    toothGeo = new THREE.ConeGeometry(.13, .3, 4); toothM = std('#e19c70', { metalness:.85, roughness:.28 });
    place = []; for (let x = -17.3; x <= 17.3; x += .55) for (let z = -3.9; z <= 3.9; z += .6) place.push([x + ((Math.round(z / .6)) % 2) * .27, PY + .14, z, 0]);
  } else if (t === 'ceramic'){
    plateM = std('#f4f1ea', { roughness:.22 });
    toothGeo = new THREE.SphereGeometry(.17, 8, 5); toothM = plateM;
    place = []; for (let x = -17.2; x <= 17.2; x += .7) for (let z = -3.8; z <= 3.8; z += .7) place.push([x + ((Math.round(z / .7)) % 2) * .35, PY - .02, z, 1]);
    [-1, 1].forEach(s => { const rim = box(36, .12, .25, std('#2e5ea8', { roughness:.3 })); rim.position.set(0, PY + .01, s * 4.15); grGroup.add(rim); });
  } else {
    plateM = std('#d9bf86', { roughness:.75 });
    toothGeo = new THREE.CylinderGeometry(.42, .42, 8, 3); toothM = std('#e8d39e', { roughness:.6 });
    place = []; for (let x = -16.5; x <= 16.5; x += 2.2) place.push([x, PY - .05, 0, 2]);
  }
  const plate = box(36, .4, 8.6, plateM); plate.position.set(0, PY - .2, 0); grGroup.add(plate);
  const im = new THREE.InstancedMesh(toothGeo, toothM, place.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(1, 1, 1);
  place.forEach((p, i) => {
    if (p[3] === 1){ sc.set(1, .55, 1); q.identity(); }
    else if (p[3] === 2){ sc.set(1, 1, 1); q.setFromEuler(new THREE.Euler(Math.PI / 2, 0, Math.PI / 2 + Math.PI / 6)); }
    else { sc.set(1, 1, 1); q.identity(); }
    m4.compose(new THREE.Vector3(p[0], p[1], p[2]), q, sc); im.setMatrixAt(i, m4);
  });
  im.castShadow = true; im.receiveShadow = true; grGroup.add(im);
  const legM = std('#8a8f94', { metalness:.8, roughness:.35 });
  [[-17.6, -3.8], [-17.6, 3.8], [17.6, -3.8], [17.6, 3.8]].forEach(([x, z]) => { const l = cyl(.25, .25, PY - .4, 10, legM); l.position.set(x, (PY - .4) / 2, z); grGroup.add(l); });
  // 板の上に残る果肉
  M.smear = new THREE.MeshStandardMaterial({ color:C('#f3e6bd'), transparent:true, opacity:0, roughness:.5, depthWrite:false });
  const sm = new THREE.Mesh(new THREE.PlaneGeometry(30, 7.6), M.smear); sm.rotation.x = -Math.PI / 2; sm.position.set(0, PY + .04, 0); grGroup.add(sm);
  // 落ちる粒
  if (particleMesh){ scene.remove(particleMesh); particleMesh.geometry.dispose(); particleMesh.material.dispose(); }
  const pg = t === 'oni' ? new THREE.BoxGeometry(1, 1, 1) : new THREE.IcosahedronGeometry(1, 0);
  particleMesh = new THREE.InstancedMesh(pg, new THREE.MeshStandardMaterial({ color:C('#f4e7bf'), roughness:.5 }), P_MAX);
  particleMesh.frustumCulled = false; scene.add(particleMesh);
  for (let i = 0; i < P_MAX; i++){ P[i].alive = false; particleMesh.setMatrixAt(i, ZERO); }
  particleMesh.instanceMatrix.needsUpdate = true;
  setupGrateSound();
}

  });
  if (moving){ beltOff += 14 * dt; M.belt.map.offset.x = beltOff / 44 * 10; }
  if (belt.length < 2) queueApple();

  if (tw){
    tw.t += dt; const k = ease(clamp(tw.t / tw.dur, 0, 1));
    HAND.x = lerp(tw.x0, tw.x1, k); HAND.y = lerp(tw.y0, tw.y1, k); HAND.tilt = lerp(tw.t0, tw.t1, k);
    if (tw.t >= tw.dur){ const n = tw.next; tw = null; if (n) n(); }
  }

  if (st === 'wait'){
    HAND.open = Math.min(1, HAND.open + dt * 3);
    const ap = belt[0];
    if (!tw && !swap && ap && Math.abs(ap.bx - PICK_X) < .02){
      if (tray.userData.grams > PULP_AREA * .95 * CAP_H * .92){ startSwap(); return; }
      st = 'move';
      goTo(PICK_X, PY + appleH(ap), 0, .55, () => {
        belt.shift(); cur = ap; attach(ap); sfx('grip'); st = 'grip';
        const h = appleH(ap);
        goTo(PICK_X, PY + h + .01, 0, .25, () => {
          goTo(PICK_X, PY + h + 5, 0, .45, () => goTo(0, PY + h + 5, 0, .75, () => goTo(0, PY + h, 0, .45, () => { st = 'grate'; phi = 0; lastBeat = 0; })));
        });
      });
    }
  } else if (st === 'grip'){
    HAND.open = Math.max(0, HAND.open - dt * 5);
  } else if (st === 'grate'){
    HAND.open = 0;
    const target = SET.mode === 'auto' || holding ? 1 : 0;
    amp += (target - amp) * (1 - Math.exp(-dt * 9));
    phi += Math.PI * SET.bpm / 60 * dt * amp;
    const beat = Math.floor((phi + Math.PI / 2) / Math.PI);
    if (beat !== lastBeat){ lastBeat = beat; if (amp > .3){ sfx('tick'); ledFlash = 1; } }
    const nx = AMP * Math.sin(phi);
    const dmm = Math.abs(nx - HAND.x);
    HAND.x = nx;
    if (dmm > 0 && cur){
      const rp = planeR(cur, cur.yc), c = Math.max(2.4, 2 * rp);
      const v0 = volBelow(cur, cur.yc);
      cur.yc += dmm * .06 * GR[SET.grater].mult * 4 / (Math.PI * c);
      const gAdd = (volBelow(cur, cur.yc) - v0) * .85;
      shapeApple(cur);
      addGrams(gAdd, cur);
      spawnAcc += gAdd * (SET.grater === 'oni' ? 4 : 9);
      const n = Math.floor(spawnAcc); spawnAcc -= n; if (n) spawnParticles(Math.min(n, 14), cur, HAND.x);
    }
    if (cur) HAND.y = PY + appleH(cur);
    if (cur && appleH(cur) <= 1.2){
      st = 'move'; amp = 0; if (mode === 'play'){ session.n++; total.n++; lsSet(K_TOTAL, JSON.stringify(total)); }   // タイトルのデモは数えない
      goTo(HAND.x, HAND.y + 7, -1.05, .7, () => goTo(HAND.x, HAND.y + .01, -1.05, .7, () =>
        goTo(BIN_X, PY + 13, -.2, .9, () => {
          dropToBin(cur); cur = null; HAND.open = 1;
          goTo(PICK_X, PY + 14, 0, 1.0, () => { st = 'wait'; });
        })));
    }
  }
}
function addGrams(g, ap){
  if (g <= 0) return;
  const u = tray.userData;
  u.B = u.grams > 0 ? u.B * u.grams / (u.grams + g) : 0;
  u.flesh = ap.v.flesh;
  u.grams += g;
  if (mode === 'play'){ session.g += g; total.g += g; }   // タイトルのデモは累計に入れない
}
function dropToBin(ap){
  const h = Math.max(.5, appleH(ap)), rp = Math.max(1, planeR(ap, ap.yc));
  const wp = new THREE.Vector3(0, (ap.yc + ap.ymax) / 2, 0); ap.mesh.localToWorld(wp);
  const side = new THREE.MeshStandardMaterial({ map:peelTex(ap.v), roughness:.4 });
  const capM = new THREE.MeshStandardMaterial({ map:fleshTex(ap.v), roughness:.4 });
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rp * .8, rp, h, 32), [side, capM, capM]);
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.position.copy(wp); mesh.rotation.set(rnd(-.8, -.4), Math.random() * 6, rnd(-.3, .3));
  scene.add(mesh); disposeApple(ap);
  const stack = bins.filter(d => d.rest).length;
  bins.push({ mesh, h, vy:0, spin:rnd(-4, 4), rest:false, floor:.3 + Math.min(4.5, stack * .55) + h / 2, rx:rnd(-.25, .25), rz:rnd(-.25, .25) });
  if (bins.length > 9){ const o = bins.shift(); scene.remove(o.mesh); o.mesh.geometry.dispose(); [].concat(o.mesh.material).forEach(m => m.dispose()); }
}
function stepBins(dt){
  bins.forEach(d => {
    if (d.rest) return;
    const m = d.mesh, k = Math.min(1, dt * 7);
    d.vy -= 400 * dt; m.position.y += d.vy * dt;
    m.position.x += (BIN_X - m.position.x) * k; m.position.z += (0 - m.position.z) * k;
    m.rotation.x += (d.rx - m.rotation.x) * k; m.rotation.z += (d.rz - m.rotation.z) * k; m.rotation.y += d.spin * dt;
    if (m.position.y <= d.floor){ m.position.y = d.floor; d.rest = true; sfx('drop'); }
  });
}
function startSwap(){
  swap = { t:0 }; oldTray = tray; tray = makeTray(); tray.position.z = 34; tray.visible = true; sfx('swap');
}
function stepSwap(dt){
  if (!swap) return;
  swap.t += dt;
  const a = ease(clamp(swap.t / .9, 0, 1)), b = ease(clamp((swap.t - .9) / .9, 0, 1));
  oldTray.position.z = lerp(0, 36, a); oldTray.position.y = lerp(0, -2, a);
  tray.position.z = lerp(34, 0, b);
  if (swap.t >= 1.8){ scene.remove(oldTray); disposeGroup(oldTray); oldTray = null; swap = null; tray.position.z = 0; }
}

/* ---------- カメラ ---------- */
let camView = 'far', camK = 0;
function camPose(view){
  const asp = W / H, vf = 38 * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * asp);
  if (view === 'far'){
    const hw = asp >= 1.2 ? 45 : asp <= .62 ? 23 : lerp(23, 45, (asp - .62) / .58);
    const d = Math.max(hw / Math.tan(hf / 2), 25 / Math.tan(vf / 2));
    const tgt = new THREE.Vector3(asp < .9 ? 2 : 4, asp < .9 ? 15 : 13, -1);
    return { pos: tgt.clone().add(new THREE.Vector3(Math.sin(.1) * d * .9, Math.sin(.42) * d, Math.cos(.42) * d)), tgt };
  }
  const d = Math.max(28, 15 / Math.tan(hf / 2)), tgt = new THREE.Vector3(0, PY + 2, 0);
  return { pos: tgt.clone().add(new THREE.Vector3(d * .22, d * .42, d * .88)), tgt };
}
function updCamera(dt){
  camK += ((camView === 'near' ? 1 : 0) - camK) * (1 - Math.exp(-dt * 3));
  const a = camPose('far'), b = camPose('near');
  camera.position.copy(a.pos).lerp(b.pos, camK);
  const t = a.tgt.clone().lerp(b.tgt, camK);
  camera.lookAt(t);
}
const ICON_ZOOM_IN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6M10.5 7.5v6"/></svg>';
const ICON_ZOOM_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></svg>';
function updCamBtn(){ $('camBtn').innerHTML = camView === 'far' ? ICON_ZOOM_IN : ICON_ZOOM_OUT; $('camBtn').setAttribute('aria-label', camView === 'far' ? 'おろし金に寄る' : '全体を見る'); }
$('camBtn').addEventListener('click', () => { camView = camView === 'far' ? 'near' : 'far'; updCamBtn(); });
updCamBtn();

/* ---------- 画面サイズ ---------- */
let W = 1, H = 1;
function resize(){
  W = Math.max(1, window.innerWidth || 0); H = Math.max(1, window.innerHeight || 0);
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ---------- UI ---------- */
function seg(el, items, get, set){
  el.innerHTML = '';
  items.forEach(([v, label]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.setAttribute('aria-pressed', get() === v ? 'true' : 'false');
    b.addEventListener('click', () => { set(v); [...el.children].forEach((c, i) => c.setAttribute('aria-pressed', items[i][0] === get() ? 'true' : 'false')); });
    el.appendChild(b);
  });
}
function fitSegs(){
  document.querySelectorAll('.seg button').forEach(b => {
    b.style.fontSize = '';
    if (!b.offsetParent) return;
    let fs = parseFloat(getComputedStyle(b).fontSize) || 13, k = 0;
    while (k++ < 7 && fs > 8 && b.scrollWidth > b.clientWidth + 1){ fs -= 1; b.style.fontSize = fs + 'px'; }
  });
}
window.addEventListener('resize', () => requestAnimationFrame(fitSegs));
// 文字の幅はフォントの読み込みで変わるので、読み込みが終わったら測り直す
window.addEventListener('load', () => requestAnimationFrame(fitSegs));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(fitSegs));
// 念のため、選択肢が見えている間はときどき測り直す(フォントの差し替えが遅れる端末向け)
setInterval(() => { if (!$('titleOv').hidden || !$('setPanel').hidden) fitSegs(); }, 1500);
function renderOpts(){
  [['opt', ''], ['set', '']].forEach(([pre]) => {
    const id = n => pre === 'opt' ? 'opt' + n : 'set' + n;
    seg($(id('Theme')), [['kitchen', '台所'], ['factory', '工場']], () => SET.theme, setTheme);
    seg($(id('Time')), [['auto', '自動'], ['day', '昼'], ['night', '夜']], () => SET.time, setTime);
    seg($(id('Mode')), [['hold', '押している間'], ['auto', '全自動']], () => SET.mode, setRunMode);
    seg($(id(pre === 'opt' ? 'Gr' : 'Gr')), GRATER_ITEMS, () => SET.grater, setGrater);
    seg($(id('Peel')), [['on', 'あり'], ['off', 'むく']], () => SET.peel, setPeel);
  });
  requestAnimationFrame(fitSegs);
}
function setTime(v){ if (SET.time === v) return; SET.time = v; saveSet(); if (isNight() !== nightNow) buildWorld(); renderOpts(); }
// 「自動」のとき、端末やclaude.aiのライト/ダーク切り替えに追従する
function onSchemeChange(){ if (SET.time === 'auto' && isNight() !== nightNow) buildWorld(); }
if (darkMQ){ try { darkMQ.addEventListener('change', onSchemeChange); } catch(e){ try { darkMQ.addListener(onSchemeChange); } catch(_){} } }
new MutationObserver(onSchemeChange).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
function setTheme(v){ if (SET.theme === v) return; SET.theme = v; saveSet(); buildWorld(); renderOpts(); }
function setRunMode(v){ if (SET.mode === v) return; SET.mode = v; saveSet(); setHold(false); holdBtn.hidden = !(mode === 'play' && SET.mode === 'hold'); renderOpts(); }
function setPeel(v){ if (SET.peel === v) return; SET.peel = v; saveSet(); belt.forEach(disposeApple); belt = []; renderOpts(); }
function renderTitle(){
  renderOpts();
  $('totalT').textContent = total.n > 0 ? 'これまでに ' + total.n + '個・' + Math.floor(total.g).toLocaleString() + 'g すりおろした' : '';
}
const GRATER_ITEMS = [['copper', '銅'], ['ceramic', '陶器'], ['oni', '鬼おろし']];
function setGrater(v){
  if (SET.grater === v) return;
  SET.grater = v; saveSet(); buildGrater(); renderOpts();
}
const tempo = b => b < 66 ? 'Largo' : b < 76 ? 'Adagio' : b < 108 ? 'Andante' : b < 120 ? 'Moderato' : b < 168 ? 'Allegro' : 'Presto';
function setBpm(b){
  SET.bpm = clamp(Math.round(b / 2) * 2, 60, 200); saveSet();
  $('bpmR').value = SET.bpm; $('bpmV').textContent = SET.bpm; $('bpmT').textContent = tempo(SET.bpm);
}
$('bpmR').addEventListener('input', e => setBpm(+e.target.value));
$('bpmDn').addEventListener('click', () => setBpm(SET.bpm - 4));
$('bpmUp').addEventListener('click', () => setBpm(SET.bpm + 4));

const holdBtn = $('holdBtn');
const setHold = on => { holding = on; holdBtn.classList.toggle('on', on); };
holdBtn.addEventListener('pointerdown', e => { e.preventDefault(); try { holdBtn.setPointerCapture(e.pointerId); } catch(_){} setHold(true); initAudio(); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => holdBtn.addEventListener(ev, () => setHold(false)));
holdBtn.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && mode === 'play'){ e.preventDefault(); if (!e.repeat) setHold(true); }
  if (e.key === 'Escape'){ if (mode === 'play' && !$('setPanel').hidden){ openSet(false); return; } if (mode === 'play') pause(); else if (mode === 'pause') resume(); }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') setHold(false); });
window.addEventListener('blur', () => setHold(false));

function setMode(m){
  mode = m;
  $('titleOv').hidden = m !== 'title'; $('pauseOv').hidden = m !== 'pause';
  const pl = m === 'play';
  $('stats').hidden = !pl && m !== 'pause'; $('bottom').hidden = !pl; $('pauseBtn').hidden = !pl;
  holdBtn.hidden = !(pl && SET.mode === 'hold');
  $('gearBtn').hidden = !pl; if (!pl) openSet(false);
}
function openSet(on){ $('setPanel').hidden = !on; $('gearBtn').setAttribute('aria-expanded', on ? 'true' : 'false'); if (on) requestAnimationFrame(fitSegs); }
$('gearBtn').addEventListener('click', () => openSet($('setPanel').hidden));
$('setClose').addEventListener('click', () => openSet(false));
function start(){
  initAudio(true);
  session.g = 0; session.n = 0;
  setBpm(SET.bpm);
  renderOpts();
  setMode('play');
}
function pause(){ if (mode !== 'play') return; setHold(false); setMode('pause'); disarm();
  $('pSum').textContent = 'リンゴ ' + session.n + '個・' + Math.floor(session.g).toLocaleString() + 'g すりおろした';
  setShare($('shareBtn'), 'スリリンゴで、' + (nightNow ? '誰もいない夜の' : '') + (SET.theme === 'kitchen' ? '台所' : '工場') + 'のロボットアームがリンゴを' + session.n + '個(' + Math.floor(session.g).toLocaleString() + 'g)すりおろした。♩=' + SET.bpm);
}
function resume(){ initAudio(); setMode('play'); }
function backToTitle(){ disarm(); camView = 'far'; updCamBtn(); setMode('title'); renderTitle(); }
$('startBtn').addEventListener('click', start);
$('pauseBtn').addEventListener('click', pause);
$('resumeBtn').addEventListener('click', resume);
let armed = false, armTimer = null; const quitBtn = $('quitBtn');
quitBtn.addEventListener('click', () => {
  if (!armed){ armed = true; quitBtn.textContent = '本当に？(もう一度タップ)'; quitBtn.classList.add('danger'); clearTimeout(armTimer); armTimer = setTimeout(disarm, 3000); return; }
  disarm(); backToTitle();
});
function disarm(){ armed = false; clearTimeout(armTimer); quitBtn.textContent = 'タイトルへ'; quitBtn.classList.remove('danger'); }
const HASHTAG = '#スリリンゴ';
function shareHref(text){ return 'https://x.com/intent/post?text=' + encodeURIComponent(text + ' ' + HASHTAG) + '&url=' + encodeURIComponent(SHARE_URL); }
function setShare(el, text){
  el.href = shareHref(text);
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches){ el.removeAttribute('target'); el.removeAttribute('rel'); }
}
setShare($('tShareBtn'), 'メトロノームみたいに揺れるロボットアームが、ひたすらリンゴをすりおろし続ける。');
document.addEventListener('visibilitychange', () => { if (document.hidden){ if (mode === 'play') pause(); } else initAudio(); });

let hudKey = '';
function updHud(){
  const k = Math.floor(session.g) + '|' + session.n;
  if (k === hudKey) return; hudKey = k;
  $('gV').textContent = Math.floor(session.g).toLocaleString(); $('nV').textContent = session.n;
}

/* ---------- ループ ---------- */
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;
  if ((window.innerWidth || 0) < 1 || (window.innerHeight || 0) < 1) return;
  try {
    if (W !== window.innerWidth || H !== window.innerHeight) resize();
    if (running()){
      const savedBpm = SET.bpm, savedMode = SET.mode;
      if (mode === 'title'){ SET.mode = 'auto'; }
      stepArm(dt); stepBins(dt); stepSwap(dt); updParticles(dt);
      SET.mode = savedMode; SET.bpm = savedBpm;
      const u = tray.userData; if (u.grams > 0) u.B += (1 - u.B) * (1 - Math.exp(-.004 * dt));
      setPulp(tray); if (oldTray) setPulp(oldTray);
      if (M.smear) M.smear.opacity = Math.min(.55, u.grams / 500);
      handV += (Math.abs(HAND.x - prevX) / Math.max(dt, 1e-3) - handV) * (1 - Math.exp(-dt * 14));
    }
    prevX = HAND.x;
    grateLevel(st === 'grate' && mode === 'play' ? handV : 0);
    poseArm(); updCamera(dt); updHud(); updClock();
    if (M.led){ ledFlash *= Math.exp(-dt * 7); M.led.emissiveIntensity = .15 + ledFlash * (nightNow ? 3.2 : 1.6); }
    renderer.render(scene, camera);
  } catch(e){ console.error(e); }
}

resize(); buildWorld(); renderTitle(); setBpm(SET.bpm); setMode('title');
requestAnimationFrame(loop);
</script>
