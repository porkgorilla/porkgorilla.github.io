const LETTER = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function parseSong(s){
  return s.split(/\s+/).filter(Boolean).map(tok => {
    const [n, d] = tok.split(':');
    const m = n.match(/^([A-G])(#?)(\d)$/);
    return {midi: 12 * (+m[3] + 1) + LETTER[m[1]] + (m[2] ? 1 : 0), beats: d ? +d : 1};
  });
}
function genGunkan(){
  const blacks = keys.filter(k => k.black).map(k => k.midi);
  const out = []; let i = Math.floor(blacks.length / 2);
  for (let n = 0; n < 40; n++){
    i = Math.max(0, Math.min(blacks.length - 1, i + pick([-2,-1,-1,0,1,1,2])));
    out.push({midi: blacks[i], beats: pick([.5,.5,.5,1,1,1.5])});
  }
  out.push({midi: blacks[0], beats: 2});
  return out;
}

/* ---------- 状態 ---------- */
let W = 1, H = 1, DPR = 1;
const cv = $('cv'), ctx = cv.getContext('2d');

let keys = [];          // 白鍵・黒鍵
let customers = [];
let floats = [];
let time = 0, lastNote = -99;
const S = {mode:'title', notes:0, eaten:0, remade:0, sales:0, missed:0, song:null};
let soundOn = true;
try { soundOn = localStorage.getItem(LS_SOUND) !== '0'; } catch(e){}

function newSushi(black){ return black ? pick(GUNKAN) : pick(NIGIRI); }
function makeGrains(){ const g = []; for (let i = 0; i < 14; i++) g.push([Math.random(), Math.random(), Math.random()]); return g; }

function buildKeys(nWhite){
  const old = new Map(keys.map(k => [k.midi, k]));
  const W7 = [0,2,4,5,7,9,11];
  const list = [];
  for (let i = 0; i < nWhite; i++){
    const deg = i % 7, m = 60 + Math.floor(i / 7) * 12 + W7[deg];
    list.push(old.get(m) || {midi:m, black:false, wi:i, sushi:newSushi(false), present:true, making:0, down:0, auto:0, grains:makeGrains(), targeted:null});
    if ([0,1,3,4,5].includes(deg) && i < nWhite - 1){
      list.push(old.get(m + 1) || {midi:m + 1, black:true, wi:i, sushi:newSushi(true), present:true, making:0, down:0, auto:0, grains:makeGrains(), targeted:null});
    }
  }
  keys = list;
}
const keyByMidi = m => keys.find(k => k.midi === m);

function layout(){
  const wallH = Math.round(H * 0.4);
  const counterY = wallH;
  const edge = 14;
  const nWhite = Math.max(8, Math.min(15, Math.floor((W - 28) / (W < 560 ? 32 : 46))));
  const keyW = Math.min(66, (W - 28) / nWhite);
  const kbW = keyW * nWhite;
  const kbX = (W - kbW) / 2;
  const keysTop = counterY + edge + 16;
  const keysH = Math.max(40, Math.min(W < 700 ? 250 : 300, H - keysTop - 14));
  L = {wallH, counterY, edge, nWhite, keyW, kbW, kbX, keysTop, keysH};
  if (!keys.length || keys.filter(k => !k.black).length !== nWhite) buildKeys(nWhite);
  const bw = keyW * 0.64, bh = keysH * 0.58;
  keys.forEach(k => {
    if (!k.black){ k.x = kbX + k.wi * keyW; k.y = keysTop; k.w = keyW; k.h = keysH; }
    else { k.x = kbX + (k.wi + 1) * keyW - bw / 2; k.y = keysTop - 2; k.w = bw; k.h = bh; }
  });
  const n = Math.max(3, Math.min(7, Math.round(W / 140)));
  if (customers.length !== n) seatCustomers(n);
  const s = Math.max(.55, Math.min(1.15, wallH / 190));
  customers.forEach((c, i) => { c.x = W * (i + .5) / n; c.s = s; });
}

function seatCustomers(n){
  const pool = PEOPLE.slice().sort(() => Math.random() - .5);
  const prev = customers;
  customers = [];
  for (let i = 0; i < n; i++){
    const p = prev[i] ? prev[i].p : pool.find(q => !customers.some(c => c.p === q)) || pick(PEOPLE);
    customers.push(prev[i] || newCustomer(p));
  }
}
function newCustomer(p){
  return {p, x:0, s:1, h:Math.random() * .5, rate:p.rate / rnd(16, 30), state:'idle', t:0, target:null, carry:null,
          bubble:null, wait:0, phase:Math.random() * 6, side:1};
}
function say(c, text, dur){ c.bubble = {text, t:dur || 1.8}; }

/* ---------- 音 ---------- */
let AC = null, master = null, noiseBuf = null;
function initAudio(force){
  if (AC && force){ try { AC.close().catch(() => {}); } catch(e){} AC = null; }
  else if (AC){ if (AC.state === 'closed') AC = null; else { if (AC.state === 'suspended') AC.resume(); return; } }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    master = AC.createGain(); master.gain.value = .55;
    master.connect(comp).connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * .4, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch(e){ AC = null; }
}
function playNote(m){
  if (!soundOn || !AC) return;
  const t = AC.currentTime, f = 440 * Math.pow(2, (m - 69) / 12);
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.3, t + .006);
  g.gain.exponentialRampToValueAtTime(.11, t + .28); g.gain.exponentialRampToValueAtTime(.0008, t + 1.9);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(f * 9, t); lp.frequency.exponentialRampToValueAtTime(f * 2.2, t + 1.1);
  lp.connect(g).connect(master);
  [[1,'triangle',1],[2,'sine',.32],[3,'sine',.1],[1.002,'sine',.25]].forEach(([mul, type, a]) => {
    const o = AC.createOscillator(), og = AC.createGain();
    o.type = type; o.frequency.value = f * mul; og.gain.value = a;
    o.connect(og).connect(lp); o.start(t); o.stop(t + 2);
  });
}
function blip(f0, f1, dur, vol, type){
  if (!soundOn || !AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq, when){
  if (!soundOn || !AC || !noiseBuf) return;
  const t = AC.currentTime + (when || 0), s = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.2;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  s.connect(bp).connect(g).connect(master); s.start(t); s.stop(t + dur + .02);
}
const sfxThud = () => { blip(120, 55, .14, .35); noise(.06, .08, 400); };
const sfxGrab = () => { noise(.05, .18, 2400); blip(900, 500, .05, .06, 'square'); };
const sfxChew = () => { noise(.07, .12, 900, 0); noise(.07, .1, 1100, .18); noise(.07, .09, 800, .36); };
const sfxMake = () => { noise(.12, .08, 600); blip(520, 760, .09, .1); };

/* ---------- 鍵盤の操作 ---------- */
function pressKey(k, auto){
  if (!k.present || k.making){ return false; }
  if (auto) k.auto = auto; else k.down++;
  playNote(k.midi); S.notes++; lastNote = time; updateStat();
  return true;
}
function releaseKey(k){ if (k) k.down = Math.max(0, k.down - 1); }
function remake(k){
  if (k.present || k.making) return;
  k.sushi = newSushi(k.black); k.making = .001; S.remade++; sfxMake();
}

const ptrs = new Map();
function canvasPos(e){ const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
function inRect(p, k){ return p.x >= k.x && p.x <= k.x + k.w && p.y >= k.y && p.y <= k.y + k.h; }
function hitKey(p){ return keys.find(k => k.black && inRect(p, k)) || keys.find(k => !k.black && inRect(p, k)) || null; }
function hitCustomer(p){
  if (p.y > L.counterY) return null;
  return customers.find(c => Math.abs(p.x - c.x) < 34 * c.s && p.y > headY(c) - 26 * c.s) || null;
}
cv.addEventListener('pointerdown', e => {
  if (S.mode !== 'play') return;
  initAudio();
  const p = canvasPos(e);
  const c = hitCustomer(p);
  if (c){ say(c, pick(c.p.talk), 1.8); return; }
  const k = hitKey(p);
  if (!k) return;
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  if (!k.present){ remake(k); ptrs.set(e.pointerId, null); return; }
  pressKey(k); ptrs.set(e.pointerId, k);
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || S.mode !== 'play') return;
  const cur = ptrs.get(e.pointerId), k = hitKey(canvasPos(e));
  if (k === cur) return;
  if (cur) releaseKey(cur);
  if (k && k.present && !k.making){ pressKey(k); ptrs.set(e.pointerId, k); }
  else ptrs.set(e.pointerId, null);
});
function endPtr(e){ if (!ptrs.has(e.pointerId)) return; releaseKey(ptrs.get(e.pointerId)); ptrs.delete(e.pointerId); }
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('lostpointercapture', endPtr);

const KEYMAP = {KeyA:0,KeyW:1,KeyS:2,KeyE:3,KeyD:4,KeyF:5,KeyT:6,KeyG:7,KeyY:8,KeyH:9,KeyU:10,KeyJ:11,KeyK:12,KeyO:13,KeyL:14,KeyP:15,Semicolon:16,Quote:17};
const kbHeld = new Map();
addEventListener('keydown', e => {
  if (e.code === 'Escape'){ if (S.mode === 'play') openPause(); else if (S.mode === 'pause') closePause(); return; }
  if (S.mode !== 'play' || e.repeat || e.metaKey || e.ctrlKey) return;
  if (!(e.code in KEYMAP)) return;
  e.preventDefault(); initAudio();
  const k = keyByMidi(60 + KEYMAP[e.code]);
  if (!k) return;
  if (!k.present){ remake(k); return; }
  if (pressKey(k)) kbHeld.set(e.code, k);
});
addEventListener('keyup', e => { const k = kbHeld.get(e.code); if (k){ releaseKey(k); kbHeld.delete(e.code); } });

/* ---------- 曲の自動演奏 ---------- */
const songSel = $('song'), playBtn = $('playBtn');
const SHUFFLE = 'shuffle';
{ const o = document.createElement('option'); o.value = SHUFFLE; o.textContent = `ランダム連続演奏(全${SONGS.length}曲)`; songSel.appendChild(o); }
SONGS.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.title; songSel.appendChild(o); });
function playDef(def){
  S.song = {list: def.gen ? genGunkan() : parseSong(def.notes), i:0, t:.25, spb: 60 / def.bpm, title:def.title};
  S.lastSongId = def.id;
}
function nextShuffle(){ return pick(SONGS.filter(s => s.id !== S.lastSongId)); }
function announce(def){ const c = pick(customers); if (c) say(c, `お、「${def.title}」`, 1.8); }
function startSong(){
  S.shuffle = songSel.value === SHUFFLE; S.nextT = 0;
  if (S.shuffle){ const d = nextShuffle(); playDef(d); announce(d); }
  else playDef(SONGS.find(s => s.id === songSel.value));
  playBtn.textContent = '■ 止める'; playBtn.classList.add('on');
}
function stopSong(){ S.song = null; S.shuffle = false; S.nextT = 0; playBtn.textContent = '▶ 演奏'; playBtn.classList.remove('on'); }
const isPlaying = () => !!S.song || S.shuffle;
playBtn.addEventListener('click', () => { initAudio(); if (S.mode !== 'play') return; isPlaying() ? stopSong() : startSong(); });
$('remakeBtn').addEventListener('click', () => {
  if (S.mode !== 'play') return; initAudio();
  let n = 0; keys.forEach(k => { if (!k.present && !k.making){ k.sushi = newSushi(k.black); k.making = .001 - n * .06; S.remade++; n++; } });
  if (n) sfxMake();
});
function updateSong(dt){
  // ランダム連続演奏: 曲と曲のあいだの間
  if (!S.song && S.shuffle){
    S.nextT -= dt;
    if (S.nextT <= 0){ const d = nextShuffle(); playDef(d); announce(d); }
    return;
  }
  const sg = S.song; if (!sg) return;
  sg.t -= dt;
  while (sg && sg.t <= 0){
    if (sg.i >= sg.list.length){
      if (S.shuffle){ S.song = null; S.nextT = 2.2; }
      else stopSong();
      const c = pick(customers); say(c, pick(['パチパチ','よっ、大将！','いい曲だねえ']), 1.8);
      return;
    }
    const ev = sg.list[sg.i++], dur = ev.beats * sg.spb, k = keyByMidi(ev.midi);
    if (k && k.present && !k.making){ pressKey(k, dur * .8); }
    else if (k){
      sfxThud(); S.missed++;
      floats.push({x:k.x + k.w / 2, y:k.y + 10, text:'スカッ', t:0, col:'#5b3a1e'});
      const chewer = customers.find(c => c.state === 'chew');
      if (chewer && Math.random() < .5) say(chewer, `あ、その${NOTE_JA[k.midi % 12]}食べちゃった`, 1.6);
    } else { playNote(ev.midi); }
    sg.t += dur;
  }
}

/* ---------- 更新 ---------- */
function headY(c){ return L.counterY - 52 * c.s - 20 * c.s; }
function chooseTarget(c){
  const avail = keys.filter(k => k.present && !k.making && !k.targeted);
  if (!avail.length) return null;
  const favs = c.p.fav === 'any' ? [] : avail.filter(k => k.sushi.id === c.p.fav);
  if (favs.length && Math.random() < .7) return pick(favs);
  // 近い鍵盤ほど選ばれやすい
  let best = null, bs = -1;
  avail.forEach(k => { const d = Math.abs(k.x + k.w / 2 - c.x) / W; const sc = Math.random() / (0.25 + d); if (sc > bs){ bs = sc; best = k; } });
  return best;
}
function update(dt){
  time += dt;
  // making: 0=握っていない、正=握っている途中、負=順番待ち(全部握る)
  keys.forEach(k => {
    if (k.auto > 0) k.auto = Math.max(0, k.auto - dt);
    if (k.making !== 0){ k.making += dt; if (k.making >= .45){ k.making = 0; k.present = true; } }
  });
  updateSong(dt);
  const music = time - lastNote < 2.5;
  customers.forEach(c => {
    if (c.bubble){ c.bubble.t -= dt; if (c.bubble.t <= 0) c.bubble = null; }
    c.phase += dt * (music ? 3.2 : .8);
    switch (c.state){
      case 'idle':
        c.h += dt * c.rate * (music ? 1.7 : 1);
        if (c.h >= 1){
          const k = chooseTarget(c);
          if (k){ c.target = k; k.targeted = c; c.state = 'warn'; c.t = 0; c.side = (k.x + k.w / 2) < c.x ? -1 : 1;
            say(c, fmt(pick(REACH), {neta:k.sushi.name}), 1.7); }
          else { c.wait -= dt; if (c.wait <= 0){ say(c, '大将、まだ？', 1.4); c.wait = 4; } }
        } else if (music && Math.random() < dt * .02 && !c.bubble){ say(c, pick(['♪','いい曲だねえ','♪♪']), 1.4); }
        break;
      case 'warn': c.t += dt; if (c.t >= .9){ c.state = 'reach'; c.t = 0; } break;
      case 'reach':
        c.t += dt;
        if (c.t >= .5){
          const k = c.target;
          if (k.present && !k.making){
            k.present = false; k.down = 0; k.auto = 0;
            ptrs.forEach((v, id) => { if (v === k) ptrs.set(id, null); });
            kbHeld.forEach((v, code) => { if (v === k) kbHeld.delete(code); });
            c.carry = {sushi:k.sushi, midi:k.midi, black:k.black}; sfxGrab();
          } else c.carry = null;
          k.targeted = null; c.state = 'back'; c.t = 0;
        }
        break;
      case 'back':
        c.t += dt;
        if (c.t >= .45){
          if (c.carry){
            c.state = 'chew'; c.t = 0; sfxChew();
            S.eaten++; S.sales += c.carry.sushi.price; updateStat();
            floats.push({x:c.x + 30 * c.s, y:Math.max(14, headY(c) + 6 * c.s), text:'+¥' + c.carry.sushi.price, t:0, col:'#f3c969'});
            say(c, fmt(pick(c.p.eat), {note:NOTE_JA[c.carry.midi % 12]}), 1.6);
          } else { c.state = 'idle'; c.h = .6; say(c, 'あれ？', 1); }
        }
        break;
      case 'chew':
        c.t += dt;
        if (c.t >= 1.3){ c.state = 'idle'; c.h = 0; c.carry = null; c.rate = c.p.rate / rnd(16, 30); }
        break;
    }
  });
  floats.forEach(f => f.t += dt);
  floats = floats.filter(f => f.t < 1.2);
}

/* ---------- 描画 ---------- */
function rr(x, y, w, h, r){

  if (!c.bubble) return;
  const s = c.s, txt = c.bubble.text;
  ctx.font = `700 ${Math.max(11, 13 * Math.min(1, s + .1))}px ${FONT}`;
  const tw = ctx.measureText(txt).width, bw = tw + 16, bh = 24;
  let bx = c.x - bw / 2; bx = Math.max(4, Math.min(W - bw - 4, bx));
  const by = Math.max(4, headY(c) - 20 * s - 8 - bh - (c.p.style === 'mage' || c.p.style === 'bun' ? 8 * s : 0));
  const a = Math.min(1, c.bubble.t * 4);
  ctx.globalAlpha = a;
  ctx.fillStyle = '#fbf6ea'; rr(bx, by, bw, bh, 10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(c.x - 5, by + bh - 1); ctx.lineTo(c.x, by + bh + 7); ctx.lineTo(c.x + 5, by + bh - 1); ctx.fill();
  ctx.fillStyle = '#2a1a12'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, bx + bw / 2, by + bh / 2 + 1);
  ctx.globalAlpha = 1;
}
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawWall();
  customers.forEach(drawCustomerBody);
  drawKeyboard();
  customers.forEach(drawArm);
  customers.forEach(drawBubble);
  floats.forEach(f => {
    ctx.globalAlpha = 1 - f.t / 1.2; ctx.fillStyle = f.col; ctx.font = `900 15px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y - f.t * 28); ctx.globalAlpha = 1;
  });
}

/* ---------- 画面サイズ ---------- */
const stage = $('stage');
function resize(){
  W = Math.max(1, stage.clientWidth || 0); H = Math.max(1, stage.clientHeight || 0);
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (W > 1 && H > 1) layout();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else addEventListener('resize', resize);
resize();

let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;
  if (W < 2 || H < 2) return;
  try { if (S.mode === 'play') update(dt); else time += dt * .3; render(); } catch(e){ console.error(e); }
}
requestAnimationFrame(loop);

/* ---------- UI ---------- */
function updateStat(){ $('stat').innerHTML = `売上 <b>¥${S.sales.toLocaleString()}</b> · ${S.eaten}貫`; }
function shareHref(text){ return 'https://x.com/intent/post?text=' + encodeURIComponent(text + ' ' + HASHTAG) + '&url=' + encodeURIComponent(SHARE_URL); }
function setShare(el, text){
  el.href = shareHref(text);
  if (matchMedia('(pointer: coarse)').matches){ el.removeAttribute('target'); el.removeAttribute('rel'); }
}
setShare($('shareTitle'), '鍵盤が寿司のピアノ。弾いていると、お客さんが勝手に鍵盤を食べていく「スシピアノ」');

function sndIcon(){
  $('sndBtn').innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
  $('sndBtn').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
}
sndIcon();
$('sndBtn').addEventListener('click', () => {
  soundOn = !soundOn; try { localStorage.setItem(LS_SOUND, soundOn ? '1' : '0'); } catch(e){}
  sndIcon(); if (soundOn) initAudio();
});

function resetShop(){
  S.notes = 0; S.eaten = 0; S.remade = 0; S.sales = 0; S.missed = 0; stopSong();
  keys.forEach(k => { k.present = true; k.making = 0; k.down = 0; k.auto = 0; k.targeted = null; k.sushi = newSushi(k.black); });
  customers = []; layout(); floats = []; ptrs.clear(); kbHeld.clear(); updateStat();
}
function startGame(){
  initAudio(true);
  resetShop();
  S.mode = 'play';
  $('titleOv').hidden = true; $('resultOv').hidden = true; $('pauseOv').hidden = true; $('pauseBtn').hidden = false;
  setTimeout(() => { if (customers[0]) say(customers[0], 'へい、大将！', 1.6); }, 300);
}
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
function backToTitle(){
  S.mode = 'title'; stopSong();
  $('resultOv').hidden = true; $('pauseOv').hidden = true; $('titleOv').hidden = false; $('pauseBtn').hidden = true;
}
$('titleBtn').addEventListener('click', backToTitle);

function openPause(){
  if (S.mode !== 'play') return;
  S.mode = 'pause';
  keys.forEach(k => { k.down = 0; }); ptrs.clear();
  const songTxt = S.song ? `「${S.song.title}」を演奏中、` : '';
  $('pauseMsg').textContent = `${songTxt}売上 ¥${S.sales.toLocaleString()}、食べられた鍵盤 ${S.eaten}貫`;
  setShare($('sharePause'), `スシピアノで営業中。${S.notes}音弾いて、${S.eaten}貫食べられた`);
  disarm(); $('pauseOv').hidden = false;
}
function closePause(){ if (S.mode !== 'pause') return; S.mode = 'play'; $('pauseOv').hidden = true; initAudio(); }
$('pauseBtn').addEventListener('click', openPause);
$('resumeBtn').addEventListener('click', closePause);

let armed = false, armTimer = null;
const closeBtn = $('closeBtn');
function disarm(){ armed = false; clearTimeout(armTimer); closeBtn.textContent = '暖簾をしまう'; closeBtn.classList.remove('danger'); closeBtn.classList.add('ghost'); }
closeBtn.addEventListener('click', () => {
  if (!armed){ armed = true; closeBtn.textContent = '本当に？(もう一度タップ)'; closeBtn.classList.add('danger'); closeBtn.classList.remove('ghost');
    clearTimeout(armTimer); armTimer = setTimeout(disarm, 3000); return; }
  disarm(); showResult();
});

function showResult(){
  S.mode = 'result'; stopSong();
  $('pauseOv').hidden = true; $('pauseBtn').hidden = true;
  let best = 0; try { best = +localStorage.getItem(LS_BEST) || 0; } catch(e){}
  const isBest = S.sales > best;
  if (isBest){ try { localStorage.setItem(LS_BEST, String(S.sales)); } catch(e){} }
  $('bill').innerHTML =
    `<div><span>弾いた音</span><span>${S.notes}音</span></div>` +
    `<div><span>鳴らなかった音(食べられ跡)</span><span>${S.missed}音</span></div>` +
    `<div><span>握り直し</span><span>${S.remade}貫</span></div>` +
    `<div><span>食べられた鍵盤</span><span>${S.eaten}貫</span></div>` +
    `<div class="total"><span>売上</span><span>¥${S.sales.toLocaleString()}</span></div>`;
  $('best').textContent = isBest && S.sales > 0 ? '本日の最高売上を更新しました' : `これまでの最高売上 ¥${Math.max(best, S.sales).toLocaleString()}`;
  setShare($('shareResult'), `スシピアノで${S.notes}音弾いたら、鍵盤を${S.eaten}貫食べられた。売上¥${S.sales.toLocaleString()}`);
  $('resultOv').hidden = false;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden){ if (S.mode === 'play') openPause(); }
  else initAudio();
});
</script>
</body>
</html>
