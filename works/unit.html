<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNIT_CONVERTER | porkgorilla://</title>
  <meta name="description" content="長さ・重さ・面積・容量・速度・データ量・温度を相互変換する単位変換ツール。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBT4300J0L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MBT4300J0L');
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    main { padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    h1 { margin: 0; font-size: 1.6rem; }
    .box { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }
    .box > * + * { margin-top: 12px; }
    input, select { font-family: var(--cyber-font); font-size: 1rem; padding: 8px 10px; width: 100%; box-sizing: border-box; min-width: 0;
      background: var(--cyber-bg-panel); color: var(--cyber-text); border: 1px solid var(--cyber-green-dim); }
    input:focus, select:focus { outline: none; border-color: var(--cyber-green); }
    label { color: var(--cyber-green-dim); font-size: .85rem; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1 1 0; min-width: 0; }
    .swap { text-align: center; }
    #res { font-size: 1.05rem; color: var(--cyber-green); text-align: center; word-break: break-all; }
    .credit { font-size: 11px; color: var(--cyber-green-dim); margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>📏 UNIT_CONVERTER</h1>
    <div class="box panel">
      <div><label>種類</label><select id="cat"></select></div>
      <div class="row">
        <div><label>変換元</label><input id="v" type="number" step="any" value="1" inputmode="decimal"></div>
        <div><label>単位</label><select id="from"></select></div>
      </div>
      <div class="swap"><button class="btn" id="swap" type="button">⇅ 入れ替え</button></div>
      <div class="row">
        <div><label>変換結果</label><input id="r" readonly></div>
        <div><label>単位</label><select id="to"></select></div>
      </div>
      <div id="res"></div>
    </div>
    <div class="credit">porkgorilla — 2026</div>
  </main>

  <script src="/site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    // 係数は基準単位あたりの量。温度だけは関数で変換する。
    const CATS = {
      '長さ': { u: { 'mm': .001, 'cm': .01, 'm': 1, 'km': 1000, 'inch': .0254, 'feet': .3048, 'yard': .9144, 'mile': 1609.344 }, from: 'm', to: 'feet' },
      '重さ': { u: { 'mg': 1e-6, 'g': .001, 'kg': 1, 't': 1000, 'oz': .028349523125, 'lb': .45359237 }, from: 'kg', to: 'lb' },
      '面積': { u: { 'cm²': 1e-4, 'm²': 1, 'ha': 1e4, 'km²': 1e6, '畳': 1.62, '坪': 3.305785, 'acre': 4046.8564224, 'ft²': .09290304 }, from: 'm²', to: '畳' },
      '容量': { u: { 'mL': .001, 'L': 1, 'm³': 1000, 'cup(US)': .2365882365, 'gal(US)': 3.785411784, 'fl oz(US)': .0295735295625 }, from: 'L', to: 'gal(US)' },
      '速度': { u: { 'm/s': 1, 'km/h': 1 / 3.6, 'mph': .44704, 'knot': .514444444 }, from: 'km/h', to: 'mph' },
      'データ量': { u: { 'bit': .125, 'B': 1, 'KB': 1e3, 'MB': 1e6, 'GB': 1e9, 'TB': 1e12, 'KiB': 1024, 'MiB': 1048576, 'GiB': 1073741824 }, from: 'MB', to: 'MiB' },
      '温度': { temp: true, u: { '°C': 0, '°F': 0, 'K': 0 }, from: '°C', to: '°F' }
    };
    const toC = { '°C': x => x, '°F': x => (x - 32) * 5 / 9, 'K': x => x - 273.15 };
    const fromC = { '°C': x => x, '°F': x => x * 9 / 5 + 32, 'K': x => x + 273.15 };
    function fill(sel, keys) { sel.innerHTML = keys.map(k => '<option>' + k + '</option>').join(''); }
    function loadCat() {
      const c = CATS[$('cat').value], keys = Object.keys(c.u);
      fill($('from'), keys); fill($('to'), keys);
      $('from').value = c.from; $('to').value = c.to;
      convert();
    }
    function fmt(x) {
      if (!isFinite(x)) return '';
      const a = Math.abs(x);
      return (a !== 0 && (a >= 1e12 || a < 1e-6)) ? x.toExponential(6) : String(parseFloat(x.toPrecision(10)));
    }
    function convert() {
      const c = CATS[$('cat').value], v = parseFloat($('v').value);
      if (isNaN(v)) { $('r').value = ''; $('res').textContent = ''; return; }
      const f = $('from').value, t = $('to').value;
      const out = c.temp ? fromC[t](toC[f](v)) : v * c.u[f] / c.u[t];
      $('r').value = fmt(out);
      $('res').textContent = fmt(v) + ' ' + f + ' = ' + fmt(out) + ' ' + t;
    }
    fill($('cat'), Object.keys(CATS));
    $('cat').onchange = loadCat;
    ['v', 'from', 'to'].forEach(id => $(id).addEventListener('input', convert));
    $('swap').onclick = () => { const a = $('from').value; $('from').value = $('to').value; $('to').value = a; convert(); };
    loadCat();
  </script>
</body>
</html>
