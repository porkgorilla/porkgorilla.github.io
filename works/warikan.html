<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARIKAN | porkgorilla://</title>
  <meta name="description" content="割り勘計算ツール。端数の丸め単位、多め・少なめの傾斜配分、幹事の負担まで計算。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBT4300J0L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MBT4300J0L');
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    main { padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    h1 { margin: 0; font-size: 1.6rem; }
    .box { width: 100%; max-width: 480px; padding: 18px 16px 16px; }
    .box > * + * { margin-top: 12px; }
    input, select { font-family: var(--cyber-font); font-size: 1rem; padding: 8px 10px; width: 100%; min-width: 0;
      background: var(--cyber-bg-panel); color: var(--cyber-text); border: 1px solid var(--cyber-green-dim); }
    input:focus, select:focus { outline: none; border-color: var(--cyber-green); }
    label { color: var(--cyber-green-dim); font-size: .85rem; display: block; margin-bottom: 4px; }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row > div { flex: 1 1 0; min-width: 0; }
    #groups .row > div:nth-child(1) { flex: 1.3 1 0; }
    #groups .row > div:nth-child(2) { flex: .7 1 0; }
    #groups .row > div:nth-child(3) { flex: 1.2 1 0; }
    #groups select { padding: 8px 4px; }
    .del { flex: 0 0 auto; padding: 8px 12px; border: 1px solid var(--cyber-red); background: none; color: var(--cyber-red);
      font-family: var(--cyber-font); cursor: pointer; }
    .del:disabled { opacity: .3; cursor: default; }
    #groups > * + * { margin-top: 8px; }
    .add { width: 100%; padding: .55rem; font-size: .9rem; }
    .result { width: 100%; max-width: 480px; padding: 18px 16px; }
    .result table { width: 100%; border-collapse: collapse; }
    .result td { padding: 8px 4px; border-bottom: 1px dashed var(--cyber-green-dim); }
    .result td.num { text-align: right; color: var(--cyber-green); font-size: 1.2rem; white-space: nowrap; }
    .result .sum { margin-top: 12px; font-size: .9rem; line-height: 1.8; }
    .result .sum b { color: var(--cyber-green); }
    #err { color: var(--cyber-red); }
    .row .btn { flex: 1; padding: .6rem .8rem; font-size: .9rem; }
    .credit { font-size: 11px; color: var(--cyber-green-dim); margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>💴 WARIKAN</h1>
    <div class="box panel">
      <div><label for="total">合計金額 (円)</label><input id="total" type="number" min="0" value="23800" inputmode="numeric"></div>
      <div class="row">
        <div><label for="unit">丸め単位</label>
          <select id="unit"><option>1</option><option>10</option><option selected>100</option><option>500</option><option>1000</option></select></div>
        <div><label for="round">端数の扱い</label>
          <select id="round"><option value="up" selected>切り上げ</option><option value="down">切り捨て</option></select></div>
      </div>
      <div>
        <label>グループ (名前 / 人数 / 負担の重み)</label>
        <div id="groups"></div>
      </div>
      <button class="btn add" id="add" type="button">+ グループを追加</button>
    </div>

    <div class="result panel">
      <div id="err"></div>
      <table id="table"></table>
      <div class="sum" id="sum"></div>
    </div>
    <div class="row" style="width:100%;max-width:480px">
      <button class="btn" id="copy" type="button">結果をコピー</button>
    </div>
    <div class="credit">porkgorilla — 2026</div>
  </main>

  <script src="/site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const yen = n => n.toLocaleString('ja-JP') + '円';

    function addGroup(name, count, weight) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<div><input class="g-name" type="text" aria-label="名前"></div>' +
        '<div><input class="g-count" type="number" min="0" inputmode="numeric" aria-label="人数"></div>' +
        '<div><select class="g-weight" aria-label="負担の重み">' +
          [['0.5', '半額'], ['0.8', '少なめ'], ['1', 'ふつう'], ['1.2', '多め'], ['1.5', '×1.5'], ['2', '×2']]
            .map(([v, l]) => `<option value="${v}">${l}</option>`).join('') +
        '</select></div>' +
        '<button class="del" type="button" aria-label="削除">×</button>';
      row.querySelector('.g-name').value = name;
      row.querySelector('.g-count').value = count;
      row.querySelector('.g-weight').value = weight;
      row.querySelector('.del').onclick = () => { row.remove(); refreshDel(); calc(); };
      row.addEventListener('input', calc);
      row.addEventListener('change', calc);
      $('groups').appendChild(row);
      refreshDel();
    }
    function refreshDel() {
      const rows = $('groups').children;
      [...rows].forEach(r => { r.querySelector('.del').disabled = rows.length <= 1; });
    }

    let lastText = '';
    function calc() {
      const total = Math.floor(+$('total').value || 0);
      const unit = +$('unit').value;
      const up = $('round').value === 'up';
      const groups = [...$('groups').children].map(r => ({
        name: r.querySelector('.g-name').value.trim() || 'グループ',
        count: Math.max(0, Math.floor(+r.querySelector('.g-count').value || 0)),
        weight: +r.querySelector('.g-weight').value,
        label: r.querySelector('.g-weight').selectedOptions[0].textContent
      }));
      const people = groups.reduce((a, g) => a + g.count, 0);
      const wsum = groups.reduce((a, g) => a + g.count * g.weight, 0);
      $('table').innerHTML = '';
      $('sum').innerHTML = '';
      $('err').textContent = '';
      if (!total || !people) { $('err').textContent = '合計金額と人数を入れてください'; lastText = ''; return; }

      // 重み1あたりの金額から1人分を出し、丸め単位で切り上げ/切り捨て
      const base = total / wsum;
      let collected = 0;
      const lines = [];
      groups.filter(g => g.count).forEach(g => {
        const raw = base * g.weight;
        const each = (up ? Math.ceil(raw / unit) : Math.floor(raw / unit)) * unit;
        collected += each * g.count;
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        td1.textContent = `${g.name} (${g.label}) × ${g.count}人`;
        const td2 = document.createElement('td');
        td2.className = 'num';
        td2.textContent = yen(each) + ' / 人';
        tr.append(td1, td2);
        $('table').appendChild(tr);
        lines.push(`${g.name}(${g.label}) ${yen(each)} × ${g.count}人`);
      });
      const diff = collected - total;
      const diffText = diff === 0 ? 'ぴったり' : diff > 0 ? `${yen(diff)} 余る(幹事が受け取る)` : `${yen(-diff)} 不足(幹事が負担)`;
      $('sum').innerHTML = `合計 <b>${yen(total)}</b> / ${people}人<br>集金額 <b>${yen(collected)}</b> → <b>${diffText}</b>`;
      lastText = `【割り勘】合計 ${yen(total)} / ${people}人\n` + lines.join('\n') + `\n集金額 ${yen(collected)}(${diffText})`;
    }

    $('add').onclick = () => { addGroup('', 1, '1'); calc(); };
    ['total', 'unit', 'round'].forEach(id => { $(id).addEventListener('input', calc); $(id).addEventListener('change', calc); });
    $('copy').onclick = async () => {
      if (!lastText) return;
      try { await navigator.clipboard.writeText(lastText); $('copy').textContent = 'コピーしました ✓'; }
      catch (e) { $('copy').textContent = 'コピーできませんでした'; }
      setTimeout(() => { $('copy').textContent = '結果をコピー'; }, 1200);
    };

    addGroup('先輩', 2, '1.5');
    addGroup('みんな', 5, '1');
    calc();
  </script>
</body>
</html>
