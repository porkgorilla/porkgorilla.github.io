<script>
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth||0); H = Math.max(1, window.innerHeight||0);
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (game.state === 'aim') layoutItems();
}
window.addEventListener('resize', resize);

const $ = id => document.getElementById(id);
const DEG = Math.PI/180;
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const easeIn = t=>t*t*t;
const easeOut = t=>1-Math.pow(1-t,3);
const easeIO = t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}

/* ---------- sound ---------- */
let AC = null;
let soundOn = store('yoko-burger-sound') !== 'off';
function audio(force){
  if (AC && force){ try{ AC.close().catch(()=>{}); }catch(e){} AC = null; }
  else if (AC){ if (AC.state==='closed') AC = null; else { if (AC.state==='suspended') AC.resume().catch(()=>{}); return; } }
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = null; }
}
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) audio(); });
function tone(freq, dur, type='square', vol=.15, slide=0){
  if(!AC || !soundOn) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur);
}
function noise(dur, vol=.4, lp=800){
  if(!AC || !soundOn) return;
  const t = AC.currentTime, n = Math.floor(AC.sampleRate*dur);
  const b = AC.createBuffer(1,n,AC.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n,2);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value = lp;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(AC.destination); s.start(t);
}
const sfx = {
  lock(err){ const p = err<3?1320:err<10?990:660; tone(p,.09,'square',.12); if(err<3) setTimeout(()=>tone(1760,.12,'square',.1),70); },
  slam(){ noise(.3,.9,450); tone(110,.35,'sine',.6,.35); setTimeout(()=>noise(.12,.35,3000),30); },
  combo(n){ tone(660*Math.pow(1.06,Math.min(n,16)),.1,'square',.09); },
  splat(){ noise(.2,.6,1200); tone(200,.2,'sawtooth',.12,.4); },
  chain(){ tone(520,.08,'square',.1,1.6); },
  grr(){ tone(90,.35,'sawtooth',.14,.8); setTimeout(()=>tone(85,.3,'sawtooth',.12,.7),120); },
  whistle(){ tone(300,1.0,'sine',.12,5); },
  gachan(){ noise(.12,.8,2500); tone(140,.15,'square',.18,.6); setTimeout(()=>noise(.08,.5,1200),110); },
  shutter(){ for(let i=0;i<16;i++) setTimeout(()=>{ noise(.06,.35,900+Math.random()*600); }, i*70); setTimeout(()=>{ noise(.25,.6,400); tone(80,.2,'sine',.3,.6); }, 1150); },
  boom(){ noise(1.2,1.0,260); noise(.5,.6,1500); tone(55,.9,'sine',.6,.4); },
  fly(){ tone(rand(500,800),.5,'triangle',.12,3); },
  kick(){ noise(.12,.4,2000); tone(300,.3,'square',.12,2.5); },
  tick(){ tone(1800,.03,'square',.05); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.15,'square',.1),i*90)); },
  lose(){ [400,300,200].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sawtooth',.1),i*140)); },
};

/* ---------- ingredients ---------- */
// t: thickness factor (relative to h), sym: 180° rotation ok?, len: length factor
const TYPES = {
  bunTop:   {name:'上バンズ', t:.30, len:1.00, sym:false},
  bunBot:   {name:'下バンズ', t:.20, len:1.00, sym:false},
  patty:    {name:'パティ',   t:.15, len:.94,  sym:true},
  cheese:   {name:'チーズ',   t:.05, len:.92,  sym:false},
  lettuce:  {name:'レタス',   t:.09, len:1.08, sym:true},
  tomato:   {name:'トマト',   t:.08, len:.82,  sym:true},
  pickles:  {name:'ピクルス', t:.06, len:.80,  sym:true},
  onion:    {name:'オニオン', t:.05, len:.86,  sym:true},
  bacon:    {name:'ベーコン', t:.06, len:1.02, sym:true},
  boot:     {name:'長靴',     t:.34, len:.95,  sym:true, bad:true},
};
const FILLINGS = ['patty','cheese','lettuce','tomato','pickles','onion','bacon','patty'];

function drawItem(it){
  const h = game.h, r = h/2*TYPES[it.type].len, t = h*TYPES[it.type].t;
  ctx.save();
  switch(it.type){
    case 'bunTop': {
      const g = ctx.createLinearGradient(-t,0,t*.6,0);
      g.addColorStop(0,'#a8581c'); g.addColorStop(.5,'#e39a3f'); g.addColorStop(1,'#f3c27a');
      ctx.fillStyle = g; ctx.strokeStyle='#6b3410'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(t*.5,0,t,r,0,Math.PI/2,Math.PI*1.5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fbe6b6'; ctx.fillRect(t*.5-4,-r*.98,4,r*1.96);
      ctx.fillStyle='#fff6dc';
      const seeds = [[-.6,-.6],[-.75,-.2],[-.7,.25],[-.55,.65],[-.3,-.85],[-.35,.0],[-.3,.45],[-.15,-.4],[-.1,.8]];
      for(const [sx,sy] of seeds){ ctx.beginPath(); ctx.ellipse(t*.5+sx*t*.95, sy*r*.85, t*.05, t*.1, .4, 0, Math.PI*2); ctx.fill(); }
      break; }
    case 'bunBot': {
      const g = ctx.createLinearGradient(-t*.5,0,t*.5,0);
      g.addColorStop(0,'#fbe6b6'); g.addColorStop(.6,'#e8a24c'); g.addColorStop(1,'#b8662a');
      ctx.fillStyle = g; ctx.strokeStyle='#6b3410'; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(-t*.5,-r*.98); ctx.lineTo(t*.2,-r*.98);
      ctx.quadraticCurveTo(t*.5,-r*.98,t*.5,-r*.7);
      ctx.lineTo(t*.5,r*.7); ctx.quadraticCurveTo(t*.5,r*.98,t*.2,r*.98);
      ctx.lineTo(-t*.5,r*.98); ctx.closePath(); ctx.fill(); ctx.stroke();
      break; }
    case 'patty': {
      ctx.fillStyle='#5a2f17'; ctx.strokeStyle='#2e160a'; ctx.lineWidth=3;
      rr(-t/2,-r,t,2*r,t*.45); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#7a4424';
      for(let i=0;i<9;i++){ const y = -r*.8 + i*r*.2; ctx.beginPath(); ctx.ellipse((i%2?-1:1)*t*.15, y, t*.12, t*.18, 0, 0, Math.PI*2); ctx.fill(); }
      ctx.strokeStyle='#2e160a'; ctx.lineWidth=2;
      for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(-t*.35,i*r*.3-t*.3); ctx.lineTo(t*.35,i*r*.3+t*.3); ctx.stroke(); }
      break; }
    case 'cheese': {
      ctx.fillStyle='#ffc928'; ctx.strokeStyle='#c98a00'; ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(-t/2,-r); ctx.lineTo(t/2,-r); ctx.lineTo(t*3.2,-r*1.02); ctx.lineTo(t/2,-r*.78);
      ctx.lineTo(t/2,r*.1); ctx.lineTo(t*1.8,r*.18); ctx.lineTo(t/2,r*.3);
      ctx.lineTo(t/2,r*.78); ctx.lineTo(t*3.2,r*1.02); ctx.lineTo(t/2,r); ctx.lineTo(-t/2,r);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      break; }
    case 'lettuce': {
      ctx.fillStyle='#5cc23a'; ctx.strokeStyle='#2c7d17'; ctx.lineWidth=2.5;
      ctx.beginPath();
      const n=14;
      ctx.moveTo(-t/2,-r);
      for(let i=0;i<=n;i++){ const y=-r+2*r*i/n; ctx.lineTo(t/2 + (i%2? t*.9 : t*.2), y); }
      for(let i=n;i>=0;i--){ const y=-r+2*r*i/n; ctx.lineTo(-t/2 - (i%2? t*.5 : 0), y); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='#a6e889'; ctx.beginPath(); ctx.moveTo(0,-r*.9); ctx.lineTo(0,r*.9); ctx.stroke();
      break; }
    case 'tomato': {
      ctx.fillStyle='#e0301e'; ctx.strokeStyle='#8f170b'; ctx.lineWidth=2.5;
      rr(-t/2,-r,t,2*r,t*.5); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ff7a5c'; rr(-t*.25,-r*.85,t*.5,r*1.7,t*.25); ctx.fill();
      ctx.fillStyle='#ffe08a';
      for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.ellipse(0,i*r*.24,t*.12,t*.2,0,0,Math.PI*2); ctx.fill(); }
      break; }
    case 'pickles': {
      ctx.fillStyle='#6f9a2a'; ctx.strokeStyle='#3b5a10'; ctx.lineWidth=2;
      for(const cy of [-r*.62,0,r*.62]){ rr(-t/2,cy-r*.3,t,r*.6,t*.5); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle='#b6d46a';
      for(const cy of [-r*.62,0,r*.62]){ rr(-t*.2,cy-r*.22,t*.4,r*.44,t*.2); ctx.fill(); }
      break; }
    case 'onion': {
      ctx.fillStyle='#f4f0ff'; ctx.strokeStyle='#a68bc8'; ctx.lineWidth=2;
      for(const [cy,l] of [[-r*.55,.4],[r*.1,.45],[r*.7,.28]]){ rr(-t/2,cy-r*l,t,r*l*2,t*.5); ctx.fill(); ctx.stroke(); }
      break; }
    case 'bacon': {
      ctx.fillStyle='#c4472e'; ctx.strokeStyle='#7d2414'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-t/2,-r);
      for(let i=0;i<=8;i++){ const y=-r+2*r*i/8; ctx.lineTo(t/2+(i%2?t*.3:-t*.1), y); }
      for(let i=8;i>=0;i--){ const y=-r+2*r*i/8; ctx.lineTo(-t/2+(i%2?t*.3:-t*.1), y); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='#f6c7a8'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(t*.05,-r*.95); ctx.lineTo(t*.05,r*.95); ctx.stroke();
      break; }
    case 'boot': {
      // shaft vertical, foot sticking right
      ctx.fillStyle='#2f6fd6'; ctx.strokeStyle='#123a7a'; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(-t*.5,-r); ctx.lineTo(t*.5,-r); ctx.lineTo(t*.5,r*.35);
      ctx.quadraticCurveTo(t*1.8,r*.4,t*1.9,r*.8); ctx.lineTo(t*1.9,r);
      ctx.lineTo(-t*.5,r); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#1b4fa8'; ctx.fillRect(-t*.5,r*.85,t*2.4,r*.15);
      ctx.fillStyle='#ffd23a'; ctx.fillRect(-t*.5,-r,t,r*.12);
      break; }
  }
  ctx.restore();
}
// set a font, shrinking it until `txt` fits in maxW (device fonts are wider than test fonts)
function fitFont(weight, size, txt, maxW){
  ctx.font = `${weight} ${size}px sans-serif`;
  const w = ctx.measureText(txt).width;
  if (w > maxW && w > 0){ size = Math.max(6, size * maxW / w); ctx.font = `${weight} ${size}px sans-serif`; }
  return size;
}
function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---------- hands ---------- */
function drawHand(x, side, squash){
  // x = inner edge of palm. side: -1 left hand (palm faces right), +1 right hand
  const h = game.h, cy = H*.5;
  ctx.save();
  ctx.translate(x, cy);
  ctx.scale(-side, 1); // draw as a left hand; palm inner edge at 0, body extends to -x
  const pw = h*.42, ph = h*1.15;
  // sleeve
  ctx.fillStyle='#ffffff'; ctx.strokeStyle='#5a3420'; ctx.lineWidth=4;
  rr(-pw-W, -ph*.22, W, ph*.44, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#e8462e'; ctx.fillRect(-pw-24, -ph*.22, 14, ph*.44);
  // palm
  const sk = '#ffd2a8', sks='#b8784a';
  ctx.fillStyle=sk; ctx.strokeStyle=sks;
  rr(-pw, -ph*.42, pw*(1-squash*.15), ph*.84, pw*.35); ctx.fill(); ctx.stroke();
  // finger lines on the palm
  ctx.strokeStyle=sks; ctx.lineWidth=3;
  for(let i=1;i<4;i++){ const fy=-ph*.42+i*ph*.21; ctx.beginPath(); ctx.moveTo(-pw*.55,fy); ctx.lineTo(-pw*.05,fy); ctx.stroke(); }
  // thumb on top
  ctx.fillStyle=sk; ctx.strokeStyle=sks; ctx.lineWidth=4;
  ctx.save(); ctx.translate(-pw*.45,-ph*.42); ctx.rotate(-.5);
  rr(-pw*.17,-pw*.55,pw*.34,pw*.7,pw*.17); ctx.fill(); ctx.stroke();
  ctx.restore();
  // glove cuff shine
  ctx.fillStyle='rgba(255,255,255,.35)'; rr(-pw*.85,-ph*.36,pw*.18,ph*.5,pw*.09); ctx.fill();
  ctx.restore();
}

/* ---------- background ---------- */
function drawBG(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#ffe4b8'); g.addColorStop(.62,'#ffc98a'); g.addColorStop(.62,'#c9452f'); g.addColorStop(1,'#8f2a1c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // wall tiles
  ctx.strokeStyle='rgba(160,90,40,.18)'; ctx.lineWidth=2;
  const s = 46;
  for(let x=0;x<W;x+=s){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H*.62); ctx.stroke(); }
  for(let y=0;y<H*.62;y+=s){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  // counter top
  ctx.fillStyle='#f2efe9'; ctx.fillRect(0,H*.62,W,10);
  // checker
  ctx.fillStyle='rgba(255,255,255,.12)';
  for(let x=0;x<W;x+=40) for(let y=H*.62+10,i=0;y<H;y+=40,i++) if(((x/40)+i)%2===0) ctx.fillRect(x,y,40,40);
  // menu board
  // size the board from the measured text so it never clips (font widths differ per device)
  ctx.font='900 22px sans-serif';
  const mbW = Math.ceil(ctx.measureText('YOKO BURGER').width) + 36;
  const cp = custPos(), mbX = Math.max(mbW/2 + 8, Math.min(W*.5, cp.x - cp.s*1.0 - mbW/2 - 6));
  ctx.fillStyle='#3a2a20'; rr(mbX-mbW/2,14+48,mbW,48,10); ctx.fill();
  ctx.fillStyle='#ffd77a'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('YOKO BURGER', mbX, 14+72);
}

/* ---------- game ---------- */
const game = {
  state:'title', stage:1, score:0, lives:3, h:150,
  items:[], t:0, timeLimit:8, timeLeft:8,
  handL:0, handR:0, slamT:0, shake:0, texts:[], stageScore:0, rot:0, stageLog:null,
  mode:'normal', combo:0, maxCombo:0, perfectStreak:0, fever:false, parts:[], hitstop:0, flash:0,
  cust:{mood:'wait', splat:0, moodT:0}, faceHits:0,
  angerV:0, pAnger:0, pulse:0, boomT:0, boomK:0, charred:false,
};

function buildStage(n){
  const items = [];
  const fillCount = Math.min(2 + n, 8);
  const pool = FILLINGS.slice();
  const mids = [];
  for(let i=0;i<fillCount;i++) mids.push(pool[Math.floor(Math.random()*pool.length)]);
  if (n>=3 && Math.random()<.6) mids.splice(Math.floor(Math.random()*(mids.length+1)),0,'boot');
  if (n>=6 && Math.random()<.4) mids.splice(Math.floor(Math.random()*(mids.length+1)),0,'boot');
  const list = ['bunTop', ...mids, 'bunBot'];
  const speedMul = 1.15 + (n-1)*.13;
  list.forEach((type,i)=>{
    const spinP = n<3 ? 0 : Math.min(.15 + (n-3)*.08, .55);
    const isBun = type.startsWith('bun');
    let mode = 'swing';
    if (Math.random() < spinP && (!isBun || n>=4)) mode = 'spin';
    if (type==='boot') mode = Math.random()<.5?'spin':'swing';
    items.push({
      type, i, mode,
      amp: rand(45,85)*DEG,
      w: rand(1.5,2.3)*speedMul * (Math.random()<.5?-1:1),
      ph: rand(0,Math.PI*2),
      base: mode==='swing' && isBun && n>=5 && Math.random()<.3 ? Math.PI : 0, // upside-down swinging bun (tricky)
      a:0, frozen:false, err:0,
      x:0,y:0, homeX:0, homeY:0, bob: rand(0,6.28),
      gone:false, flying:false, vx:0, vy:0, va:0, yOff:0, res:'', kicked:false,
    });
  });
  // fix: upside-down bun never valid as start; it swings around 180 so player must catch it when it passes... it never passes 0. Drop that idea for swing; use spin instead.
  items.forEach(it=>{ if(it.base){ it.base=0; it.mode='spin'; } });
  game.items = items;
  game.timeLimit = game.mode==='practice' ? 9999 : Math.max(3.2, 2.6 + items.length*.62 - n*.18);
  game.faceHits = 0; game.chains = 0;
  game.cust.mood = 'wait'; game.cust.splat = 0;
  game.fever = game.mode==='normal' && game.perfectStreak >= 2;
  game.timeLeft = game.timeLimit;
  game.t = 0;
  game.texts = [];
  game.rot = 0; game.serveK = 0;
  layoutItems();
}
function layoutItems(){
  const n = game.items.length;
  game.h = Math.min(H*.3, W*.42, 260);
  const left = W*.2, right = W*.8;
  const zig = Math.min(H*.17, game.h*.9);
  game.items.forEach((it,i)=>{
    it.homeX = n===1 ? W/2 : left + (right-left)*i/(n-1);
    it.homeY = H*.5 + (n>3 ? (i%2? zig : -zig) * (i===0||i===n-1 ? .35 : 1) : 0);
    if (game.state==='aim' || game.state==='ready'){ it.x = it.homeX; it.y = it.homeY; }
  });
  game.handL0 = W*.07; game.handR0 = W*.93;
}

function errOf(it){
  const sym = TYPES[it.type].sym;
  const period = sym ? Math.PI : Math.PI*2;
  let e = ((it.a % period) + period) % period;
  e = Math.min(e, period - e);
  return e/DEG;
}

function startGame(mode){
  audio(true);
  $('pauseBtn').hidden = false;
  game.mode = mode || 'normal';
  game.stage = 1; game.score = 0; game.lives = 3; game.combo = 0; game.maxCombo = 0; game.perfectStreak = 0;
  game.angerV = 0; game.pAnger = 0; game.pulse = 0; game.charred = false; game.boomT = 0; game.boomK = 0;
  game.ending = false; game.endT = 0; game.capFly = null; game.lastCause = 'collapse';
  game.run = {boots:0, face:0, fly:0, start: Date.now()};
  $('slamBtn').classList.remove('hidden');
  $('title').classList.add('hidden'); $('over').classList.add('hidden'); $('pause').classList.add('hidden');
  $('hud').classList.remove('hidden'); game.paused = false; document.body.classList.add('playing'); setTimeout(fitHUD, 0);
  startStage();
}
function startStage(){
  game.state = 'ready';
  buildStage(game.stage);
  game.readyT = 1.1;
  game.handL = game.handL0; game.handR = game.handR0;
  updateHUD();
}
function updateHUD(){
  $('slamBtn').textContent = game.mode==='practice' ? 'いま挟む' : '今すぐ挟む！';
  $('stage').textContent = (W < 430 ? 'S' : 'STAGE ') + game.stage;
  $('score').textContent = game.score.toLocaleString();
  const ang = 3 - game.lives;
  if (game.mode==='practice') $('lives').textContent = 'まかない';
  else $('lives').innerHTML = '怒' + [0,1,2].map(i=>`<i class="${i<ang?'on':''}"></i>`).join('');
  $('lives').setAttribute('aria-label', '店長の怒り ' + ang + '/3');
  fitHUD();
}
// shrink the HUD pill's font until it fits (real-device fonts are wider than the test browser's)
function fitHUD(){
  const pill = document.querySelector('#top .pill'), sp = $('hud');
  if (!pill || sp.classList.contains('hidden')) return;
  pill.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(pill).fontSize) || 16, n = 0;
  while (n++ < 12 && fs > 9 && (pill.scrollWidth > sp.clientWidth || pill.scrollWidth > pill.clientWidth + 1)){
    fs -= 1; pill.style.fontSize = fs + 'px';
  }
}
window.addEventListener('resize', ()=>{ try{ fitHUD(); }catch(e){} });

function addText(x,y,s,col,size=26){ game.texts.push({x,y,s,col,size,t:0}); }

/* ---------- input ---------- */
function onTap(px,py){
  audio();
  if (game.state !== 'aim' || game.paused) return;
  let best=null, bd=Infinity;
  for(const it of game.items){
    if (it.frozen || it.gone) continue;
    const d = Math.hypot(px-it.x, (py-it.y)*.8);
    if (d < bd){ bd=d; best=it; }
  }
  if (!best || bd > game.h*.75) return;
  if (best.type==='boot'){
    best.gone = true; best.kicked = true; best.flying = true;
    best.vx = rand(-300,300); best.vy = -1400; best.va = rand(-14,14);
    sfx.kick(); addText(best.x,best.y-game.h*.4,'ポイッ！','#2f6fd6');
    game.score += 50; updateHUD();
  } else {
    best.frozen = true;
    best.err = errOf(best);
    sfx.lock(best.err);
    const e = best.err;
    if (e < 3){ game.combo++; game.maxCombo = Math.max(game.maxCombo, game.combo); if (game.combo>1) setTimeout(()=>sfx.combo(game.combo),60); }
    else if (e >= 10) game.combo = 0;
    const label = e<3 ? (game.combo>1 ? 'ピタッ！×'+game.combo : 'ピタッ！') : e<10 ? Math.round(e)+'°' : Math.round(e)+'°…';
    addText(best.x, best.y - game.h*.55, label, e<3?'#ff3d6e':e<10?'#2a9d3a':'#8a5a2a', e<3?30+Math.min(game.combo,10)*1.5:24);
    if (e<3) burst(best.x, best.y, 10, ['#ff3d6e','#ffd23a','#fff'], 260);
  }
  if (game.items.every(it=>it.frozen||it.gone)) beginSlam();
}
function burst(x,y,n,cols,spd){
  for(let i=0;i<n;i++){ const a=rand(0,Math.PI*2), v=rand(.3,1)*spd;
    game.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*.3,life:rand(.4,.9),t:0,col:cols[i%cols.length],sz:rand(3,7),g:900}); }
}
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); if (game.state==='ending'){ skipEnding(); return; } onTap(e.clientX, e.clientY); });
document.getElementById('hud').style.pointerEvents='none';
window.addEventListener('keydown', e=>{
  if (e.code==='Escape' || e.code==='KeyP'){ game.paused ? closePause() : openPause(); return; }
  if (game.paused) return;
  if (e.code==='Space' || e.code==='Enter'){
    if (game.state==='aim'){
      // lock leftmost unlocked
      const it = game.items.find(i=>!i.frozen && !i.gone);
      if (it) onTap(it.x, it.y);
    }
  }
});

/* ---------- slam ---------- */
function beginSlam(){
  if (game.state!=='aim') return;
  game.state = 'slam'; game.slamT = 0;
  for(const it of game.items){ if(!it.gone && !it.frozen){ it.frozen = true; it.err = errOf(it); } }
  game.slamFromL = game.handL; game.slamFromR = game.handR;
  game.contactDone = false;
  computePack(false);
  for(const it of game.items){ it.sx = it.x; it.sy = it.y; }
}
function computePack(excludeFlyers){
  const keep = game.items.filter(it=>!it.gone && !(excludeFlyers && it.flying));
  const tot = keep.reduce((s,it)=>s + game.h*TYPES[it.type].t, 0);
  let x = W/2 - tot/2;
  for(const it of keep){ const t = game.h*TYPES[it.type].t; it.px = x + t/2; x += t; }
  game.packL = W/2 - tot/2; game.packR = W/2 + tot/2;
}
function contact(){
  game.contactDone = true;
  sfx.slam(); game.shake = 26; game.hitstop = .09; game.flash = .5;
  addText(W/2, H*.5 - game.h*.85, 'バチン！！', '#e8462e', 54);
  const list = game.items.filter(it=>!it.gone);
  // chain reaction: a badly tilted item knocks its neighbours
  const err = list.map(it=>it.type==='boot'?0:it.err);
  let changed = true, guard = 0;
  const flyBase = 20;
  const done = new Set();
  while(changed && guard++ < 20){
    changed = false;
    for(let i=0;i<list.length;i++){
      if (err[i] >= flyBase && !done.has(i)){
        done.add(i);
        for(const j of [i-1,i+1]){
          if (j<0||j>=list.length||list[j].type==='boot') continue;
          const before = err[j];
          err[j] += (err[i]-flyBase)*.28 + 3;
          if (before < flyBase && err[j] >= flyBase){ list[j].chained = true; game.chains++; }
          changed = true;
        }
      }
    }
  }
  let flew = 0;
  const C = custPos();
  list.forEach((it,i)=>{
    const e = err[i]; it.err2 = e;
    const lean = Math.sign(Math.sin(2*it.a)) || 1; // which way the top leans
    if (it.type==='boot'){ it.res='boot'; return; }
    if (e < 3){ it.res='perfect'; it.a = 0; it.yOff = 0; }
    else if (e < 10){ it.res='good'; it.yOff = lean*(e/10)*game.h*.12; it.a = lean*e*.25*DEG; }
    else if (e < flyBase){ it.res='ok'; it.yOff = lean*(e/flyBase)*game.h*.3; it.a = lean*e*.35*DEG; }
    else {
      it.res='fly'; it.flying = true; flew++;
      const pow = clamp((e-flyBase)/50, 0, 1);
      const delay = it.chained ? .06 : 0;
      it.launchDelay = delay;
      if (Math.random() < .45){
        // aim at the customer's face
        const vy = -(1300 + pow*500), t = -vy/2400 * rand(.85,1.15);
        it.vx = (C.x - it.x)/t; it.vy = vy * ((C.y < it.y) ? 1 : .6);
      } else {
        it.vx = lean * (350 + pow*800) * rand(.6,1.2);
        it.vy = -(900 + pow*900) * (Math.random()<.8?1:-0.25);
      }
      it.va = lean * (10 + pow*20) * rand(.7,1.3);
      burst(it.x, it.y, 8, ['#fff','#ffe08a','#e0301e'], 380);
    }
  });
  if (game.chains) { setTimeout(sfx.chain, 80); addText(W/2, H*.5 + game.h*.85, '連鎖 ×'+game.chains+'！', '#7a3fd0', 34); }
  if (flew) setTimeout(sfx.fly, 40);
  // crumbs
  burst(game.packL, H*.5, 12, ['#f3c27a','#fff6dc','#e39a3f'], 420);
  burst(game.packR, H*.5, 12, ['#f3c27a','#fff6dc','#e39a3f'], 420);
  computePack(true);
  for(const it of game.items){ it.cx = it.x; }
}
function custPos(){ const s = Math.min(W,H)*.11; return {x: W - s*1.3, y: Math.max(92, H*.15) + s*.2, s}; }
function scoreStage(){
  const kept = game.items.filter(it=>!it.flying && !it.kicked);
  const real = game.items.filter(it=>it.type!=='boot');
  const realKept = kept.filter(it=>it.type!=='boot');
  const perfect = real.filter(it=>it.res==='perfect').length;
  const good = real.filter(it=>it.res==='good').length;
  const ok = real.filter(it=>it.res==='ok').length;
  const fly = real.filter(it=>it.res==='fly').length;
  const boots = kept.filter(it=>it.type==='boot').length;
  const bunLost = real.some(it=>it.type.startsWith('bun') && it.res==='fly');
  let pts = perfect*100 + good*60 + ok*25 - boots*150;
  const allPerfect = perfect===real.length && boots===0;
  if (allPerfect) pts += 300 + game.stage*50;
  if (game.mode==='normal') pts += Math.round(game.timeLeft*40);
  pts += game.combo*15;
  if (game.fever) pts *= 2;
  pts = Math.max(0, Math.round(pts));
  const survive = realKept.length / real.length;
  let fail = bunLost || survive < .6 || boots>0;
  let title, comment;
  if (allPerfect){ title='神バーガー！'; comment = pick(['店長「…完璧だ。時給上げとく」','店長「これぞウチの看板商品！」','店長「写真撮ってメニューに載せる」']); }
  else if (fail){
    if (boots>0){ title='長靴バーガー'; comment = pick(['店長「なんで長靴が入ってるんだ！！」','店長「店の信用が…！」','店長「客から靴下の匂いがすると苦情だ」']); }
    else if (bunLost){ title='バンズ消失'; comment = pick(['店長「バンズはどこ行った！？」','店長「それはただの具の束だ！」','店長「パンを挟まずに何を挟む！」']); }
    else { title='崩壊バーガー'; comment = pick(['店長「天井にトマト付いてるぞ！」','店長「具が全部飛んでったぞ！」','店長「パンしか残ってない！」']); }
  }
  else if (fly===0 && ok===0){ title='うまいバーガー'; comment = pick(['店長「うん、合格」','店長「お客さんに出していいぞ」','店長「いい仕事だ」']); }
  else { title='まあまあバーガー'; comment = pick(['店長「…はみ出してるな」','店長「次はちゃんと立てろよ」','店長「レタス脱走してるぞ」']); }
  if (game.faceHits>0 && !allPerfect) comment = pick(['店長「…顔に具が当たったんだが」','店長「熱っ！トマト熱っ！」','店長「店長の顔は皿じゃない！」']);
  const bad = fail;
  if (game.mode==='practice') fail = false;
  if (allPerfect) game.perfectStreak++; else game.perfectStreak = 0;
  if (game.run && game.mode==='normal'){ game.run.boots += boots; game.run.face += game.faceHits; game.run.fly += fly; }
  const cause = game.faceHits>0 ? 'face' : boots>0 ? 'boot' : bunLost ? 'bun' : 'collapse';
  if (bad) game.lastCause = cause;
  return {pts, perfect, good, ok, fly, boots, fail, bad, title, comment, allPerfect};
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function showResult(){
  const r = game.stageLog;
  $('rTitle').textContent = r.title;
  $('rScore').textContent = '+' + r.pts;
  $('rRows').innerHTML =
    `<div class="row"><span>ピタッ！</span><b>${r.perfect}</b></div>`+
    `<div class="row"><span>ちょいズレ</span><b>${r.good}</b></div>`+
    `<div class="row"><span>はみ出し</span><b>${r.ok}</b></div>`+
    `<div class="row"><span>吹っ飛び</span><b>${r.fly}</b></div>`+
    (r.boots?`<div class="row"><span>長靴混入</span><b>${r.boots}</b></div>`:'')+
    (game.chains?`<div class="row"><span>連鎖</span><b>${game.chains}</b></div>`:'')+
    (game.faceHits?`<div class="row"><span>顔面ヒット</span><b>${game.faceHits}</b></div>`:'')+
    `<div class="row wide"><span>コンボ</span><b>${game.combo}（最高 ${game.maxCombo}）</b></div>`+
    (game.fever?`<div class="row"><span>ゴールデンタイム</span><b>×2</b></div>`:'')+
    (game.perfectStreak>=2 && game.mode==='normal'?`<div class="row" style="color:#c98a00"><b>次はゴールデンタイム！</b><b>★</b></div>`:'');
  $('rComment').textContent = r.comment + (r.fail ? '　（店長の怒り ＋1）' : '');
  $('nextBtn').textContent = (r.fail && game.lives<=0) ? '……店長？' : 'つぎへ';
  $('result').classList.remove('hidden');
}
$('nextBtn').addEventListener('click', ()=>{
  audio();
  $('result').classList.add('hidden');
  if (game.lives<=0){ game.state = 'boom'; game.boomT = 0; game.boomK = 0; game.boomed = false; sfx.whistle(); return; }
  game.stage++; startStage();
});
function isEnd(){ return game.state==='boom' || game.state==='ending' || game.state==='over'; }
/* ---------- ending: one-liner -> cause line -> timecard -> pull back -> shutter ---------- */
const LINE1 = ['……もう帰っていいよ','……今日はもう、上がっていいよ','……明日から来なくていいよ','……おつかれさま。ほんとに'];
const LINE2 = {
  boot:['……その長靴、履いて帰ってね','……長靴は、持ち帰ってね'],
  bun:['……バンズ見つけてから帰ってね','……バンズ、どこ行ったんだろうね'],
  face:['……ちょっと顔、洗ってくる','……クリーニング代は引いとくね'],
  collapse:['……天井のトマト、拭いてから帰ってね','……床のレタス、拾ってから帰ってね'],
};
const EM = {line1:.6, line2:2.8, card:5.0, stamp:5.6, pull:8.2, shutter:9.6, panel:11.0};
function startEnding(){
  game.state = 'ending'; game.ending = true; game.endT = 0; document.body.classList.remove('playing');
  $('hud').classList.add('hidden'); $('pauseBtn').hidden = true;
  game.line1 = pick(LINE1);
  let l2 = pick(LINE2[game.lastCause] || LINE2.collapse);
  if (game.stage <= 2 && Math.random()<.5) l2 = '……まだ始まったばかりだよ';
  else if (game.score >= 4000 && Math.random()<.5) l2 = '……腕はいいんだけどねえ';
  game.line2 = l2;
  const r = game.run || {boots:0,face:0,fly:0,start:Date.now()};
  const sec = Math.max(1, Math.round((Date.now() - r.start)/1000));
  const base = Math.round(sec/3600*1100);
  const rows = [
    ['基本給（' + Math.floor(sec/60) + '分' + (sec%60) + '秒）', base],
    ['出来高手当', game.score],
  ];
  if (r.boots) rows.push(['長靴弁償 ×' + r.boots, -800*r.boots]);
  if (r.face) rows.push(['店長クリーニング代 ×' + r.face, -300*r.face]);
  if (r.fly) rows.push(['食材ロス ×' + r.fly, -50*r.fly]);
  rows.push(['店長修理費', -1500]);
  const net = rows.reduce((a,b)=>a+b[1],0);
  const t2 = new Date(), t1 = new Date(r.start), hm = d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  game.slip = {rows, net, inT: hm(t1), outT: hm(t2)};
  game.endFlags = {};
}
function endAt(k){ return game.endT >= EM[k]; }
function onceAt(k, fn){ if (endAt(k) && !game.endFlags[k]){ game.endFlags[k] = true; fn(); } }
function updateEnding(dt){
  game.endT += dt;
  onceAt('line1', ()=>sfx.tick());
  onceAt('line2', ()=>sfx.tick());
  onceAt('card', ()=>tone(500,.12,'triangle',.1,1.5));
  onceAt('stamp', ()=>{ sfx.gachan(); game.shake = 14; });
  onceAt('shutter', ()=>sfx.shutter());
  onceAt('panel', ()=>gameOver());
}
function skipEnding(){
  const ms = Object.values(EM).sort((a,b)=>a-b);
  const nxt = ms.find(m=>m > game.endT + .01);
  if (nxt !== undefined) game.endT = nxt;
}
function gameOver(){
  game.state = 'over';
  const best = Math.max(game.score, +(store('yoko-burger-best')||0));
  store('yoko-burger-best', best);
  const net = game.slip ? game.slip.net : 0;
  $('oText').textContent = `STAGE ${game.stage} まで到達　本日の支給額 ${net.toLocaleString()}円　ベスト ${best.toLocaleString()}`;
  $('oScore').textContent = game.score.toLocaleString();
  setShare($('shareOver'), `${GAME_NAME}で店長を爆発させた。STAGE ${game.stage}・${game.score.toLocaleString()}点、本日の支給額 ${net.toLocaleString()}円`);
  $('pauseBtn').hidden = true;
  $('over').classList.remove('hidden');
  $('slamBtn').classList.add('hidden');
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, Math.max(0, (now-last)/1000)); last = now;
  if (window.innerWidth < 1 || window.innerHeight < 1) return;
  if (W !== window.innerWidth || H !== window.innerHeight) resize();
  try {
    if (!game.paused) update(dt);
    render();
    $('slamBtn').style.display = (game.state==='aim' && !game.paused) ? '' : 'none';
  } catch(e){ console.error(e); }
}
function update(dt){
  game.flash = Math.max(0, game.flash - dt*3);
  if (game.hitstop > 0){ game.hitstop -= dt; return; }
  for(const p of game.parts){ p.t += dt; p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  game.parts = game.parts.filter(p=>p.t<p.life);
  game.cust.moodT -= dt;
  { const target = game.mode==='practice' ? game.pAnger : 3 - game.lives;
    game.angerV += (Math.min(target, 2.6) - game.angerV) * Math.min(1, dt*3);
    game.pulse = Math.max(0, game.pulse - dt*1.5); }
  if (game.state==='ending') updateEnding(dt);
  if (game.state==='boom'){
    game.boomT += dt;
    game.boomK = easeOut(clamp(game.boomT/.6, 0, 1));
    if (game.boomT > 1.5 && !game.boomed){
      game.boomed = true; game.charred = true;
      sfx.boom(); game.shake = 40; game.flash = .45;
      const {s} = custPos(); const side = H < 520 && W > H; const cx = side ? W*.26 : W/2, cy = side ? H*.5 : H*.34;
      burst(cx, cy, 40, ['#ff7a1a','#ffd23a','#e0301e','#fff'], 900);
      for(let i=0;i<26;i++){ const a=rand(0,Math.PI*2), v=rand(60,260); game.parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:rand(1.2,2.2),t:0,col:i%2?'#6b6b6b':'#9a9a9a',sz:rand(14,34),g:-60,smoke:true}); }
      game.capFly = {x:cx, y:cy - s*1.6, vx:rand(-120,120), vy:-1300, a:0};
      addText(cx, cy - s*2.6, 'ドカーン！！', '#e0301e', 60);
    }
    if (game.capFly){ const c = game.capFly; c.vy += 1800*dt; c.x += c.vx*dt; c.y += c.vy*dt; c.a += 9*dt; }
    if (game.boomT > 2.9){ startEnding(); }
  }
  if ((game.state==='over'||game.state==='ending') && game.capFly){ const c = game.capFly; c.vy += 1800*dt; c.x += c.vx*dt; c.y += c.vy*dt; c.a += 9*dt; if (c.y > H+200) game.capFly = null; }
  game.t += dt;
  for(const tx of game.texts) tx.t += dt;
  game.texts = game.texts.filter(t=>t.t<1.1);
  game.shake *= Math.pow(.02, dt);

  if (game.state==='title'){ demoUpdate(dt); return; }

  // motion of unfrozen items
  if (game.state==='ready' || game.state==='aim'){
    for(const it of game.items){
      if (!it.frozen && !it.gone){
        it.a = it.mode==='swing' ? it.base + it.amp*Math.sin(it.w*game.t + it.ph) : it.base + it.w*1.3*game.t + it.ph;
      }
      if (!it.gone){ it.x = it.homeX; it.y = it.homeY + Math.sin(game.t*2+it.bob)*6; }
    }
  }
  if (game.state==='ready'){
    game.readyT -= dt;
    if (game.readyT<=0){ game.state='aim'; game.t = game.t; }
  }
  if (game.state==='aim'){
    const prev = game.timeLeft;
    game.timeLeft -= dt;
    if (game.timeLeft < 3 && Math.ceil(prev) !== Math.ceil(game.timeLeft)) sfx.tick();
    const p = game.mode==='practice' ? 0 : 1 - game.timeLeft/game.timeLimit;
    const closeL = Math.min(...game.items.filter(i=>!i.gone).map(i=>i.homeX)) - game.h*.55;
    const closeR = Math.max(...game.items.filter(i=>!i.gone).map(i=>i.homeX)) + game.h*.55;
    game.handL = lerp(game.handL0, Math.max(game.handL0, closeL), easeIn(p));
    game.handR = lerp(game.handR0, Math.min(game.handR0, closeR), easeIn(p));
    if (game.timeLeft <= 0){ game.timeLeft = 0; beginSlam(); }
    if (game.mode==='practice') game.timeLeft = game.timeLimit;
  }
  if (game.state==='slam'){
    game.slamT += dt;
    const T1 = .2;
    if (game.slamT < T1){
      const k = easeIn(game.slamT/T1);
      game.handL = lerp(game.slamFromL, game.packL, k);
      game.handR = lerp(game.slamFromR, game.packR, k);
      for(const it of game.items){ if(it.gone) continue; it.x = lerp(it.sx, it.px, k); it.y = lerp(it.sy, H*.5, k); }
    } else {
      if (!game.contactDone){ for(const it of game.items){ if(!it.gone){ it.x = it.px; it.y = H*.5; } } contact(); }
      const k2 = clamp((game.slamT - T1)/.35, 0, 1);
      const ek = easeOut(k2);
      for(const it of game.items){
        if (it.gone && !it.flying) continue;
        if (it.flying){ continue; }
        it.x = lerp(it.cx, it.px, ek);
        it.y = H*.5 + it.yOff*ek;
      }
      // hands squeeze bounce
      const sq = Math.sin(clamp((game.slamT-T1)/.3,0,1)*Math.PI)*game.h*.05;
      game.handL = game.packL + sq*.3; game.handR = game.packR - sq*.3;
      if (game.slamT > 1.3){
        game.state = 'serve'; game.serveT = 0;
        game.serveL = game.handL; game.serveR = game.handR;
        game.stageLog = scoreStage();
      if (game.cust.mood==='wait') game.cust.mood = 'wow';
      }
    }
  }
  if (game.state==='serve'){
    game.serveT += dt;
    const k = easeIO(clamp(game.serveT/.8,0,1));
    game.rot = k*Math.PI/2; game.serveK = k;
    game.handL = lerp(game.serveL, -W*.3, easeIn(clamp(game.serveT/.5,0,1)));
    game.handR = lerp(game.serveR, W*1.3, easeIn(clamp(game.serveT/.5,0,1)));
    if (game.serveT > 1.1 && !game.resultShown){
      game.resultShown = true;
      const r = game.stageLog;
      game.score += r.pts;
      if (r.fail){ game.lives--; game.pulse = 1; setTimeout(sfx.grr, 250); addText(custPos().x - custPos().s*1.4, custPos().y - custPos().s*.9, 'ムカッ', '#e0301e', 30); }
      if (game.mode==='practice') game.pAnger = clamp(game.pAnger + (r.bad ? 1 : -0.6), 0, 2.4);
      if (r.bad){ sfx.lose(); game.cust.mood = game.cust.mood==='splat'?'splat':'angry'; }
      else { sfx.win(); if (game.cust.mood!=='splat') game.cust.mood = 'happy'; }
      if (r.allPerfect){ for(let k=0;k<5;k++) setTimeout(()=>burst(rand(W*.2,W*.8), H*.25, 18, ['#ff3d6e','#ffd23a','#5cc23a','#2f6fd6','#fff'], 500), k*120); }
      game.cust.moodT = 99;
      updateHUD();
      showResult();
      game.state = 'result';
    }
  }
  if (game.state==='ready') game.resultShown = false;
  // flyers physics (any state)
  const C = custPos();
  for(const it of game.items){
    if (!it.flying) continue;
    if (it.launchDelay > 0){ it.launchDelay -= dt; continue; }
    it.vy += 2400*dt; it.x += it.vx*dt; it.y += it.vy*dt; it.a += it.va*dt;
    if (!it.hitFace && !it.kicked && Math.hypot(it.x-C.x, it.y-C.y) < C.s*.9){
      it.hitFace = true; game.faceHits++; game.cust.mood='splat'; game.cust.moodT = 2.5; game.cust.splat++;
      it.vx = -it.vx*.4 - 200; it.vy = Math.abs(it.vy)*.2 + 200;
      sfx.splat(); game.shake = Math.max(game.shake, 10);
      burst(C.x, C.y, 14, ['#e0301e','#ffc928','#5cc23a'], 350);
      addText(C.x - C.s*.6, C.y + C.s*1.2, '顔面！', '#e0301e', 28);
    }
    if (it.y > H + game.h*2) { it.flying = false; it.gone = true; }
  }
}

/* demo on title screen */
let demo = null;
function demoUpdate(dt){
  if (!demo){ game.stage = 2; buildStage(2); demo = true; game.handL = game.handL0; game.handR = game.handR0; }
  for(const it of game.items){
    it.a = it.mode==='swing' ? it.amp*Math.sin(it.w*game.t+it.ph) : it.w*1.3*game.t+it.ph;
    it.x = it.homeX; it.y = it.homeY + Math.sin(game.t*2+it.bob)*6;
  }
}

function camParams(){
  const side = H < 520 && W > H;
  return { sc: side ? .46 : .4, cx: side ? W*.3 : W/2, cy: side ? H*.58 : H*.37 };
}
function render(){
  const k = game.ending ? easeIO(clamp((game.endT - EM.pull)/1.2, 0, 1)) : 0;
  if (k <= 0){ renderScene(); return; }
  const cp = camParams();
  const sc = lerp(1, cp.sc, k), cx = lerp(W/2, cp.cx, k), cy = lerp(H/2, cp.cy, k);
  const wx = cx - W*sc/2, wy = cy - H*sc/2, ww = W*sc, wh = H*sc;
  drawFacade(wx, wy, ww, wh, k);
  ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
  ctx.translate(wx, wy); ctx.scale(sc, sc);
  renderScene();
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
  const sh = clamp((game.endT - EM.shutter)/1.15, 0, 1);
  if (sh > 0) drawShutter(wx, wy, ww, wh, easeIn(sh));
  ctx.restore();
  drawFrame(wx, wy, ww, wh, k);
}
function drawFacade(wx, wy, ww, wh, k){
  // evening sky + building wall + sidewalk
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2b2f5e'); g.addColorStop(.5,'#c86a5a'); g.addColorStop(1,'#f0a868');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const bTop = wy - wh*.42, bBot = wy + wh + wh*.12;
  const bL = Math.min(wx - ww*.35, wx - 30), bR = Math.max(wx + ww*1.35, wx + ww + 30);
  ctx.fillStyle = '#8a3b2a'; ctx.fillRect(bL, bTop, bR-bL, bBot-bTop);
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
  const bh = Math.max(6, wh*.045);
  for(let y=bTop, r=0; y<bBot; y+=bh, r++){ ctx.beginPath(); ctx.moveTo(bL,y); ctx.lineTo(bR,y); ctx.stroke();
    for(let x=bL + (r%2? bh: 0); x<bR; x+=bh*2){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+bh); ctx.stroke(); } }
  // roof edge
  ctx.fillStyle = '#4a1e14'; ctx.fillRect(bL - 6, bTop - 8, bR-bL+12, 12);
  // sidewalk / street
  ctx.fillStyle = '#9a9086'; ctx.fillRect(0, bBot, W, H-bBot);
  ctx.fillStyle = '#7c736a'; ctx.fillRect(0, bBot, W, 6);
  ctx.fillStyle = 'rgba(0,0,0,.08)'; for(let x=0;x<W;x+=60) ctx.fillRect(x, bBot+6, 2, H-bBot);
  // door to the right of the window
  const dW = ww*.22, dH = wh*.92, dX = wx + ww + ww*.06, dY = wy + wh - dH;
  if (dX + dW < bR){
    ctx.fillStyle = '#3a2214'; ctx.fillRect(dX, dY, dW, dH);
    ctx.fillStyle = '#5a3420'; ctx.fillRect(dX+dW*.1, dY+dH*.06, dW*.8, dH*.4);
    ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.arc(dX+dW*.82, dY+dH*.58, Math.max(2,dW*.05), 0, Math.PI*2); ctx.fill();
    // CLOSED sign on the door after the shutter
    if (endAt('panel') || game.endT > EM.shutter + 1.2){
      ctx.save(); ctx.translate(dX+dW/2, dY+dH*.26); ctx.rotate(-.06);
      ctx.fillStyle='#fff8ec'; rr(-dW*.42,-dH*.08,dW*.84,dH*.16,3); ctx.fill();
      ctx.fillStyle='#c4160a'; fitFont(900, Math.max(8,dW*.2), 'CLOSED', dW*.84*.82); ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('CLOSED', 0, 0); ctx.restore();
    }
  }
}
function drawFrame(wx, wy, ww, wh, k){
  ctx.globalAlpha = k;
  ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = Math.max(4, ww*.02); ctx.strokeRect(wx, wy, ww, wh);
  // awning
  const aY = wy - wh*.12, aH = wh*.12, n = 8;
  for(let i=0;i<n;i++){ ctx.fillStyle = i%2 ? '#fff' : '#d8341f'; ctx.fillRect(wx - ww*.04 + i*(ww*1.08/n), aY, ww*1.08/n + 1, aH); }
  ctx.fillStyle='#d8341f';
  for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(wx - ww*.04 + (i+.5)*(ww*1.08/n), aY+aH, ww*1.08/n/2, 0, Math.PI); ctx.fillStyle = i%2 ? '#fff' : '#d8341f'; ctx.fill(); }
  // sign
  const sW = Math.min(ww*1.1, W*.9), sH = Math.min(wh*.13, sW*.2), sX = wx + ww/2 - sW/2, sY = aY - sH - wh*.04;
  ctx.fillStyle='#3a2a20'; rr(sX, sY, sW, sH, sH*.2); ctx.fill();
  ctx.fillStyle='#ffd77a'; fitFont(900, Math.max(10, Math.min(sH*.6, sW*.11)), 'YOKO BURGER', sW*.86); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('YOKO BURGER', wx + ww/2, sY + sH/2 + 1);
  ctx.globalAlpha = 1;
}
function drawShutter(wx, wy, ww, wh, k){
  const h = wh*k;
  ctx.fillStyle = '#b9bcc0'; ctx.fillRect(wx, wy, ww, h);
  ctx.strokeStyle = '#8d9196'; ctx.lineWidth = Math.max(1.5, wh*.006);
  const rib = Math.max(6, wh*.035);
  for(let y = wy + h; y > wy; y -= rib){ ctx.beginPath(); ctx.moveTo(wx, y); ctx.lineTo(wx+ww, y); ctx.stroke(); }
  ctx.fillStyle = '#7a7e83'; ctx.fillRect(wx, wy + h - rib*.6, ww, rib*.6);
  if (k >= 1){
    // closed sign + the real punchline: they're already hiring a replacement
    const md = Math.min(ww, wh*1.2);
    ctx.fillStyle='#3a2214'; fitFont(900, Math.max(14, md*.12), '本日閉店', ww*.84); ctx.textAlign='center'; ctx.textBaseline='middle';

function renderScene(){

function wrapText(txt, maxW){
  const out = []; let cur = '';
  for (const ch of txt){ if (ctx.measureText(cur+ch).width > maxW && cur){ out.push(cur); cur = ch; } else cur += ch; }
  if (cur) out.push(cur); return out;
}
function drawEndingUI(){

  if (T >= EM.line1 && T < EM.card){
    const txt = T < EM.line2 ? game.line1 : game.line2;
    const t0 = T < EM.line2 ? EM.line1 : EM.line2;
    const shown = txt.slice(0, Math.floor((T - t0) * 16) + 1);
    const fs = clamp(Math.min(W,H)*.055, 15, 26);
    ctx.font = `900 ${fs}px sans-serif`;
    const maxW = side ? W*.5 : Math.min(W*.8, 460);
    const lines = wrapText(txt, maxW - fs);
    const bw = Math.min(maxW, Math.max(...lines.map(l=>ctx.measureText(l).width)) + fs*1.6), bh = lines.length*fs*1.35 + fs;
    const bx = side ? W*.47 : W/2 - bw/2;
    const by = side ? H*.46 - bh/2 : H*.34 + s*3.7;
    ctx.fillStyle='#fff'; ctx.strokeStyle='#2a1a10'; ctx.lineWidth=3;
    rr(bx, by, bw, bh, fs*.6); ctx.fill(); ctx.stroke();
    // tail
    ctx.beginPath();
    if (side){ ctx.moveTo(bx, by+bh*.4); ctx.lineTo(bx - fs*.9, by+bh*.55); ctx.lineTo(bx, by+bh*.7); }
    else { ctx.moveTo(W/2 - fs*.5, by); ctx.lineTo(W/2, by - fs*.9); ctx.lineTo(W/2 + fs*.5, by); }
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.fillRect(side? bx-1 : W/2-fs*.5+2, side? by+bh*.4+2 : by-1, side? 4 : fs-4, side? bh*.3-4 : 4);

    lines.forEach((l,i)=>{ const part = l.slice(0, Math.max(0, rem)); rem -= l.length; ctx.fillText(part, bx + fs*.8, by + fs*.5 + fs*1.35*(i+.5)); });
  }

      ctx.restore();
    }
    ctx.restore();
  }

    ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='700 12px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='bottom';
    ctx.fillText('タップで進む', W - 12, H - 12);

function mixCol(c1, c2, k){
  const p = c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const A = p(c1), B = p(c2); k = clamp(k,0,1);

}

  if (A >= 1.8){
    ctx.fillStyle='rgba(255,255,255,.75)';
    for(let q=0;q<3;q++){ const ph=(game.t*1.6 + q/3)%1; for(const sg of [-1,1]){ ctx.globalAlpha = 1-ph; ctx.beginPath(); ctx.arc(sg*(s*.95+ph*s*.35), -s*.1 - ph*s*.9, s*(.09+ph*.12), 0, Math.PI*2); ctx.fill(); } }
    ctx.globalAlpha = 1;
  }
  // speech bubble during play
  if (game.state==='aim' || game.state==='ready'){
    const line = game.mode==='practice' ? (A>=1.5?'…まかないだぞ':'ゆっくりでいいよ') : A < .8 ? '早くしてね' : A < 1.8 ? '…早くしろ' : 'ﾌﾟﾙﾌﾟﾙ…';
    // measure the line and grow the bubble leftward; shrink the font if it would leave the screen
    const right = -s*1.0, room = (custPos().x + right) - 8;
    let fs = Math.max(11, s*.24);
    ctx.font = `800 ${fs}px sans-serif`;
    let tw = ctx.measureText(line).width;
    if (tw + fs*1.6 > room){ fs = Math.max(9, fs * room / (tw + fs*1.6)); ctx.font = `800 ${fs}px sans-serif`; tw = ctx.measureText(line).width; }
    const bw = tw + fs*1.6, bh = Math.max(s*.6, fs*1.9);
    ctx.fillStyle='#fff'; ctx.strokeStyle='#5a3420'; ctx.lineWidth=2;
    const by = Math.max(s*.2, (14+48+48+6 + bh/2) - custPos().y);   // keep clear of the menu board
    rr(right - bw, by - bh/2, bw, bh, bh*.35); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(right-1, by - bh*.2); ctx.lineTo(right + s*.14, by); ctx.lineTo(right-1, by + bh*.2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.fillRect(right-3, by - bh*.2 + 2, 3, bh*.4 - 4);
    ctx.fillStyle = A>=1.8 ? '#c4160a' : '#3a2214'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(line, right - bw/2, by);
  }
  ctx.restore();
}
function drawCharred(s){
  // classic cartoon aftermath: sooty face, afro, blinking eyes
  ctx.fillStyle='#3a3a3a'; ctx.strokeStyle='#111'; ctx.lineWidth=3;
  rr(-s*.85, s*.72, s*1.7, s*.95, s*.3); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#1d1d1d';
  for(let i=0;i<14;i++){ const an = Math.PI*1.0 + i/13*Math.PI; ctx.beginPath(); ctx.arc(Math.cos(an)*s*.82, -s*.1+Math.sin(an)*s*.78, s*.3, 0, Math.PI*2); ctx.fill(); }
  ctx.beginPath(); ctx.arc(0,-s*.55,s*.7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#4a4a4a'; ctx.beginPath(); ctx.arc(0,0,s*.8,0,Math.PI*2); ctx.fill(); ctx.stroke();
  const blink = (game.t % 2.2) < .12;
  ctx.fillStyle='#fff';
  for(const ex of [-.3,.3]){ ctx.beginPath(); if (blink) ctx.ellipse(ex*s,-s*.05,s*.12,s*.02,0,0,Math.PI*2); else ctx.arc(ex*s,-s*.05,s*.12,0,Math.PI*2); ctx.fill(); }
  if (!blink){ ctx.fillStyle='#111'; for(const ex of [-.3,.3]){ ctx.beginPath(); ctx.arc(ex*s,-s*.05,s*.04,0,Math.PI*2); ctx.fill(); } }
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.ellipse(-s*.17,s*.27,s*.2,s*.085,.3,0,Math.PI*2); ctx.ellipse(s*.17,s*.27,s*.2,s*.085,-.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0,s*.46,s*.1,s*.06,0,0,Math.PI*2); ctx.fill();
  // little smoke puff
  ctx.fillStyle='rgba(150,150,150,.6)';
  for(let q=0;q<3;q++){ const ph=(game.t*.8+q/3)%1; ctx.globalAlpha=1-ph; ctx.beginPath(); ctx.arc(s*.2*Math.sin(q*2+game.t), -s*1.3-ph*s*1.2, s*(.12+ph*.2), 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
}
function drawPlaced(it){
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(it.a);
  // frozen glow
  if (it.frozen && (game.state==='aim'||game.state==='ready')){
    ctx.shadowColor = it.err<3 ? 'rgba(255,61,110,.9)' : 'rgba(255,255,255,.8)'; ctx.shadowBlur = 16;
  }
  drawItem(it);
  ctx.restore();
}

resize();
requestAnimationFrame(frame);
})();
</script>
